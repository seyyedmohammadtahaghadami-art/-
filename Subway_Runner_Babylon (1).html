<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner V24 - Stable Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Lalezar', sans-serif; user-select: none; touch-action: none; color: white; }
        .interactive { pointer-events: auto; }
        
        /* HUD */
        #hud { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; text-shadow: 2px 2px 0 #000; font-size: 22px; display: none; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; border: 2px solid #f1c40f; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 5px; }
        #mission-hud { position: absolute; top: 60px; right: 20px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 10px; border-right: 4px solid #e67e22; font-size: 16px; display: none; pointer-events: none; }
        
        #pause-btn { position: absolute; top: 10px; right: 20px; z-index: 25; background: rgba(0,0,0,0.5); border: 2px solid #fff; color: white; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; display: none; pointer-events: auto; }
        #active-powerups { position: absolute; top: 70px; left: 10px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .pu-badge { background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 10px; border-left: 4px solid #fff; font-size: 14px; display: flex; align-items: center; gap: 5px; }

        /* Menus */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; overflow-y: auto; padding: 20px 0; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        h1 { color: #f1c40f; font-size: 45px; margin: 0 0 10px 0; text-shadow: 3px 3px 0 #c0392b; transform: skew(-5deg); }
        h2 { color: #ecf0f1; margin-bottom: 15px; font-size: 24px; border-bottom: 2px solid #f1c40f; padding-bottom: 5px; display: inline-block; }
        
        .btn { background: linear-gradient(#e67e22, #d35400); border: none; padding: 12px 25px; margin: 6px; color: white; font-family: 'Lalezar'; font-size: 20px; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #a04000; width: 260px; transition: 0.1s; }
        .btn:active { transform: translateY(5px); box-shadow: none; }
        .btn-blue { background: linear-gradient(#3498db, #2980b9); box-shadow: 0 5px 0 #1c5980; }
        .btn-gray { background: linear-gradient(#7f8c8d, #636e72); box-shadow: 0 5px 0 #4b5456; width: 140px; font-size: 16px; }
        .btn-green { background: linear-gradient(#2ecc71, #27ae60); box-shadow: 0 5px 0 #1e8449; }
        .btn-red { background: linear-gradient(#e74c3c, #c0392b); box-shadow: 0 5px 0 #922b21; }
        .btn-revive { background: linear-gradient(#9b59b6, #8e44ad); box-shadow: 0 5px 0 #6c3483; animation: pulse 1.5s infinite; }

        .grid-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 500px; margin-bottom: 20px; }
        .grid-item { background: rgba(255,255,255,0.1); border: 2px solid #555; border-radius: 10px; padding: 10px; width: 90px; text-align: center; cursor: pointer; }
        .grid-item.selected { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); }
        .item-preview { width: 40px; height: 40px; margin: 0 auto 5px; border-radius: 5px; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        .setting-row { display: flex; justify-content: space-between; align-items: center; width: 90%; max-width: 300px; background: rgba(255,255,255,0.05); padding: 10px; margin: 5px 0; border-radius: 8px; }
        select { background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 5px; font-family: 'Lalezar'; }

        #blur-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(0px); pointer-events: none; transition: 0.2s; z-index: 5; }
        #toast { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #f1c40f; padding: 10px 25px; border-radius: 30px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 30; border: 2px solid #f1c40f; font-size: 18px; white-space: nowrap;}
        #new-record-banner { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%) scale(0); color: #f1c40f; font-size: 40px; text-shadow: 0 0 20px #e67e22; pointer-events: none; z-index: 15; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

    <div id="blur-overlay"></div>
    <div id="toast">پیام</div>
    <div id="new-record-banner">🏆 رکورد جدید!</div>
    <button id="pause-btn">⏸️</button>

    <div id="hud">
        <div class="hud-box">امتیاز: <span id="score">0</span></div>
        <div class="hud-box">🪙 <span id="coins">0</span></div>
        <div class="hud-box" style="border-color:#aaa; font-size:16px;">رکورد: <span id="hud-high">0</span></div>
    </div>
    <div id="mission-hud">🎯 مأموریت: <span id="mission-text">...</span> (<span id="mission-prog">0</span>)</div>
    <div id="active-powerups"></div>

    <div id="main-menu" class="menu-screen interactive">
        <h1>SUBWAY V24</h1>
        <p style="color:#aaa; margin-bottom:20px;">نسخه پایدار نهایی - بدون هنگی</p>
        <div style="margin-bottom:15px; font-size:20px; color:#f1c40f;">سکه: <span id="menu-coins">0</span> | رکورد: <span id="menu-high">0</span></div>
        <button class="btn" id="btn-start">شروع دویدن 🏃‍♂️</button>
        <button class="btn btn-blue" id="btn-shop">فروشگاه 🛒</button>
        <button class="btn btn-green" id="btn-ach">دستاوردها 🏆</button>
        <button class="btn btn-gray" id="btn-set">تنظیمات ⚙️</button>
        <button class="btn btn-small btn-gray" id="btn-mute" style="margin-top:10px;">صدا: <span id="mute-text">روشن</span> 🔊</button>
    </div>

    <div id="pause-menu" class="menu-screen interactive hidden">
        <h1 style="color:#fff">PAUSED</h1>
        <button class="btn" id="btn-resume">ادامه ▶️</button>
        <button class="btn btn-red" id="btn-quit">خروج ❌</button>
    </div>

    <div id="shop-menu" class="menu-screen interactive hidden">
        <h2>فروشگاه</h2>
        <div style="color:#f1c40f; margin-bottom:10px; font-size:20px;">موجودی: <span id="shop-coins">0</span> 🪙</div>
        <h3 style="width:100%; text-align:center; color:#aaa; font-size:16px; margin-top:10px;">👕 اسکین‌ها</h3>
        <div class="grid-container" id="skin-grid"></div>
        <h3 style="width:100%; text-align:center; color:#aaa; font-size:16px;">⚡ ارتقاهای دائمی</h3>
        <div class="grid-container" id="upgrade-grid"></div>
        <button class="btn btn-gray" id="btn-shop-back">بازگشت</button>
    </div>

    <div id="achieve-menu" class="menu-screen interactive hidden">
        <h2>دستاوردها</h2>
        <div id="achieve-list" style="width:90%; max-width:400px; text-align:right;"></div>
        <button class="btn btn-gray" id="btn-ach-back" style="margin-top:20px;">بازگشت</button>
    </div>

    <div id="settings-menu" class="menu-screen interactive hidden">
        <h2>تنظیمات</h2>
        <div class="setting-row"><span>کیفیت گرافیک</span><select id="quality-select"><option value="low">پایین</option><option value="med" selected>متوسط</option><option value="high">بالا</option></select></div>
        <div class="setting-row"><span>سایه‌ها</span><input type="checkbox" id="shadow-toggle" checked></div>
        <div class="setting-row"><span>لرزش دوربین</span><input type="checkbox" id="shake-toggle" checked></div>
        <button class="btn btn-gray" id="btn-set-back" style="margin-top:20px;">بازگشت</button>
    </div>

    <div id="game-over" class="menu-screen interactive hidden">
        <h1 style="color:#e74c3c">BUSTED!</h1>
        <div style="font-size:28px; margin:10px;">امتیاز: <span id="final-score">0</span></div>
        <div style="font-size:18px; color:#aaa;">رکورد: <span id="final-high">0</span></div>
        <div style="font-size:20px; color:#f1c40f; margin-bottom:20px;">سکه: +<span id="final-coins">0</span></div>
        <button class="btn btn-revive" id="btn-revive">ادامه با ۱۰۰ سکه 💎</button>
        <button class="btn" id="btn-restart">دوباره 🔄</button>
        <button class="btn btn-gray" id="btn-go-menu">منو</button>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- AUDIO SYSTEM (Stable) ---
        const audio = {
            ctx: null, muted: false, musicTimer: 0,
            init() { 
                try {
                    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                    if (this.ctx.state === 'suspended') this.ctx.resume(); 
                } catch(e) { console.warn("Audio not supported"); }
            },
            playTone(freq, type, dur, vol = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                    o.type = type; o.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    g.gain.setValueAtTime(vol, this.ctx.currentTime); 
                    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                    o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + dur);
                } catch(e){}
            },
            coin() { this.playTone(1200, 'sine', 0.1, 0.1); this.playTone(1800, 'sine', 0.1, 0.1); },
            jump() { this.playTone(300, 'square', 0.2, 0.1); },
            crash() { this.playTone(100, 'sawtooth', 0.5, 0.2); },
            powerup() { this.playTone(600, 'triangle', 0.1, 0.1); },
            revive() { this.playTone(400, 'sine', 0.3, 0.2); },
            updateMusic(dt) {
                if(this.muted || !game.isPlaying || game.isPaused || !this.ctx) return;
                this.musicTimer -= dt;
                if(this.musicTimer <= 0) {
                    this.playTone(110 + (Math.random()*50), 'triangle', 0.2, 0.03);
                    this.musicTimer = 250;
                }
            },
            toggleMute() { 
                this.muted = !this.muted; 
                document.getElementById('mute-text').innerText = this.muted ? "خاموش" : "روشن"; 
            }
        };

        // --- DATA ---
        const SKINS = [
            { id: 'default', name: 'دونده', color: 0xe74c3c, price: 0, icon: '🏃' },
            { id: 'ninja', name: 'نینجا', color: 0x111111, price: 500, icon: '🥷' },
            { id: 'gold', name: 'طلایی', color: 0xf1c40f, price: 1500, icon: '👑' },
            { id: 'cyber', name: 'سایبر', color: 0x00ffff, price: 3000, icon: '🤖' },
            { id: 'zombie', name: 'زامبی', color: 0x27ae60, price: 5000, icon: '🧟' },
            { id: 'king', name: 'پادشاه', color: 0x8e44ad, price: 10000, icon: '🦸' },
            { id: 'ghost', name: 'روح', color: 0xffffff, price: 15000, icon: '👻' },
            { id: 'fire', name: 'آتشین', color: 0xff4500, price: 20000, icon: '🔥' },
            { id: 'neon', name: 'نئونی', color: 0x39ff14, price: 30000, icon: '💚' }
        ];

        const POWERUPS_SHOP = [
            { id: 'magnet', name: 'آهنربا قوی', icon: '🧲', price: 200 },
            { id: 'shield', name: 'سپر اضافه', icon: '🛡️', price: 500 },
            { id: 'multiplier', name: 'سکه x2 دائم', icon: '💰', price: 1000 },
            { id: 'slowmo', name: 'زمان آهسته', icon: '🐢', price: 400 },
            { id: 'superjump', name: 'پرش قوی', icon: '⬆️', price: 600 },
            { id: 'hoverboard', name: 'هاوربرد', icon: '🛹', price: 1200 }
        ];

        const ACHIEVEMENTS = [
            { id: 'score_1000', name: 'دوننده تازه کار', desc: '۱۰۰۰ امتیاز', target: 1000, type: 'score' },
            { id: 'coins_500', name: 'ثروتمند', desc: '۵۰۰ سکه', target: 500, type: 'coins' },
            { id: 'train_hopper', name: 'پارکور باز', desc: '۱۰ پرش روی قطار', target: 10, type: 'trains' },
            { id: 'sky_high', name: 'پرنده', desc: 'استفاده از جت‌پک', target: 1, type: 'jetpack_used' },
            { id: 'survivor', name: 'بازگشت از مرگ', desc: 'استفاده از Revive', target: 1, type: 'revive_used' }
        ];

        let state = {
            coins: parseInt(localStorage.getItem('v24_coins')) || 0,
            highScore: parseInt(localStorage.getItem('v24_high')) || 0,
            unlockedSkins: JSON.parse(localStorage.getItem('v24_skins')) || ['default'],
            currentSkin: localStorage.getItem('v24_skin') || 'default',
            achievements: JSON.parse(localStorage.getItem('v24_ach')) || [],
            ownedPowerups: JSON.parse(localStorage.getItem('v24_pu')) || [],
            stats: { trainsHopped: 0, jetpackUsed: 0, reviveUsed: 0 },
            settings: { quality: 'med', shadows: true, shake: true },
            mission: { type: 'coins', target: 50, current: 0, completed: false }
        };

        // --- STABLE GAME ENGINE ---
        class Game {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87CEEB);
                this.scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

                this.baseCamPos = new THREE.Vector3(0, 6, 10);
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 300);
                this.camera.position.copy(this.baseCamPos);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: state.settings.quality !== 'low', powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.shadowMap.enabled = state.settings.shadows;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(this.renderer.domElement);

                // Lighting
                this.sun = new THREE.DirectionalLight(0xffffff, 1.5);
                this.sun.position.set(20, 40, 20);
                this.sun.castShadow = true;
                this.sun.shadow.mapSize.set(1024, 1024); // Optimized shadow map
                this.scene.add(this.sun);
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));

                this.createWorld();
                this.player = this.createPlayerMesh(SKINS.find(s=>s.id===state.currentSkin).color);
                this.scene.add(this.player);

                this.objects = []; 
                this.coins = [];
                this.powerups = [];
                this.environment = [];
                this.timers = []; 
                
                this.gameTime = 0;
                this.lastTime = performance.now();
                this.spawnTimer = 0;
                this.envSpawnTimer = 0;
                
                this.resetState(true);
                this.setupInputs();
                this.bindUI();
                this.animate();
                
                window.addEventListener('resize', () => this.onResize());
                ui.updateMenu();
                ui.updateMission();
            }

            bindUI() {
                // استفاده از addEventListener به جای onclick داخل HTML برای پایداری بیشتر
                document.getElementById('pause-btn').addEventListener('click', () => this.togglePause());
                document.getElementById('btn-start').addEventListener('click', () => this.start());
                document.getElementById('btn-shop').addEventListener('click', () => ui.showShop());
                document.getElementById('btn-ach').addEventListener('click', () => ui.showAchievements());
                document.getElementById('btn-set').addEventListener('click', () => ui.showSettings());
                document.getElementById('btn-mute').addEventListener('click', () => audio.toggleMute());
                document.getElementById('btn-resume').addEventListener('click', () => this.resume());
                document.getElementById('btn-quit').addEventListener('click', () => this.quitToMenu());
                document.getElementById('btn-shop-back').addEventListener('click', () => ui.showMain());
                document.getElementById('btn-ach-back').addEventListener('click', () => ui.showMain());
                document.getElementById('btn-set-back').addEventListener('click', () => ui.showMain());
                document.getElementById('btn-revive').addEventListener('click', () => this.revive());
                document.getElementById('btn-restart').addEventListener('click', () => this.restart());
                document.getElementById('btn-go-menu').addEventListener('click', () => ui.showMain());
                
                document.getElementById('quality-select').addEventListener('change', (e) => { state.settings.quality = e.target.value; location.reload(); });
                document.getElementById('shadow-toggle').addEventListener('change', (e) => { state.settings.shadows = e.target.checked; this.renderer.shadowMap.enabled = e.target.checked; });
                document.getElementById('shake-toggle').addEventListener('change', (e) => { state.settings.shake = e.target.checked; });
            }

            createWorld() {
                const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 800), new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.9 }));
                ground.rotation.x = -Math.PI/2; ground.position.z = -300; ground.receiveShadow = true;
                this.scene.add(ground);

                const railMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.9, roughness: 0.1 });
                [-2.5, 0, 2.5].forEach(x => {
                    [-0.8, 0.8].forEach(offset => {
                        const r = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 800), railMat);
                        r.position.set(x + offset, 0.08, -300);
                        this.scene.add(r);
                    });
                });
            }

            createPlayerMesh(color) {
                const g = new THREE.Group();
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.4), new THREE.MeshStandardMaterial({color: color}));
                b.position.y = 0.9; b.castShadow = true; g.add(b);
                const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({color: 0xffccaa}));
                h.position.y = 1.6; h.castShadow = true; g.add(h);
                const lGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
                const lMat = new THREE.MeshStandardMaterial({color: 0x333});
                const ll = new THREE.Mesh(lGeo, lMat); ll.position.set(-0.2, 0.35, 0); g.add(ll);
                const rl = new THREE.Mesh(lGeo, lMat); rl.position.set(0.2, 0.35, 0); g.add(rl);
                const la = new THREE.Mesh(lGeo, lMat); la.position.set(-0.4, 1.0, 0); g.add(la);
                const ra = new THREE.Mesh(lGeo, lMat); ra.position.set(0.4, 1.0, 0); g.add(ra);
                g.userData = { parts: { ll, rl, la, ra } };
                return g;
            }

            spawnEnvironment(zPos) {
                // محدودیت تعداد برای جلوگیری از هنگی
                if(this.environment.length > 40) return; 

                if(Math.random() > 0.3) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const h = 10 + Math.random() * 30;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(8, h, 15), new THREE.MeshStandardMaterial({ color: Math.random() * 0x555555 + 0x222222 }));
                    b.position.set(side * (15 + Math.random() * 20), h/2, zPos);
                    b.castShadow = true; b.receiveShadow = true;
                    this.scene.add(b);
                    this.environment.push(b);
                }
                if(Math.random() > 0.8) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), new THREE.MeshStandardMaterial({color: 0x333}));
                    pole.position.set(side * 6, 3, zPos);
                    this.scene.add(pole);
                    this.environment.push(pole);
                }
            }

            spawnTrain() {
                if(this.objects.length > 8) return; // سقف تولید
                const laneIdx = Math.floor(Math.random() * 3);
                const length = 30 + Math.random() * 40; 
                const group = new THREE.Group();
                
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.5, length), new THREE.MeshStandardMaterial({ color: 0x2980b9, metalness: 0.6 }));
                body.position.y = 1.75; body.castShadow = true; body.receiveShadow = true; group.add(body);
                
                const roof = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.2, length-1), new THREE.MeshStandardMaterial({ color: 0xecf0f1 }));
                roof.position.y = 3.6; group.add(roof);

                group.position.set([-2.5, 0, 2.5][laneIdx], 0, -200);
                this.scene.add(group);
                
                const rand = Math.random();
                let moveSpeed = 0;
                if(rand < 0.3) moveSpeed = 0.8; 
                else if(rand < 0.6) moveSpeed = -0.2; 

                this.objects.push({ mesh: group, type: 'train', lane: laneIdx, length: length, height: 3.5, moveSpeed: moveSpeed });

                for(let z = -length/2 + 5; z < length/2 - 5; z+=4) {
                    this.spawnCoin([-2.5, 0, 2.5][laneIdx], 4.0, -200 + z);
                }
            }

            spawnBarrier() {
                if(this.objects.length > 8) return;
                const laneIdx = Math.floor(Math.random() * 3);
                const type = Math.random() > 0.5 ? 'low' : 'high';
                const group = new THREE.Group();
                if(type === 'low') {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.5), new THREE.MeshStandardMaterial({color: 0xe67e22}));
                    m.position.y = 0.5; m.castShadow = true; group.add(m);
                } else {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 0.5), new THREE.MeshStandardMaterial({color: 0xc0392b}));
                    m.position.y = 2; m.castShadow = true; group.add(m);
                }
                group.position.set([-2.5, 0, 2.5][laneIdx], 0, -200);
                this.scene.add(group);
                this.objects.push({ mesh: group, type: 'barrier', subType: type, lane: laneIdx });
            }

            spawnCoin(x, y, z) {
                if(this.coins.length > 50) return;
                const c = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 8), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1 }));
                c.rotation.x = Math.PI/2; c.position.set(x, y, z);
                this.scene.add(c);
                this.coins.push(c);
            }

            spawnPowerup() {
                if(this.powerups.length > 3) return;
                const laneIdx = Math.floor(Math.random() * 3);
                const types = ['magnet', 'shield', 'jetpack', 'multiplier', 'slowmo', 'superjump', 'hoverboard'];
                const type = types[Math.floor(Math.random() * types.length)];
                const colors = { magnet: 0xe74c3c, shield: 0x3498db, jetpack: 0x9b59b6, multiplier: 0x2ecc71, slowmo: 0x00ffff, superjump: 0xff00ff, hoverboard: 0xffff00 };
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: colors[type], emissive: colors[type], emissiveIntensity: 0.5 }));
                p.position.set([-2.5, 0, 2.5][laneIdx], 1.5, -200);
                this.scene.add(p);
                this.powerups.push({ mesh: p, type: type });
            }

            resetState(fullReset = true) {
                if(fullReset) {
                    this.isPlaying = false;
                    this.isPaused = false;
                    this.speed = 0.4;
                    this.score = 0;
                    this.runCoins = 0;
                    this.lane = 1;
                    this.vy = 0;
                    this.isJumping = false;
                    this.isOnTrain = false;
                    this.activeTrain = null;
                    this.stunned = false;
                    this.activePUs = {};
                    this.jetpackDescending = false;
                    
                    [...this.objects, ...this.coins, ...this.powerups, ...this.environment].forEach(o => this.scene.remove(o.mesh || o));
                    this.objects = []; this.coins = []; this.powerups = []; this.environment = [];
                    
                    this.player.position.set(0, 0, 0);
                    this.player.scale.set(1,1,1);
                    this.player.rotation.set(0,0,0);
                    document.getElementById('active-powerups').innerHTML = '';
                    this.camera.position.copy(this.baseCamPos);
                    
                    state.mission.current = 0;
                    state.mission.completed = false;
                    state.mission.target = 50 + Math.floor(Math.random() * 100);
                    ui.updateMission();
                }
                this.timers = [];
                this.gameTime = 0;
                this.spawnTimer = 0;
                this.envSpawnTimer = 0;
            }

            addTimer(duration, callback) {
                this.timers.push({ end: this.gameTime + duration, callback: callback });
            }

            updateTimers(dtMs) {
                if(this.isPaused) return;
                this.gameTime += dtMs;
                for(let i = this.timers.length - 1; i >= 0; i--) {
                    if(this.gameTime >= this.timers[i].end) {
                        this.timers[i].callback();
                        this.timers.splice(i, 1);
                    }
                }
            }

            setupInputs() {
                const handle = (dir) => {
                    if(!this.isPlaying || this.stunned || this.isPaused) return;
                    if(dir === 'left' && this.lane > 0) this.lane--;
                    if(dir === 'right' && this.lane < 2) this.lane++;
                    if(dir === 'up') this.jump();
                    if(dir === 'down') this.roll();
                };
                document.addEventListener('keydown', e => {
                    if(e.key === 'ArrowLeft') handle('left');
                    if(e.key === 'ArrowRight') handle('right');
                    if(e.key === 'ArrowUp') handle('up');
                    if(e.key === 'ArrowDown') handle('down');
                    if(e.key === 'Escape') this.togglePause();
                });
                let tx, ty;
                document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:false});
                document.addEventListener('touchend', e => {
                    const dx = e.changedTouches[0].clientX - tx;
                    const dy = e.changedTouches[0].clientY - ty;
                    if(Math.abs(dx) > Math.abs(dy)) {
                        if(dx > 30) handle('right'); else if(dx < -30) handle('left');
                    } else {
                        if(dy < -30) handle('up'); else if(dy > 30) handle('down');
                    }
                }, {passive:false});
            }

            jump() {
                if(!this.isJumping && !this.activePUs.jetpack && !this.jetpackDescending) {
                    this.vy = this.activePUs.superjump ? 0.9 : 0.6;
                    this.isJumping = true;
                    this.isOnTrain = false;
                    this.activeTrain = null;
                    audio.jump();
                }
            }

            roll() {
                if(!this.isJumping && !this.isOnTrain && !this.activePUs.jetpack && !this.jetpackDescending) {
                    this.player.scale.y = 0.5;
                    this.player.position.y = 0;
                    this.addTimer(700, () => {
                        this.player.scale.y = 1;
                        if(!this.isOnTrain) this.player.position.y = 0;
                    });
                }
            }

            activatePowerup(type) {
                audio.powerup();
                const container = document.getElementById('active-powerups');
                const names = { magnet: '🧲 آهنربا', shield: '🛡️ سپر', jetpack: '🚀 جت‌پک', multiplier: '💰 سکه x2', slowmo: '🐢 آهسته', superjump: '⬆️ پرش قوی', hoverboard: '🛹 هاوربرد' };
                
                const existing = document.getElementById(`pu-${type}`);
                if(existing) existing.remove();

                const div = document.createElement('div');
                div.className = 'pu-badge'; div.id = `pu-${type}`; div.innerText = names[type];
                container.appendChild(div);

                this.activePUs[type] = true;
                if(type === 'jetpack') state.stats.jetpackUsed++;
                
                let duration = 8000;
                if(type === 'jetpack') duration = 6000;
                if(type === 'slowmo') duration = 5000;
                
                this.addTimer(duration, () => {
                    this.activePUs[type] = false;
                    const el = document.getElementById(`pu-${type}`);
                    if(el) el.remove();
                    if(type === 'jetpack') this.jetpackDescending = true;
                });
            }

            stumble(fromSide = false) {
                if(this.activePUs.shield || this.activePUs.hoverboard) {
                    if(this.activePUs.hoverboard) this.activePUs.hoverboard = false;
                    else this.activePUs.shield = false;
                    
                    const elId = this.activePUs.hoverboard ? 'pu-hoverboard' : 'pu-shield';
                    const el = document.getElementById(elId);
                    if(el) el.remove();
                    ui.toast("محافظت فعال شد! 🛡️");
                    return;
                }
                this.stunned = true;
                this.speed *= 0.4; 
                document.getElementById('blur-overlay').style.backdropFilter = 'blur(8px)';
                
                if(fromSide) {
                    if(this.lane < 2) this.lane++; else this.lane--;
                    ui.toast("هل داده شدی! 😵");
                } else {
                    ui.toast("سرگیجه! مراقب باش 😵");
                }

                this.addTimer(1500, () => {
                    this.stunned = false;
                    this.speed = Math.max(this.speed * 2, 0.4); 
                    document.getElementById('blur-overlay').style.backdropFilter = 'blur(0px)';
                });
            }

            checkCollisions() {
                // ساده‌سازی برخورد برای کاهش بار CPU
                const px = this.player.position.x;
                const py = this.player.position.y;
                const pz = this.player.position.z;
                const isRolling = this.player.scale.y < 1;

                this.isOnTrain = false;

                for(let obj of this.objects) {
                    const oz = obj.mesh.position.z;
                    const ox = obj.mesh.position.x;
                    
                    if(obj.type === 'train') {
                        const halfLen = obj.length / 2;
                        if(Math.abs(pz - oz) < halfLen + 0.3 && Math.abs(px - ox) < 1.0) {
                            const tTop = obj.height;
                            if(this.vy <= 0 && py >= tTop - 0.5 && py <= tTop + 1.5) {
                                this.isOnTrain = true;
                                if(this.activeTrain !== obj) { state.stats.trainsHopped++; this.activeTrain = obj; }
                                this.player.position.y = tTop;
                                this.vy = 0; this.isJumping = false; this.jetpackDescending = false;
                            } else if (py < tTop - 0.5) {
                                const trainFrontZ = oz + halfLen;
                                if(Math.abs(pz - trainFrontZ) < 0.8) this.gameOver();
                                else this.stumble(true);
                            }
                        }
                    } else if (obj.type === 'barrier') {
                        if(Math.abs(pz - oz) < 0.5 && Math.abs(px - ox) < 1.0) {
                            if(obj.subType === 'high' && isRolling) continue;
                            if(obj.subType === 'low' && py > 1) continue;
                            if(!this.activePUs.shield && !this.activePUs.hoverboard) this.gameOver();
                            else this.stumble(false);
                        }
                    }
                }

                for(let i=this.coins.length-1; i>=0; i--) {
                    const c = this.coins[i];
                    if(this.activePUs.magnet && c.position.distanceTo(this.player.position) < 15) {
                        c.position.lerp(this.player.position, 0.2);
                    }
                    if(Math.abs(c.position.z - pz) < 0.8 && Math.abs(c.position.x - px) < 0.8 && Math.abs(c.position.y - py) < 1.5) {
                        this.scene.remove(c);
                        this.coins.splice(i, 1);
                        const amount = (this.activePUs.multiplier || state.ownedPowerups.includes('multiplier')) ? 2 : 1;
                        this.runCoins += amount;
                        if(!state.mission.completed && state.mission.type === 'coins') { state.mission.current += amount; ui.updateMission(); }
                        audio.coin();
                    }
                }

                for(let i=this.powerups.length-1; i>=0; i--) {
                    const p = this.powerups[i];
                    if(Math.abs(p.mesh.position.z - pz) < 0.8 && Math.abs(p.mesh.position.x - px) < 0.8) {
                        this.activatePowerup(p.type);
                        this.scene.remove(p.mesh);
                        this.powerups.splice(i, 1);
                    }
                }
            }

            gameOver() {
                this.isPlaying = false;
                audio.crash();
                document.getElementById('game-over').classList.remove('hidden');
                document.getElementById('hud').style.display = 'none';
                document.getElementById('mission-hud').style.display = 'none';
                document.getElementById('pause-btn').style.display = 'none';
                document.getElementById('active-powerups').innerHTML = '';
                document.getElementById('final-score').innerText = Math.floor(this.score);
                document.getElementById('final-high').innerText = state.highScore;
                document.getElementById('final-coins').innerText = this.runCoins;
                
                state.coins += this.runCoins;
                if(this.score > state.highScore) {
                    state.highScore = Math.floor(this.score);
                    const banner = document.getElementById('new-record-banner');
                    banner.style.transform = "translate(-50%, -50%) scale(1)";
                    setTimeout(() => banner.style.transform = "translate(-50%, -50%) scale(0)", 3000);
                }
                
                localStorage.setItem('v24_coins', state.coins);
                localStorage.setItem('v24_high', state.highScore);
                localStorage.setItem('v24_stats', JSON.stringify(state.stats));
                ui.checkAchievements();
                ui.updateMenu();
            }

            revive() {
                if(state.coins >= 100) {
                    state.coins -= 100;
                    state.stats.reviveUsed++;
                    localStorage.setItem('v24_coins', state.coins);
                    localStorage.setItem('v24_stats', JSON.stringify(state.stats));
                    audio.revive();
                    
                    document.getElementById('game-over').classList.add('hidden');
                    document.getElementById('hud').style.display = 'flex';
                    document.getElementById('mission-hud').style.display = 'block';
                    document.getElementById('pause-btn').style.display = 'block';
                    
                    this.objects.forEach(o => { if(o.mesh.position.z > -20 && o.mesh.position.z < 20) o.mesh.position.z -= 30; });
                    this.player.position.y = 2; this.vy = 0; this.stunned = false; this.isPlaying = true;
                    ui.updateMenu(); ui.checkAchievements();
                } else { ui.toast("سکه کافی نیست! 💸"); }
            }

            start() {
                audio.init();
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('mission-hud').style.display = 'block';
                document.getElementById('pause-btn').style.display = 'block';
                this.resetState(true);
                this.isPlaying = true;
            }

            restart() { document.getElementById('game-over').classList.add('hidden'); this.start(); }
            togglePause() { if(!this.isPlaying) return; this.isPaused = !this.isPaused; document.getElementById('pause-menu').classList.toggle('hidden', !this.isPaused); }
            resume() { this.isPaused = false; document.getElementById('pause-menu').classList.add('hidden'); }
            quitToMenu() { this.isPlaying = false; this.isPaused = false; document.getElementById('pause-menu').classList.add('hidden'); ui.showMain(); }

            animate() {
                requestAnimationFrame(() => this.animate());
                const now = performance.now();
                // Clamp delta to prevent physics explosion after lag spike
                const dt = Math.min((now - this.lastTime) / 1000, 0.1); 
                this.lastTime = now;

                audio.updateMusic(dt * 1000);
                this.updateTimers(dt * 1000);

                if(this.isPlaying && !this.isPaused) {
                    let currentSpeed = this.speed;
                    if(this.activePUs.slowmo) currentSpeed *= 0.5;
                    
                    const level = Math.floor(this.score / 1000);
                    if(!this.stunned) this.speed = Math.min(0.4 + (level * 0.05) + (this.score * 0.0001), 2.2);
                    
                    this.score += currentSpeed;
                    document.getElementById('score').innerText = Math.floor(this.score);
                    document.getElementById('coins').innerText = state.coins + this.runCoins;
                    document.getElementById('hud-high').innerText = state.highScore;

                    const targetX = [-2.5, 0, 2.5][this.lane];
                    this.player.position.x += (targetX - this.player.position.x) * 10 * dt;
                    this.player.rotation.z = (this.player.position.x - targetX) * -0.1;

                    let targetCamY = this.baseCamPos.y;
                    let targetCamZ = this.baseCamPos.z;

                    if(this.activePUs.jetpack) {
                        this.player.position.y += 8 * dt; 
                        if(this.player.position.y > 12) this.player.position.y = 12;
                        this.player.rotation.x = -0.5;
                        this.vy = 0; this.isJumping = false; this.jetpackDescending = false;
                        targetCamY = 16; targetCamZ = 18;
                        if(Math.random() < 0.1) this.spawnCoin([-2.5, 0, 2.5][Math.floor(Math.random()*3)], 10 + Math.random()*3, -150);
                    } else if (this.jetpackDescending) {
                        this.player.position.y -= 3 * dt;
                        this.player.rotation.x = -0.2;
                        if(this.player.position.y <= 0) { this.player.position.y = 0; this.jetpackDescending = false; this.player.rotation.x = 0; }
                        targetCamY = 8 + this.player.position.y;
                    } else {
                        this.player.rotation.x = 0;
                        if(!this.isOnTrain) {
                            this.player.position.y += this.vy;
                            this.vy -= 1.5 * dt;
                            if(this.player.position.y < 0) { this.player.position.y = 0; this.vy = 0; this.isJumping = false; }
                        } else { targetCamY = 8; }
                    }

                    this.camera.position.y += (targetCamY - this.camera.position.y) * 3 * dt;
                    this.camera.position.z += (targetCamZ - this.camera.position.z) * 3 * dt;
                    this.camera.lookAt(0, this.player.position.y + 2, -10);

                    const moveFactor = dt * 60;
                    
                    // Cleanup & Move Objects safely
                    for(let i=this.objects.length-1; i>=0; i--) {
                        const o = this.objects[i];
                        let move = currentSpeed;
                        if(o.type === 'train') move += o.moveSpeed;
                        o.mesh.position.z += move * moveFactor;
                        if(o.mesh.position.z > 30) { this.scene.remove(o.mesh); this.objects.splice(i, 1); }
                    }
                    for(let i=this.coins.length-1; i>=0; i--) {
                        const c = this.coins[i];
                        c.position.z += currentSpeed * moveFactor;
                        c.rotation.z += 5 * dt;
                        if(c.position.z > 10) { this.scene.remove(c); this.coins.splice(i, 1); }
                    }
                    for(let i=this.powerups.length-1; i>=0; i--) {
                        const p = this.powerups[i];
                        p.mesh.position.z += currentSpeed * moveFactor;
                        p.mesh.rotation.y += 3 * dt;
                        if(p.mesh.position.z > 10) { this.scene.remove(p.mesh); this.powerups.splice(i, 1); }
                    }
                    for(let i=this.environment.length-1; i>=0; i--) {
                        const e = this.environment[i];
                        e.position.z += currentSpeed * moveFactor;
                        if(e.position.z > 30) { this.scene.remove(e); this.environment.splice(i, 1); }
                    }

                    // Spawning Logic with Timers instead of Random per frame
                    this.spawnTimer -= dt;
                    if(this.spawnTimer <= 0) {
                        const spawnRate = Math.max(0.5, 1.5 - (level * 0.1));
                        this.spawnTimer = spawnRate;
                        if(Math.random() > 0.3) this.spawnTrain(); else this.spawnBarrier();
                        if(Math.random() < 0.1) this.spawnPowerup();
                    }
                    
                    this.envSpawnTimer -= dt;
                    if(this.envSpawnTimer <= 0) {
                        this.envSpawnTimer = 0.5;
                        this.spawnEnvironment(-250);
                    }

                    if(!this.isJumping && !this.activePUs.jetpack && !this.jetpackDescending) {
                        const t = now * 0.01 * (currentSpeed/0.4);
                        this.player.userData.parts.ll.rotation.x = Math.sin(t);
                        this.player.userData.parts.rl.rotation.x = Math.sin(t + Math.PI);
                        this.player.userData.parts.la.rotation.x = Math.sin(t + Math.PI);
                        this.player.userData.parts.ra.rotation.x = Math.sin(t);
                    }

                    if(state.settings.shake && !this.stunned) this.camera.position.x = (Math.random() - 0.5) * 0.05;
                    else this.camera.position.x += (0 - this.camera.position.x) * 5 * dt;

                    this.checkCollisions();
                    
                    if(!state.mission.completed && state.mission.current >= state.mission.target) {
                        state.mission.completed = true;
                        state.coins += 50;
                        localStorage.setItem('v24_coins', state.coins);
                        ui.toast("🎉 مأموریت انجام شد! +50 سکه");
                        ui.updateMission();
                        this.addTimer(3000, () => {
                            state.mission.current = 0; state.mission.completed = false;
                            state.mission.target = 50 + Math.floor(Math.random() * 100);
                            ui.updateMission();
                        });
                    }
                }
                this.renderer.render(this.scene, this.camera);
            }
            
            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            }
        }

        // --- UI MANAGER ---
        const ui = {
            showMain: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('main-menu').classList.remove('hidden');
                document.getElementById('pause-btn').style.display = 'none';
                document.getElementById('mission-hud').style.display = 'none';
                ui.updateMenu();
            },
            showShop: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('shop-menu').classList.remove('hidden');
                ui.renderShop();
            },
            showAchievements: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('achieve-menu').classList.remove('hidden');
                ui.renderAchievements();
            },
            showSettings: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('settings-menu').classList.remove('hidden');
                document.getElementById('quality-select').value = state.settings.quality;
                document.getElementById('shadow-toggle').checked = state.settings.shadows;
                document.getElementById('shake-toggle').checked = state.settings.shake;
            },
            updateMenu: () => {
                document.getElementById('menu-coins').innerText = state.coins;
                document.getElementById('menu-high').innerText = state.highScore;
            },
            updateMission: () => {
                const el = document.getElementById('mission-hud');
                if(state.mission.completed) {
                    document.getElementById('mission-text').innerText = "✅ تکمیل شد!";
                    document.getElementById('mission-prog').innerText = "";
                    el.style.borderRightColor = "#2ecc71";
                } else {
                    document.getElementById('mission-text').innerText = `جمع‌آوری ${state.mission.target} سکه`;
                    document.getElementById('mission-prog').innerText = `${state.mission.current}/${state.mission.target}`;
                    el.style.borderRightColor = "#e67e22";
                }
            },
            toast: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg; t.style.opacity = 1;
                if(ui.toastTimer) clearTimeout(ui.toastTimer);
                ui.toastTimer = setTimeout(() => t.style.opacity = 0, 2000);
            },
            renderShop: () => {
                document.getElementById('shop-coins').innerText = state.coins;
                const sGrid = document.getElementById('skin-grid'); sGrid.innerHTML = '';
                SKINS.forEach(skin => {
                    const isUnlocked = state.unlockedSkins.includes(skin.id);
                    const isSelected = state.currentSkin === skin.id;
                    const div = document.createElement('div');
                    div.className = `grid-item ${isSelected ? 'selected' : ''}`;
                    const colorHex = '#' + skin.color.toString(16).padStart(6, '0');
                    div.innerHTML = `<div class="item-preview" style="background:${colorHex}">${skin.icon}</div><div style="font-size:12px">${skin.name}</div><div style="color:#f1c40f; font-size:10px">${isUnlocked ? (isSelected ? '✓' : 'انتخاب') : skin.price}</div>`;
                    div.onclick = () => {
                        if(isUnlocked) {
                            state.currentSkin = skin.id; localStorage.setItem('v24_skin', skin.id);
                            game.scene.remove(game.player); game.player = game.createPlayerMesh(skin.color); game.scene.add(game.player);
                            ui.renderShop();
                        } else if(state.coins >= skin.price) {
                            state.coins -= skin.price; state.unlockedSkins.push(skin.id); state.currentSkin = skin.id;
                            localStorage.setItem('v24_coins', state.coins); localStorage.setItem('v24_skins', JSON.stringify(state.unlockedSkins)); localStorage.setItem('v24_skin', skin.id);
                            game.scene.remove(game.player); game.player = game.createPlayerMesh(skin.color); game.scene.add(game.player);
                            ui.renderShop(); ui.updateMenu(); ui.toast(`${skin.name} خریداری شد!`);
                        } else ui.toast("سکه کافی نیست! 💸");
                    };
                    sGrid.appendChild(div);
                });
                const uGrid = document.getElementById('upgrade-grid'); uGrid.innerHTML = '';
                POWERUPS_SHOP.forEach(pu => {
                    const isOwned = state.ownedPowerups.includes(pu.id);
                    const div = document.createElement('div');
                    div.className = `grid-item ${isOwned ? 'selected' : ''}`;
                    div.innerHTML = `<div class="item-preview" style="background:#333;">${pu.icon}</div><div style="font-size:12px">${pu.name}</div><div style="color:#f1c40f; font-size:10px">${isOwned ? '✓ فعال' : pu.price}</div>`;
                    div.onclick = () => {
                        if(!isOwned && state.coins >= pu.price) {
                            state.coins -= pu.price; state.ownedPowerups.push(pu.id);
                            localStorage.setItem('v24_coins', state.coins); localStorage.setItem('v24_pu', JSON.stringify(state.ownedPowerups));
                            ui.renderShop(); ui.updateMenu(); ui.toast(`${pu.name} ارتقا یافت!`);
                        } else if (!isOwned) ui.toast("سکه کافی نیست! 💸");
                    };
                    uGrid.appendChild(div);
                });
            },
            renderAchievements: () => {
                const list = document.getElementById('achieve-list'); list.innerHTML = '';
                ACHIEVEMENTS.forEach(ach => {
                    const isDone = state.achievements.includes(ach.id);
                    const div = document.createElement('div');
                    div.style.cssText = `background:rgba(255,255,255,0.1); margin:5px 0; padding:10px; border-radius:5px; border-right: 4px solid ${isDone ? '#2ecc71' : '#555'}`;
                    div.innerHTML = `<div style="color:${isDone ? '#2ecc71' : '#fff'}">${ach.name}</div><div style="font-size:12px; color:#aaa">${ach.desc}</div>`;
                    list.appendChild(div);
                });
            },
            checkAchievements: () => {
                let newUnlock = false;
                ACHIEVEMENTS.forEach(ach => {
                    if(!state.achievements.includes(ach.id)) {
                        let val = 0;
                        if(ach.type === 'score') val = state.highScore;
                        if(ach.type === 'coins') val = state.coins;
                        if(ach.type === 'trains') val = state.stats.trainsHopped || 0;
                        if(ach.type === 'jetpack_used') val = state.stats.jetpackUsed || 0;
                        if(ach.type === 'revive_used') val = state.stats.reviveUsed || 0;
                        if(val >= ach.target) { state.achievements.push(ach.id); newUnlock = true; }
                    }
                });
                if(newUnlock) { localStorage.setItem('v24_ach', JSON.stringify(state.achievements)); ui.toast("🏆 دستاورد جدید!"); }
            }
        };

        const game = new Game();
        window.game = game; window.ui = ui; window.audio = audio;
    </script>
</body>
</html>
