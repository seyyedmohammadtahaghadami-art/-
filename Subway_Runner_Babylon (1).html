<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner V18 - Real Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Lalezar', sans-serif; user-select: none; }
        
        /* UI Containers */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }
        
        /* HUD */
        #hud { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; color: white; text-shadow: 1px 1px 2px black; font-size: 24px; display: none; }
        .powerup-active { color: #f1c40f; animation: pulse 1s infinite; }
        
        /* Menus */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .hidden { display: none !important; }
        
        h1 { color: #f1c40f; font-size: 50px; margin: 0; text-shadow: 3px 3px 0 #c0392b; transform: skew(-5deg); }
        .btn { background: linear-gradient(#e67e22, #d35400); border: none; padding: 15px 40px; margin: 10px; color: white; font-family: 'Lalezar'; font-size: 24px; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #a04000; width: 250px; transition: 0.1s; }
        .btn:active { transform: translateY(5px); box-shadow: none; }
        .btn-blue { background: linear-gradient(#3498db, #2980b9); box-shadow: 0 5px 0 #1c5980; }
        
        /* Effects */
        #blur-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(0px); pointer-events: none; transition: backdrop-filter 0.2s; z-index: 5; }
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 6; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

    <div id="blur-overlay"></div>
    <div id="flash-overlay"></div>

    <!-- HUD -->
    <div id="hud">
        <div>امتیاز: <span id="score">0</span></div>
        <div id="powerup-display" style="display:none">⚡ <span id="powerup-timer"></span></div>
        <div>🪙 <span id="coins">0</span></div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen interactive">
        <h1>SUBWAY V18</h1>
        <p style="color:white; font-size:20px;">نسخه قطار واقعی + پلیس</p>
        <button class="btn" onclick="game.start()">شروع بازی 🏃‍️</button>
        <button class="btn btn-blue" onclick="alert('فروشگاه: به زودی...\nفعالا ۱۰۰ سکه هدیه گرفتی!')">فروشگاه 🛒</button>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="menu-screen interactive hidden">
        <h1 style="color:#e74c3c">BUSTED!</h1>
        <h2 style="color:white">گیر افتادی!</h2>
        <p style="color:white; font-size:30px">امتیاز: <span id="final-score">0</span></p>
        <button class="btn" onclick="game.restart()">فرار دوباره 🔄</button>
        <button class="btn btn-blue" onclick="location.reload()">منو اصلی</button>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION ---
        const LANES = [-2.2, 0, 2.2];
        const SPEED_START = 0.4;
        const GRAVITY = 0.025;
        
        // --- ASSETS GENERATION (Procedural) ---
        function createTrainMesh() {
            const group = new THREE.Group();
            
            // Main Body (Long)
            const bodyGeo = new THREE.BoxGeometry(2, 2.5, 12);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, metalness: 0.6, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.75;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Roof details
            const roofGeo = new THREE.BoxGeometry(1.8, 0.2, 11);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xecf0f1 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 3.1;
            group.add(roof);

            // Windows
            const winGeo = new THREE.PlaneGeometry(1.5, 0.8);
            const winMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            for(let i=-4; i<=4; i+=2) {
                const w1 = new THREE.Mesh(winGeo, winMat);
                w1.position.set(1.01, 2, i);
                w1.rotation.y = Math.PI/2;
                group.add(w1);
                
                const w2 = new THREE.Mesh(winGeo, winMat);
                w2.position.set(-1.01, 2, i);
                w2.rotation.y = -Math.PI/2;
                group.add(w2);
            }

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 2.2, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            [-4, 4].forEach(z => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.rotation.z = Math.PI/2;
                w.position.set(0, 0.4, z);
                group.add(w);
            });

            return group;
        }

        function createPlayerMesh() {
            const group = new THREE.Group();
            // Body
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.4), new THREE.MeshStandardMaterial({color: 0xe74c3c}));
            b.position.y = 0.9;
            group.add(b);
            // Head
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({color: 0xffccaa}));
            h.position.y = 1.6;
            group.add(h);
            // Limbs
            const lGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
            const lMat = new THREE.MeshStandardMaterial({color: 0x333});
            const ll = new THREE.Mesh(lGeo, lMat); ll.position.set(-0.2, 0.35, 0); group.add(ll);
            const rl = new THREE.Mesh(lGeo, lMat); rl.position.set(0.2, 0.35, 0); group.add(rl);
            
            group.userData = { parts: { ll, rl, body: b } };
            return group;
        }

        function createCopMesh() {
            const group = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1, 0.5), new THREE.MeshStandardMaterial({color: 0x2c3e50}));
            b.position.y = 1; group.add(b);
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({color: 0xffccaa}));
            h.position.y = 1.7; group.add(h);
            return group;
        }

        // --- GAME ENGINE ---
        class Game {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87CEEB);
                this.scene.fog = new THREE.Fog(0x87CEEB, 20, 90);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
                this.camera.position.set(0, 5, 8);
                this.camera.lookAt(0, 1, -10);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                document.body.appendChild(this.renderer.domElement);

                // Lights
                const sun = new THREE.DirectionalLight(0xffffff, 1);
                sun.position.set(10, 20, 10);
                sun.castShadow = true;
                this.scene.add(sun);
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.5));

                // World
                this.createEnvironment();
                
                // Entities
                this.player = createPlayerMesh();
                this.scene.add(this.player);
                
                this.cop = createCopMesh();
                this.cop.position.set(0, 0, 6); // Behind player
                this.scene.add(this.cop);

                this.objects = []; // Trains, obstacles
                this.coins = [];
                this.powerups = [];

                // State
                this.resetState();
                
                // Inputs
                this.setupInputs();
                
                // Loop
                this.animate();
                
                // Gift
                if(!localStorage.getItem('v18_gift')) {
                    this.totalCoins = 1000;
                    localStorage.setItem('v18_gift', 'true');
                    localStorage.setItem('sr_coins', 1000);
                } else {
                    this.totalCoins = parseInt(localStorage.getItem('sr_coins')) || 0;
                }
            }

            resetState() {
                this.isPlaying = false;
                this.speed = SPEED_START;
                this.score = 0;
                this.runCoins = 0;
                this.lane = 1; // 0, 1, 2
                this.vy = 0;
                this.isJumping = false;
                this.isOnTrain = false;
                this.currentTrain = null;
                
                // Powerups
                this.magnetActive = false;
                this.jetpackActive = false;
                
                // Clear objects
                this.objects.forEach(o => this.scene.remove(o.mesh));
                this.coins.forEach(c => this.scene.remove(c));
                this.objects = [];
                this.coins = [];
                
                this.player.position.set(0, 0, 0);
                this.player.rotation.set(0,0,0);
            }

            createEnvironment() {
                // Ground
                const ground = new THREE.Mesh(
                    new THREE.PlaneGeometry(100, 400),
                    new THREE.MeshStandardMaterial({ color: 0x333333 })
                );
                ground.rotation.x = -Math.PI/2;
                ground.position.z = -100;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Tracks
                const railGeo = new THREE.BoxGeometry(0.1, 0.1, 400);
                const railMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
                LANES.forEach(x => {
                    const r1 = new THREE.Mesh(railGeo, railMat);
                    r1.position.set(x - 0.7, 0.05, -100);
                    this.scene.add(r1);
                    const r2 = new THREE.Mesh(railGeo, railMat);
                    r2.position.set(x + 0.7, 0.05, -100);
                    this.scene.add(r2);
                });
            }

            spawnTrain() {
                const laneIdx = Math.floor(Math.random() * 3);
                const train = createTrainMesh();
                const xPos = LANES[laneIdx];
                
                // Randomly moving or static
                const isMoving = Math.random() > 0.5;
                const zPos = isMoving ? -150 : -80; // Moving trains start further
                
                train.position.set(xPos, 0, zPos);
                this.scene.add(train);
                
                this.objects.push({
                    mesh: train,
                    type: 'train',
                    lane: laneIdx,
                    moving: isMoving,
                    speed: isMoving ? 0.8 : 0, // Moves towards player
                    length: 12,
                    height: 3
                });
            }

            spawnCoinRow(zStart) {
                const laneIdx = Math.floor(Math.random() * 3);
                const isAir = Math.random() > 0.7;
                
                for(let i=0; i<5; i++) {
                    const c = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16),
                        new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1, roughness: 0.3 })
                    );
                    c.rotation.x = Math.PI/2;
                    c.position.set(LANES[laneIdx], isAir ? 2.5 : 1, zStart - (i*2));
                    this.scene.add(c);
                    this.coins.push(c);
                }
            }

            spawnPowerup(z) {
                const laneIdx = Math.floor(Math.random() * 3);
                const type = Math.random() > 0.5 ? 'magnet' : 'jetpack';
                const color = type === 'magnet' ? 0xe74c3c : 0x3498db;
                
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 0.8, 0.8),
                    new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 })
                );
                p.position.set(LANES[laneIdx], 1.5, z);
                this.scene.add(p);
                this.powerups.push({ mesh: p, type: type });
            }

            setupInputs() {
                const handle = (dir) => {
                    if(!this.isPlaying) return;
                    if(dir === 'left' && this.lane > 0) this.lane--;
                    if(dir === 'right' && this.lane < 2) this.lane++;
                    if(dir === 'up') this.jump();
                    if(dir === 'down') this.roll();
                };

                document.addEventListener('keydown', e => {
                    if(e.key === 'ArrowLeft') handle('left');
                    if(e.key === 'ArrowRight') handle('right');
                    if(e.key === 'ArrowUp') handle('up');
                    if(e.key === 'ArrowDown') handle('down');
                });

                let tx, ty;
                document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
                document.addEventListener('touchend', e => {
                    const dx = e.changedTouches[0].clientX - tx;
                    const dy = e.changedTouches[0].clientY - ty;
                    if(Math.abs(dx) > Math.abs(dy)) {
                        if(dx > 30) handle('right'); // Inverted for RTL feel? No, standard is right=right
                        else if(dx < -30) handle('left');
                    } else {
                        if(dy < -30) handle('up');
                        else if(dy > 30) handle('down');
                    }
                });
            }

            jump() {
                if(!this.isJumping && !this.jetpackActive) {
                    this.vy = 0.45;
                    this.isJumping = true;
                    this.isOnTrain = false;
                }
            }

            roll() {
                // Simple visual roll
                if(!this.isJumping) {
                    this.player.scale.y = 0.5;
                    this.player.position.y = 0;
                    setTimeout(() => {
                        this.player.scale.y = 1;
                        if(!this.isOnTrain) this.player.position.y = 0;
                    }, 600);
                }
            }

            activatePowerup(type) {
                const display = document.getElementById('powerup-display');
                display.style.display = 'block';
                
                if(type === 'magnet') {
                    this.magnetActive = true;
                    document.getElementById('powerup-timer').innerText = '🧲 آهنربا';
                    setTimeout(() => { this.magnetActive = false; display.style.display='none'; }, 8000);
                } else if(type === 'jetpack') {
                    this.jetpackActive = true;
                    this.vy = 0.5; // Fly up
                    document.getElementById('powerup-timer').innerText = '🚀 جت‌پک';
                    setTimeout(() => { this.jetpackActive = false; display.style.display='none'; }, 6000);
                }
            }

            checkCollisions() {
                const pBox = new THREE.Box3().setFromObject(this.player);
                pBox.expandByScalar(-0.2); // Forgiveness

                // Trains
                this.isOnTrain = false;
                for(let obj of this.objects) {
                    if(obj.type === 'train') {
                        const tBox = new THREE.Box3().setFromObject(obj.mesh);
                        
                        // Simple AABB check first
                        if(pBox.intersectsBox(tBox)) {
                            // Check if on top
                            // Player bottom vs Train top
                            const playerBottom = this.player.position.y;
                            const trainTop = obj.height;
                            
                            // If falling and close to top
                            if(this.vy <= 0 && playerBottom >= trainTop - 0.5 && playerBottom <= trainTop + 0.5) {
                                this.isOnTrain = true;
                                this.currentTrain = obj;
                                this.player.position.y = trainTop;
                                this.vy = 0;
                                this.isJumping = false;
                            } else {
                                // Side or front collision
                                // If hitting front face
                                const distZ = this.player.position.z - obj.mesh.position.z;
                                if(distZ > 0 && Math.abs(this.player.position.x - obj.mesh.position.x) < 1) {
                                    this.gameOver();
                                } else {
                                    // Side hit - Stumble effect
                                    this.stumble();
                                }
                            }
                        }
                    }
                }

                // Coins
                for(let i=this.coins.length-1; i>=0; i--) {
                    const c = this.coins[i];
                    const cBox = new THREE.Box3().setFromObject(c);
                    
                    // Magnet Logic
                    if(this.magnetActive) {
                        const dist = this.player.position.distanceTo(c.position);
                        if(dist < 8) {
                            c.position.lerp(this.player.position, 0.2);
                        }
                    }

                    if(pBox.intersectsBox(cBox)) {
                        this.scene.remove(c);
                        this.coins.splice(i, 1);
                        this.runCoins++;
                        this.score += 10;
                    }
                }

                // Powerups
                for(let i=this.powerups.length-1; i>=0; i--) {
                    const p = this.powerups[i];
                    const pBox = new THREE.Box3().setFromObject(p.mesh);
                    if(pBox.intersectsBox(pBox)) { // Wait, pBox vs pBox? No.
                        if(new THREE.Box3().setFromObject(this.player).intersectsBox(pBox)) {
                            this.activatePowerup(p.type);
                            this.scene.remove(p.mesh);
                            this.powerups.splice(i, 1);
                        }
                    }
                }
            }

            stumble() {
                // Visual feedback for side hit
                const overlay = document.getElementById('blur-overlay');
                overlay.style.backdropFilter = 'blur(5px)';
                this.speed *= 0.5; // Slow down
                setTimeout(() => {
                    overlay.style.backdropFilter = 'blur(0px)';
                    this.speed = Math.max(this.speed * 2, SPEED_START); // Recover
                }, 1000);
            }

            gameOver() {
                this.isPlaying = false;
                document.getElementById('game-over').classList.remove('hidden');
                document.getElementById('hud').style.display = 'none';
                document.getElementById('final-score').innerText = Math.floor(this.score);
                
                this.totalCoins += this.runCoins;
                localStorage.setItem('sr_coins', this.totalCoins);
                
                // Flash red
                const flash = document.getElementById('flash-overlay');
                flash.style.background = 'red';
                flash.style.opacity = 0.5;
                setTimeout(()=> flash.style.opacity = 0, 200);
            }

            start() {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('hud').style.display = 'flex';
                this.resetState();
                this.isPlaying = true;
                
                // Initial spawns
                this.spawnTrain();
                this.spawnCoinRow(-30);
            }

            restart() {
                document.getElementById('game-over').classList.add('hidden');
                this.start();
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                if(this.isPlaying) {
                    // Speed up
                    this.speed = Math.min(this.speed + 0.0001, 1.5);
                    this.score += this.speed * 0.1;
                    
                    // UI
                    document.getElementById('score').innerText = Math.floor(this.score);
                    document.getElementById('coins').innerText = this.totalCoins + this.runCoins;

                    // Player Lane Lerp
                    const targetX = LANES[this.lane];
                    this.player.position.x += (targetX - this.player.position.x) * 0.2;
                    this.player.rotation.z = (this.player.position.x - targetX) * -0.1;

                    // Jump / Gravity / Jetpack
                    if(this.jetpackActive) {
                        this.player.position.y += 0.1;
                        if(this.player.position.y > 6) this.player.position.y = 6;
                        this.player.rotation.x = -0.5; // Tilt up
                    } else {
                        this.player.rotation.x = 0;
                        if(!this.isOnTrain) {
                            this.player.position.y += this.vy;
                            this.vy -= GRAVITY;
                            if(this.player.position.y < 0) {
                                this.player.position.y = 0;
                                this.vy = 0;
                                this.isJumping = false;
                            }
                        } else {
                            // Stick to train
                            if(this.currentTrain) {
                                this.player.position.y = this.currentTrain.height;
                            }
                        }
                    }

                    // Move World
                    // Trains
                    this.objects.forEach(obj => {
                        if(obj.moving) {
                            obj.mesh.position.z += obj.speed + this.speed; // Relative speed
                        } else {
                            obj.mesh.position.z += this.speed;
                        }
                        
                        // Remove if passed
                        if(obj.mesh.position.z > 20) {
                            this.scene.remove(obj.mesh);
                            obj.dead = true;
                        }
                    });
                    this.objects = this.objects.filter(o => !o.dead);

                    // Coins
                    this.coins.forEach(c => {
                        c.position.z += this.speed;
                        c.rotation.z += 0.1;
                        if(c.position.z > 10) { c.dead = true; this.scene.remove(c); }
                    });
                    this.coins = this.coins.filter(c => !c.dead);

                    // Powerups
                    this.powerups.forEach(p => {
                        p.mesh.position.z += this.speed;
                        p.mesh.rotation.y += 0.05;
                        if(p.mesh.position.z > 10) { p.dead = true; this.scene.remove(p.mesh); }
                    });
                    this.powerups = this.powerups.filter(p => !p.dead);

                    // Spawning Logic
                    if(Math.random() < 0.02) this.spawnTrain();
                    if(Math.random() < 0.03) this.spawnCoinRow(-80);
                    if(Math.random() < 0.002) this.spawnPowerup(-80);

                    // Cop Animation (Running behind)
                    this.cop.position.x = this.player.position.x; // Follow lane
                    this.cop.position.z = 6 + Math.sin(Date.now()*0.01)*0.2; // Bobbing
                    
                    // Run Anim
                    if(!this.isJumping && !this.jetpackActive) {
                        const t = Date.now() * 0.02;
                        this.player.userData.parts.ll.rotation.x = Math.sin(t);
                        this.player.userData.parts.rl.rotation.x = Math.sin(t + Math.PI);
                    }

                    this.checkCollisions();
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        const game = new Game();
        window.game = game;

        // Resize
        window.addEventListener('resize', () => {
            game.camera.aspect = window.innerWidth / window.innerHeight;
            game.camera.updateProjectionMatrix();
            game.renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
