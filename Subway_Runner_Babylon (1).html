<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro V9 - Physics & Graphics Fix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        body { margin: 0; overflow: hidden; background: #0f0f1a; font-family: 'Vazirmatn', sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .hud { padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: 900; font-size: 1.5rem; pointer-events: auto; }
        .coin-box { background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,215,0,0.3); }
        
        .menu-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 15, 26, 0.92); backdrop-filter: blur(10px); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            pointer-events: auto; transition: opacity 0.3s; z-index: 20; 
        }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        
        h1 { color: #fff; font-size: 3.5rem; margin: 0 0 30px 0; text-transform: uppercase; background: linear-gradient(to bottom, #ffeb3b, #ff9800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); letter-spacing: 2px; text-align: center;}
        
        button { 
            background: linear-gradient(to bottom, #4caf50, #2e7d32); 
            border: none; padding: 18px 50px; color: white; 
            font-family: inherit; font-size: 1.3rem; font-weight: bold; 
            border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #1b5e20, 0 10px 20px rgba(0,0,0,0.3); 
            transition: all 0.1s; margin: 10px; min-width: 240px; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.3); position: relative; overflow: hidden;
        }
        button::after { content:''; position:absolute; top:0; left:0; width:100%; height:50%; background:rgba(255,255,255,0.1); }
        button:active { transform: translateY(6px); box-shadow: 0 0 0 #1b5e20; }
        button.secondary { background: linear-gradient(to bottom, #546e7a, #37474f); box-shadow: 0 6px 0 #263238; }
        button.secondary:active { box-shadow: 0 0 0 #263238; }
        
        .panel-row { display: flex; justify-content: space-between; width: 320px; margin: 12px 0; color: white; font-size: 1.1rem; align-items: center; background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 12px; }
        .toggle-group { display: flex; gap: 5px; }
        .toggle-btn { background: rgba(0,0,0,0.3); padding: 6px 16px; border-radius: 20px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; transition: 0.2s; }
        .toggle-btn.active { background: #ff9800; border-color: #ffb74d; color: black; font-weight: bold; box-shadow: 0 0 10px rgba(255,152,0,0.4); }

        .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 500px; margin-bottom: 25px; }
        .shop-item { background: rgba(255,255,255,0.05); padding: 15px 10px; border-radius: 15px; text-align: center; border: 2px solid rgba(255,255,255,0.05); cursor: pointer; color: white; transition: 0.2s; }
        .shop-item:hover { background: rgba(255,255,255,0.1); }
        .shop-item.selected { border-color: #ffeb3b; background: rgba(255, 235, 59, 0.15); box-shadow: 0 0 15px rgba(255,235,59,0.2); }
        .skin-preview { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 8px; border: 2px solid rgba(255,255,255,0.2); box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3); }
        
        #pause-btn { pointer-events: auto; background: rgba(0,0,0,0.4); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem; border: 2px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px); }
        
        /* Stumble Effect Overlay */
        #stumble-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.3) 100%); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="stumble-overlay"></div>

    <div id="ui-layer">
        <div class="hud">
            <div class="coin-box">🪙 <span id="coin-display">0</span></div>
            <div id="pause-btn">⏸️</div>
        </div>
        <div class="hud" style="justify-content:center; padding-bottom:50px; pointer-events:none;">
            <div id="score-display" style="font-size:3rem; letter-spacing:2px;">0</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen">
        <h1>SUBWAY PRO V9</h1>
        <button onclick="Game.start()">🏃‍♂️ شروع دویدن</button>
        <button class="secondary" onclick="UI.showShop()">🛒 فروشگاه و اسکین</button>
        <button class="secondary" onclick="UI.showSettings()">⚙️ تنظیمات گرافیک</button>
    </div>

    <!-- Settings -->
    <div id="settings-menu" class="menu-screen hidden">
        <h2 style="color:white; margin-bottom:25px; font-size:1.8rem;">تنظیمات گرافیک</h2>
        <div class="panel-row">
            <span>کیفیت رندر:</span>
            <div class="toggle-group">
                <div class="toggle-btn" onclick="Settings.setQuality('low')" id="q-low">پایین</div>
                <div class="toggle-btn active" onclick="Settings.setQuality('med')" id="q-med">متوسط</div>
                <div class="toggle-btn" onclick="Settings.setQuality('high')" id="q-high">بالا</div>
            </div>
        </div>
        <div class="panel-row">
            <span>سایه‌زنی (Shadow):</span>
            <div class="toggle-btn active" onclick="Settings.toggleShadow()" id="t-shadow">روشن</div>
        </div>
        <div class="panel-row">
            <span>افکت ذرات:</span>
            <div class="toggle-btn active" onclick="Settings.toggleParticles()" id="t-particles">روشن</div>
        </div>
        <button class="secondary" onclick="UI.showMain()" style="margin-top:30px;">بازگشت به منو</button>
    </div>

    <!-- Shop -->
    <div id="shop-menu" class="menu-screen hidden">
        <h2 style="color:white; margin-bottom:10px;">فروشگاه شخصیت‌ها</h2>
        <div style="color:#ffd700; margin-bottom:20px; font-size:1.3rem; background:rgba(0,0,0,0.3); padding:8px 20px; border-radius:20px;">موجودی: <span id="shop-coins">0</span> 🪙</div>
        <div class="shop-grid" id="skin-container"></div>
        <button class="secondary" onclick="UI.showMain()">بازگشت</button>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="menu-screen hidden">
        <h1 style="background:linear-gradient(to bottom, #ff5252, #b71c1c); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">GAME OVER</h1>
        <h2 style="color:white; font-size:1.5rem; margin-bottom:30px;">امتیاز نهایی: <span id="final-score" style="color:#ffeb3b">0</span></h2>
        <button onclick="Game.start()">🔄 تلاش مجدد</button>
        <button class="secondary" onclick="UI.showMain()">منوی اصلی</button>
    </div>

<script>
/**
 * SUBWAY RUNNER PRO V9 - PHYSICS & COLLISION OVERHAUL
 * - Real Jump Arc & Landing
 * - Side Collision = Stumble (Not Death)
 * - Train Roof Walking
 * - True Graphics Settings
 */

const CONFIG = {
    laneWidth: 3.2,
    baseSpeed: 18,
    gravity: -45,
    jumpForce: 16,
    stumbleDuration: 1.5, // Seconds of dizziness after side hit
    colors: {
        fog: 0x87CEEB,
        ground: 0x5D4037,
        skins: {
            'classic': { color: 0xFFCCAA, price: 0, name: 'کلاسیک' },
            'ninja': { color: 0x212121, price: 200, name: 'نینجا' },
            'red': { color: 0xD32F2F, price: 250, name: 'قرمز' },
            'blue': { color: 0x1976D2, price: 300, name: 'آبی' },
            'gold': { color: 0xFFD700, price: 500, name: 'طلایی' }
        }
    }
};

let state = {
    isPlaying: false,
    isPaused: false,
    score: 0,
    coins: parseInt(localStorage.getItem('srp_coins_v9') || '0'),
    speed: CONFIG.baseSpeed,
    lane: 0,
    yVel: 0,
    isJumping: false,
    onTrain: null, // Reference to train object if riding
    stumbleTimer: 0, // > 0 means player is stumbling
    skin: localStorage.getItem('srp_skin_v9') || 'classic',
    ownedSkins: JSON.parse(localStorage.getItem('srp_owned_v9') || '["classic"]'),
    settings: JSON.parse(localStorage.getItem('srp_settings_v9') || '{"quality":"med","shadows":true,"particles":true}')
};

// --- THREE.JS CORE ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.colors.fog);
scene.fog = new THREE.FogExp2(CONFIG.colors.fog, 0.012);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 150);
camera.position.set(0, 6, 9);
camera.lookAt(0, 1, -5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = state.settings.shadows;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('game-container').appendChild(renderer.domElement);

// Lighting
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(15, 30, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 80;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
dirLight.shadow.bias = -0.0005;
scene.add(dirLight);

// --- ASSETS ---
function createProceduralTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#5D4037'; ctx.fillRect(0,0,512,512);
    for(let i=0; i<8000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#4E342E' : '#6D4C41';
        ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
    }
    ctx.fillStyle = '#3E2723';
    [100, 256, 412].forEach(x => ctx.fillRect(x, 0, 20, 512));
    ctx.fillStyle = '#212121';
    for(let y=0; y<512; y+=40) ctx.fillRect(80, y, 352, 10);
    
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 10);
    return tex;
}

const groundMat = new THREE.MeshStandardMaterial({ map: createProceduralTexture(), roughness: 0.9, metalness: 0.1 });

// --- OBJECT FACTORIES ---
let player, ground;
let obstacles = [];
let clock = new THREE.Clock();

function createPlayerMesh(skinKey) {
    const group = new THREE.Group();
    const skinColor = CONFIG.colors.skins[skinKey]?.color || 0xFFCCAA;
    const matSkin = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.4 });
    const matCloth = new THREE.MeshStandardMaterial({ color: 0x37474F, roughness: 0.7 });
    const matShoe = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });

    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 0.9, 12), matSkin);
    torso.position.y = 1.1; torso.castShadow = true; group.add(torso);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), matSkin);
    head.position.y = 1.85; head.castShadow = true; group.add(head);

    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.15, 16), new THREE.MeshStandardMaterial({color: 0xD32F2F}));
    cap.position.y = 1.95; group.add(cap);
    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.3), new THREE.MeshStandardMaterial({color: 0xD32F2F}));
    brim.position.set(0, 1.95, 0.25); group.add(brim);

    const legGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.8, 8);
    const ll = new THREE.Mesh(legGeo, matCloth); ll.position.set(-0.15, 0.4, 0); ll.castShadow=true; group.add(ll);
    const rl = new THREE.Mesh(legGeo, matCloth); rl.position.set(0.15, 0.4, 0); rl.castShadow=true; group.add(rl);

    const shoeGeo = new THREE.BoxGeometry(0.18, 0.15, 0.3);
    group.add(new THREE.Mesh(shoeGeo, matShoe).translateX(-0.15).translateY(0.07).translateZ(0.05));
    group.add(new THREE.Mesh(shoeGeo, matShoe).translateX(0.15).translateY(0.07).translateZ(0.05));

    return group;
}

function createTrainMesh(color) {
    const group = new THREE.Group();
    const matBody = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.4 });
    const matDark = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    const matWindow = new THREE.MeshStandardMaterial({ color: 0x81D4FA, roughness: 0.1, metalness: 0.8 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.8, 7), matBody);
    body.position.y = 1.6; body.castShadow = true; body.receiveShadow = true;
    group.add(body);

    const roof = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.2, 6.8), matDark);
    roof.position.y = 3.1; group.add(roof);

    const win = new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.8, 5), matWindow);
    win.position.y = 2.2; group.add(win);

    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    wheelGeo.rotateZ(Math.PI/2);
    [-2.5, 2.5].forEach(z => {
        group.add(new THREE.Mesh(wheelGeo, matDark).translateX(-1.1).translateY(0.4).translateZ(z));
        group.add(new THREE.Mesh(wheelGeo, matDark).translateX(1.1).translateY(0.4).translateZ(z));
    });

    // Collision Box Data attached to mesh
    group.userData = { 
        type: 'train', 
        topY: 3.2, // Height of roof for landing
        width: 2.4, 
        length: 7 
    };
    return group;
}

function createBarrierMesh() {
    const group = new THREE.Group();
    const matWood = new THREE.MeshStandardMaterial({ color: 0x8D6E63, roughness: 0.9 });
    const matMetal = new THREE.MeshStandardMaterial({ color: 0xBDBDBD, metalness: 0.6, roughness: 0.4 });

    const legGeo = new THREE.BoxGeometry(0.15, 1.2, 0.15);
    group.add(new THREE.Mesh(legGeo, matMetal).translateX(-1.2).translateY(0.6));
    group.add(new THREE.Mesh(legGeo, matMetal).translateX(1.2).translateY(0.6));

    const barGeo = new THREE.BoxGeometry(2.6, 0.2, 0.1);
    group.add(new THREE.Mesh(barGeo, matWood).translateY(0.9));
    group.add(new THREE.Mesh(barGeo, matWood).translateY(0.5));

    group.userData = { type: 'barrier', topY: 1.1, width: 2.6 };
    return group;
}

// --- GAME LOGIC ---
function initWorld() {
    if(player) scene.remove(player);
    obstacles.forEach(o => scene.remove(o));
    obstacles = [];

    if(!ground) {
        ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 300), groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    player = createPlayerMesh(state.skin);
    scene.add(player);

    state.lane = 0;
    state.score = 0;
    state.speed = CONFIG.baseSpeed;
    state.isJumping = false;
    state.yVel = 0;
    state.onTrain = null;
    state.stumbleTimer = 0;
    player.position.set(0, 0, 0);
    player.rotation.set(0,0,0);
    updateHUD();
}

function spawnObstacle(zPos) {
    const type = Math.random();
    let mesh;
    if(type < 0.6) {
        const colors = [0xE53935, 0x1E88E5, 0xFDD835, 0x43A047, 0x8E24AA];
        mesh = createTrainMesh(colors[Math.floor(Math.random()*colors.length)]);
    } else {
        mesh = createBarrierMesh();
    }
    const lane = Math.floor(Math.random() * 3) - 1;
    mesh.position.x = lane * CONFIG.laneWidth;
    mesh.position.z = zPos;
    scene.add(mesh);
    obstacles.push(mesh);
}

function triggerStumble() {
    state.stumbleTimer = CONFIG.stumbleDuration;
    state.speed *= 0.5; // Slow down significantly
    document.getElementById('stumble-overlay').style.opacity = 1;
    
    // Visual wobble
    const wobbleAnim = () => {
        if(state.stumbleTimer <= 0) return;
        player.rotation.z = Math.sin(Date.now() * 0.02) * 0.3;
        player.rotation.x = Math.cos(Date.now() * 0.015) * 0.2;
        requestAnimationFrame(wobbleAnim);
    };
    wobbleAnim();
}

function update(delta) {
    if(!state.isPlaying || state.isPaused) return;

    // Recover from stumble
    if(state.stumbleTimer > 0) {
        state.stumbleTimer -= delta;
        state.speed = Math.min(state.speed + delta * 5, CONFIG.baseSpeed); // Gradually recover speed
        if(state.stumbleTimer <= 0) {
            document.getElementById('stumble-overlay').style.opacity = 0;
            player.rotation.set(0,0,0);
        }
    }

    const move = state.speed * delta;
    state.score += Math.floor(move * 10);
    if(state.stumbleTimer <= 0) state.speed = Math.min(state.speed + delta * 0.05, 45);

    // Lane Movement (Slower during stumble)
    const laneSpeed = state.stumbleTimer > 0 ? 5 : 12;
    const targetX = state.lane * CONFIG.laneWidth;
    player.position.x += (targetX - player.position.x) * laneSpeed * delta;
    
    // Normal lean only if not stumbling
    if(state.stumbleTimer <= 0) {
        player.rotation.z = (player.position.x - targetX) * -0.08;
    }

    // Vertical Physics & Train Riding
    let groundLevel = 0;
    let ridingTrain = false;

    // Check if we are above a train/barrier to land on it
    for(let ob of obstacles) {
        const dz = ob.position.z - player.position.z;
        const dx = Math.abs(ob.position.x - player.position.x);
        
        // Are we within the horizontal bounds of this obstacle?
        const halfW = (ob.userData.width || 2.4) / 2;
        const halfL = (ob.userData.length || 1) / 2;
        
        if(dx < halfW + 0.2 && dz > -halfL && dz < halfL) {
            const topY = ob.userData.topY;
            // If falling and feet are near the top surface
            if(state.yVel <= 0 && player.position.y >= topY - 0.5 && player.position.y <= topY + 1.0) {
                groundLevel = topY;
                if(ob.userData.type === 'train') {
                    state.onTrain = ob;
                    ridingTrain = true;
                }
                break;
            }
        }
    }

    // Apply Gravity or Snap to Surface
    if(player.position.y > groundLevel + 0.1 || state.yVel > 0) {
        state.yVel += CONFIG.gravity * delta;
        player.position.y += state.yVel * delta;
        state.isJumping = true;
    } else {
        // Landed
        player.position.y = groundLevel;
        state.yVel = 0;
        state.isJumping = false;
        if(!ridingTrain) state.onTrain = null;
    }

    // If riding train, move with it (trains move at same speed as world in this engine)
    // Actually in this engine obstacles move towards player, so no extra X/Z needed for riding
    // But we must ensure Y stays locked
    if(ridingTrain && state.onTrain) {
        player.position.y = state.onTrain.userData.topY;
        state.isJumping = false;
        state.yVel = 0;
    }

    // Collision Detection
    for(let i = obstacles.length - 1; i >= 0; i--) {
        let ob = obstacles[i];
        ob.position.z += move;

        const dz = ob.position.z - player.position.z;
        const dx = Math.abs(ob.position.x - player.position.x);
        const dy = player.position.y;

        // Z overlap check
        const halfL = (ob.userData.length || 1) / 2;
        if(dz > -halfL - 0.3 && dz < halfL + 0.3) {
            
            // SIDE COLLISION (Stumble Logic)
            // Player is beside the train but overlapping slightly in X
            const halfW = (ob.userData.width || 2.4) / 2;
            const playerHalfW = 0.35;
            
            // If X distance indicates partial overlap (grazing) AND we are NOT on top
            if(dx < halfW + playerHalfW && dx > halfW - 0.4 && dy < ob.userData.topY - 0.5) {
                if(state.stumbleTimer <= 0) triggerStumble();
            }
            
            // FRONT/DIRECT COLLISION (Death Logic)
            // Direct center overlap AND not jumping high enough over barriers
            else if(dx < halfW - 0.2 && dy < ob.userData.topY - 0.5) {
                // For trains: only die if hitting front face (dz close to front edge)
                if(ob.userData.type === 'train' && dz > halfL - 1.0 && dz < halfL + 0.5) {
                    gameOver(); return;
                }
                // For barriers: die if not cleared
                if(ob.userData.type === 'barrier' && dy < 0.9) {
                    gameOver(); return;
                }
            }
        }

        if(ob.position.z > 12) {
            scene.remove(ob);
            obstacles.splice(i, 1);
            if(state.onTrain === ob) state.onTrain = null;
        }
    }

    // Spawning
    const lastZ = obstacles.length > 0 ? obstacles[obstacles.length-1].position.z : -30;
    if(lastZ > -120) spawnObstacle(lastZ - (18 + Math.random() * 18));

    // Ground Scroll
    ground.position.z += move;
    if(ground.position.z > 100) ground.position.z = -100;

    // Camera
    camera.position.z = player.position.z + 9;
    camera.position.x += (player.position.x * 0.4 - camera.position.x) * 4 * delta;
    
    updateHUD();
}

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);
    update(delta);
    renderer.render(scene, camera);
}

// --- INPUT ---
window.addEventListener('keydown', e => {
    if(!state.isPlaying || state.isPaused) return;
    if(e.key === 'ArrowLeft' && state.lane > -1) state.lane--;
    if(e.key === 'ArrowRight' && state.lane < 1) state.lane++;
    if((e.key === 'ArrowUp' || e.key === ' ') && !state.isJumping) {
        state.isJumping = true;
        state.yVel = CONFIG.jumpForce;
    }
});

let tx = 0;
window.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:false});
window.addEventListener('touchend', e => {
    if(!state.isPlaying || state.isPaused) return;
    const dx = e.changedTouches[0].clientX - tx;
    if(Math.abs(dx) > 30) {
        if(dx > 0 && state.lane < 1) state.lane++;
        if(dx < 0 && state.lane > -1) state.lane--;
    }
}, {passive:false});

// --- SYSTEMS ---
const UI = {
    showMain: () => { document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden')); document.getElementById('main-menu').classList.remove('hidden'); },
    showShop: () => { document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden')); document.getElementById('shop-menu').classList.remove('hidden'); renderShop(); },
    showSettings: () => { document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden')); document.getElementById('settings-menu').classList.remove('hidden'); Settings.updateUI(); }
};

const Game = {
    start: () => {
        initWorld();
        state.isPlaying = true;
        state.isPaused = false;
        document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
        clock.start();
    },
    pause: () => { state.isPaused = !state.isPaused; }
};

function gameOver() {
    state.isPlaying = false;
    localStorage.setItem('srp_coins_v9', state.coins);
    document.getElementById('final-score').innerText = state.score;
    document.getElementById('game-over').classList.remove('hidden');
}

function updateHUD() {
    document.getElementById('score-display').innerText = state.score;
    document.getElementById('coin-display').innerText = state.coins;
}

// --- SETTINGS (REAL IMPACT) ---
const Settings = {
    setQuality: (level) => {
        state.settings.quality = level;
        const dpr = level === 'low' ? 0.75 : level === 'med' ? 1 : Math.min(window.devicePixelRatio, 2);
        renderer.setPixelRatio(dpr);
        Settings.updateUI();
        saveSettings();
    },
    toggleShadow: () => {
        state.settings.shadows = !state.settings.shadows;
        renderer.shadowMap.enabled = state.settings.shadows;
        scene.traverse(obj => { if(obj.material) obj.material.needsUpdate = true; });
        Settings.updateUI();
        saveSettings();
    },
    toggleParticles: () => {
        state.settings.particles = !state.settings.particles;
        Settings.updateUI();
        saveSettings();
    },
    updateUI: () => {
        document.getElementById('t-shadow').className = `toggle-btn ${state.settings.shadows ? 'active' : ''}`;
        document.getElementById('t-shadow').innerText = state.settings.shadows ? 'روشن' : 'خاموش';
        document.getElementById('t-particles').className = `toggle-btn ${state.settings.particles ? 'active' : ''}`;
        document.getElementById('t-particles').innerText = state.settings.particles ? 'روشن' : 'خاموش';
        ['low','med','high'].forEach(q => {
            document.getElementById(`q-${q}`).className = `toggle-btn ${state.settings.quality === q ? 'active' : ''}`;
        });
    }
};

function saveSettings() { localStorage.setItem('srp_settings_v9', JSON.stringify(state.settings)); }

// --- SHOP ---
function renderShop() {
    const container = document.getElementById('skin-container');
    container.innerHTML = '';
    document.getElementById('shop-coins').innerText = state.coins;
    Object.entries(CONFIG.colors.skins).forEach(([key, data]) => {
        const owned = state.ownedSkins.includes(key);
        const selected = state.skin === key;
        const div = document.createElement('div');
        div.className = `shop-item ${selected ? 'selected' : ''} ${!owned ? 'locked' : ''}`;
        div.innerHTML = `<div class="skin-preview" style="background:#${data.color.toString(16).padStart(6,'0')}"></div><div style="font-weight:bold">${data.name}</div><div style="font-size:0.8rem;color:#aaa;margin-top:4px">${owned ? '✓ انتخاب شده' : data.price + ' 🪙'}</div>`;
        div.onclick = () => {
            if(owned) { state.skin = key; localStorage.setItem('srp_skin_v9', key); renderShop(); }
            else if(state.coins >= data.price) {
                state.coins -= data.price; state.ownedSkins.push(key); state.skin = key;
                localStorage.setItem('srp_coins_v9', state.coins);
                localStorage.setItem('srp_owned_v9', JSON.stringify(state.ownedSkins));
                localStorage.setItem('srp_skin_v9', key);
                renderShop();
            } else { alert("سکه کافی نیست!"); }
        };
        container.appendChild(div);
    });
}

document.getElementById('pause-btn').onclick = Game.pause;
Settings.updateUI();
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
