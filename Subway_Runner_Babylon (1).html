<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro V13 - Core Restored</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        body { margin: 0; overflow: hidden; background: #4FC3F7; font-family: 'Vazirmatn', sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .hud-top { padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-weight: 900; font-size: 1.2rem; pointer-events: auto; }
        .stat-box { background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; margin-bottom: 8px; border: 2px solid rgba(255,255,255,0.3); display: inline-block;}
        
        .menu-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            pointer-events: auto; transition: opacity 0.3s; z-index: 20; 
        }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        
        h1 { color: #FFEB3B; font-size: 3rem; margin: 0 0 20px 0; text-shadow: 3px 3px 0 #D32F2F; letter-spacing: 2px; }
        
        button { 
            background: linear-gradient(to bottom, #FF9800, #F57C00); 
            border: none; padding: 15px 40px; color: white; 
            font-family: inherit; font-size: 1.2rem; font-weight: bold; 
            border-radius: 30px; cursor: pointer; box-shadow: 0 5px 0 #E65100; 
            transition: transform 0.1s; margin: 10px; min-width: 220px; 
        }
        button:active { transform: translateY(5px); box-shadow: none; }
        button.sec { background: linear-gradient(to bottom, #607D8B, #455A64); box-shadow: 0 5px 0 #263238; }
        button.sec:active { box-shadow: none; }
        
        #stumble-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.6) 100%); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="stumble-overlay"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div>
                <div class="stat-box">امتیاز: <span id="score-display">0</span></div><br>
                <div class="stat-box" style="color:#FFD700">🪙 <span id="coin-display">0</span></div><br>
                <div class="stat-box" style="font-size:1rem; color:#81D4FA" id="mission-display">مأموریت: ۱۰ سکه جمع کن</div>
            </div>
            <div id="pause-btn" style="pointer-events:auto; background:rgba(0,0,0,0.5); width:45px; height:45px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.5rem;">⏸️</div>
        </div>
    </div>

    <div id="main-menu" class="menu-screen">
        <h1>SUBWAY PRO V13</h1>
        <button onclick="Game.start()">شروع دویدن 🏃‍♂️</button>
        <button class="sec" onclick="UI.show('shop-menu')">فروشگاه 🛒</button>
        <button class="sec" onclick="UI.show('char-menu')">انتخاب شخصیت 👤</button>
    </div>

    <div id="shop-menu" class="menu-screen hidden">
        <h2 style="color:white">فروشگاه پاورآپ</h2>
        <p style="color:#FFD700">سکه: <span id="shop-coins">0</span></p>
        <button onclick="Shop.buy('magnet', 50)">🧲 آهنربا (۵۰)</button>
        <button onclick="Shop.buy('shield', 100)">🛡️ سپر (۱۰۰)</button>
        <button class="sec" onclick="UI.show('main-menu')">بستن</button>
    </div>

    <div id="char-menu" class="menu-screen hidden">
        <h2 style="color:white">انتخاب شخصیت</h2>
        <button onclick="Game.setSkin(0xFFCCAA)">پیش‌فرض</button>
        <button onclick="Game.setSkin(0xD32F2F)">قرمز</button>
        <button onclick="Game.setSkin(0x1976D2)">آبی</button>
        <button class="sec" onclick="UI.show('main-menu')">بستن</button>
    </div>

    <div id="game-over" class="menu-screen hidden">
        <h1 style="color:#FF5252; text-shadow: 3px 3px 0 #000;">GAME OVER</h1>
        <h2 style="color:white" id="final-score">امتیاز: 0</h2>
        <button onclick="Game.start()">دوباره 🔄</button>
        <button class="sec" onclick="UI.show('main-menu')">منو</button>
    </div>

<script>
// --- CONFIG & STATE (Based on V7 Core) ---
const state = {
    isPlaying: false, isPaused: false, score: 0, coins: parseInt(localStorage.getItem('srp_coins')||'0'),
    speed: 18, lane: 0, yVel: 0, isJumping: false, skinColor: 0xFFCCAA, stumbleTimer: 0,
    missionTarget: 10, missionProgress: 0
};

// --- THREE.JS SETUP (Bright & Poppy) ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4FC3F7); // Bright Sky Blue
scene.fog = new THREE.Fog(0x4FC3F7, 20, 70);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 5, 8); camera.lookAt(0, 0, -5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('game-container').appendChild(renderer.domElement);

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 20, 10); sun.castShadow = true;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20; sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
scene.add(sun);

// --- ASSETS ---
let player, ground, obstacles = [], clock = new THREE.Clock();

function createPlayer() {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: state.skinColor });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16), mat); body.position.y = 1; body.castShadow=true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mat); head.position.y = 1.6; head.castShadow=true;
    g.add(body, head); return g;
}

function createTrain(color) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.5, 6), new THREE.MeshLambertMaterial({ color }));
    body.position.y = 1.25; body.castShadow=true; body.receiveShadow=true;
    g.add(body);
    g.userData = { type: 'train', w: 2.2, h: 2.5, d: 6 };
    return g;
}

function createBarrier() {
    const g = new THREE.Group();
    const bar = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 0.5), new THREE.MeshLambertMaterial({ color: 0xFFEB3B }));
    bar.position.y = 0.4; bar.castShadow=true;
    g.add(bar);
    g.userData = { type: 'barrier', w: 2.5, h: 0.8, d: 0.5 };
    return g;
}

// --- LOGIC ---
function init() {
    if(player) scene.remove(player);
    obstacles.forEach(o=>scene.remove(o)); obstacles=[];
    
    if(!ground) {
        ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 200), new THREE.MeshLambertMaterial({ color: 0x8BC34A })); // Bright Green Ground
        ground.rotation.x = -Math.PI/2; ground.receiveShadow=true; scene.add(ground);
    }
    
    player = createPlayer(); scene.add(player);
    state.lane = 0; state.score = 0; state.speed = 18; state.isJumping = false; state.yVel = 0; state.stumbleTimer = 0;
    state.missionProgress = 0; updateHUD();
}

function spawn(z) {
    const mesh = Math.random() > 0.4 ? createTrain([0xF44336, 0x2196F3, 0x9C27B0][Math.floor(Math.random()*3)]) : createBarrier();
    mesh.position.x = (Math.floor(Math.random()*3)-1) * 3;
    mesh.position.z = z;
    scene.add(mesh); obstacles.push(mesh);
}

function triggerStumble() {
    state.stumbleTimer = 1.5; state.speed *= 0.4;
    document.getElementById('stumble-overlay').style.opacity = 1;
}

function update(dt) {
    if(!state.isPlaying || state.isPaused) return;

    // Stumble logic
    if(state.stumbleTimer > 0) {
        state.stumbleTimer -= dt; state.speed = Math.min(state.speed + dt*8, 18);
        if(state.stumbleTimer <= 0) { document.getElementById('stumble-overlay').style.opacity = 0; player.rotation.set(0,0,0); }
    } else {
        state.speed = Math.min(state.speed + dt*0.2, 35);
    }

    const move = state.speed * dt;
    state.score += Math.floor(move * 5);

    // Lane Lerp
    const tx = state.lane * 3;
    player.position.x += (tx - player.position.x) * 12 * dt;
    if(state.stumbleTimer <= 0) player.rotation.z = (player.position.x - tx) * -0.1;

    // Jump Physics (FIXED)
    if(state.isJumping) {
        state.yVel -= 45 * dt; // Gravity
        player.position.y += state.yVel * dt;
        if(player.position.y <= 0) { player.position.y = 0; state.isJumping = false; state.yVel = 0; }
    }

    // Obstacles & Collision
    for(let i=obstacles.length-1; i>=0; i--) {
        let ob = obstacles[i];
        ob.position.z += move;

        const dz = ob.position.z - player.position.z;
        const dx = Math.abs(ob.position.x - player.position.x);
        const dy = player.position.y;

        // AABB Collision
        if(dz > -ob.userData.d/2 - 0.3 && dz < ob.userData.d/2 + 0.3) {
            if(dx < ob.userData.w/2 + 0.3) {
                // Check Y (Are we on top?)
                if(dy < ob.userData.h - 0.2) {
                    // Side hit vs Front hit
                    if(dx > ob.userData.w/2 - 0.2) {
                        if(state.stumbleTimer <= 0) triggerStumble(); // Side hit = Stumble
                    } else {
                        gameOver(); return; // Front hit = Death
                    }
                } else if (ob.userData.type === 'train' && state.yVel <= 0) {
                    player.position.y = ob.userData.h; state.isJumping = false; state.yVel = 0; // Run on train
                }
            }
        }

        if(ob.position.z > 10) { scene.remove(ob); obstacles.splice(i,1); }
    }

    // Spawn
    const lastZ = obstacles.length ? obstacles[obstacles.length-1].position.z : -20;
    if(lastZ > -80) spawn(lastZ - (12 + Math.random()*10));

    ground.position.z += move; if(ground.position.z > 50) ground.position.z = -50;
    camera.position.x += (player.position.x * 0.3 - camera.position.x) * 5 * dt;

    // Mission Logic
    if(state.score > state.missionProgress + 100) {
        state.missionProgress = state.score;
        state.coins += 5; // Reward
        localStorage.setItem('srp_coins', state.coins);
    }

    updateHUD();
}

function animate() {
    requestAnimationFrame(animate);
    update(Math.min(clock.getDelta(), 0.1));
    renderer.render(scene, camera);
}

// --- INPUT (FIXED JUMP) ---
window.addEventListener('keydown', e => {
    if(!state.isPlaying) return;
    if(e.key==='ArrowLeft' && state.lane>-1) state.lane--;
    if(e.key==='ArrowRight' && state.lane<1) state.lane++;
    if((e.key==='ArrowUp'||e.key===' ') && !state.isJumping) { state.isJumping = true; state.yVel = 18; }
});

let tx=0;
window.addEventListener('touchstart', e=>tx=e.touches[0].clientX);
window.addEventListener('touchend', e=>{
    if(!state.isPlaying) return;
    const dx = e.changedTouches[0].clientX - tx;
    if(Math.abs(dx)>30) { if(dx>0 && state.lane<1) state.lane++; if(dx<0 && state.lane>-1) state.lane--; }
    else if (dx === 0 && !state.isJumping) { state.isJumping = true; state.yVel = 18; } // Tap to jump
});

// --- UI & SYSTEMS ---
const UI = { show: (id) => { document.querySelectorAll('.menu-screen').forEach(el=>el.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); if(id==='shop-menu') document.getElementById('shop-coins').innerText=state.coins; }};
const Game = {
    start: () => { init(); state.isPlaying=true; state.isPaused=false; UI.show('game-container'); document.querySelectorAll('.menu-screen').forEach(el=>el.classList.add('hidden')); clock.start(); },
    setSkin: (c) => { state.skinColor = c; UI.show('main-menu'); },
    pause: () => state.isPaused = !state.isPaused
};
function gameOver() { state.isPlaying=false; document.getElementById('final-score').innerText=`امتیاز: ${state.score}`; UI.show('game-over'); }
function updateHUD() { document.getElementById('score-display').innerText=state.score; document.getElementById('coin-display').innerText=state.coins; }
const Shop = { buy: (item, price) => { if(state.coins>=price) { state.coins-=price; localStorage.setItem('srp_coins',state.coins); document.getElementById('shop-coins').innerText=state.coins; alert('خریداری شد!'); } else alert('سکه ندارید!'); }};

document.getElementById('pause-btn').onclick = Game.pause;
animate();
window.addEventListener('resize', ()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
</script>
</body>
</html>
