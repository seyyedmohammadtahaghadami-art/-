<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro V8 - Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Vazirmatn', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .hud { padding: 20px; display: flex; justify-content: space-between; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: 900; font-size: 1.5rem; pointer-events: auto; }
        .coin-counter { color: #ffd700; display: flex; align-items: center; gap: 10px; }
        
        /* Menus */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 30, 0.85); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: opacity 0.3s; z-index: 10; }
        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        
        h1 { color: #fff; font-size: 3rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; background: linear-gradient(to right, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { color: #ddd; margin-bottom: 30px; }
        
        button { background: linear-gradient(45deg, #ff416c, #ff4b2b); border: none; padding: 15px 40px; color: white; font-family: inherit; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4); transition: transform 0.1s, box-shadow 0.1s; margin: 10px; min-width: 200px; }
        button:active { transform: scale(0.95); }
        button.secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: none; }
        
        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin-bottom: 20px; }
        .shop-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
        .shop-item:hover { background: rgba(255,255,255,0.1); }
        .shop-item.owned { border-color: #4caf50; }
        .shop-item.selected { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        
        #pause-btn { pointer-events: auto; background: rgba(0,0,0,0.3); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
    </style>
    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Game Canvas Container -->
    <div id="game-container"></div>

    <!-- HUD -->
    <div id="ui-layer">
        <div class="hud">
            <div class="coin-counter">🪙 <span id="score-display">0</span></div>
            <div id="pause-btn">⏸️</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen">
        <h1>SUBWAY PRO V8</h1>
        <h2>نسخه نهایی و کامل</h2>
        <button onclick="startGame()">شروع دویدن 🏃‍♂️</button>
        <button class="secondary" onclick="openShop()">فروشگاه 🛒</button>
        <button class="secondary" onclick="toggleSettings()">تنظیمات ⚙️</button>
    </div>

    <!-- Shop Menu -->
    <div id="shop-menu" class="menu-screen hidden">
        <h2>فروشگاه اسکین‌ها</h2>
        <div class="shop-grid" id="skin-grid"></div>
        <button class="secondary" onclick="closeMenus()">بازگشت</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="menu-screen hidden">
        <h1 style="font-size: 2.5rem;">GAME OVER</h1>
        <h2 id="final-score">امتیاز: 0</h2>
        <p id="police-msg" style="color:#ff4b2b; margin-bottom:20px; display:none;">👮 پلیس شما را گرفت!</p>
        <button onclick="resetGame()">تلاش مجدد 🔄</button>
        <button class="secondary" onclick="goToMainMenu()">منوی اصلی</button>
    </div>

<script>
/**
 * SUBWAY RUNNER PRO V8 - CORE ENGINE
 * Improved Graphics, Police System, Procedural Generation
 */

// --- CONFIGURATION & STATE ---
const CONFIG = {
    laneWidth: 3,
    speedBase: 15,
    speedMax: 40,
    gravity: -30,
    jumpForce: 12,
    colors: {
        ground: 0x2c3e50,
        fog: 0x1a1a2e,
        train: [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71],
        skins: {
            'classic': 0xffccaa,
            'ninja': 0x222222,
            'gold': 0xffd700,
            'neon': 0x00ffcc
        }
    }
};

let state = {
    isPlaying: false,
    isPaused: false,
    score: 0,
    coins: parseInt(localStorage.getItem('srp_coins') || '0'),
    speed: CONFIG.speedBase,
    lane: 0, // -1, 0, 1
    yVelocity: 0,
    isJumping: false,
    skin: localStorage.getItem('srp_skin') || 'classic',
    ownedSkins: JSON.parse(localStorage.getItem('srp_owned') || '["classic"]'),
    policeDistance: 15, // Distance behind player
    policeCatchRate: 0.5 // How fast police closes in when hitting obstacles
};

// --- THREE.JS SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.colors.fog);
scene.fog = new THREE.FogExp2(CONFIG.colors.fog, 0.02);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 5, 8);
camera.lookAt(0, 0, -5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game-container').appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 50;
dirLight.shadow.camera.left = -10;
dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 10;
dirLight.shadow.camera.bottom = -10;
scene.add(dirLight);

// --- GAME OBJECTS ---
let player, police, ground;
let obstacles = [];
let particles = [];
let clock = new THREE.Clock();

// Materials
const matGround = new THREE.MeshStandardMaterial({ color: CONFIG.colors.ground, roughness: 0.8 });
const matTrain = new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.2 });
const matCoin = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa8800, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.2 });

function createPlayer() {
    const group = new THREE.Group();
    
    // Body
    const geoBody = new THREE.CapsuleGeometry(0.4, 1, 4, 8);
    const matSkin = new THREE.MeshStandardMaterial({ color: CONFIG.colors.skins[state.skin] || 0xffccaa });
    const body = new THREE.Mesh(geoBody, matSkin);
    body.position.y = 0.9;
    body.castShadow = true;
    group.add(body);
    
    // Backpack (Jetpack placeholder)
    const geoPack = new THREE.BoxGeometry(0.5, 0.6, 0.3);
    const pack = new THREE.Mesh(geoPack, new THREE.MeshStandardMaterial({color: 0x333333}));
    pack.position.set(0, 1, 0.35);
    group.add(pack);

    return group;
}

function createPolice() {
    const group = new THREE.Group();
    
    // Officer Body
    const geo = new THREE.CapsuleGeometry(0.45, 1.1, 4, 8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x000088 }); // Dark Blue Uniform
    const body = new THREE.Mesh(geo, mat);
    body.position.y = 0.95;
    body.castShadow = true;
    group.add(body);

    // Hat
    const hatGeo = new THREE.CylinderGeometry(0.3, 0.5, 0.3, 8);
    const hat = new THREE.Mesh(hatGeo, new THREE.MeshStandardMaterial({color:0x000044}));
    hat.position.y = 1.8;
    group.add(hat);

    // Dog (Simple representation)
    const dogGroup = new THREE.Group();
    const dogBody = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.8), new THREE.MeshStandardMaterial({color: 0x8B4513}));
    dogBody.position.y = 0.4;
    dogGroup.add(dogBody);
    dogGroup.position.set(0.8, 0, 0.5);
    group.add(dogGroup);

    return group;
}

function initWorld() {
    // Ground
    if(ground) scene.remove(ground);
    const geoGround = new THREE.PlaneGeometry(40, 200);
    ground = new THREE.Mesh(geoGround, matGround);
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -50;
    ground.receiveShadow = true;
    scene.add(ground);

    // Player
    if(player) scene.remove(player);
    player = createPlayer();
    scene.add(player);

    // Police
    if(police) scene.remove(police);
    police = createPolice();
    scene.add(police);
    
    // Reset State
    state.lane = 0;
    state.score = 0;
    state.speed = CONFIG.speedBase;
    state.policeDistance = 15;
    player.position.set(0, 0, 0);
    updateUI();
}

// --- PROCEDURAL GENERATION ---
function spawnObstacle(zPos) {
    const type = Math.random();
    let mesh;
    
    if (type < 0.6) {
        // Train
        const color = CONFIG.colors.train[Math.floor(Math.random() * CONFIG.colors.train.length)];
        const geo = new THREE.BoxGeometry(2.2, 2.5, 6);
        mesh = new THREE.Mesh(geo, matTrain.clone());
        mesh.material.color.setHex(color);
        mesh.position.y = 1.25;
        mesh.userData = { type: 'train', hitBox: { w: 2, h: 2.5, d: 5.8 } };
    } else if (type < 0.85) {
        // Barrier (Jumpable)
        const geo = new THREE.BoxGeometry(2.5, 0.8, 0.5);
        mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: 0xffaa00}));
        mesh.position.y = 0.4;
        mesh.userData = { type: 'barrier', hitBox: { w: 2.3, h: 0.8, d: 0.5 } };
    } else {
        // Coins Cluster
        const group = new THREE.Group();
        for(let i=0; i<3; i++) {
            const coin = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.08, 8, 16), matCoin);
            coin.position.y = 1 + (i*0.5);
            coin.rotation.y = Math.PI/2;
            group.add(coin);
        }
        mesh = group;
        mesh.userData = { type: 'coin', hitBox: { w: 1, h: 2, d: 0.5 } };
    }

    // Random Lane
    const lane = Math.floor(Math.random() * 3) - 1;
    mesh.position.x = lane * CONFIG.laneWidth;
    mesh.position.z = zPos;
    
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    obstacles.push(mesh);
}

// --- GAME LOGIC ---
function update(delta) {
    if (!state.isPlaying || state.isPaused) return;

    // Move Player Forward (Conceptually moving world towards player)
    const moveDist = state.speed * delta;
    state.score += Math.floor(moveDist * 10);
    state.speed = Math.min(state.speed + delta * 0.1, CONFIG.speedMax);

    // Lane Interpolation
    const targetX = state.lane * CONFIG.laneWidth;
    player.position.x += (targetX - player.position.x) * 10 * delta;
    player.rotation.z = (player.position.x - targetX) * -0.1; // Lean effect

    // Jump Physics
    if (state.isJumping) {
        state.yVelocity += CONFIG.gravity * delta;
        player.position.y += state.yVelocity * delta;
        if (player.position.y <= 0) {
            player.position.y = 0;
            state.isJumping = false;
            state.yVelocity = 0;
        }
    }

    // Police Logic
    police.position.x = player.position.x * 0.8; // Follow loosely
    police.position.z = player.position.z + state.policeDistance;
    police.position.y = player.position.y; // Match jump roughly
    
    // Animate Police Run Bobbing
    police.children[0].position.y = 0.95 + Math.sin(Date.now() * 0.015) * 0.1;
    
    // Move Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let ob = obstacles[i];
        ob.position.z += moveDist;

        // Rotation for coins
        if(ob.userData.type === 'coin') {
            ob.children.forEach(c => c.rotation.z += 3 * delta);
        }

        // Collision Detection
        const dz = ob.position.z - player.position.z;
        const dx = Math.abs(ob.position.x - player.position.x);
        
        if (dz > -1 && dz < 1 && dx < 1.2) {
            if (ob.userData.type === 'coin') {
                state.coins++;
                playSound('coin');
                scene.remove(ob);
                obstacles.splice(i, 1);
                continue;
            } else if (ob.userData.type === 'barrier' && player.position.y > 1) {
                // Successfully jumped over
                continue;
            } else {
                // CRASH!
                gameOver(true);
                return;
            }
        }

        // Cleanup
        if (ob.position.z > 10) {
            scene.remove(ob);
            obstacles.splice(i, 1);
        }
    }

    // Spawn new obstacles
    const lastZ = obstacles.length > 0 ? obstacles[obstacles.length-1].position.z : -20;
    if (lastZ > -100) {
        spawnObstacle(lastZ - (15 + Math.random() * 15));
    }

    // Move Ground Texture illusion
    ground.position.z += moveDist;
    if(ground.position.z > 50) ground.position.z = -50;

    // Camera Follow
    camera.position.z = player.position.z + 8;
    camera.position.x += (player.position.x * 0.3 - camera.position.x) * 5 * delta;

    updateUI();
}

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);
    update(delta);
    renderer.render(scene, camera);
}

// --- INPUT HANDLING ---
function handleInput(action) {
    if (!state.isPlaying || state.isPaused) return;
    
    switch(action) {
        case 'left': 
            if(state.lane > -1) state.lane--; 
            break;
        case 'right': 
            if(state.lane < 1) state.lane++; 
            break;
        case 'jump': 
            if(!state.isJumping) {
                state.isJumping = true;
                state.yVelocity = CONFIG.jumpForce;
                playSound('jump');
            }
            break;
        case 'roll':
            // Simplified roll as fast fall or duck
            if(state.isJumping) state.yVelocity = -20;
            break;
    }
}

window.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') handleInput('left');
    if(e.key === 'ArrowRight') handleInput('right');
    if(e.key === 'ArrowUp' || e.key === ' ') handleInput('jump');
    if(e.key === 'ArrowDown') handleInput('roll');
    if(e.key === 'Escape') togglePause();
});

// Touch Controls
let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});
window.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    
    if(Math.abs(dx) > Math.abs(dy)) {
        if(Math.abs(dx) > 30) handleInput(dx > 0 ? 'right' : 'left');
    } else {
        if(Math.abs(dy) > 30) handleInput(dy > 0 ? 'roll' : 'jump');
    }
});

// --- AUDIO SYSTEM (Synthesized) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    if(type === 'jump') {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

// --- UI & STATE MANAGEMENT ---
function updateUI() {
    document.getElementById('score-display').innerText = state.score;
}

function startGame() {
    initWorld();
    state.isPlaying = true;
    state.isPaused = false;
    document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
    clock.start();
}

function gameOver(caughtByPolice) {
    state.isPlaying = false;
    playSound('crash');
    localStorage.setItem('srp_coins', state.coins);
    
    document.getElementById('final-score').innerText = `امتیاز: ${state.score}`;
    document.getElementById('police-msg').style.display = caughtByPolice ? 'block' : 'none';
    document.getElementById('game-over').classList.remove('hidden');
}

function resetGame() {
    startGame();
}

function goToMainMenu() {
    document.getElementById('game-over').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
}

function togglePause() {
    if(!state.isPlaying) return;
    state.isPaused = !state.isPaused;
    if(state.isPaused) {
        // Show simple pause overlay could go here
    }
}

// Shop Logic
function openShop() {
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('shop-menu').classList.remove('hidden');
    renderShop();
}

function renderShop() {
    const grid = document.getElementById('skin-grid');
    grid.innerHTML = '';
    Object.keys(CONFIG.colors.skins).forEach(skinKey => {
        const price = skinKey === 'classic' ? 0 : 200;
        const owned = state.ownedSkins.includes(skinKey);
        const selected = state.skin === skinKey;
        
        const div = document.createElement('div');
        div.className = `shop-item ${owned ? 'owned' : ''} ${selected ? 'selected' : ''}`;
        div.innerHTML = `
            <div style="width:30px;height:30px;background:#${CONFIG.colors.skins[skinKey].toString(16)};border-radius:50%;margin:0 auto 10px;"></div>
            <div>${skinKey.toUpperCase()}</div>
            <div style="font-size:0.8rem;color:#aaa">${owned ? 'خریداری شده' : price + ' 🪙'}</div>
        `;
        div.onclick = () => buyOrSelect(skinKey, price);
        grid.appendChild(div);
    });
}

function buyOrSelect(skin, price) {
    if(state.ownedSkins.includes(skin)) {
        state.skin = skin;
        localStorage.setItem('srp_skin', skin);
        renderShop();
    } else if(state.coins >= price) {
        state.coins -= price;
        state.ownedSkins.push(skin);
        state.skin = skin;
        localStorage.setItem('srp_coins', state.coins);
        localStorage.setItem('srp_owned', JSON.stringify(state.ownedSkins));
        localStorage.setItem('srp_skin', skin);
        renderShop();
    } else {
        alert("سکه کافی نیست!");
    }
}

function closeMenus() {
    document.getElementById('shop-menu').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
}

function toggleSettings() {
    alert("تنظیمات گرافیکی در نسخه V8 به صورت خودکار بهینه شده‌اند.");
}

// Resize Handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start Loop
animate();

</script>
</body>
</html>
