<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro V10.1 - Stable & Enhanced</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        body { margin: 0; overflow: hidden; background: #050510; font-family: 'Vazirmatn', sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .hud { padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.9); font-weight: 900; font-size: 1.5rem; pointer-events: auto; }
        .coin-box { background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2)); backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 30px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,215,0,0.4); box-shadow: 0 4px 15px rgba(255,165,0,0.2); }
        
        /* Glassmorphism Menus */
        .menu-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(20px) saturate(180%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            pointer-events: auto; transition: opacity 0.4s ease; z-index: 20; 
        }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        
        h1 { 
            color: #fff; font-size: 3.5rem; margin: 0 0 40px 0; text-transform: uppercase; 
            background: linear-gradient(to bottom, #fff, #aaa); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3)); letter-spacing: 5px; text-align: center;
        }
        
        button { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            border: none; padding: 18px 50px; color: white; 
            font-family: inherit; font-size: 1.3rem; font-weight: bold; 
            border-radius: 60px; cursor: pointer; 
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); margin: 12px; min-width: 240px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        button:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 15px 40px rgba(118, 75, 162, 0.6); }
        button:active { transform: translateY(2px) scale(0.98); }
        button.secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); box-shadow: none; }
        button.secondary:hover { background: rgba(255,255,255,0.1); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .panel-row { display: flex; justify-content: space-between; width: 320px; margin: 12px 0; color: white; font-size: 1.1rem; align-items: center; background: rgba(255,255,255,0.03); padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .toggle-group { display: flex; gap: 8px; }
        .toggle-btn { background: rgba(0,0,0,0.4); padding: 8px 18px; border-radius: 25px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; transition: 0.3s; }
        .toggle-btn.active { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-color: transparent; color: white; font-weight: bold; box-shadow: 0 0 15px rgba(245, 87, 108, 0.4); }

        .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 500px; margin-bottom: 30px; }
        .shop-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(5px); }
        .shop-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); }
        .shop-item.selected { border-color: #ffd700; background: rgba(255, 215, 0, 0.1); box-shadow: 0 0 20px rgba(255,215,0,0.15); }
        .skin-preview { width: 45px; height: 45px; border-radius: 50%; margin: 0 auto 10px; border: 3px solid rgba(255,255,255,0.1); box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4); }
        
        #pause-btn { pointer-events: auto; background: rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); transition: 0.3s; }
        #pause-btn:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }
        
        #stumble-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.4) 100%); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 5; mix-blend-mode: overlay; }
    </style>
    <!-- Only Core Three.js - No External Post Processing to prevent button failure -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="stumble-overlay"></div>

    <div id="ui-layer">
        <div class="hud">
            <div class="coin-box">🪙 <span id="coin-display">0</span></div>
            <div id="pause-btn">⏸️</div>
        </div>
        <div class="hud" style="justify-content:center; padding-bottom:50px; pointer-events:none;">
            <div id="score-display" style="font-size:3rem; letter-spacing:2px; text-shadow: 0 0 20px rgba(255,255,255,0.3);">0</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen">
        <h1>SUBWAY PRO V10</h1>
        <button onclick="Game.start()">🏃‍♂️ شروع دویدن</button>
        <button class="secondary" onclick="UI.showShop()">🛒 فروشگاه و اسکین</button>
        <button class="secondary" onclick="UI.showSettings()">⚙️ تنظیمات گرافیک</button>
    </div>

    <!-- Settings -->
    <div id="settings-menu" class="menu-screen hidden">
        <h2 style="color:white; margin-bottom:25px; font-size:1.8rem; font-weight:300;">تنظیمات گرافیک</h2>
        <div class="panel-row">
            <span>کیفیت رندر:</span>
            <div class="toggle-group">
                <div class="toggle-btn" onclick="Settings.setQuality('low')" id="q-low">پایین</div>
                <div class="toggle-btn active" onclick="Settings.setQuality('med')" id="q-med">متوسط</div>
                <div class="toggle-btn" onclick="Settings.setQuality('high')" id="q-high">بالا</div>
            </div>
        </div>
        <div class="panel-row">
            <span>سایه‌زنی (Shadow):</span>
            <div class="toggle-btn active" onclick="Settings.toggleShadow()" id="t-shadow">روشن</div>
        </div>
        <div class="panel-row">
            <span>افکت ذرات:</span>
            <div class="toggle-btn active" onclick="Settings.toggleParticles()" id="t-particles">روشن</div>
        </div>
        <button class="secondary" onclick="UI.showMain()" style="margin-top:30px;">بازگشت به منو</button>
    </div>

    <!-- Shop -->
    <div id="shop-menu" class="menu-screen hidden">
        <h2 style="color:white; margin-bottom:15px; font-weight:300;">فروشگاه شخصیت‌ها</h2>
        <div style="color:#ffd700; margin-bottom:20px; font-size:1.3rem; background:rgba(255,215,0,0.1); padding:8px 25px; border-radius:30px; border:1px solid rgba(255,215,0,0.2);">موجودی: <span id="shop-coins">0</span> 🪙</div>
        <div class="shop-grid" id="skin-container"></div>
        <button class="secondary" onclick="UI.showMain()">بازگشت</button>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="menu-screen hidden">
        <h1 style="background:linear-gradient(to bottom, #ff416c, #ff4b2b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 30px rgba(255,75,43,0.4));">GAME OVER</h1>
        <h2 style="color:white; font-size:1.6rem; margin-bottom:30px; font-weight:300;">امتیاز نهایی: <span id="final-score" style="color:#fff; font-weight:900;">0</span></h2>
        <button onclick="Game.start()">🔄 تلاش مجدد</button>
        <button class="secondary" onclick="UI.showMain()">منوی اصلی</button>
    </div>

<script>
/**
 * SUBWAY RUNNER PRO V10.1 - STABLE ENGINE
 * Fixed: Button functionality, Internal Shaders, Optimized PBR
 */

const CONFIG = {
    laneWidth: 3.5,
    baseSpeed: 20,
    gravity: -55,
    jumpForce: 19,
    stumbleDuration: 1.5,
    colors: {
        fog: 0x1a1a2e,
        skins: {
            'classic': { color: 0xFFCCAA, price: 0, name: 'کلاسیک' },
            'ninja': { color: 0x1a1a1a, price: 200, name: 'نینجا' },
            'cyber': { color: 0x00d2ff, price: 300, name: 'سایبر' },
            'neon': { color: 0xff00cc, price: 400, name: 'نئون' },
            'gold': { color: 0xffd700, price: 600, name: 'طلایی' }
        }
    }
};

let state = {
    isPlaying: false,
    isPaused: false,
    score: 0,
    coins: parseInt(localStorage.getItem('srp_coins_v10') || '0'),
    speed: CONFIG.baseSpeed,
    lane: 0,
    yVel: 0,
    isJumping: false,
    onTrain: null,
    stumbleTimer: 0,
    skin: localStorage.getItem('srp_skin_v10') || 'classic',
    ownedSkins: JSON.parse(localStorage.getItem('srp_owned_v10') || '["classic"]'),
    settings: JSON.parse(localStorage.getItem('srp_settings_v10') || '{"quality":"med","shadows":true,"particles":true}')
};

// --- THREE.JS CORE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.colors.fog);
scene.fog = new THREE.FogExp2(CONFIG.colors.fog, 0.018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 7, 10);
camera.lookAt(0, 2, -5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('game-container').appendChild(renderer.domElement);

// Professional Three-Point Lighting
const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
mainLight.position.set(20, 40, 30);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
mainLight.shadow.camera.near = 0.5;
mainLight.shadow.camera.far = 100;
mainLight.shadow.camera.left = -30;
mainLight.shadow.camera.right = 30;
mainLight.shadow.camera.top = 30;
mainLight.shadow.camera.bottom = -30;
mainLight.shadow.bias = -0.0001;
mainLight.shadow.normalBias = 0.02;
scene.add(mainLight);

// Rim Light for cinematic separation
const rimLight = new THREE.DirectionalLight(0x667eea, 0.8);
rimLight.position.set(-10, 10, -20);
scene.add(rimLight);

// --- PROCEDURAL TEXTURES & MATERIALS ---
function createNoiseTexture(size, contrast) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#888';
    ctx.fillRect(0,0,size,size);
    for(let i=0; i<size*size*0.5; i++) {
        const v = Math.random() * contrast;
        ctx.fillStyle = `rgb(${v},${v},${v})`;
        ctx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

const roughnessMap = createNoiseTexture(512, 200);

const matGround = new THREE.MeshStandardMaterial({ 
    color: 0x3a3a3a, roughness: 0.85, metalness: 0.1, roughnessMap: roughnessMap
});

const matTrainBody = new THREE.MeshStandardMaterial({ 
    color: 0xffffff, roughness: 0.2, metalness: 0.6
});

const matGlass = new THREE.MeshPhysicalMaterial({
    color: 0x88ccff, metalness: 0.1, roughness: 0.05, transmission: 0.6, transparent: true, opacity: 0.9
});

// --- OBJECT FACTORIES ---
let player, ground;
let obstacles = [];
let clock = new THREE.Clock();

function createPlayerMesh(skinKey) {
    const group = new THREE.Group();
    const skinColor = CONFIG.colors.skins[skinKey]?.color || 0xFFCCAA;
    
    const matSkin = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.5, metalness: 0.1 });
    const matCloth = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8, roughnessMap: roughnessMap });
    const matShoe = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 });

    // Smooth Capsule Body
    const torsoGeo = new THREE.CapsuleGeometry(0.38, 0.9, 8, 16);
    const torso = new THREE.Mesh(torsoGeo, matSkin);
    torso.position.y = 1.1; torso.castShadow = true; group.add(torso);

    // Head
    const headGeo = new THREE.SphereGeometry(0.3, 32, 32);
    const head = new THREE.Mesh(headGeo, matSkin);
    head.position.y = 1.9; head.castShadow = true; group.add(head);

    // Cap
    const capGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.15, 32);
    const capMat = new THREE.MeshStandardMaterial({color: 0xff4b2b, roughness: 0.4});
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.y = 2.05; group.add(cap);
    
    const brimGeo = new THREE.BoxGeometry(0.18, 0.04, 0.35);
    const brim = new THREE.Mesh(brimGeo, capMat);
    brim.position.set(0, 2.05, 0.3); group.add(brim);

    // Legs
    const legGeo = new THREE.CapsuleGeometry(0.13, 0.7, 4, 8);
    const ll = new THREE.Mesh(legGeo, matCloth); ll.position.set(-0.18, 0.45, 0); ll.castShadow=true; group.add(ll);
    const rl = new THREE.Mesh(legGeo, matCloth); rl.position.set(0.18, 0.45, 0); rl.castShadow=true; group.add(rl);

    // Shoes
    const shoeGeo = new THREE.BoxGeometry(0.2, 0.18, 0.35, 2, 2, 2);
    const ls = new THREE.Mesh(shoeGeo, matShoe); ls.position.set(-0.18, 0.09, 0.05); ls.castShadow=true; group.add(ls);
    const rs = new THREE.Mesh(shoeGeo, matShoe); rs.position.set(0.18, 0.09, 0.05); rs.castShadow=true; group.add(rs);

    return group;
}

function createTrainMesh(color) {
    const group = new THREE.Group();
    const bodyMat = matTrainBody.clone();
    bodyMat.color.setHex(color);
    
    const bodyGeo = new THREE.BoxGeometry(2.6, 3, 8, 4, 4, 4);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.7; body.castShadow = true; body.receiveShadow = true;
    group.add(body);

    const winGeo = new THREE.BoxGeometry(2.65, 0.9, 6);
    const win = new THREE.Mesh(winGeo, matGlass);
    win.position.y = 2.3; group.add(win);

    const roofGeo = new THREE.BoxGeometry(2.4, 0.15, 7.8);
    const roof = new THREE.Mesh(roofGeo, new THREE.MeshStandardMaterial({color:0x111111, roughness:0.9}));
    roof.position.y = 3.25; group.add(roof);

    const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 32);
    wheelGeo.rotateZ(Math.PI/2);
    const wheelMat = new THREE.MeshStandardMaterial({color:0x333333, metalness:0.8, roughness:0.2});
    [-3, 3].forEach(z => {
        group.add(new THREE.Mesh(wheelGeo, wheelMat).translateX(-1.2).translateY(0.45).translateZ(z));
        group.add(new THREE.Mesh(wheelGeo, wheelMat).translateX(1.2).translateY(0.45).translateZ(z));
    });

    // Glowing Tail Lights
    const lightGeo = new THREE.CircleGeometry(0.15, 16);
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const tl1 = new THREE.Mesh(lightGeo, lightMat); tl1.position.set(-0.8, 1.2, 4.01); group.add(tl1);
    const tl2 = new THREE.Mesh(lightGeo, lightMat); tl2.position.set(0.8, 1.2, 4.01); group.add(tl2);

    group.userData = { type: 'train', topY: 3.3, width: 2.6, length: 8 };
    return group;
}

function createBarrierMesh() {
    const group = new THREE.Group();
    const matWood = new THREE.MeshStandardMaterial({ color: 0x8D6E63, roughness: 0.9, roughnessMap: roughnessMap });
    const matMetal = new THREE.MeshStandardMaterial({ color: 0xBDBDBD, metalness: 0.7, roughness: 0.3 });

    const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.3, 16);
    group.add(new THREE.Mesh(legGeo, matMetal).translateX(-1.3).translateY(0.65));
    group.add(new THREE.Mesh(legGeo, matMetal).translateX(1.3).translateY(0.65));

    const barGeo = new THREE.BoxGeometry(2.8, 0.25, 0.15);
    group.add(new THREE.Mesh(barGeo, matWood).translateY(1.0));
    group.add(new THREE.Mesh(barGeo, matWood).translateY(0.5));

    group.userData = { type: 'barrier', topY: 1.15, width: 2.8 };
    return group;
}

// --- GAME LOGIC ---
function initWorld() {
    if(player) scene.remove(player);
    obstacles.forEach(o => scene.remove(o));
    obstacles = [];

    if(!ground) {
        ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 400, 1, 1), matGround);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    player = createPlayerMesh(state.skin);
    scene.add(player);

    state.lane = 0; state.score = 0; state.speed = CONFIG.baseSpeed;
    state.isJumping = false; state.yVel = 0; state.onTrain = null; state.stumbleTimer = 0;
    player.position.set(0, 0, 0); player.rotation.set(0,0,0);
    updateHUD();
}

function spawnObstacle(zPos) {
    const type = Math.random();
    let mesh;
    if(type < 0.6) {
        const colors = [0xE53935, 0x1E88E5, 0xFDD835, 0x43A047, 0x8E24AA];
        mesh = createTrainMesh(colors[Math.floor(Math.random()*colors.length)]);
    } else {
        mesh = createBarrierMesh();
    }
    const lane = Math.floor(Math.random() * 3) - 1;
    mesh.position.x = lane * CONFIG.laneWidth;
    mesh.position.z = zPos;
    scene.add(mesh);
    obstacles.push(mesh);
}

function triggerStumble() {
    state.stumbleTimer = CONFIG.stumbleDuration;
    state.speed *= 0.4;
    document.getElementById('stumble-overlay').style.opacity = 1;
    const wobbleAnim = () => {
        if(state.stumbleTimer <= 0) return;
        player.rotation.z = Math.sin(Date.now() * 0.025) * 0.4;
        player.rotation.x = Math.cos(Date.now() * 0.02) * 0.25;
        requestAnimationFrame(wobbleAnim);
    };
    wobbleAnim();
}

function update(delta) {
    if(!state.isPlaying || state.isPaused) return;

    if(state.stumbleTimer > 0) {
        state.stumbleTimer -= delta;
        state.speed = Math.min(state.speed + delta * 8, CONFIG.baseSpeed);
        if(state.stumbleTimer <= 0) {
            document.getElementById('stumble-overlay').style.opacity = 0;
            player.rotation.set(0,0,0);
        }
    }

    const move = state.speed * delta;
    state.score += Math.floor(move * 10);
    if(state.stumbleTimer <= 0) state.speed = Math.min(state.speed + delta * 0.08, 50);

    const laneSpeed = state.stumbleTimer > 0 ? 6 : 15;
    const targetX = state.lane * CONFIG.laneWidth;
    player.position.x += (targetX - player.position.x) * laneSpeed * delta;
    if(state.stumbleTimer <= 0) player.rotation.z = (player.position.x - targetX) * -0.08;

    // Vertical Physics & Train Riding
    let groundLevel = 0;
    let ridingTrain = false;

    for(let ob of obstacles) {
        const dz = ob.position.z - player.position.z;
        const dx = Math.abs(ob.position.x - player.position.x);
        const halfW = (ob.userData.width || 2.6) / 2;
        const halfL = (ob.userData.length || 1) / 2;
        
        if(dx < halfW + 0.3 && dz > -halfL && dz < halfL) {
            const topY = ob.userData.topY;
            if(state.yVel <= 0 && player.position.y >= topY - 0.5 && player.position.y <= topY + 1.2) {
                groundLevel = topY;
                if(ob.userData.type === 'train') { state.onTrain = ob; ridingTrain = true; }
                break;
            }
        }
    }

    if(player.position.y > groundLevel + 0.1 || state.yVel > 0) {
        state.yVel += CONFIG.gravity * delta;
        player.position.y += state.yVel * delta;
        state.isJumping = true;
    } else {
        player.position.y = groundLevel;
        state.yVel = 0;
        state.isJumping = false;
        if(!ridingTrain) state.onTrain = null;
    }

    if(ridingTrain && state.onTrain) {
        player.position.y = state.onTrain.userData.topY;
        state.isJumping = false; state.yVel = 0;
    }

    // Collision
    for(let i = obstacles.length - 1; i >= 0; i--) {
        let ob = obstacles[i];
        ob.position.z += move;

        const dz = ob.position.z - player.position.z;
        const dx = Math.abs(ob.position.x - player.position.x);
        const dy = player.position.y;
        const halfL = (ob.userData.length || 1) / 2;
        
        if(dz > -halfL - 0.3 && dz < halfL + 0.3) {
            const halfW = (ob.userData.width || 2.6) / 2;
            const playerHalfW = 0.38;
            
            // Side Collision -> Stumble
            if(dx < halfW + playerHalfW && dx > halfW - 0.5 && dy < ob.userData.topY - 0.5) {
                if(state.stumbleTimer <= 0) triggerStumble();
            }
            // Front/Direct Collision -> Death
            else if(dx < halfW - 0.2 && dy < ob.userData.topY - 0.5) {
                if(ob.userData.type === 'train' && dz > halfL - 1.2 && dz < halfL + 0.5) { gameOver(); return; }
                if(ob.userData.type === 'barrier' && dy < 0.9) { gameOver(); return; }
            }
        }

        if(ob.position.z > 15) {
            scene.remove(ob);
            obstacles.splice(i, 1);
            if(state.onTrain === ob) state.onTrain = null;
        }
    }

    const lastZ = obstacles.length > 0 ? obstacles[obstacles.length-1].position.z : -30;
    if(lastZ > -130) spawnObstacle(lastZ - (20 + Math.random() * 20));

    ground.position.z += move;
    if(ground.position.z > 100) ground.position.z = -100;

    camera.position.z = player.position.z + 10;
    camera.position.x += (player.position.x * 0.4 - camera.position.x) * 4 * delta;
    
    updateHUD();
}

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);
    update(delta);
    renderer.render(scene, camera);
}

// --- INPUT ---
window.addEventListener('keydown', e => {
    if(!state.isPlaying || state.isPaused) return;
    if(e.key === 'ArrowLeft' && state.lane > -1) state.lane--;
    if(e.key === 'ArrowRight' && state.lane < 1) state.lane++;
    if((e.key === 'ArrowUp' || e.key === ' ') && !state.isJumping) {
        state.isJumping = true; state.yVel = CONFIG.jumpForce;
    }
});

let tx = 0;
window.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:false});
window.addEventListener('touchend', e => {
    if(!state.isPlaying || state.isPaused) return;
    const dx = e.changedTouches[0].clientX - tx;
    if(Math.abs(dx) > 30) {
        if(dx > 0 && state.lane < 1) state.lane++;
        if(dx < 0 && state.lane > -1) state.lane--;
    }
}, {passive:false});

// --- SYSTEMS ---
const UI = {
    showMain: () => { document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden')); document.getElementById('main-menu').classList.remove('hidden'); },
    showShop: () => { document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden')); document.getElementById('shop-menu').classList.remove('hidden'); renderShop(); },
    showSettings: () => { document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden')); document.getElementById('settings-menu').classList.remove('hidden'); Settings.updateUI(); }
};

const Game = {
    start: () => {
        try {
            initWorld();
            state.isPlaying = true; state.isPaused = false;
            document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
            clock.start();
        } catch(err) {
            console.error("Game Start Error:", err);
            alert("خطا در شروع بازی: " + err.message);
        }
    },
    pause: () => { state.isPaused = !state.isPaused; }
};

function gameOver() {
    state.isPlaying = false;
    localStorage.setItem('srp_coins_v10', state.coins);
    document.getElementById('final-score').innerText = state.score;
    document.getElementById('game-over').classList.remove('hidden');
}

function updateHUD() {
    document.getElementById('score-display').innerText = state.score;
    document.getElementById('coin-display').innerText = state.coins;
}

// --- SETTINGS ---
const Settings = {
    setQuality: (level) => {
        state.settings.quality = level;
        const dpr = level === 'low' ? 0.7 : level === 'med' ? 1 : Math.min(window.devicePixelRatio, 2);
        renderer.setPixelRatio(dpr);
        mainLight.shadow.mapSize.width = level === 'low' ? 512 : level === 'med' ? 1024 : 2048;
        mainLight.shadow.mapSize.height = mainLight.shadow.mapSize.width;
        Settings.updateUI();
        saveSettings();
    },
    toggleShadow: () => {
        state.settings.shadows = !state.settings.shadows;
        renderer.shadowMap.enabled = state.settings.shadows;
        scene.traverse(obj => { if(obj.material) obj.material.needsUpdate = true; });
        Settings.updateUI();
        saveSettings();
    },
    toggleParticles: () => {
        state.settings.particles = !state.settings.particles;
        Settings.updateUI();
        saveSettings();
    },
    updateUI: () => {
        document.getElementById('t-shadow').className = `toggle-btn ${state.settings.shadows ? 'active' : ''}`;
        document.getElementById('t-shadow').innerText = state.settings.shadows ? 'روشن' : 'خاموش';
        document.getElementById('t-particles').className = `toggle-btn ${state.settings.particles ? 'active' : ''}`;
        document.getElementById('t-particles').innerText = state.settings.particles ? 'روشن' : 'خاموش';
        ['low','med','high'].forEach(q => {
            document.getElementById(`q-${q}`).className = `toggle-btn ${state.settings.quality === q ? 'active' : ''}`;
        });
    }
};

function saveSettings() { localStorage.setItem('srp_settings_v10', JSON.stringify(state.settings)); }

// --- SHOP ---
function renderShop() {
    const container = document.getElementById('skin-container');
    container.innerHTML = '';
    document.getElementById('shop-coins').innerText = state.coins;
    Object.entries(CONFIG.colors.skins).forEach(([key, data]) => {
        const owned = state.ownedSkins.includes(key);
        const selected = state.skin === key;
        const div = document.createElement('div');
        div.className = `shop-item ${selected ? 'selected' : ''} ${!owned ? 'locked' : ''}`;
        div.innerHTML = `<div class="skin-preview" style="background:#${data.color.toString(16).padStart(6,'0')}"></div><div style="font-weight:bold">${data.name}</div><div style="font-size:0.8rem;color:#aaa;margin-top:6px">${owned ? '✓ انتخاب شده' : data.price + ' 🪙'}</div>`;
        div.onclick = () => {
            if(owned) { state.skin = key; localStorage.setItem('srp_skin_v10', key); renderShop(); }
            else if(state.coins >= data.price) {
                state.coins -= data.price; state.ownedSkins.push(key); state.skin = key;
                localStorage.setItem('srp_coins_v10', state.coins);
                localStorage.setItem('srp_owned_v10', JSON.stringify(state.ownedSkins));
                localStorage.setItem('srp_skin_v10', key);
                renderShop();
            } else { alert("سکه کافی نیست!"); }
        };
        container.appendChild(div);
    });
}

document.getElementById('pause-btn').onclick = Game.pause;
Settings.updateUI();
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
