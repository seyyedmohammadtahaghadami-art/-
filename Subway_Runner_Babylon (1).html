<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner V24 - Hardcore</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Lalezar', sans-serif; user-select: none; touch-action: none; color: white; }
        
        /* UI Layers */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }
        
        /* HUD */
        #hud { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; text-shadow: 2px 2px 0 #000; font-size: 22px; display: none; }
        .hud-box { background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; border: 2px solid #f1c40f; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 5px; }
        
        /* Pause Button */
        #pause-btn { position: absolute; top: 10px; right: 20px; z-index: 25; background: rgba(0,0,0,0.5); border: 2px solid #fff; color: white; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; display: none; pointer-events: auto; }

        /* Active Powerups */
        #active-powerups { position: absolute; top: 70px; left: 10px; display: flex; flex-direction: column; gap: 5px; }
        .pu-badge { background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 10px; border-left: 4px solid #fff; font-size: 14px; display: flex; align-items: center; gap: 5px; animation: slideIn 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* Menus */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; overflow-y: auto; padding: 20px 0; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        
        h1 { color: #f1c40f; font-size: 45px; margin: 0 0 10px 0; text-shadow: 3px 3px 0 #c0392b; transform: skew(-5deg); }
        h2 { color: #ecf0f1; margin-bottom: 15px; font-size: 24px; border-bottom: 2px solid #f1c40f; padding-bottom: 5px; display: inline-block; }
        
        .btn { background: linear-gradient(#e67e22, #d35400); border: none; padding: 12px 25px; margin: 6px; color: white; font-family: 'Lalezar'; font-size: 20px; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #a04000; width: 260px; transition: 0.1s; text-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(5px); box-shadow: none; }
        .btn-blue { background: linear-gradient(#3498db, #2980b9); box-shadow: 0 5px 0 #1c5980; }
        .btn-gray { background: linear-gradient(#7f8c8d, #636e72); box-shadow: 0 5px 0 #4b5456; width: 140px; font-size: 16px; }
        .btn-green { background: linear-gradient(#2ecc71, #27ae60); box-shadow: 0 5px 0 #1e8449; }
        .btn-red { background: linear-gradient(#e74c3c, #c0392b); box-shadow: 0 5px 0 #922b21; }

        /* Shop & Grid */
        .grid-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 500px; margin-bottom: 20px; }
        .grid-item { background: rgba(255,255,255,0.1); border: 2px solid #555; border-radius: 10px; padding: 10px; width: 90px; text-align: center; cursor: pointer; transition: 0.2s; }
        .grid-item:hover { background: rgba(255,255,255,0.2); }
        .grid-item.selected { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); box-shadow: 0 0 10px #f1c40f; }
        .item-preview { width: 40px; height: 40px; margin: 0 auto 5px; border-radius: 5px; border: 2px solid #fff; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        /* Settings */
        .setting-row { display: flex; justify-content: space-between; align-items: center; width: 90%; max-width: 300px; background: rgba(255,255,255,0.05); padding: 10px; margin: 5px 0; border-radius: 8px; }
        select { background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 5px; font-family: 'Lalezar'; }

        /* Effects */
        #blur-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(0px); pointer-events: none; transition: 0.2s; z-index: 5; }
        #toast { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #f1c40f; padding: 10px 25px; border-radius: 30px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 30; border: 2px solid #f1c40f; font-size: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

    <div id="blur-overlay"></div>
    <div id="toast">پیام</div>
    <button id="pause-btn" onclick="game.togglePause()">⏸️</button>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-box">امتیاز: <span id="score">0</span></div>
        <div class="hud-box">🪙 <span id="coins">0</span></div>
    </div>
    <div id="active-powerups"></div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen interactive">
        <h1>SUBWAY V24</h1>
        <p style="color:#aaa; margin-bottom:20px;">نسخه هاردکور - قطار متحرک</p>
        <div style="margin-bottom:15px; font-size:20px; color:#f1c40f;">سکه: <span id="menu-coins">0</span> | رکورد: <span id="menu-high">0</span></div>
        <button class="btn" onclick="game.start()">شروع دویدن 🏃‍♂️</button>
        <button class="btn btn-blue" onclick="ui.showShop()">فروشگاه 🛒</button>
        <button class="btn btn-green" onclick="ui.showAchievements()">دستاوردها 🏆</button>
        <button class="btn btn-gray" onclick="ui.showSettings()">تنظیمات ⚙️</button>
        <button class="btn btn-small btn-gray" onclick="audio.toggleMute()" style="margin-top:10px;">صدا: <span id="mute-text">روشن</span> 🔊</button>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="menu-screen interactive hidden">
        <h1 style="color:#fff">PAUSED</h1>
        <button class="btn" onclick="game.resume()">ادame ▶️</button>
        <button class="btn btn-red" onclick="game.quitToMenu()">خروج ❌</button>
    </div>

    <!-- Shop Menu -->
    <div id="shop-menu" class="menu-screen interactive hidden">
        <h2>فروشگاه</h2>
        <div style="color:#f1c40f; margin-bottom:10px; font-size:20px;">موجودی: <span id="shop-coins">0</span> 🪙</div>
        
        <h3 style="width:100%; text-align:center; color:#aaa; font-size:16px; margin-top:10px;">👕 اسکین‌ها (گران‌تر)</h3>
        <div class="grid-container" id="skin-grid"></div>
        
        <h3 style="width:100%; text-align:center; color:#aaa; font-size:16px;">⚡ پاور-آپ‌ها</h3>
        <div class="grid-container" id="upgrade-grid"></div>

        <button class="btn btn-gray" onclick="ui.showMain()">بازگشت</button>
    </div>

    <!-- Achievements Menu -->
    <div id="achieve-menu" class="menu-screen interactive hidden">
        <h2>دستاوردها</h2>
        <div id="achieve-list" style="width:90%; max-width:400px; text-align:right;"></div>
        <button class="btn btn-gray" onclick="ui.showMain()" style="margin-top:20px;">بازگشت</button>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="menu-screen interactive hidden">
        <h2>تنظیمات</h2>
        <div class="setting-row">
            <span>کیفیت گرافیک</span>
            <select id="quality-select" onchange="game.setQuality(this.value)">
                <option value="low">پایین</option>
                <option value="med" selected>متوسط</option>
                <option value="high">بالا (Ultra)</option>
            </select>
        </div>
        <div class="setting-row">
            <span>سایه‌ها</span>
            <input type="checkbox" id="shadow-toggle" checked onchange="game.toggleShadows(this.checked)">
        </div>
        <div class="setting-row">
            <span>لرزش دوربین</span>
            <input type="checkbox" id="shake-toggle" checked onchange="game.toggleShake(this.checked)">
        </div>
        <button class="btn btn-gray" onclick="ui.showMain()" style="margin-top:20px;">بازگشت</button>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="menu-screen interactive hidden">
        <h1 style="color:#e74c3c">BUSTED!</h1>
        <div style="font-size:28px; margin:10px;">امتیاز: <span id="final-score">0</span></div>
        <div style="font-size:18px; color:#aaa;">رکورد: <span id="final-high">0</span></div>
        <div style="font-size:20px; color:#f1c40f; margin-bottom:20px;">سکه: +<span id="final-coins">0</span></div>
        <button class="btn" onclick="game.restart()">دوباره 🔄</button>
        <button class="btn btn-gray" onclick="ui.showMain()">منو</button>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- AUDIO SYSTEM ---
        const audio = {
            ctx: null, muted: false, musicInterval: null,
            init() { 
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                if (this.ctx.state === 'suspended') this.ctx.resume(); 
                this.startMusic();
            },
            playTone(freq, type, dur, vol = 0.1) {
                if (this.muted || !this.ctx) return;
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, this.ctx.currentTime);
                g.gain.setValueAtTime(vol, this.ctx.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + dur);
            },
            coin() { this.playTone(1200, 'sine', 0.1, 0.1); setTimeout(()=>this.playTone(1800, 'sine', 0.1, 0.1), 50); },
            jump() { this.playTone(300, 'square', 0.2, 0.1); },
            crash() { this.playTone(100, 'sawtooth', 0.5, 0.2); },
            powerup() { this.playTone(600, 'triangle', 0.1, 0.1); setTimeout(()=>this.playTone(900, 'triangle', 0.2, 0.1), 100); },
            startMusic() {
                if(this.musicInterval) clearInterval(this.musicInterval);
                if(this.muted) return;
                const notes = [110, 110, 130, 110, 146, 130];
                let step = 0;
                this.musicInterval = setInterval(() => {
                    if(this.muted || !game.isPlaying || game.isPaused) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = notes[step % notes.length];
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
                    step++;
                }, 250);
            },
            toggleMute() { 
                this.muted = !this.muted; 
                document.getElementById('mute-text').innerText = this.muted ? "خاموش" : "روشن"; 
                if(!this.muted) this.startMusic(); else clearInterval(this.musicInterval);
            }
        };

        // --- DATA ---
        const SKINS = [
            { id: 'default', name: 'دونده', color: 0xe74c3c, price: 0, icon: '🏃' },
            { id: 'ninja', name: 'نینجا', color: 0x111111, price: 500, icon: '🥷' },
            { id: 'gold', name: 'طلایی', color: 0xf1c40f, price: 1500, icon: '👑' },
            { id: 'cyber', name: 'سایبر', color: 0x00ffff, price: 3000, icon: '🤖' },
            { id: 'zombie', name: 'زامبی', color: 0x27ae60, price: 5000, icon: '🧟' },
            { id: 'king', name: 'پادشاه', color: 0x8e44ad, price: 10000, icon: '🦸' }
        ];

        const POWERUPS_SHOP = [
            { id: 'magnet', name: 'آهنربا', icon: '🧲', price: 200 },
            { id: 'jetpack', name: 'جت‌پک', icon: '🚀', price: 800 },
            { id: 'shield', name: 'سپر', icon: '🛡️', price: 500 },
            { id: 'multiplier', name: 'سکه x2', icon: '💰', price: 1000 },
            { id: 'slowmo', name: 'آهسته', icon: '🐢', price: 400 },
            { id: 'superjump', name: 'پرش قوی', icon: '⬆️', price: 600 },
            { id: 'hoverboard', name: 'هاوربرد', icon: '🛹', price: 1200 }
        ];

        const ACHIEVEMENTS = [
            { id: 'score_1000', name: 'دوننده تازه کار', desc: '۱۰۰۰ امتیاز', target: 1000, type: 'score' },
            { id: 'coins_500', name: 'ثروتمند', desc: '۵۰ سکه', target: 500, type: 'coins' },
            { id: 'train_hopper', name: 'پارکور باز', desc: '۱۰ پرش روی قطار', target: 10, type: 'trains' },
            { id: 'sky_high', name: 'پرنده', desc: 'استفاده از جت‌پک', target: 1, type: 'jetpack_used' }
        ];

        let state = {
            coins: parseInt(localStorage.getItem('v24_coins')) || 0,
            highScore: parseInt(localStorage.getItem('v24_high')) || 0,
            unlockedSkins: JSON.parse(localStorage.getItem('v24_skins')) || ['default'],
            currentSkin: localStorage.getItem('v24_skin') || 'default',
            achievements: JSON.parse(localStorage.getItem('v24_ach')) || [],
            ownedPowerups: JSON.parse(localStorage.getItem('v24_pu')) || [],
            stats: { trainsHopped: 0, jetpackUsed: 0 },
            settings: { quality: 'med', shadows: true, shake: true }
        };

        // --- GAME ENGINE ---
        class Game {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87CEEB);
                this.scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

                this.baseCamPos = new THREE.Vector3(0, 6, 10);
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
                this.camera.position.copy(this.baseCamPos);
                this.camera.lookAt(0, 1, -10);

                this.renderer = new THREE.WebGLRenderer({ antialias: state.settings.quality !== 'low' });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = state.settings.shadows;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(this.renderer.domElement);

                this.sun = new THREE.DirectionalLight(0xffffff, 1.2);
                this.sun.position.set(10, 30, 10);
                this.sun.castShadow = true;
                this.sun.shadow.mapSize.width = 2048; this.sun.shadow.mapSize.height = 2048;
                this.scene.add(this.sun);
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                this.scene.add(new THREE.HemisphereLight(0xffffbb, 0x080820, 0.5));

                this.createWorld();
                this.player = this.createPlayerMesh(SKINS.find(s=>s.id===state.currentSkin).color);
                this.scene.add(this.player);

                this.objects = []; 
                this.coins = [];
                this.powerups = [];
                
                this.resetState();
                this.setupInputs();
                this.animate();
                
                window.addEventListener('resize', () => this.onResize());
                ui.updateMenu();
            }

            createWorld() {
                const groundGeo = new THREE.PlaneGeometry(100, 600);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI/2; ground.position.z = -250; ground.receiveShadow = true;
                this.scene.add(ground);

                const railGeo = new THREE.BoxGeometry(0.15, 0.15, 600);
                const railMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.2 });
                [-2.5, 0, 2.5].forEach(x => {
                    [-0.8, 0.8].forEach(offset => {
                        const r = new THREE.Mesh(railGeo, railMat);
                        r.position.set(x + offset, 0.08, -250);
                        this.scene.add(r);
                    });
                });
            }

            createPlayerMesh(color) {
                const g = new THREE.Group();
                const bMat = new THREE.MeshStandardMaterial({color: color, roughness: 0.3, metalness: 0.1});
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.4), bMat);
                b.position.y = 0.9; b.castShadow = true; g.add(b);
                const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({color: 0xffccaa}));
                h.position.y = 1.6; h.castShadow = true; g.add(h);
                const lGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
                const lMat = new THREE.MeshStandardMaterial({color: 0x333});
                const ll = new THREE.Mesh(lGeo, lMat); ll.position.set(-0.2, 0.35, 0); g.add(ll);
                const rl = new THREE.Mesh(lGeo, lMat); rl.position.set(0.2, 0.35, 0); g.add(rl);
                const la = new THREE.Mesh(lGeo, lMat); la.position.set(-0.4, 1.0, 0); g.add(la);
                const ra = new THREE.Mesh(lGeo, lMat); ra.position.set(0.4, 1.0, 0); g.add(ra);
                g.userData = { parts: { ll, rl, la, ra } };
                return g;
            }

            spawnTrain() {
                const laneIdx = Math.floor(Math.random() * 3);
                const length = 30 + Math.random() * 40; 
                const group = new THREE.Group();
                
                // Train Body
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, metalness: 0.6, roughness: 0.2 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.5, length), bodyMat);
                body.position.y = 1.75; body.castShadow = true; body.receiveShadow = true; group.add(body);
                
                // Roof
                const roof = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.2, length-1), new THREE.MeshStandardMaterial({ color: 0xecf0f1 }));
                roof.position.y = 3.6; group.add(roof);

                // Stripe
                const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.2, length), new THREE.MeshBasicMaterial({ color: 0xf1c40f }));
                stripe.position.y = 2.5; group.add(stripe);

                group.position.set([-2.5, 0, 2.5][laneIdx], 0, -160);
                this.scene.add(group);
                
                // Moving Logic: 30% chance to move towards player (fast), 30% same direction (slow), 40% static
                const rand = Math.random();
                let moveSpeed = 0;
                if(rand < 0.3) moveSpeed = 0.8; // Towards player (Danger!)
                else if(rand < 0.6) moveSpeed = -0.2; // Same direction

                this.objects.push({ mesh: group, type: 'train', lane: laneIdx, length: length, height: 3.5, moveSpeed: moveSpeed });

                // Coins on top (Precise placement)
                for(let z = -length/2 + 5; z < length/2 - 5; z+=3) {
                    this.spawnCoin([-2.5, 0, 2.5][laneIdx], 4.0, -160 + z);
                }
            }

            spawnBarrier() {
                const laneIdx = Math.floor(Math.random() * 3);
                const type = Math.random() > 0.5 ? 'low' : 'high';
                const group = new THREE.Group();
                if(type === 'low') {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.5), new THREE.MeshStandardMaterial({color: 0xe67e22}));
                    m.position.y = 0.5; m.castShadow = true; group.add(m);
                } else {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 0.5), new THREE.MeshStandardMaterial({color: 0xc0392b}));
                    m.position.y = 2; m.castShadow = true; group.add(m);
                    const pGeo = new THREE.CylinderGeometry(0.05, 0.05, 2);
                    const pMat = new THREE.MeshStandardMaterial({color: 0x7f8c8d});
                    const p1 = new THREE.Mesh(pGeo, pMat); p1.position.set(-0.9, 1, 0); group.add(p1);
                    const p2 = new THREE.Mesh(pGeo, pMat); p2.position.set(0.9, 1, 0); group.add(p2);
                }
                group.position.set([-2.5, 0, 2.5][laneIdx], 0, -160);
                this.scene.add(group);
                this.objects.push({ mesh: group, type: 'barrier', subType: type, lane: laneIdx });
            }

            spawnCoin(x, y, z) {
                const c = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1, roughness: 0.2, emissive: 0xaa8800, emissiveIntensity: 0.2 }));
                c.rotation.x = Math.PI/2; c.position.set(x, y, z);
                this.scene.add(c);
                this.coins.push(c);
            }

            spawnPowerup() {
                const laneIdx = Math.floor(Math.random() * 3);
                const types = ['magnet', 'shield', 'jetpack', 'multiplier', 'slowmo', 'superjump', 'hoverboard'];
                const type = types[Math.floor(Math.random() * types.length)];
                const colors = { magnet: 0xe74c3c, shield: 0x3498db, jetpack: 0x9b59b6, multiplier: 0x2ecc71, slowmo: 0x00ffff, superjump: 0xff00ff, hoverboard: 0xffff00 };
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: colors[type], emissive: colors[type], emissiveIntensity: 0.5 }));
                p.position.set([-2.5, 0, 2.5][laneIdx], 1.5, -160);
                this.scene.add(p);
                this.powerups.push({ mesh: p, type: type });
            }

            resetState() {
                this.isPlaying = false;
                this.isPaused = false;
                this.speed = 0.4;
                this.score = 0;
                this.runCoins = 0;
                this.lane = 1;
                this.vy = 0;
                this.isJumping = false;
                this.isOnTrain = false;
                this.activeTrain = null;
                this.stunned = false;
                this.activePUs = {};
                
                this.objects.forEach(o => this.scene.remove(o.mesh));
                this.coins.forEach(c => this.scene.remove(c));
                this.powerups.forEach(p => this.scene.remove(p.mesh));
                this.objects = []; this.coins = []; this.powerups = [];
                
                this.player.position.set(0, 0, 0);
                this.player.scale.set(1,1,1);
                this.player.rotation.set(0,0,0);
                document.getElementById('active-powerups').innerHTML = '';
                this.camera.position.copy(this.baseCamPos);
            }

            setupInputs() {
                const handle = (dir) => {
                    if(!this.isPlaying || this.stunned || this.isPaused) return;
                    if(dir === 'left' && this.lane > 0) this.lane--;
                    if(dir === 'right' && this.lane < 2) this.lane++;
                    if(dir === 'up') this.jump();
                    if(dir === 'down') this.roll();
                };
                document.addEventListener('keydown', e => {
                    if(e.key === 'ArrowLeft') handle('left');
                    if(e.key === 'ArrowRight') handle('right');
                    if(e.key === 'ArrowUp') handle('up');
                    if(e.key === 'ArrowDown') handle('down');
                    if(e.key === 'Escape') this.togglePause();
                });
                let tx, ty;
                document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:false});
                document.addEventListener('touchend', e => {
                    const dx = e.changedTouches[0].clientX - tx;
                    const dy = e.changedTouches[0].clientY - ty;
                    if(Math.abs(dx) > Math.abs(dy)) {
                        if(dx > 30) handle('right'); else if(dx < -30) handle('left');
                    } else {
                        if(dy < -30) handle('up'); else if(dy > 30) handle('down');
                    }
                }, {passive:false});
            }

            jump() {
                if(!this.isJumping && !this.activePUs.jetpack) {
                    let force = 0.6;
                    if(this.activePUs.superjump) force = 0.9;
                    this.vy = force;
                    this.isJumping = true;
                    this.isOnTrain = false;
                    this.activeTrain = null;
                    audio.jump();
                }
            }

            roll() {
                if(!this.isJumping && !this.isOnTrain) {
                    this.player.scale.y = 0.5;
                    this.player.position.y = 0;
                    setTimeout(() => {
                        this.player.scale.y = 1;
                        if(!this.isOnTrain) this.player.position.y = 0;
                    }, 700);
                }
            }

            activatePowerup(type) {
                audio.powerup();
                const container = document.getElementById('active-powerups');
                const names = { magnet: '🧲 آهنربا', shield: '🛡️ سپر', jetpack: '🚀 جت‌پک', multiplier: '💰 سکه x2', slowmo: '🐢 آهسته', superjump: '⬆️ پرش قوی', hoverboard: '🛹 هاوربرد' };
                const div = document.createElement('div');
                div.className = 'pu-badge';
                div.id = `pu-${type}`;
                div.innerText = names[type];
                container.appendChild(div);

                this.activePUs[type] = true;
                if(type === 'jetpack') state.stats.jetpackUsed++;
                
                let duration = 8000;
                if(type === 'jetpack') duration = 6000;
                if(type === 'slowmo') duration = 5000;
                
                setTimeout(() => {
                    this.activePUs[type] = false;
                    const el = document.getElementById(`pu-${type}`);
                    if(el) el.remove();
                }, duration);
            }

            stumble() {
                if(this.activePUs.shield || this.activePUs.hoverboard) {
                    if(this.activePUs.hoverboard) {
                        this.activePUs.hoverboard = false;
                        const el = document.getElementById('pu-hoverboard');
                        if(el) el.remove();
                    } else {
                        this.activePUs.shield = false;
                        const el = document.getElementById('pu-shield');
                        if(el) el.remove();
                    }
                    ui.toast("محافظت فعال شد! 🛡️");
                    return;
                }
                this.stunned = true;
                this.speed *= 0.4; 
                document.getElementById('blur-overlay').style.backdropFilter = 'blur(8px)';
                ui.toast("سرگیجه! مراقب باش 😵");
                setTimeout(() => {
                    this.stunned = false;
                    this.speed = Math.max(this.speed * 2, 0.4); 
                    document.getElementById('blur-overlay').style.backdropFilter = 'blur(0px)';
                }, 1500);
            }

            checkCollisions() {
                const pBox = new THREE.Box3().setFromObject(this.player);
                pBox.expandByScalar(-0.2);
                this.isOnTrain = false;

                for(let obj of this.objects) {
                    const oBox = new THREE.Box3().setFromObject(obj.mesh);
                    if(obj.type === 'train') {
                        if(Math.abs(this.player.position.z - obj.mesh.position.z) < obj.length/2 + 0.5) {
                            if(Math.abs(this.player.position.x - obj.mesh.position.x) < 1.2) {
                                const pBottom = this.player.position.y;
                                const tTop = obj.height;
                                if(this.vy <= 0 && pBottom >= tTop - 0.5 && pBottom <= tTop + 1.5) {
                                    this.isOnTrain = true;
                                    if(this.activeTrain !== obj) {
                                        state.stats.trainsHopped++;
                                        this.activeTrain = obj;
                                    }
                                    this.player.position.y = tTop;
                                    this.vy = 0;
                                    this.isJumping = false;
                                } else if (pBottom < tTop - 0.5) {
                                    // Check if hitting FRONT (Game Over) or SIDE (Stumble)
                                    // Front is roughly at obj.mesh.position.z - obj.length/2
                                    const trainFront = obj.mesh.position.z - obj.length/2;
                                    if(this.player.position.z > trainFront - 1 && this.player.position.z < trainFront + 1) {
                                        this.gameOver(); // Frontal Crash
                                    } else {
                                        this.stumble(); // Side rub
                                    }
                                }
                            }
                        }
                    } else if (obj.type === 'barrier') {
                        if(pBox.intersectsBox(oBox)) {
                            if(obj.subType === 'high' && this.player.scale.y < 1) continue; 
                            if(obj.subType === 'low' && this.player.position.y > 1) continue; 
                            if(!this.activePUs.shield && !this.activePUs.hoverboard) this.gameOver();
                            else this.stumble();
                        }
                    }
                }

                for(let i=this.coins.length-1; i>=0; i--) {
                    const c = this.coins[i];
                    if(this.activePUs.magnet) {
                        const d = this.player.position.distanceTo(c.position);
                        if(d < 12) c.position.lerp(this.player.position, 0.2);
                    }
                    if(pBox.intersectsBox(new THREE.Box3().setFromObject(c))) {
                        this.scene.remove(c);
                        this.coins.splice(i, 1);
                        this.runCoins += (this.activePUs.multiplier ? 2 : 1);
                        audio.coin();
                    }
                }

                for(let i=this.powerups.length-1; i>=0; i--) {
                    const p = this.powerups[i];
                    if(pBox.intersectsBox(new THREE.Box3().setFromObject(p.mesh))) {
                        this.activatePowerup(p.type);
                        this.scene.remove(p.mesh);
                        this.powerups.splice(i, 1);
                    }
                }
            }

            gameOver() {
                this.isPlaying = false;
                audio.crash();
                document.getElementById('game-over').classList.remove('hidden');
                document.getElementById('hud').style.display = 'none';
                document.getElementById('pause-btn').style.display = 'none';
                document.getElementById('active-powerups').innerHTML = '';
                document.getElementById('final-score').innerText = Math.floor(this.score);
                document.getElementById('final-high').innerText = state.highScore;
                document.getElementById('final-coins').innerText = this.runCoins;
                
                state.coins += this.runCoins;
                if(this.score > state.highScore) state.highScore = Math.floor(this.score);
                
                localStorage.setItem('v24_coins', state.coins);
                localStorage.setItem('v24_high', state.highScore);
                localStorage.setItem('v24_stats', JSON.stringify(state.stats));
                
                ui.checkAchievements();
                ui.updateMenu();
            }

            start() {
                audio.init();
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('pause-btn').style.display = 'block';
                this.resetState();
                this.isPlaying = true;
                this.spawnTrain();
            }

            restart() {
                document.getElementById('game-over').classList.add('hidden');
                this.start();
            }

            togglePause() {
                if(!this.isPlaying) return;
                this.isPaused = !this.isPaused;
                if(this.isPaused) {
                    document.getElementById('pause-menu').classList.remove('hidden');
                } else {
                    document.getElementById('pause-menu').classList.add('hidden');
                }
            }

            resume() {
                this.isPaused = false;
                document.getElementById('pause-menu').classList.add('hidden');
            }

            quitToMenu() {
                this.isPlaying = false;
                this.isPaused = false;
                document.getElementById('pause-menu').classList.add('hidden');
                ui.showMain();
            }

            setQuality(q) { state.settings.quality = q; location.reload(); }
            toggleShadows(v) { state.settings.shadows = v; this.renderer.shadowMap.enabled = v; }
            toggleShake(v) { state.settings.shake = v; }

            animate() {
                requestAnimationFrame(() => this.animate());

                if(this.isPlaying && !this.isPaused) {
                    let currentSpeed = this.speed;
                    if(this.activePUs.slowmo) currentSpeed *= 0.5;
                    
                    // Difficulty Scaling: Speed increases with score
                    if(!this.stunned) this.speed = Math.min(0.4 + (this.score * 0.0002), 1.8);
                    
                    this.score += currentSpeed;
                    document.getElementById('score').innerText = Math.floor(this.score);
                    document.getElementById('coins').innerText = state.coins + this.runCoins;

                    const targetX = [-2.5, 0, 2.5][this.lane];
                    this.player.position.x += (targetX - this.player.position.x) * 0.2;
                    this.player.rotation.z = (this.player.position.x - targetX) * -0.1;

                    // --- CAMERA LOGIC ---
                    let targetCamY = this.baseCamPos.y;
                    let targetCamZ = this.baseCamPos.z;

                    if(this.activePUs.jetpack) {
                        this.player.position.y += 0.15; 
                        if(this.player.position.y > 10) this.player.position.y = 10;
                        this.player.rotation.x = -0.5;
                        this.vy = 0; 
                        this.isJumping = false;
                        
                        targetCamY = 12; 
                        targetCamZ = 14;

                        // Spawn Sky Coins
                        if(Math.random() < 0.3) {
                            this.spawnCoin([-2.5, 0, 2.5][Math.floor(Math.random()*3)], 8 + Math.random()*2, -100);
                        }
                    } else {
                        this.player.rotation.x = 0;
                        if(!this.isOnTrain) {
                            this.player.position.y += this.vy;
                            this.vy -= 0.025;
                            if(this.player.position.y < 0) {
                                this.player.position.y = 0;
                                this.vy = 0;
                                this.isJumping = false;
                            }
                        } else {
                            targetCamY = 8;
                        }
                    }

                    this.camera.position.y += (targetCamY - this.camera.position.y) * 0.05;
                    this.camera.position.z += (targetCamZ - this.camera.position.z) * 0.05;
                    this.camera.lookAt(0, this.player.position.y, -10);

                    // Move World
                    this.objects.forEach(o => {
                        // Train specific movement
                        let move = currentSpeed;
                        if(o.type === 'train') move += o.moveSpeed;
                        
                        o.mesh.position.z += move;
                        if(o.mesh.position.z > 20) { o.dead = true; this.scene.remove(o.mesh); }
                    });
                    this.objects = this.objects.filter(o => !o.dead);

                    this.coins.forEach(c => {
                        c.position.z += currentSpeed;
                        c.rotation.z += 0.1;
                        if(c.position.z > 10) { c.dead = true; this.scene.remove(c); }
                    });
                    this.coins = this.coins.filter(c => !c.dead);

                    this.powerups.forEach(p => {
                        p.mesh.position.z += currentSpeed;
                        p.mesh.rotation.y += 0.05;
                        if(p.mesh.position.z > 10) { p.dead = true; this.scene.remove(p.mesh); }
                    });
                    this.powerups = this.powerups.filter(p => !p.dead);

                    // Spawning Logic (Harder over time)
                    const spawnRate = Math.max(0.01, 0.025 - (this.score * 0.000005));
                    if(this.objects.length < 3 && Math.random() < spawnRate) {
                        if(Math.random() > 0.3) this.spawnTrain();
                        else this.spawnBarrier();
                    }
                    if(Math.random() < 0.04) this.spawnCoin([-2.5, 0, 2.5][Math.floor(Math.random()*3)], 1, -160);
                    if(Math.random() < 0.003) this.spawnPowerup();

                    if(!this.isJumping && !this.activePUs.jetpack) {
                        const t = Date.now() * 0.02 * (currentSpeed/0.4);
                        this.player.userData.parts.ll.rotation.x = Math.sin(t);
                        this.player.userData.parts.rl.rotation.x = Math.sin(t + Math.PI);
                        this.player.userData.parts.la.rotation.x = Math.sin(t + Math.PI);
                        this.player.userData.parts.ra.rotation.x = Math.sin(t);
                    }

                    if(state.settings.shake && !this.stunned) {
                        this.camera.position.x = (Math.random() - 0.5) * 0.05;
                    } else {
                        this.camera.position.x = 0;
                    }

                    this.checkCollisions();
                }

                this.renderer.render(this.scene, this.camera);
            }
            
            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // --- UI MANAGER ---
        const ui = {
            showMain: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('main-menu').classList.remove('hidden');
                document.getElementById('pause-btn').style.display = 'none';
                ui.updateMenu();
            },
            showShop: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('shop-menu').classList.remove('hidden');
                ui.renderShop();
            },
            showAchievements: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('achieve-menu').classList.remove('hidden');
                ui.renderAchievements();
            },
            showSettings: () => {
                document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
                document.getElementById('settings-menu').classList.remove('hidden');
                document.getElementById('quality-select').value = state.settings.quality;
                document.getElementById('shadow-toggle').checked = state.settings.shadows;
                document.getElementById('shake-toggle').checked = state.settings.shake;
            },
            updateMenu: () => {
                document.getElementById('menu-coins').innerText = state.coins;
                document.getElementById('menu-high').innerText = state.highScore;
            },
            toast: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.style.opacity = 1;
                setTimeout(() => t.style.opacity = 0, 2000);
            },
            renderShop: () => {
                document.getElementById('shop-coins').innerText = state.coins;
                const sGrid = document.getElementById('skin-grid');
                sGrid.innerHTML = '';
                SKINS.forEach(skin => {
                    const isUnlocked = state.unlockedSkins.includes(skin.id);
                    const isSelected = state.currentSkin === skin.id;
                    const div = document.createElement('div');
                    div.className = `grid-item ${isSelected ? 'selected' : ''}`;
                    const colorHex = '#' + skin.color.toString(16).padStart(6, '0');
                    div.innerHTML = `<div class="item-preview" style="background:${colorHex}">${skin.icon}</div><div style="font-size:12px">${skin.name}</div><div style="color:#f1c40f; font-size:10px">${isUnlocked ? (isSelected ? '✓' : 'انتخاب') : skin.price}</div>`;
                    div.onclick = () => {
                        if(isUnlocked) {
                            state.currentSkin = skin.id;
                            localStorage.setItem('v24_skin', skin.id);
                            game.scene.remove(game.player);
                            game.player = game.createPlayerMesh(skin.color);
                            game.scene.add(game.player);
                            ui.renderShop();
                        } else if(state.coins >= skin.price) {
                            state.coins -= skin.price;
                            state.unlockedSkins.push(skin.id);
                            state.currentSkin = skin.id;
                            localStorage.setItem('v24_coins', state.coins);
                            localStorage.setItem('v24_skins', JSON.stringify(state.unlockedSkins));
                            localStorage.setItem('v24_skin', skin.id);
                            game.scene.remove(game.player);
                            game.player = game.createPlayerMesh(skin.color);
                            game.scene.add(game.player);
                            ui.renderShop();
                            ui.updateMenu();
                        }
                    };
                    sGrid.appendChild(div);
                });

                const uGrid = document.getElementById('upgrade-grid');
                uGrid.innerHTML = '';
                POWERUPS_SHOP.forEach(pu => {
                    const isOwned = state.ownedPowerups.includes(pu.id);
                    const div = document.createElement('div');
                    div.className = `grid-item ${isOwned ? 'selected' : ''}`;
                    div.innerHTML = `<div class="item-preview" style="background:#333;">${pu.icon}</div><div style="font-size:12px">${pu.name}</div><div style="color:#f1c40f; font-size:10px">${isOwned ? '✓ موجود' : pu.price}</div>`;
                    div.onclick = () => {
                        if(!isOwned && state.coins >= pu.price) {
                            state.coins -= pu.price;
                            state.ownedPowerups.push(pu.id);
                            localStorage.setItem('v24_coins', state.coins);
                            localStorage.setItem('v24_pu', JSON.stringify(state.ownedPowerups));
                            ui.renderShop();
                            ui.updateMenu();
                            ui.toast(`${pu.name} خریداری شد!`);
                        }
                    };
                    uGrid.appendChild(div);
                });
            },
            renderAchievements: () => {
                const list = document.getElementById('achieve-list');
                list.innerHTML = '';
                ACHIEVEMENTS.forEach(ach => {
                    const isDone = state.achievements.includes(ach.id);
                    const div = document.createElement('div');
                    div.style.cssText = `background:rgba(255,255,255,0.1); margin:5px 0; padding:10px; border-radius:5px; border-right: 4px solid ${isDone ? '#2ecc71' : '#555'}`;
                    div.innerHTML = `<div style="color:${isDone ? '#2ecc71' : '#fff'}">${ach.name}</div><div style="font-size:12px; color:#aaa">${ach.desc}</div>`;
                    list.appendChild(div);
                });
            },
            checkAchievements: () => {
                let newUnlock = false;
                ACHIEVEMENTS.forEach(ach => {
                    if(!state.achievements.includes(ach.id)) {
                        let val = 0;
                        if(ach.type === 'score') val = state.highScore;
                        if(ach.type === 'coins') val = state.coins;
                        if(ach.type === 'trains') val = state.stats.trainsHopped || 0;
                        if(ach.type === 'jetpack_used') val = state.stats.jetpackUsed || 0;
                        if(val >= ach.target) {
                            state.achievements.push(ach.id);
                            newUnlock = true;
                        }
                    }
                });
                if(newUnlock) {
                    localStorage.setItem('v24_ach', JSON.stringify(state.achievements));
                    ui.toast("دستاورد جدید باز شد! 🏆");
                }
            }
        };

        const game = new Game();
        window.game = game;
        window.ui = ui;
        window.audio = audio;

    </script>
</body>
