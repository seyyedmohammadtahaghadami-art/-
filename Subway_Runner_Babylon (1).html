<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro V17 - Fixed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Lalezar', cursive, sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layers */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to game when playing */
        }

        .interactive {
            pointer-events: auto;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            z-index: 20;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #f1c40f;
        }

        /* Menus */
        .menu-panel {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #e67e22;
            text-align: center;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.5);
            max-width: 90%;
            width: 400px;
            display: none; /* Hidden by default */
        }

        .menu-panel.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 {
            color: #f1c40f;
            font-size: 40px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #c0392b;
        }

        h2 { color: #ecf0f1; margin-bottom: 20px; }

        button {
            background: linear-gradient(to bottom, #e67e22, #d35400);
            border: none;
            padding: 15px 30px;
            color: white;
            font-family: 'Lalezar', cursive;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 5px 0 #a04000;
            width: 100%;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #a04000;
        }

        button.secondary {
            background: linear-gradient(to bottom, #34495e, #2c3e50);
            box-shadow: 0 5px 0 #1a252f;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 150px;
            z-index: 15;
            display: none;
            pointer-events: none;
        }
        
        .control-zone {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
            /* Debug: border: 1px solid red; */
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }

        /* Error Modal */
        #error-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #c0392b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 100;
            display: none;
            text-align: center;
            border: 2px solid white;
        }

    </style>
    <!-- Import Three.js as a module -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <!-- Game Canvas Container -->
    <div id="game-container"></div>

    <!-- HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-item">امتیاز: <span id="score-val">0</span></div>
        <div class="hud-item">🪙 <span id="coin-val">0</span></div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="ui-layer interactive">
        <div class="menu-panel active">
            <h1>SUBWAY PRO V17</h1>
            <p style="color: #bdc3c7;">نسخه اصلاح شده - بدون باگ</p>
            <button onclick="startGame()">شروع دویدن 🏃‍♂️</button>
            <button class="secondary" onclick="alert('بخش فروشگاه در حال ساخت است')">فروشگاه 🛒</button>
            <button class="secondary" onclick="alert('تنظیمات: کیفیت بالا فعال است')">تنظیمات ⚙️</button>
        </div>
    </div>

    <!-- Game Over Menu -->
    <div id="game-over-menu" class="ui-layer interactive" style="display: none;">
        <div class="menu-panel active">
            <h1 style="color: #e74c3c;">GAME OVER</h1>
            <h2>امتیاز نهایی: <span id="final-score">0</span></h2>
            <h2>سکه‌ها: <span id="final-coins">0</span></h2>
            <button onclick="resetGame()">دوباره 🔄</button>
            <button class="secondary" onclick="showMainMenu()">منو اصلی</button>
        </div>
    </div>

    <!-- Mobile Touch Zones -->
    <div id="mobile-controls">
        <div id="left-zone" class="control-zone"></div>
        <div id="right-zone" class="control-zone"></div>
    </div>

    <!-- Error Handler -->
    <div id="error-modal">
        <h3>خطای سیستم</h3>
        <p id="error-msg"></p>
        <button onclick="location.reload()">تلاش مجدد</button>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- Global Variables ---
        let scene, camera, renderer;
        let player, track;
        let obstacles = [];
        let coins = [];
        let particles = [];
        
        // Game State
        let isPlaying = false;
        let score = 0;
        let coinsCollected = 0;
        let totalCoins = parseInt(localStorage.getItem('subway_coins')) || 0;
        let speed = 0.5;
        let lane = 0; // -1 (Left), 0 (Center), 1 (Right)
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;
        const jumpStrength = 0.35;
        const laneWidth = 2.5;
        
        // DOM Elements
        const scoreEl = document.getElementById('score-val');
        const coinEl = document.getElementById('coin-val');
        const finalScoreEl = document.getElementById('final-score');
        const finalCoinsEl = document.getElementById('final-coins');
        const hud = document.getElementById('hud');
        const mainMenu = document.getElementById('main-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const mobileControls = document.getElementById('mobile-controls');

        // --- Initialization ---
        function init() {
            try {
                // Scene Setup
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB); // Sky blue
                scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

                // Camera
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(0, 5, 8);
                camera.lookAt(0, 0, -5);

                // Renderer
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                document.getElementById('game-container').appendChild(renderer.domElement);

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(10, 20, 10);
                dirLight.castShadow = true;
                scene.add(dirLight);

                // Create World
                createTrack();
                createPlayer();

                // Event Listeners
                window.addEventListener('resize', onWindowResize);
                document.addEventListener('keydown', handleInput);
                
                // Touch Controls
                setupTouchControls();

                // Update UI
                coinEl.innerText = totalCoins;

                // Start Loop
                animate();

            } catch (error) {
                showError(error.message);
            }
        }

        function createTrack() {
            // Ground
            const geometry = new THREE.PlaneGeometry(20, 200);
            const material = new THREE.MeshStandardMaterial({ color: 0x333333 });
            track = new THREE.Mesh(geometry, material);
            track.rotation.x = -Math.PI / 2;
            track.position.z = -50;
            track.receiveShadow = true;
            scene.add(track);

            // Lane markers
            const lineGeo = new THREE.PlaneGeometry(0.2, 200);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            const line1 = new THREE.Mesh(lineGeo, lineMat);
            line1.rotation.x = -Math.PI / 2;
            line1.position.set(-laneWidth/2 - 0.5, 0.01, -50);
            scene.add(line1);

            const line2 = new THREE.Mesh(lineGeo, lineMat);
            line2.rotation.x = -Math.PI / 2;
            line2.position.set(laneWidth/2 + 0.5, 0.01, -50);
            scene.add(line2);
        }

        function createPlayer() {
            // Using CapsuleGeometry as requested/fixed
            const geometry = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
            const material = new THREE.MeshStandardMaterial({ color: 0xe74c3c }); // Red runner
            player = new THREE.Mesh(geometry, material);
            player.castShadow = true;
            player.position.y = 1;
            scene.add(player);
        }

        function spawnObstacle() {
            if (!isPlaying) return;
            
            const laneIndex = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
            const xPos = laneIndex * laneWidth;
            
            // Randomly choose between barrier or train-like block
            const type = Math.random() > 0.5 ? 'barrier' : 'block';
            let mesh;

            if (type === 'barrier') {
                const geo = new THREE.BoxGeometry(2, 1, 0.5);
                const mat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 0.5;
            } else {
                const geo = new THREE.BoxGeometry(2, 2, 4);
                const mat = new THREE.MeshStandardMaterial({ color: 0x2980b9 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 1;
            }

            mesh.position.x = xPos;
            mesh.position.z = -60; // Spawn far away
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // Add bounding box for collision
            mesh.userData = { type: 'obstacle', hit: false };
            
            scene.add(mesh);
            obstacles.push(mesh);
        }

        function spawnCoin() {
            if (!isPlaying) return;

            const laneIndex = Math.floor(Math.random() * 3) - 1;
            const xPos = laneIndex * laneWidth;

            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            const coin = new THREE.Mesh(geo, mat);
            
            coin.rotation.x = Math.PI / 2;
            coin.position.set(xPos, 1, -60);
            
            coin.userData = { type: 'coin' };
            
            scene.add(coin);
            coins.push(coin);
        }

        // --- Game Logic ---

        function startGame() {
            mainMenu.style.display = 'none';
            gameOverMenu.style.display = 'none';
            hud.style.display = 'flex';
            mobileControls.style.display = 'block';
            
            resetGameState();
            isPlaying = true;
            
            // Spawners
            setInterval(spawnObstacle, 1500);
            setInterval(spawnCoin, 800);
        }

        function resetGameState() {
            score = 0;
            coinsCollected = 0;
            speed = 0.5;
            lane = 0;
            isJumping = false;
            player.position.set(0, 1, 0);
            player.rotation.set(0, 0, 0);
            
            // Clear old objects
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];
            
            updateHUD();
        }

        function gameOver() {
            isPlaying = false;
            hud.style.display = 'none';
            mobileControls.style.display = 'none';
            gameOverMenu.style.display = 'flex';
            
            finalScoreEl.innerText = Math.floor(score);
            finalCoinsEl.innerText = coinsCollected;
            
            // Save progress
            totalCoins += coinsCollected;
            localStorage.setItem('subway_coins', totalCoins);
        }

        function resetGame() {
            startGame();
        }

        function showMainMenu() {
            gameOverMenu.style.display = 'none';
            mainMenu.style.display = 'flex';
            coinEl.innerText = totalCoins;
        }

        function updateHUD() {
            scoreEl.innerText = Math.floor(score);
            coinEl.innerText = totalCoins + coinsCollected;
        }

        function handleInput(e) {
            if (!isPlaying) return;

            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                    moveLane(-1);
                    break;
                case 'ArrowRight':
                case 'd':
                    moveLane(1);
                    break;
                case 'ArrowUp':
                case 'w':
                case ' ':
                    jump();
                    break;
            }
        }

        function setupTouchControls() {
            let touchStartX = 0;
            let touchStartY = 0;

            document.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: false});

            document.addEventListener('touchend', e => {
                if(!isPlaying) return;
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // Horizontal Swipe
                    if (Math.abs(diffX) > 30) {
                        if (diffX > 0) moveLane(1); // Right
                        else moveLane(-1); // Left
                    }
                } else {
                    // Vertical Swipe
                    if (Math.abs(diffY) > 30) {
                        if (diffY < 0) jump(); // Up
                    }
                }
            }, {passive: false});
        }

        function moveLane(dir) {
            lane += dir;
            if (lane < -1) lane = -1;
            if (lane > 1) lane = 1;
        }

        function jump() {
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = jumpStrength;
            }
        }

        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(player);
            // Shrink player box slightly for forgiving gameplay
            playerBox.expandByScalar(-0.2);

            // Obstacles
            for (let obs of obstacles) {
                const obsBox = new THREE.Box3().setFromObject(obs);
                if (playerBox.intersectsBox(obsBox)) {
                    gameOver();
                    return;
                }
            }

            // Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const coinBox = new THREE.Box3().setFromObject(coin);
                if (playerBox.intersectsBox(coinBox)) {
                    // Collect
                    scene.remove(coin);
                    coins.splice(i, 1);
                    coinsCollected++;
                    score += 10;
                    updateHUD();
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Increase speed slowly
                speed += 0.0001;
                score += speed * 0.1;
                updateHUD();

                // Player Movement (Lane interpolation)
                const targetX = lane * laneWidth;
                player.position.x += (targetX - player.position.x) * 0.2;
                
                // Tilt effect
                player.rotation.z = (player.position.x - targetX) * -0.1;

                // Jump Physics
                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity -= gravity;
                    
                    if (player.position.y <= 1) {
                        player.position.y = 1;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }

                // Move Objects
                obstacles.forEach((obs, index) => {
                    obs.position.z += speed;
                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(index, 1);
                    }
                });

                coins.forEach((coin, index) => {
                    coin.position.z += speed;
                    coin.rotation.z += 0.1; // Spin
                    if (coin.position.z > 10) {
                        scene.remove(coin);
                        coins.splice(index, 1);
                    }
                });

                checkCollisions();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function showError(msg) {
            console.error(msg);
            document.getElementById('error-msg').innerText = msg;
            document.getElementById('error-modal').style.display = 'block';
        }

        // Expose functions to window for HTML buttons
        window.startGame = startGame;
        window.resetGame = resetGame;
        window.showMainMenu = showMainMenu;

        // Start
        init();

    </script>
</body>
</html>
