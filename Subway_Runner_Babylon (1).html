<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner V25 - Ultra Graphics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
        
        :root { --primary: #f1c40f; --accent: #e67e22; --glass: rgba(0,0,0,0.7); }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Lalezar', cursive; color: white; touch-action: none; }
        
        /* Canvas Container */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }

        /* HUD */
        #hud { display: none; justify-content: space-between; padding: 15px 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-size: 24px; }
        .hud-pill { background: var(--glass); padding: 8px 16px; border-radius: 30px; border: 2px solid var(--primary); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px; transform: translateY(-100%); animation: slideDown 0.5s forwards; }
        
        /* Mission Banner */
        #mission-bar { position: absolute; top: 70px; right: 20px; background: linear-gradient(90deg, rgba(230,126,34,0.9), rgba(0,0,0,0.8)); padding: 10px 20px; border-radius: 12px; font-size: 18px; display: none; border-right: 5px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* Powerup Indicators */
        #powerup-list { position: absolute; top: 80px; left: 20px; display: flex; flex-direction: column; gap: 8px; }
        .pu-icon { width: 50px; height: 50px; background: var(--glass); border-radius: 12px; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 24px; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
        .pu-timer { position: absolute; bottom: 0; left: 0; height: 4px; background: #2ecc71; width: 100%; transition: width 0.1s linear; }

        /* Menus */
        .menu { position: absolute; inset: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(15px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; overflow-y: auto; padding: 20px; transition: opacity 0.3s; }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        
        h1 { font-size: 60px; margin: 0; background: linear-gradient(to bottom, #f1c40f, #e67e22); -webkit-background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #c0392b); transform: skew(-5deg); letter-spacing: 2px; }
        h2 { color: #ecf0f1; border-bottom: 3px solid var(--primary); padding-bottom: 5px; margin-top: 20px; }

        .btn { background: linear-gradient(to bottom, #e67e22, #d35400); border: none; padding: 15px 40px; margin: 8px; color: white; font-family: inherit; font-size: 22px; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #a04000, 0 10px 20px rgba(0,0,0,0.4); transition: all 0.1s; width: 280px; text-shadow: 0 2px 0 rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #a04000, inset 0 2px 5px rgba(0,0,0,0.3); }
        .btn-blue { background: linear-gradient(to bottom, #3498db, #2980b9); box-shadow: 0 6px 0 #1c5980, 0 10px 20px rgba(0,0,0,0.4); }
        .btn-green { background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 6px 0 #1e8449, 0 10px 20px rgba(0,0,0,0.4); }
        .btn-red { background: linear-gradient(to bottom, #e74c3c, #c0392b); box-shadow: 0 6px 0 #922b21, 0 10px 20px rgba(0,0,0,0.4); }
        .btn-gray { background: linear-gradient(to bottom, #7f8c8d, #636e72); box-shadow: 0 6px 0 #4b5456, 0 10px 20px rgba(0,0,0,0.4); width: 160px; font-size: 18px; }
        .btn-revive { background: linear-gradient(to bottom, #9b59b6, #8e44ad); box-shadow: 0 6px 0 #6c3483; animation: pulse 2s infinite; }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; width: 100%; max-width: 600px; margin: 15px 0; }
        .shop-item { background: rgba(255,255,255,0.05); border: 2px solid #444; border-radius: 15px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .shop-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }
        .shop-item.active { border-color: var(--primary); background: rgba(241,196,15,0.15); box-shadow: 0 0 15px rgba(241,196,15,0.3); }
        .item-icon { font-size: 32px; margin-bottom: 5px; display: block; }
        .item-price { color: var(--primary); font-size: 14px; margin-top: 4px; }
        .owned-badge { position: absolute; top: 5px; right: 5px; background: #2ecc71; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; }

        /* Toast Notification */
        #toast { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color: var(--primary); padding: 12px 30px; border-radius: 40px; border: 2px solid var(--primary); font-size: 20px; z-index: 100; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* Animations */
        @keyframes slideDown { to { transform: translateY(0); } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        
        /* Settings Row */
        .setting-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 350px; background: rgba(255,255,255,0.05); padding: 12px 20px; margin: 6px 0; border-radius: 12px; }
        select, input[type="checkbox"] { accent-color: var(--primary); transform: scale(1.3); }
        select { background: #333; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 8px; font-family: inherit; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="hud">
            <div class="hud-pill">🏆 <span id="score-display">0</span></div>
            <div class="hud-pill">🪙 <span id="coin-display">0</span></div>
        </div>
        <div id="mission-bar">🎯 <span id="mission-desc">جمع‌آوری ۵۰ سکه</span> (<span id="mission-prog">0/50</span>)</div>
        <div id="powerup-list"></div>
        <div id="toast">پیام سیستم</div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu interactive">
        <h1>SUBWAY V25</h1>
        <p style="color:#aaa; margin: 10px 0 30px;">نسخه اولترا | گرافیک PBR | فیزیک روان</p>
        <div style="font-size: 22px; color: var(--primary); margin-bottom: 20px;">
            سکه: <span id="menu-coins">0</span> | رکورد: <span id="menu-high">0</span>
        </div>
        <button class="btn" onclick="game.start()">🏃‍♂️ شروع دویدن</button>
        <button class="btn btn-blue" onclick="ui.openShop()">🛒 فروشگاه اسکین</button>
        <button class="btn btn-green" onclick="ui.openAchievements()">🏆 دستاوردها</button>
        <button class="btn btn-gray" onclick="ui.openSettings()">⚙️ تنظیمات</button>
        <button class="btn btn-gray" onclick="audio.toggle()" style="margin-top:15px; width:160px;">🔊 <span id="audio-status">روشن</span></button>
    </div>

    <!-- Shop -->
    <div id="shop-menu" class="menu interactive hidden">
        <h2>فروشگاه اسکین‌ها</h2>
        <div style="color:var(--primary); font-size:20px; margin:10px;">موجودی: <span id="shop-coins">0</span> 🪙</div>
        <div class="shop-grid" id="skin-grid"></div>
        <h2>ارتقاهای دائمی</h2>
        <div class="shop-grid" id="upgrade-grid"></div>
        <button class="btn btn-gray" onclick="ui.backToMain()">بازگشت</button>
    </div>

    <!-- Achievements -->
    <div id="achieve-menu" class="menu interactive hidden">
        <h2>دستاوردها</h2>
        <div id="achieve-list" style="width:100%; max-width:400px; margin:20px 0;"></div>
        <button class="btn btn-gray" onclick="ui.backToMain()">بازگشت</button>
    </div>

    <!-- Settings -->
    <div id="settings-menu" class="menu interactive hidden">
        <h2>تنظیمات گرافیکی</h2>
        <div class="setting-row"><span>کیفیت رندر</span><select id="opt-quality"><option value="low">پایین</option><option value="med" selected>متوسط</option><option value="high">اولترا</option></select></div>
        <div class="setting-row"><span>سایه‌زنی</span><input type="checkbox" id="opt-shadows" checked></div>
        <div class="setting-row"><span>لرزش دوربین</span><input type="checkbox" id="opt-shake" checked></div>
        <div class="setting-row"><span>ذرات محیطی</span><input type="checkbox" id="opt-particles" checked></div>
        <button class="btn btn-gray" onclick="ui.backToMain()" style="margin-top:20px;">ذخیره و بازگشت</button>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="menu interactive hidden">
        <h1 style="color:#e74c3c; font-size:50px;">BUSTED!</h1>
        <div style="font-size:30px; margin:15px;">امتیاز: <span id="go-score">0</span></div>
        <div style="color:#aaa; font-size:18px;">رکورد شخصی: <span id="go-high">0</span></div>
        <div style="color:var(--primary); font-size:24px; margin:10px 0 30px;">+<span id="go-coins">0</span> سکه</div>
        <button class="btn btn-revive" onclick="game.revive()">💎 ادامه (۱۰۰ سکه)</button>
        <button class="btn" onclick="game.restart()">🔄 تلاش مجدد</button>
        <button class="btn btn-gray" onclick="ui.backToMain()">منوی اصلی</button>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // ==========================================
        // 1. CONFIG & STATE MANAGEMENT
        // ==========================================
        const CONFIG = {
            laneWidth: 2.8,
            baseSpeed: 12,
            maxSpeed: 35,
            gravity: 45,
            jumpForce: 18,
            highJumpForce: 24,
            laneChangeSpeed: 12,
            colors: {
                sky: 0x87CEEB,
                ground: 0x2c3e50,
                rail: 0x95a5a6,
                train: [0xe74c3c, 0x3498db, 0x2ecc71, 0xf1c40f, 0x9b59b6]
            }
        };

        const DB = {
            get: (k, d) => JSON.parse(localStorage.getItem(`sv25_${k}`)) ?? d,
            set: (k, v) => localStorage.setItem(`sv25_${k}`, JSON.stringify(v)),
            coins: parseInt(localStorage.getItem('sv25_coins')) || 0,
            high: parseInt(localStorage.getItem('sv25_high')) || 0,
            skins: JSON.parse(localStorage.getItem('sv25_skins')) || ['default'],
            curSkin: localStorage.getItem('sv25_curSkin') || 'default',
            upgrades: JSON.parse(localStorage.getItem('sv25_upgrades')) || [],
            achievements: JSON.parse(localStorage.getItem('sv25_achs')) || [],
            stats: JSON.parse(localStorage.getItem('sv25_stats')) || { runs: 0, trains: 0, jumps: 0 }
        };

        const SKINS = [
            { id: 'default', name: 'دونده کلاسیک', color: 0xe74c3c, price: 0, icon: '🏃' },
            { id: 'ninja', name: 'نینجای سایه', color: 0x111111, price: 500, icon: '🥷' },
            { id: 'gold', name: 'سلطان طلا', color: 0xf1c40f, price: 1500, icon: '👑' },
            { id: 'cyber', name: 'سایبرپانک', color: 0x00ffff, price: 3000, icon: '🤖' },
            { id: 'zombie', name: 'زامبی شهری', color: 0x27ae60, price: 5000, icon: '🧟' },
            { id: 'king', name: 'پادشاه مترو', color: 0x8e44ad, price: 10000, icon: '🦸' },
            { id: 'ghost', name: 'روح سرگردان', color: 0xffffff, price: 15000, icon: '👻' },
            { id: 'fire', name: 'آتش خشمگین', color: 0xff4500, price: 20000, icon: '🔥' },
            { id: 'neon', name: 'نئون شب', color: 0x39ff14, price: 30000, icon: '💚' }
        ];

        const UPGRADES = [
            { id: 'magnet', name: 'آهنربای قوی', icon: '🧲', price: 300, desc: 'جذب سکه از راه دور' },
            { id: 'shield', name: 'سپر محافظ', icon: '🛡️', price: 800, desc: 'شروع با سپر فعال' },
            { id: 'multiplier', name: 'سکه دوبرابر', icon: '💰', price: 1500, desc: 'همیشه سکه x2 بگیر' },
            { id: 'hoverboard', name: 'هاوربرد', icon: '🛹', price: 2000, desc: 'شانس اسپاون هاوربرد' }
        ];

        const ACHIEVEMENTS = [
            { id: 'run_1k', name: 'دونده تازه‌کار', desc: '۱۰۰۰ امتیاز در یک اجرا', check: s => s.score >= 1000 },
            { id: 'rich', name: 'ثروتمند مترو', desc: 'جمع‌آوری ۱۰۰۰ سکه', check: () => DB.coins >= 1000 },
            { id: 'train_master', name: 'استاد قطار', desc: '۵۰ بار پرش روی قطار', check: () => DB.stats.trains >= 50 },
            { id: 'survivor', name: 'بازگشت از مرگ', desc: 'استفاده از Revive', check: () => DB.stats.revives > 0 },
            { id: 'collector', name: 'کلکسیونر', desc: 'خرید ۵ اسکین', check: () => DB.skins.length >= 5 }
        ];

        // ==========================================
        // 2. AUDIO SYSTEM (Web Audio API)
        // ==========================================
        const audio = {
            ctx: null, muted: false, bgmOsc: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            play(type) {
                if (this.muted || !this.ctx) return;
                const t = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                o.connect(g); g.connect(this.ctx.destination);

                switch(type) {
                    case 'coin':
                        o.type = 'sine'; o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(1800, t+0.1);
                        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.15);
                        o.start(t); o.stop(t+0.15); break;
                    case 'jump':
                        o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.linearRampToValueAtTime(400, t+0.2);
                        g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t+0.2);
                        o.start(t); o.stop(t+0.2); break;
                    case 'crash':
                        o.type = 'sawtooth'; o.frequency.setValueAtTime(100, t); o.frequency.exponentialRampToValueAtTime(10, t+0.5);
                        g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.5);
                        o.start(t); o.stop(t+0.5); break;
                    case 'powerup':
                        o.type = 'square'; o.frequency.setValueAtTime(400, t); o.frequency.linearRampToValueAtTime(800, t+0.1);
                        g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0, t+0.3);
                        o.start(t); o.stop(t+0.3); break;
                }
            },
            toggle() {
                this.muted = !this.muted;
                document.getElementById('audio-status').innerText = this.muted ? 'خاموش' : 'روشن';
                if(!this.muted) this.init();
            }
        };

        // ==========================================
        // 3. GAME ENGINE CORE
        // ==========================================
        class GameEngine {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.clock = new THREE.Clock();
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(CONFIG.colors.sky);
                this.scene.fog = new THREE.FogExp2(CONFIG.colors.sky, 0.008);

                // Camera Setup
                this.camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 500);
                this.camera.position.set(0, 5, 8);
                
                // Renderer Setup (Ultra Quality)
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.container.appendChild(this.renderer.domElement);

                // Lighting
                const hemi = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.8);
                this.scene.add(hemi);
                
                this.sun = new THREE.DirectionalLight(0xffffff, 1.5);
                this.sun.position.set(30, 50, 30);
                this.sun.castShadow = true;
                this.sun.shadow.mapSize.width = 2048;
                this.sun.shadow.mapSize.height = 2048;
                this.sun.shadow.camera.near = 0.5;
                this.sun.shadow.camera.far = 150;
                this.sun.shadow.camera.left = -40;
                this.sun.shadow.camera.right = 40;
                this.sun.shadow.camera.top = 40;
                this.sun.shadow.camera.bottom = -40;
                this.sun.shadow.bias = -0.0005;
                this.scene.add(this.sun);

                // Game State
                this.isPlaying = false;
                this.isPaused = false;
                this.speed = CONFIG.baseSpeed;
                this.score = 0;
                this.runCoins = 0;
                this.lane = 1; // 0, 1, 2
                this.targetLaneX = 0;
                this.playerY = 0;
                this.vy = 0;
                this.isGrounded = true;
                this.activePowerups = {};
                this.objects = [];
                this.particles = [];
                this.worldZ = 0;
                this.lastSpawnZ = 0;
                
                this.initWorld();
                this.initPlayer();
                this.setupInputs();
                
                window.addEventListener('resize', () => this.onResize());
                ui.updateMenuStats();
                
                this.animate();
            }

            initWorld() {
                // Ground Plane
                const groundGeo = new THREE.PlaneGeometry(200, 1000);
                const groundMat = new THREE.MeshStandardMaterial({ 
                    color: CONFIG.colors.ground, 
                    roughness: 0.8, 
                    metalness: 0.2 
                });
                this.ground = new THREE.Mesh(groundGeo, groundMat);
                this.ground.rotation.x = -Math.PI / 2;
                this.ground.receiveShadow = true;
                this.scene.add(this.ground);

                // Rails
                const railGeo = new THREE.BoxGeometry(0.15, 0.1, 1000);
                const railMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.rail, metalness: 0.9, roughness: 0.1 });
                [-CONFIG.laneWidth, 0, CONFIG.laneWidth].forEach(x => {
                    [-0.7, 0.7].forEach(offset => {
                        const rail = new THREE.Mesh(railGeo, railMat);
                        rail.position.set(x + offset, 0.05, -400);
                        rail.receiveShadow = true;
                        this.scene.add(rail);
                    });
                });
            }

            initPlayer() {
                this.playerGroup = new THREE.Group();
                
                const skinData = SKINS.find(s => s.id === DB.curSkin) || SKINS[0];
                const matBody = new THREE.MeshStandardMaterial({ color: skinData.color, roughness: 0.3, metalness: 0.1 });
                const matSkin = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.8 });
                const matCloth = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });

                // Body Parts for Animation
                this.parts = {};
                
                // Torso
                const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.35), matBody);
                torso.position.y = 1.1; torso.castShadow = true;
                this.playerGroup.add(torso);

                // Head
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matSkin);
                head.position.y = 1.75; head.castShadow = true;
                this.playerGroup.add(head);

                // Limbs (Pivot based animation)
                const limbGeo = new THREE.BoxGeometry(0.18, 0.6, 0.18);
                
                this.parts.legL = new THREE.Mesh(limbGeo, matCloth);
                this.parts.legL.position.set(-0.18, 0.4, 0); this.parts.legL.castShadow = true;
                this.playerGroup.add(this.parts.legL);

                this.parts.legR = new THREE.Mesh(limbGeo, matCloth);
                this.parts.legR.position.set(0.18, 0.4, 0); this.parts.legR.castShadow = true;
                this.playerGroup.add(this.parts.legR);

                this.parts.armL = new THREE.Mesh(limbGeo, matBody);
                this.parts.armL.position.set(-0.45, 1.2, 0); this.parts.armL.castShadow = true;
                this.playerGroup.add(this.parts.armL);

                this.parts.armR = new THREE.Mesh(limbGeo, matBody);
                this.parts.armR.position.set(0.45, 1.2, 0); this.parts.armR.castShadow = true;
                this.playerGroup.add(this.parts.armR);

                // Shield Effect Mesh (Hidden by default)
                this.shieldMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(1.2, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0x3498db, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
                );
                this.shieldMesh.visible = false;
                this.playerGroup.add(this.shieldMesh);

                this.scene.add(this.playerGroup);
            }

            setupInputs() {
                const handle = (action) => {
                    if (!this.isPlaying || this.isPaused) return;
                    if (action === 'left' && this.lane > 0) { this.lane--; audio.play('jump'); }
                    if (action === 'right' && this.lane < 2) { this.lane++; audio.play('jump'); }
                    if (action === 'up') this.jump();
                    if (action === 'down') this.roll();
                };

                document.addEventListener('keydown', e => {
                    if (e.key === 'ArrowLeft') handle('left');
                    if (e.key === 'ArrowRight') handle('right');
                    if (e.key === 'ArrowUp' || e.key === ' ') handle('up');
                    if (e.key === 'ArrowDown') handle('down');
                    if (e.key === 'Escape') this.togglePause();
                });

                let tx, ty;
                document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:false});
                document.addEventListener('touchend', e => {
                    const dx = e.changedTouches[0].clientX - tx;
                    const dy = e.changedTouches[0].clientY - ty;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 40) handle('right');
                        else if (dx < -40) handle('left');
                    } else {
                        if (dy < -40) handle('up');
                        else if (dy > 40) handle('down');
                    }
                }, {passive:false});
            }

            jump() {
                if (this.isGrounded && !this.activePowerups.jetpack) {
                    const force = this.activePowerups.superJump ? CONFIG.highJumpForce : CONFIG.jumpForce;
                    this.vy = force;
                    this.isGrounded = false;
                    audio.play('jump');
                    DB.stats.jumps++;
                    this.spawnParticles(0, 0, 0, 10, 0xffffff);
                }
            }

            roll() {
                if (this.isGrounded && !this.activePowerups.jetpack) {
                    this.playerGroup.scale.y = 0.5;
                    setTimeout(() => { 
                        if(this.isPlaying && this.isGrounded) this.playerGroup.scale.y = 1; 
                    }, 800);
                } else if (!this.isGrounded) {
                    this.vy = -20; // Fast fall
                }
            }

            spawnParticles(x, y, z, count, color) {
                if (!document.getElementById('opt-particles').checked) return;
                const geo = new THREE.BufferGeometry();
                const positions = [];
                const velocities = [];
                for(let i=0; i<count; i++) {
                    positions.push(x, y, z);
                    velocities.push((Math.random()-0.5)*5, Math.random()*5, (Math.random()-0.5)*5);
                }
                geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                const mat = new THREE.PointsMaterial({ color: color, size: 0.2, transparent: true });
                const pts = new THREE.Points(geo, mat);
                pts.userData = { vel: velocities, life: 1.0 };
                this.scene.add(pts);
                this.particles.push(pts);
            }

            start() {
                audio.init();
                this.resetGame();
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('game-over').classList.add('hidden');
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('mission-bar').style.display = 'block';
                this.isPlaying = true;
                this.isPaused = false;
                
                // Apply Start Upgrades
                if (DB.upgrades.includes('shield')) this.activatePowerup('shield', 10);
                
                ui.updateMission();
            }

            resetGame() {
                this.speed = CONFIG.baseSpeed;
                this.score = 0;
                this.runCoins = 0;
                this.lane = 1;
                this.playerY = 0;
                this.vy = 0;
                this.isGrounded = true;
                this.worldZ = 0;
                this.lastSpawnZ = -50;
                this.activePowerups = {};
                
                // Clear Scene Objects
                this.objects.forEach(o => this.scene.remove(o.mesh));
                this.objects = [];
                this.particles.forEach(p => this.scene.remove(p));
                this.particles = [];
                
                this.playerGroup.position.set(0, 0, 0);
                this.playerGroup.scale.set(1,1,1);
                this.playerGroup.rotation.set(0,0,0);
                this.shieldMesh.visible = false;
                
                document.getElementById('powerup-list').innerHTML = '';
                
                // Reset Mission
                this.mission = { type: 'coins', target: 50 + Math.floor(Math.random()*50), current: 0, done: false };
            }

            togglePause() {
                if (!this.isPlaying) return;
                this.isPaused = !this.isPaused;
                const menu = document.getElementById('pause-menu');
                if (this.isPaused) menu.classList.remove('hidden');
                else menu.classList.add('hidden');
            }

            revive() {
                if (DB.coins >= 100) {
                    DB.coins -= 100;
                    DB.stats.revives = (DB.stats.revives || 0) + 1;
                    DB.set('coins', DB.coins);
                    DB.set('stats', DB.stats);
                    
                    audio.play('powerup');
                    document.getElementById('game-over').classList.add('hidden');
                    document.getElementById('hud').style.display = 'flex';
                    
                    // Clear nearby obstacles
                    this.objects = this.objects.filter(o => {
                        if (o.mesh.position.z > this.playerGroup.position.z - 10 && o.mesh.position.z < this.playerGroup.position.z + 20) {
                            this.scene.remove(o.mesh);
                            return false;
                        }
                        return true;
                    });
                    
                    this.playerGroup.position.y = 3;
                    this.vy = 0;
                    this.activatePowerup('shield', 5);
                    this.isPlaying = true;
                    ui.updateMenuStats();
                } else {
                    ui.toast("سکه کافی نیست! 💸");
                }
            }

            gameOver() {
                this.isPlaying = false;
                audio.play('crash');
                
                if (this.score > DB.high) {
                    DB.high = Math.floor(this.score);
                    DB.set('high', DB.high);
                }
                DB.coins += this.runCoins;
                DB.set('coins', DB.coins);
                DB.set('stats', DB.stats);
                
                document.getElementById('hud').style.display = 'none';
                document.getElementById('mission-bar').style.display = 'none';
                document.getElementById('game-over').classList.remove('hidden');
                document.getElementById('go-score').innerText = Math.floor(this.score);
                document.getElementById('go-high').innerText = DB.high;
                document.getElementById('go-coins').innerText = this.runCoins;
                
                ui.checkAchievements();
                ui.updateMenuStats();
            }

            activatePowerup(type, duration = 10) {
                this.activePowerups[type] = duration;
                audio.play('powerup');
                
                if (type === 'shield') this.shieldMesh.visible = true;
                
                const el = document.createElement('div');
                el.className = 'pu-icon';
                el.innerHTML = `${this.getPuIcon(type)}<div class="pu-timer" style="width:100%"></div>`;
                el.id = `pu-${type}`;
                document.getElementById('powerup-list').appendChild(el);
            }

            getPuIcon(t) {
                const map = { shield:'🛡️', magnet:'🧲', multiplier:'💰', jetpack:'🚀', superJump:'⬆️', hoverboard:'🛹' };
                return map[t] || '❓';
            }

            spawnObject(z) {
                const lane = Math.floor(Math.random() * 3);
                const x = (lane - 1) * CONFIG.laneWidth;
                const r = Math.random();
                
                if (r < 0.4) {
                    // Train
                    const len = 15 + Math.random() * 20;
                    const color = CONFIG.colors.train[Math.floor(Math.random() * CONFIG.colors.train.length)];
                    const geo = new THREE.BoxGeometry(2.2, 3.5, len);
                    const mat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.3 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, 1.75, z - len/2);
                    mesh.castShadow = true; mesh.receiveShadow = true;
                    this.scene.add(mesh);
                    this.objects.push({ mesh, type: 'train', lane, len, hitbox: { w:2, h:3.5, d:len } });
                    
                    // Coins on train
                    for(let cz = z-len+2; cz < z-2; cz+=3) {
                        this.spawnCoin(x, 4.5, cz);
                    }
                } else if (r < 0.7) {
                    // Barrier
                    const isHigh = Math.random() > 0.5;
                    const geo = new THREE.BoxGeometry(2.4, isHigh?0.5:1.2, 0.5);
                    const mat = new THREE.MeshStandardMaterial({ color: isHigh?0xc0392b:0xe67e22 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, isHigh?2.5:0.6, z);
                    mesh.castShadow = true;
                    this.scene.add(mesh);
                    this.objects.push({ mesh, type: 'barrier', subtype: isHigh?'high':'low', lane, hitbox: { w:2.4, h:isHigh?0.5:1.2, d:0.5, y:isHigh?2.5:0.6 } });
                } else {
                    // Powerup
                    const types = ['magnet', 'jetpack', 'superJump', 'multiplier'];
                    const puType = types[Math.floor(Math.random()*types.length)];
                    const colors = { magnet:0xe74c3c, jetpack:0x9b59b6, superJump:0xff00ff, multiplier:0x2ecc71 };
                    const geo = new THREE.OctahedronGeometry(0.5);
                    const mat = new THREE.MeshStandardMaterial({ color: colors[puType], emissive: colors[puType], emissiveIntensity: 0.5 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, 1.5, z);
                    this.scene.add(mesh);
                    this.objects.push({ mesh, type: 'powerup', puType, lane, hitbox: { w:1, h:1, d:1 } });
                }
            }

            spawnCoin(x, y, z) {
                const geo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1, roughness: 0.2, emissive: 0xaa8800, emissiveIntensity: 0.2 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = Math.PI/2;
                mesh.position.set(x, y, z);
                this.scene.add(mesh);
                this.objects.push({ mesh, type: 'coin', lane: -1, hitbox: { w:0.7, h:0.7, d:0.1 } });
            }

            update(dt) {
                if (!this.isPlaying || this.isPaused) return;

                // Speed Progression
                this.speed = Math.min(CONFIG.maxSpeed, this.speed + dt * 0.1);
                this.score += this.speed * dt * 0.1;
                this.worldZ -= this.speed * dt;

                // Smooth Lane Change
                this.targetLaneX = (this.lane - 1) * CONFIG.laneWidth;
                this.playerGroup.position.x += (this.targetLaneX - this.playerGroup.position.x) * CONFIG.laneChangeSpeed * dt;
                this.playerGroup.rotation.z = (this.playerGroup.position.x - this.targetLaneX) * -0.1;

                // Physics & Gravity
                if (!this.isGrounded) {
                    this.vy -= CONFIG.gravity * dt;
                    this.playerY += this.vy * dt;
                    if (this.playerY <= 0) {
                        this.playerY = 0;
                        this.vy = 0;
                        this.isGrounded = true;
                        this.playerGroup.scale.y = 1;
                        this.spawnParticles(this.playerGroup.position.x, 0, this.playerGroup.position.z, 5, 0xaaaaaa);
                    }
                }
                this.playerGroup.position.y = this.playerY;

                // Jetpack Logic
                if (this.activePowerups.jetpack) {
                    this.playerY = Math.max(this.playerY, 6);
                    this.playerGroup.position.y += (6 - this.playerGroup.position.y) * 5 * dt;
                    this.vy = 0;
                    this.isGrounded = false;
                    if (Math.random() < 0.3) this.spawnCoin((Math.floor(Math.random()*3)-1)*CONFIG.laneWidth, 7, this.worldZ - 50);
                }

                // Animation
                if (this.isGrounded && !this.activePowerups.jetpack) {
                    const t = performance.now() * 0.015 * (this.speed / CONFIG.baseSpeed);
                    this.parts.legL.rotation.x = Math.sin(t) * 0.8;
                    this.parts.legR.rotation.x = Math.sin(t + Math.PI) * 0.8;
                    this.parts.armL.rotation.x = Math.sin(t + Math.PI) * 0.8;
                    this.parts.armR.rotation.x = Math.sin(t) * 0.8;
                } else {
                    this.parts.legL.rotation.x = -0.5;
                    this.parts.legR.rotation.x = 0.2;
                    this.parts.armL.rotation.x = -2.5;
                    this.parts.armR.rotation.x = -2.5;
                }

                // Camera Follow (Cinematic Lerp)
                const camTargetZ = this.playerGroup.position.z + 8 + (this.speed * 0.1);
                const camTargetY = 5 + (this.playerY * 0.5);
                this.camera.position.z += (camTargetZ - this.camera.position.z) * 4 * dt;
                this.camera.position.y += (camTargetY - this.camera.position.y) * 4 * dt;
                this.camera.lookAt(this.playerGroup.position.x * 0.3, this.playerGroup.position.y + 2, this.playerGroup.position.z - 10);

                // Spawning
                if (this.worldZ < this.lastSpawnZ - 40) {
                    this.lastSpawnZ -= 40;
                    this.spawnObject(this.lastSpawnZ - 60);
                    if (Math.random() < 0.3) this.spawnCoin((Math.floor(Math.random()*3)-1)*CONFIG.laneWidth, 1, this.lastSpawnZ - 60);
                }

                // Object Management & Collision
                const pBox = new THREE.Box3().setFromCenterAndSize(
                    new THREE.Vector3(this.playerGroup.position.x, this.playerGroup.position.y + 0.9, this.playerGroup.position.z),
                    new THREE.Vector3(0.6, 1.8, 0.4)
                );

                for (let i = this.objects.length - 1; i >= 0; i--) {
                    const obj = this.objects[i];
                    
                    // Move coins/powerups slightly for visual effect
                    if (obj.type === 'coin') obj.mesh.rotation.y += 3 * dt;
                    if (obj.type === 'powerup') obj.mesh.rotation.y += 2 * dt;

                    // Cleanup behind camera
                    if (obj.mesh.position.z > this.camera.position.z + 5) {
                        this.scene.remove(obj.mesh);
                        this.objects.splice(i, 1);
                        continue;
                    }

                    // Magnet Effect
                    if (obj.type === 'coin' && this.activePowerups.magnet) {
                        const dist = obj.mesh.position.distanceTo(this.playerGroup.position);
                        if (dist < 15) {
                            obj.mesh.position.lerp(this.playerGroup.position, 10 * dt);
                        }
                    }

                    // Collision Check
                    if (obj.mesh.position.z > this.playerGroup.position.z - 1 && obj.mesh.position.z < this.playerGroup.position.z + 1) {
                        const laneMatch = Math.abs(obj.mesh.position.x - this.playerGroup.position.x) < 1.5;
                        
                        if (laneMatch) {
                            if (obj.type === 'coin') {
                                const mult = (this.activePowerups.multiplier || DB.upgrades.includes('multiplier')) ? 2 : 1;
                                this.runCoins += mult;
                                this.mission.current += mult;
                                audio.play('coin');
                                this.scene.remove(obj.mesh);
                                this.objects.splice(i, 1);
                                ui.updateHUD();
                                ui.updateMission();
                            } else if (obj.type === 'powerup') {
                                this.activatePowerup(obj.puType);
                                this.scene.remove(obj.mesh);
                                this.objects.splice(i, 1);
                            } else if ((obj.type === 'train' || obj.type === 'barrier') && !this.activePowerups.shield) {
                                // Precise Hitbox Check
                                let hit = false;
                                if (obj.type === 'barrier') {
                                    if (obj.subtype === 'high' && this.playerGroup.scale.y < 0.8) hit = false; // Rolled under
                                    else if (obj.subtype === 'low' && this.playerY > 1.5) hit = false; // Jumped over
                                    else hit = true;
                                } else if (obj.type === 'train') {
                                    if (this.playerY >= 3.5 && this.vy <= 0) {
                                        // Landed on train
                                        this.isGrounded = true;
                                        this.playerY = 3.5;
                                        this.vy = 0;
                                        DB.stats.trains++;
                                        hit = false;
                                    } else if (this.playerY < 3.5) {
                                        hit = true;
                                    }
                                }
                                
                                if (hit) {
                                    this.gameOver();
                                    return;
                                }
                            } else if (this.activePowerups.shield && (obj.type === 'train' || obj.type === 'barrier')) {
                                delete this.activePowerups.shield;
                                this.shieldMesh.visible = false;
                                const el = document.getElementById('pu-shield');
                                if(el) el.remove();
                                ui.toast("سپر شکست! 🛡️💥");
                                // Push object away visually
                                obj.mesh.position.z -= 5;
                            }
                        }
                    }
                }

                // Update Powerup Timers
                for (const [type, time] of Object.entries(this.activePowerups)) {
                    if (typeof time === 'number') {
                        this.activePowerups[type] -= dt;
                        const el = document.querySelector(`#pu-${type} .pu-timer`);
                        if (el) el.style.width = `${(this.activePowerups[type] / 10) * 100}%`;
                        
                        if (this.activePowerups[type] <= 0) {
                            delete this.activePowerups[type];
                            const el = document.getElementById(`pu-${type}`);
                            if (el) el.remove();
                            if (type === 'shield') this.shieldMesh.visible = false;
                        }
                    }
                }

                // Update Particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.userData.life -= dt * 2;
                    const pos = p.geometry.attributes.position.array;
                    for(let j=0; j<p.userData.vel.length; j+=3) {
                        pos[j] += p.userData.vel[j] * dt;
                        pos[j+1] += p.userData.vel[j+1] * dt;
                        pos[j+2] += p.userData.vel[j+2] * dt;
                    }
                    p.geometry.attributes.position.needsUpdate = true;
                    p.material.opacity = p.userData.life;
                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(i, 1);
                    }
                }

                // Ground Follow
                this.ground.position.z = this.playerGroup.position.z;
                this.sun.position.z = this.playerGroup.position.z + 30;
                this.sun.target.position.z = this.playerGroup.position.z;
                this.sun.target.updateMatrixWorld();

                ui.updateHUD();
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const dt = Math.min(this.clock.getDelta(), 0.1); // Cap delta to prevent physics explosions
                this.update(dt);
                this.renderer.render(this.scene, this.camera);
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // ==========================================
        // 4. UI MANAGER
        // ==========================================
        const ui = {
            updateHUD() {
                document.getElementById('score-display').innerText = Math.floor(game.score);
                document.getElementById('coin-display').innerText = game.runCoins;
            },
            updateMission() {
                if (game.mission.done) return;
                document.getElementById('mission-desc').innerText = `جمع‌آوری ${game.mission.target} سکه`;
                document.getElementById('mission-prog').innerText = `${Math.min(game.mission.current, game.mission.target)}/${game.mission.target}`;
                
                if (game.mission.current >= game.mission.target) {
                    game.mission.done = true;
                    game.runCoins += 50;
                    DB.coins += 50;
                    this.toast("🎉 مأموریت انجام شد! +50 سکه");
                    document.getElementById('mission-bar').style.background = "linear-gradient(90deg, #2ecc71, #000)";
                    setTimeout(() => {
                        game.mission = { type: 'coins', target: 50 + Math.floor(Math.random()*50), current: 0, done: false };
                        document.getElementById('mission-bar').style.background = "";
                        this.updateMission();
                    }, 3000);
                }
            },
            updateMenuStats() {
                document.getElementById('menu-coins').innerText = DB.coins;
                document.getElementById('menu-high').innerText = DB.high;
                document.getElementById('shop-coins').innerText = DB.coins;
            },
            toast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2500);
            },
            openShop() {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('shop-menu').classList.remove('hidden');
                this.renderShop();
            },
            openAchievements() {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('achieve-menu').classList.remove('hidden');
                const list = document.getElementById('achieve-list');
                list.innerHTML = '';
                ACHIEVEMENTS.forEach(a => {
                    const unlocked = DB.achievements.includes(a.id);
                    const div = document.createElement('div');
                    div.style.cssText = `background:${unlocked?'rgba(46,204,113,0.2)':'rgba(255,255,255,0.05)'}; padding:15px; margin:8px 0; border-radius:10px; border-right:4px solid ${unlocked?'#2ecc71':'#555'}`;
                    div.innerHTML = `<div style="font-size:18px; color:${unlocked?'#2ecc71':'#fff'}">${a.name}</div><div style="font-size:14px; color:#aaa">${a.desc}</div>`;
                    list.appendChild(div);
                });
            },
            openSettings() {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('settings-menu').classList.remove('hidden');
            },
            backToMain() {
                document.querySelectorAll('.menu').forEach(m => m.classList.add('hidden'));
                document.getElementById('main-menu').classList.remove('hidden');
                this.updateMenuStats();
            },
            renderShop() {
                const sGrid = document.getElementById('skin-grid');
                sGrid.innerHTML = '';
                SKINS.forEach(s => {
                    const owned = DB.skins.includes(s.id);
                    const active = DB.curSkin === s.id;
                    const div = document.createElement('div');
                    div.className = `shop-item ${active ? 'active' : ''}`;
                    div.innerHTML = `
                        <span class="item-icon">${s.icon}</span>
                        <div style="font-size:14px">${s.name}</div>
                        <div class="item-price">${owned ? (active?'✓ فعال':'انتخاب') : s.price+' 🪙'}</div>
                        ${owned ? '<div class="owned-badge">✓</div>' : ''}
                    `;
                    div.onclick = () => {
                        if (owned) {
                            DB.curSkin = s.id;
                            DB.set('curSkin', s.id);
                            game.initPlayer(); // Rebuild player mesh
                            this.renderShop();
                        } else if (DB.coins >= s.price) {
                            DB.coins -= s.price;
                            DB.skins.push(s.id);
                            DB.curSkin = s.id;
                            DB.set('coins', DB.coins);
                            DB.set('skins', DB.skins);
                            DB.set('curSkin', s.id);
                            game.initPlayer();
                            this.renderShop();
                            this.updateMenuStats();
                            this.toast(`اسکین ${s.name} خریداری شد!`);
                        } else {
                            this.toast("سکه کافی نیست! 💸");
                        }
                    };
                    sGrid.appendChild(div);
                });

                const uGrid = document.getElementById('upgrade-grid');
                uGrid.innerHTML = '';
                UPGRADES.forEach(u => {
                    const owned = DB.upgrades.includes(u.id);
                    const div = document.createElement('div');
                    div.className = `shop-item ${owned ? 'active' : ''}`;
                    div.innerHTML = `
                        <span class="item-icon">${u.icon}</span>
                        <div style="font-size:14px">${u.name}</div>
                        <div style="font-size:11px; color:#aaa">${u.desc}</div>
                        <div class="item-price">${owned ? '✓ خریداری شده' : u.price+' 🪙'}</div>
                    `;
                    div.onclick = () => {
                        if (!owned && DB.coins >= u.price) {
                            DB.coins -= u.price;
                            DB.upgrades.push(u.id);
                            DB.set('coins', DB.coins);
                            DB.set('upgrades', DB.upgrades);
                            this.renderShop();
                            this.updateMenuStats();
                            this.toast(`ارتقای ${u.name} فعال شد!`);
                        } else if (!owned) {
                            this.toast("سکه کافی نیست! 💸");
                        }
                    };
                    uGrid.appendChild(div);
                });
            },
            checkAchievements() {
                let newUnlock = false;
                ACHIEVEMENTS.forEach(a => {
                    if (!DB.achievements.includes(a.id) && a.check(game)) {
                        DB.achievements.push(a.id);
                        newUnlock = true;
                    }
                });
                if (newUnlock) {
                    DB.set('achievements', DB.achievements);
                    this.toast("🏆 دستاورد جدید باز شد!");
                }
            }
        };

        // Initialize Game
        const game = new GameEngine();
        window.game = game;
        window.ui = ui;
        window.audio = audio;

    </script>
</body>
</html>
