<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro V2 - نزدیک به مرجع</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Lalezar', cursive; touch-action: none; user-select: none; 
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; 
        }
        
        .hud-top { 
            display: flex; justify-content: space-between; padding: 16px 20px; 
            font-size: 28px; color: white; text-shadow: 2px 2px 6px #000; 
        }
        .stat-box { 
            background: rgba(0,0,0,0.55); padding: 8px 22px; border-radius: 30px; 
            border: 2px solid rgba(255,255,255,0.25); backdrop-filter: blur(8px); 
            display: flex; align-items: center; gap: 8px;
        }
        .coin-icon { color: #FFD700; font-size: 32px; filter: drop-shadow(0 0 6px #ff0); }
        
        #powerups { 
            position: absolute; top: 85px; right: 20px; 
            display: flex; flex-direction: column; gap: 8px; 
        }
        .pu-badge { 
            background: rgba(0, 255, 255, 0.35); border: 2px solid #0ff; 
            padding: 7px 18px; border-radius: 14px; color: #fff; font-size: 18px; 
            display: none; animation: pulse 1s infinite; box-shadow: 0 0 12px #0ff;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .menu-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(30,20,40,0.9) 0%, rgba(0,0,0,0.97) 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            pointer-events: auto; z-index: 10; transition: opacity 0.4s; 
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        h1 { 
            font-size: 64px; color: #FFD700; margin: 0; 
            text-shadow: 0 0 40px #FFD700, 4px 4px 0 #c0392b; 
            letter-spacing: 4px;
        }
        h2 { font-size: 42px; color: #ff4757; margin: 10px 0; text-shadow: 3px 3px 0 #000; }
        p { color: #ecf0f1; font-size: 22px; margin-bottom: 30px; text-shadow: 1px 1px 3px #000; }
        .subtitle { font-size: 18px; color: #bdc3c7; margin-top: -20px; margin-bottom: 35px; }

        button { 
            background: linear-gradient(to bottom, #ff9f43, #ee5253); border: 3px solid #fff; 
            padding: 14px 55px; color: white; font-size: 28px; font-family: 'Lalezar', cursive; 
            border-radius: 50px; cursor: pointer; box-shadow: 0 12px 28px rgba(0,0,0,0.55); 
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin: 8px;
        }
        button:hover { transform: scale(1.05) translateY(-4px); }
        button:active { transform: scale(0.96); }
        .btn-secondary { 
            background: linear-gradient(to bottom, #576574, #222f3e); font-size: 22px; padding: 11px 38px; 
        }

        #shop-modal { background: rgba(0,0,0,0.92); z-index: 20; }
        .shop-panel { 
            background: #2c3e50; padding: 35px; border-radius: 28px; 
            border: 4px solid #f1c40f; text-align: center; width: 88%; max-width: 480px; 
            box-shadow: 0 0 80px rgba(241, 196, 15, 0.25);
        }
        .shop-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.08); padding: 16px; margin: 16px 0; 
            border-radius: 14px; color: white; font-size: 22px; border: 1px solid rgba(255,255,255,0.1);
        }
        .buy-btn { 
            background: #27ae60; border: none; padding: 9px 22px; border-radius: 18px; 
            cursor: pointer; color: white; font-family: 'Lalezar'; font-size: 18px;
        }
        .buy-btn:disabled { background: #7f8c8d; cursor: not-allowed; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-box">امتیاز: <span id="score">0</span></div>
            <div class="stat-box"><span class="coin-icon">🪙</span> <span id="coins">0</span></div>
        </div>
        <div id="powerups">
            <div id="pu-magnet" class="pu-badge">آهنربا فعال!</div>
            <div id="pu-shield" class="pu-badge">سپر فعال!</div>
        </div>
    </div>

    <div id="start-screen" class="menu-screen">
        <h1>SUBWAY PRO</h1>
        <p class="subtitle">نسخه نزدیک به مرجع تصویری</p>
        <button id="start-btn">شروع دویدن</button>
        <button id="shop-btn" class="btn-secondary">فروشگاه 🛒</button>
        <p style="font-size: 16px; margin-top: 25px; opacity: 0.75;">Swipe یا Arrow Keys | بالا = پرش روی قطار</p>
    </div>

    <div id="shop-modal" class="menu-screen hidden">
        <div class="shop-panel">
            <h2>فروشگاه</h2>
            <p>سکه‌های شما: <span id="shop-coins" style="color:#f1c40f">0</span></p>
            <div class="shop-item">
                <span>آهنربا (جذب سکه)</span>
                <button class="buy-btn" id="buy-magnet">50 سکه</button>
            </div>
            <div class="shop-item">
                <span>سپر محافظ</span>
                <button class="buy-btn" id="buy-shield">100 سکه</button>
            </div>
            <button id="close-shop" class="btn-secondary" style="margin-top: 25px;">بستن</button>
        </div>
    </div>

    <div id="game-over-screen" class="menu-screen hidden">
        <h1 style="color: #ff4757; text-shadow: 0 0 30px #ff4757;">GAME OVER</h1>
        <p>امتیاز نهایی: <span id="final-score">0</span></p>
        <button id="retry-btn">تلاش مجدد</button>
        <button id="menu-btn" class="btn-secondary">منو</button>
    </div>

<script>
/**
 * SUBWAY RUNNER PRO V2
 * هدف: نزدیک شدن هرچه بیشتر به تصویر مرجع (شخصیت + محیط)
 * Three.js r128 compatible
 */

const CONFIG = {
    laneWidth: 3.8,
    baseSpeed: 0.55,
    maxSpeed: 2.1,
    jumpForce: 0.72,
    gravity: 0.034,
    trainHeight: 3.4,
    colors: {
        sky: 0x87CEEB,
        ground: 0x2a2a2a,
        trainRed: 0xd63031,
        trainYellow: 0xfdcb6e,
        trainBlue: 0x0984e3
    }
};

class SubwayGame {
    constructor() {
        this.state = {
            isPlaying: false,
            score: 0,
            coins: parseInt(localStorage.getItem('subway_pro_v2_coins')) || 0,
            speed: CONFIG.baseSpeed,
            lane: 1,
            targetX: 0,
            velY: 0,
            isJumping: false,
            isRolling: false,
            rollTimer: 0,
            inventory: { magnet: 0, shield: 0 },
            activePowerups: { magnet: 0, shield: false }
        };

        this.entities = { trains: [], barriers: [], coins: [], powerups: [] };
        this.buildings = [];

        this.initThree();
        this.createWorld();
        this.createPlayer();
        this.setupInputs();
        this.updateUI();
        this.animate();
    }

    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(CONFIG.colors.sky);
        this.scene.fog = new THREE.FogExp2(0x87CEEB, 0.009);

        this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 250);
        this.camera.position.set(0, 6.5, 12);
        this.camera.lookAt(0, 1.5, -15);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        // Lighting - closer to sunny reference
        const hemi = new THREE.HemisphereLight(0xfff5e6, 0x445566, 0.7);
        this.scene.add(hemi);

        this.sun = new THREE.DirectionalLight(0xfff0d0, 1.15);
        this.sun.position.set(25, 50, 15);
        this.sun.castShadow = true;
        this.sun.shadow.mapSize.set(2048, 2048);
        this.sun.shadow.camera.left = -40;
        this.sun.shadow.camera.right = 40;
        this.sun.shadow.camera.top = 40;
        this.sun.shadow.camera.bottom = -40;
        this.sun.shadow.bias = -0.0005;
        this.scene.add(this.sun);

        // Warm fill
        const fill = new THREE.DirectionalLight(0xffcc88, 0.35);
        fill.position.set(-20, 15, -10);
        this.scene.add(fill);

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // ========== WORLD ==========
    createWorld() {
        // Ground
        const groundGeo = new THREE.PlaneGeometry(80, 500);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            roughness: 0.9,
            metalness: 0.1
        });
        this.ground = new THREE.Mesh(groundGeo, groundMat);
        this.ground.rotation.x = -Math.PI / 2;
        this.ground.position.z = -120;
        this.ground.receiveShadow = true;
        this.scene.add(this.ground);

        // Tracks
        this.trackGroup = new THREE.Group();
        const railMat = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.85, roughness: 0.25 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 });

        for (let i = -1; i <= 1; i++) {
            const offset = i * CONFIG.laneWidth;
            const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 500), railMat);
            r1.position.set(offset - 0.95, 0.06, -120);
            const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 500), railMat);
            r2.position.set(offset + 0.95, 0.06, -120);
            this.trackGroup.add(r1, r2);
        }

        for (let j = 0; j < 130; j++) {
            const s = new THREE.Mesh(new THREE.BoxGeometry(13, 0.18, 0.55), sleeperMat);
            s.position.set(0, 0.03, -j * 3.8);
            s.receiveShadow = true;
            this.trackGroup.add(s);
        }
        this.scene.add(this.trackGroup);

        // Side walls + graffiti buildings (closer to reference)
        this.createCityWalls();
    }

    createCityWalls() {
        // Create a simple canvas texture for graffiti look
        const makeGraffitiTexture = (baseColor, accent) => {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            
            // Brick base
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 256, 256);
            
            // Brick lines
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 2;
            for (let y = 0; y < 256; y += 32) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(256, y);
                ctx.stroke();
            }
            for (let x = 0; x < 256; x += 64) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 256);
                ctx.stroke();
            }

            // Random graffiti blobs
            const colors = [accent, '#ff2d55', '#00e5ff', '#ffcc00', '#a855f7', '#22c55e', '#f97316'];
            for (let i = 0; i < 12; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.globalAlpha = 0.75;
                const x = Math.random() * 200;
                const y = Math.random() * 200;
                const w = 40 + Math.random() * 80;
                const h = 30 + Math.random() * 70;
                ctx.beginPath();
                ctx.ellipse(x + w/2, y + h/2, w/2, h/2, Math.random(), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Some "tags"
            ctx.font = 'bold 42px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.85;
            ctx.fillText(['TOKER', 'NEON', 'CITY', 'RUN', 'SURF'][Math.floor(Math.random()*5)], 20, 80 + Math.random()*100);

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        };

        const wallMatL = new THREE.MeshStandardMaterial({ 
            map: makeGraffitiTexture('#8B5A2B', '#ff4d6d'),
            roughness: 0.85
        });
        const wallMatR = new THREE.MeshStandardMaterial({ 
            map: makeGraffitiTexture('#6B4423', '#00d4ff'),
            roughness: 0.85
        });

        // Continuous side walls
        for (let side = -1; side <= 1; side += 2) {
            for (let i = 0; i < 18; i++) {
                const h = 14 + Math.random() * 18;
                const w = 8 + Math.random() * 6;
                const d = 10 + Math.random() * 8;
                
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = side < 0 ? wallMatL : wallMatR;
                const b = new THREE.Mesh(geo, mat);
                
                b.position.set(
                    side * (14 + Math.random() * 6),
                    h / 2,
                    -i * 22 - Math.random() * 8
                );
                b.castShadow = true;
                b.receiveShadow = true;
                this.scene.add(b);
                this.buildings.push(b);
            }
        }

        // Extra colorful panels (graffiti style faces)
        const faceColors = [0xff2d55, 0x00e5ff, 0xffcc00, 0xa855f7, 0x22c55e, 0xf97316, 0xec4899];
        for (let i = 0; i < 12; i++) {
            const panel = new THREE.Mesh(
                new THREE.PlaneGeometry(5 + Math.random()*3, 6 + Math.random()*4),
                new THREE.MeshStandardMaterial({ 
                    color: faceColors[i % faceColors.length],
                    roughness: 0.6,
                    metalness: 0.1
                })
            );
            const side = i % 2 === 0 ? -1 : 1;
            panel.position.set(side * 12.5, 4 + Math.random()*6, -i * 28 - 10);
            panel.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
            this.scene.add(panel);
            this.buildings.push(panel);
        }
    }

    // ========== PLAYER (نزدیک به عکس) ==========
    createPlayer() {
        this.player = new THREE.Group();

        // Materials matching reference
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5c6a5, roughness: 0.55 });
        const hoodieMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 });
        const capMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.4 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
        const shoeWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
        const shoeBlue = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });

        // === TORSO (Hoodie) ===
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.15, 0.55), hoodieMat);
        torso.position.y = 1.35;
        torso.castShadow = true;
        this.player.add(torso);

        // Hoodie hood (back)
        const hood = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), hoodieMat);
        hood.position.set(0, 1.95, 0.12);
        hood.scale.set(1.1, 0.9, 1.0);
        this.player.add(hood);

        // === HEAD ===
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 14), skinMat);
        head.position.y = 2.15;
        head.scale.set(1, 1.05, 0.95);
        head.castShadow = true;
        this.player.add(head);

        // Cap
        const capBase = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.36, 0.18, 16), capMat);
        capBase.position.y = 2.38;
        const capTop = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 10, 0, Math.PI*2, 0, Math.PI*0.5), capMat);
        capTop.position.y = 2.47;
        const brim = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 0.42), capMat);
        brim.position.set(0, 2.32, -0.32);
        this.player.add(capBase, capTop, brim);

        // === LIMBS ===
        this.limbs = {};

        // Arms
        const armGeo = new THREE.BoxGeometry(0.28, 0.85, 0.28);
        this.limbs.armL = new THREE.Group();
        this.limbs.armL.position.set(-0.62, 1.75, 0);
        const meshArmL = new THREE.Mesh(armGeo, hoodieMat);
        meshArmL.position.y = -0.4;
        meshArmL.castShadow = true;
        this.limbs.armL.add(meshArmL);
        this.player.add(this.limbs.armL);

        this.limbs.armR = new THREE.Group();
        this.limbs.armR.position.set(0.62, 1.75, 0);
        const meshArmR = new THREE.Mesh(armGeo, hoodieMat);
        meshArmR.position.y = -0.4;
        meshArmR.castShadow = true;
        this.limbs.armR.add(meshArmR);
        this.player.add(this.limbs.armR);

        // Hands
        const handL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), skinMat);
        handL.position.y = -0.85;
        this.limbs.armL.add(handL);
        const handR = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), skinMat);
        handR.position.y = -0.85;
        this.limbs.armR.add(handR);

        // Legs
        const legGeo = new THREE.BoxGeometry(0.34, 0.95, 0.34);
        this.limbs.legL = new THREE.Group();
        this.limbs.legL.position.set(-0.28, 0.75, 0);
        const meshLegL = new THREE.Mesh(legGeo, pantsMat);
        meshLegL.position.y = -0.45;
        meshLegL.castShadow = true;
        this.limbs.legL.add(meshLegL);

        // Shoe L (Nike style)
        const shoeL = new THREE.Group();
        const shoeBaseL = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.22, 0.55), shoeWhite);
        shoeBaseL.position.set(0, -0.95, 0.02);
        const shoeStripeL = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.12, 0.2), shoeBlue);
        shoeStripeL.position.set(0, -0.9, -0.05);
        shoeL.add(shoeBaseL, shoeStripeL);
        this.limbs.legL.add(shoeL);
        this.player.add(this.limbs.legL);

        this.limbs.legR = new THREE.Group();
        this.limbs.legR.position.set(0.28, 0.75, 0);
        const meshLegR = new THREE.Mesh(legGeo, pantsMat);
        meshLegR.position.y = -0.45;
        meshLegR.castShadow = true;
        this.limbs.legR.add(meshLegR);

        const shoeR = new THREE.Group();
        const shoeBaseR = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.22, 0.55), shoeWhite);
        shoeBaseR.position.set(0, -0.95, 0.02);
        const shoeStripeR = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.12, 0.2), shoeBlue);
        shoeStripeR.position.set(0, -0.9, -0.05);
        shoeR.add(shoeBaseR, shoeStripeR);
        this.limbs.legR.add(shoeR);
        this.player.add(this.limbs.legR);

        // Shield
        this.shieldMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.6, 20, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.28, wireframe: true })
        );
        this.shieldMesh.visible = false;
        this.player.add(this.shieldMesh);

        this.scene.add(this.player);
    }

    // ========== TRAINS (بهتر و نزدیک‌تر به عکس) ==========
    createTrain(lane, type) {
        const group = new THREE.Group();
        const length = 14 + Math.random() * 12;
        const colors = [CONFIG.colors.trainRed, CONFIG.colors.trainYellow, CONFIG.colors.trainBlue];
        const color = colors[Math.floor(Math.random() * colors.length)];

        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: color, 
            metalness: 0.55, 
            roughness: 0.25 
        });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.7, roughness: 0.2 });
        const windowMat = new THREE.MeshStandardMaterial({ color: 0x1a2332, metalness: 0.9, roughness: 0.1 });

        // Main body
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.9, CONFIG.trainHeight, length), bodyMat);
        body.position.y = CONFIG.trainHeight / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);

        // Roof
        const roof = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.25, length + 0.2), 
            new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.6, roughness: 0.3 }));
        roof.position.y = CONFIG.trainHeight + 0.05;
        group.add(roof);

        // Front / back ends rounded look
        const front = new THREE.Mesh(new THREE.BoxGeometry(2.7, CONFIG.trainHeight * 0.85, 0.6), bodyMat);
        front.position.set(0, CONFIG.trainHeight * 0.45, length / 2 + 0.1);
        group.add(front);

        // Windows
        const winCount = Math.floor(length / 2.8);
        for (let i = 0; i < winCount; i++) {
            const z = -length/2 + 1.8 + i * 2.8;
            const wL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.15, 1.6), windowMat);
            wL.position.set(-1.46, CONFIG.trainHeight * 0.62, z);
            const wR = wL.clone();
            wR.position.x = 1.46;
            group.add(wL, wR);
        }

        // Side stripe
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.92, 0.25, length * 0.9), 
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }));
        stripe.position.y = CONFIG.trainHeight * 0.28;
        group.add(stripe);

        // Undercarriage
        const under = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.4, length * 0.9), darkMat);
        under.position.y = 0.25;
        group.add(under);

        let moveSpeed = 0;
        if (type === 'movingTowards') moveSpeed = -(CONFIG.baseSpeed + 1.4);
        if (type === 'movingWith') moveSpeed = CONFIG.baseSpeed - 0.25;

        group.position.set((lane - 1) * CONFIG.laneWidth, 0, -110);
        group.userData = { 
            type: 'train', 
            length, 
            moveSpeed, 
            height: CONFIG.trainHeight,
            climbable: true 
        };

        this.scene.add(group);
        this.entities.trains.push(group);
    }

    createBarrier(lane, barrierType) {
        const group = new THREE.Group();
        if (barrierType === 'high') {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.45, 0.5), 
                new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.4 }));
            bar.position.y = 1.55;
            bar.castShadow = true;
            const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.55), 
                new THREE.MeshStandardMaterial({ color: 0x444444 }));
            leg1.position.set(-1.05, 0.77, 0);
            const leg2 = leg1.clone(); leg2.position.x = 1.05;
            group.add(bar, leg1, leg2);
            group.userData = { type: 'barrier_high' };
        } else {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.05, 0.55), 
                new THREE.MeshStandardMaterial({ color: 0xe67e22, metalness: 0.3 }));
            bar.position.y = 0.55;
            bar.castShadow = true;
            group.add(bar);
            group.userData = { type: 'barrier_low' };
        }
        group.position.set((lane - 1) * CONFIG.laneWidth, 0, -110);
        this.scene.add(group);
        this.entities.barriers.push(group);
    }

    createCoin(x, y, z) {
        const geo = new THREE.CylinderGeometry(0.42, 0.42, 0.09, 20);
        const mat = new THREE.MeshStandardMaterial({ 
            color: 0xFFD700, 
            metalness: 0.95, 
            roughness: 0.15,
            emissive: 0x553300,
            emissiveIntensity: 0.25
        });
        const coin = new THREE.Mesh(geo, mat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(x, y, z);
        coin.castShadow = true;
        this.scene.add(coin);
        this.entities.coins.push(coin);
    }

    createPowerup(lane) {
        const type = Math.random() > 0.5 ? 'magnet' : 'shield';
        const color = type === 'magnet' ? 0xff2244 : 0x00e5ff;
        const group = new THREE.Group();
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), 
            new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.45 }));
        const glow = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.25, 1.25), 
            new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.28 }));
        group.add(box, glow);
        group.position.set((lane - 1) * CONFIG.laneWidth, 1.6, -110);
        group.userData = { type };
        this.scene.add(group);
        this.entities.powerups.push(group);
    }

    spawnLogic() {
        if (Math.random() < 0.032 + (this.state.speed * 0.0045)) {
            const lane = Math.floor(Math.random() * 3);
            let safe = true;
            for (let t of this.entities.trains) {
                if (Math.abs(t.position.x - ((lane-1)*CONFIG.laneWidth)) < 0.1 && t.position.z > -120) safe = false;
            }
            for (let b of this.entities.barriers) {
                if (Math.abs(b.position.x - ((lane-1)*CONFIG.laneWidth)) < 0.1 && b.position.z > -120) safe = false;
            }

            if (safe) {
                const r = Math.random();
                if (r < 0.42) {
                    const types = ['static', 'movingTowards', 'movingWith'];
                    this.createTrain(lane, types[Math.floor(Math.random()*3)]);
                    if (Math.random() > 0.4) {
                        for (let i = 0; i < 5; i++) 
                            this.createCoin((lane-1)*CONFIG.laneWidth, CONFIG.trainHeight + 0.55, -115 - i*2.4);
                    }
                } else if (r < 0.62) {
                    this.createBarrier(lane, 'high');
                    for (let i = 0; i < 3; i++) this.createCoin((lane-1)*CONFIG.laneWidth, 1.1, -112 - i*2);
                } else if (r < 0.82) {
                    this.createBarrier(lane, 'low');
                    for (let i = 0; i < 3; i++) this.createCoin((lane-1)*CONFIG.laneWidth, 2.1, -112 - i*2);
                } else if (r < 0.93) {
                    this.createPowerup(lane);
                } else {
                    for (let i = 0; i < 6; i++) this.createCoin((lane-1)*CONFIG.laneWidth, 1.1, -110 - i*2);
                }
            }
        }
    }

    // ========== PHYSICS ==========
    updatePhysics() {
        this.player.position.x += (this.state.targetX - this.player.position.x) * 0.16;
        this.player.rotation.z = (this.state.targetX - this.player.position.x) * -0.09;

        this.player.position.y += this.state.velY;
        this.state.velY -= CONFIG.gravity;

        let onTrainSurface = false;
        let currentTrainHeight = 0;
        let hitTrainSide = false;

        for (let t of this.entities.trains) {
            const dz = t.position.z - this.player.position.z;
            const dx = Math.abs(t.position.x - this.player.position.x);
            
            if (dx < 1.55) {
                if (dz < t.userData.length/2 && dz > -t.userData.length/2) {
                    if (this.player.position.y >= t.userData.height - 0.55) {
                        onTrainSurface = true;
                        currentTrainHeight = t.userData.height;
                    } else if (dz > 0 && dz < t.userData.length/2 + 1.1) {
                        if (this.state.isJumping && this.player.position.y > t.userData.height - 1.6) {
                            this.player.position.y = t.userData.height;
                            this.state.velY = 0;
                            this.state.isJumping = false;
                            onTrainSurface = true;
                            currentTrainHeight = t.userData.height;
                        } else {
                            hitTrainSide = true;
                        }
                    }
                }
            }
        }

        if (hitTrainSide) {
            this.crash();
            return;
        }

        if (onTrainSurface) {
            if (this.player.position.y <= currentTrainHeight) {
                this.player.position.y = currentTrainHeight;
                this.state.velY = 0;
                this.state.isJumping = false;
            }
        } else {
            if (this.player.position.y <= 0) {
                this.player.position.y = 0;
                this.state.velY = 0;
                this.state.isJumping = false;
            }
        }

        if (this.state.isRolling) {
            this.player.scale.y = 0.48;
            this.state.rollTimer--;
            if (this.state.rollTimer <= 0) {
                this.state.isRolling = false;
                this.player.scale.y = 1;
            }
        }

        // Running animation
        if (!this.state.isJumping && !this.state.isRolling) {
            const t = Date.now() * 0.016 * (this.state.speed / CONFIG.baseSpeed);
            this.limbs.legL.rotation.x = Math.sin(t) * 0.85;
            this.limbs.legR.rotation.x = -Math.sin(t) * 0.85;
            this.limbs.armL.rotation.x = -Math.sin(t) * 0.75;
            this.limbs.armR.rotation.x = Math.sin(t) * 0.75;
            if (!onTrainSurface) this.player.position.y = Math.abs(Math.sin(t * 2)) * 0.08;
        } else if (this.state.isJumping) {
            this.limbs.legL.rotation.x = -0.55;
            this.limbs.legR.rotation.x = 0.25;
            this.limbs.armL.rotation.x = -2.4;
            this.limbs.armR.rotation.x = -2.4;
        } else if (this.state.isRolling) {
            this.limbs.legL.rotation.x = 1.4;
            this.limbs.legR.rotation.x = 1.4;
            this.limbs.armL.rotation.x = 0.3;
            this.limbs.armR.rotation.x = 0.3;
        }

        const speed = this.state.speed;

        // Move trains
        for (let i = this.entities.trains.length - 1; i >= 0; i--) {
            let t = this.entities.trains[i];
            t.position.z += speed + t.userData.moveSpeed;
            if (t.position.z > 25) {
                this.scene.remove(t);
                this.entities.trains.splice(i, 1);
            }
        }

        // Barriers
        for (let i = this.entities.barriers.length - 1; i >= 0; i--) {
            let b = this.entities.barriers[i];
            b.position.z += speed;
            const dz = Math.abs(b.position.z - this.player.position.z);
            const dx = Math.abs(b.position.x - this.player.position.x);
            if (dz < 1.05 && dx < 1.25) {
                if (b.userData.type === 'barrier_high' && !this.state.isRolling) this.crash();
                if (b.userData.type === 'barrier_low' && this.player.position.y < 1.05) this.crash();
            }
            if (b.position.z > 22) {
                this.scene.remove(b);
                this.entities.barriers.splice(i, 1);
            }
        }

        // Coins
        for (let i = this.entities.coins.length - 1; i >= 0; i--) {
            let c = this.entities.coins[i];
            c.position.z += speed;
            c.rotation.z += 0.12;

            if (this.state.activePowerups.magnet > 0) {
                const dist = c.position.distanceTo(this.player.position);
                if (dist < 13) {
                    const dir = new THREE.Vector3().subVectors(this.player.position, c.position).normalize();
                    c.position.add(dir.multiplyScalar(0.9));
                }
            }

            const playerBox = new THREE.Vector3(this.player.position.x, this.player.position.y + 1.1, this.player.position.z);
            if (c.position.distanceTo(playerBox) < 1.6) {
                this.state.coins++;
                this.state.score += 5;
                this.updateUI();
                this.scene.remove(c);
                this.entities.coins.splice(i, 1);
            } else if (c.position.z > 12) {
                this.scene.remove(c);
                this.entities.coins.splice(i, 1);
            }
        }

        // Powerups
        for (let i = this.entities.powerups.length - 1; i >= 0; i--) {
            let p = this.entities.powerups[i];
            p.position.z += speed;
            p.rotation.y += 0.06;
            if (p.children[1]) p.children[1].rotation.y -= 0.06;

            if (p.position.distanceTo(this.player.position) < 1.6) {
                this.activatePowerup(p.userData.type);
                this.scene.remove(p);
                this.entities.powerups.splice(i, 1);
            } else if (p.position.z > 12) {
                this.scene.remove(p);
                this.entities.powerups.splice(i, 1);
            }
        }

        if (this.state.activePowerups.magnet > 0) {
            this.state.activePowerups.magnet--;
            if (this.state.activePowerups.magnet <= 0) 
                document.getElementById('pu-magnet').style.display = 'none';
        }

        // Track loop
        this.trackGroup.position.z += speed;
        if (this.trackGroup.position.z > 3.8) this.trackGroup.position.z = 0;

        // Move buildings slowly for parallax
        for (let b of this.buildings) {
            b.position.z += speed * 0.15;
            if (b.position.z > 40) b.position.z -= 400;
        }

        this.state.speed = Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + (this.state.score * 0.00018));
        this.state.score += this.state.speed * 0.1;
        this.updateUI();
    }

    activatePowerup(type) {
        if (type === 'magnet') {
            this.state.activePowerups.magnet = 650;
            document.getElementById('pu-magnet').style.display = 'block';
        } else if (type === 'shield') {
            this.state.activePowerups.shield = true;
            this.shieldMesh.visible = true;
            document.getElementById('pu-shield').style.display = 'block';
        }
    }

    crash() {
        if (this.state.activePowerups.shield) {
            this.state.activePowerups.shield = false;
            this.shieldMesh.visible = false;
            document.getElementById('pu-shield').style.display = 'none';
            [...this.entities.trains, ...this.entities.barriers].forEach(o => o.position.z += 12);
        } else {
            this.gameOver();
        }
    }

    // ========== CONTROLS ==========
    setupInputs() {
        window.addEventListener('keydown', (e) => {
            if (!this.state.isPlaying) return;
            if (e.key === 'ArrowLeft') this.moveLane(-1);
            if (e.key === 'ArrowRight') this.moveLane(1);
            if (e.key === 'ArrowUp') this.jump();
            if (e.key === 'ArrowDown') this.roll();
        });

        let tx = 0, ty = 0;
        document.addEventListener('touchstart', e => { 
            tx = e.changedTouches[0].screenX; 
            ty = e.changedTouches[0].screenY; 
        }, {passive: false});
        
        document.addEventListener('touchend', e => {
            if (!this.state.isPlaying) return;
            const dx = e.changedTouches[0].screenX - tx;
            const dy = e.changedTouches[0].screenY - ty;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 35) this.moveLane(1); 
                else if (dx < -35) this.moveLane(-1);
            } else {
                if (dy < -35) this.jump(); 
                else if (dy > 35) this.roll();
            }
        }, {passive: false});
    }

    moveLane(dir) {
        this.state.lane = Math.max(0, Math.min(2, this.state.lane + dir));
        this.state.targetX = (this.state.lane - 1) * CONFIG.laneWidth;
    }

    jump() {
        if (!this.state.isJumping) {
            this.state.velY = CONFIG.jumpForce;
            this.state.isJumping = true;
            this.state.isRolling = false;
            this.player.scale.y = 1;
        }
    }

    roll() {
        if (!this.state.isRolling) {
            this.state.isRolling = true;
            this.state.rollTimer = 42;
            if (this.state.isJumping) this.state.velY = -0.85;
        }
    }

    // ========== GAME FLOW ==========
    start() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        
        this.state.isPlaying = true;
        this.state.score = 0;
        this.state.speed = CONFIG.baseSpeed;
        this.state.lane = 1;
        this.state.targetX = 0;
        this.state.velY = 0;
        this.state.isJumping = false;
        this.state.isRolling = false;
        this.player.position.set(0, 0, 0);
        this.player.scale.y = 1;
        
        if (this.state.inventory.magnet > 0) { 
            this.activatePowerup('magnet'); 
            this.state.inventory.magnet--; 
        }
        if (this.state.inventory.shield > 0) { 
            this.activatePowerup('shield'); 
            this.state.inventory.shield--; 
        }

        [...this.entities.trains, ...this.entities.barriers, ...this.entities.coins, ...this.entities.powerups]
            .forEach(o => this.scene.remove(o));
        this.entities = { trains: [], barriers: [], coins: [], powerups: [] };
        
        this.updateUI();
    }

    gameOver() {
        this.state.isPlaying = false;
        localStorage.setItem('subway_pro_v2_coins', this.state.coins);
        document.getElementById('final-score').innerText = Math.floor(this.state.score);
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    showMenu() {
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        this.updateUI();
    }

    openShop() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('shop-modal').classList.remove('hidden');
        this.updateShopUI();
    }

    closeShop() {
        document.getElementById('shop-modal').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    buyItem(item, cost) {
        if (this.state.coins >= cost) {
            this.state.coins -= cost;
            this.state.inventory[item]++;
            localStorage.setItem('subway_pro_v2_coins', this.state.coins);
            this.updateShopUI();
            this.updateUI();
        }
    }

    updateUI() {
        document.getElementById('score').innerText = Math.floor(this.state.score);
        document.getElementById('coins').innerText = this.state.coins;
    }

    updateShopUI() {
        document.getElementById('shop-coins').innerText = this.state.coins;
        document.getElementById('buy-magnet').disabled = this.state.coins < 50;
        document.getElementById('buy-shield').disabled = this.state.coins < 100;
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        if (this.state.isPlaying) {
            this.updatePhysics();
            this.spawnLogic();
        }
        // Camera follow
        this.camera.position.x += (this.player.position.x * 0.35 - this.camera.position.x) * 0.08;
        this.camera.lookAt(this.player.position.x * 0.3, 2.2, this.player.position.z - 12);
        this.renderer.render(this.scene, this.camera);
    }
}

// Init
const game = new SubwayGame();

document.getElementById('start-btn').onclick = () => game.start();
document.getElementById('retry-btn').onclick = () => game.start();
document.getElementById('menu-btn').onclick = () => game.showMenu();
document.getElementById('shop-btn').onclick = () => game.openShop();
document.getElementById('close-shop').onclick = () => game.closeShop();
document.getElementById('buy-magnet').onclick = () => game.buyItem('magnet', 50);
document.getElementById('buy-shield').onclick = () => game.buyItem('shield', 100);
</script>
