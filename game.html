<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D - Ultimate</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Tahoma', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Styles */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hud {
            display: flex; justify-content: space-between; padding: 20px;
            color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .box {
            background: rgba(0, 0, 0, 0.3); padding: 10px 20px; border-radius: 15px;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* Menus */
        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto; z-index: 10;
            backdrop-filter: blur(3px);
        }
        h1 { color: #FFD700; font-size: 45px; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        p { color: #fff; font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
        
        button {
            background: linear-gradient(45deg, #FF4500, #FF8C00); border: none; padding: 15px 50px;
            color: white; font-size: 26px; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.4); transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Tahoma', sans-serif; font-weight: bold; outline: none;
        }
        button:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(255, 69, 0, 0.4); }
        .hidden { display: none !important; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud">
            <div class="box">امتیاز: <span id="score">0</span></div>
            <div class="box">سکه: <span id="coins">0</span></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="menu-screen">
        <h1>Subway Pro 3D</h1>
        <p>نسخه نهایی - گرافیک بالا</p>
        <button id="start-btn">شروع دویدن</button>
        <p style="font-size: 14px; margin-top: 20px; opacity: 0.7;">کنترل: Swipe (موبایل) یا Arrow Keys (کیبورد)</p>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="menu-screen hidden">
        <h1>GAME OVER</h1>
        <p>امتیاز نهایی: <span id="final-score">0</span></p>
        <button id="retry-btn">تلاش مجدد</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const LANE_WIDTH = 2.5;
        const SPEED_START = 0.4;
        const SPEED_MAX = 1.2;
        const JUMP_FORCE = 0.35;
        const GRAVITY = 0.018;
        
        // --- VARIABLES ---
        let scene, camera, renderer;
        let player, playerGroup;
        let obstacles = [];
        let coins = [];
        let particles = [];
        let buildings = [];
        
        let currentLane = 1; // 0: Left, 1: Center, 2: Right
        let targetX = 0;
        let velocityY = 0;
        let isJumping = false;
        let isGameOver = false;
        let isGameActive = false;
        let gameSpeed = SPEED_START;
        let score = 0;
        let coinCount = 0;
        let frameId;
        let distanceTraveled = 0;

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const coinsEl = document.getElementById('coins');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        // --- INITIALIZATION ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3, 6);
            camera.lookAt(0, 0, -5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            scene.add(dirLight);

            // Create World
            createPlayer();
            createEnvironment();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleInput);
            
            // Touch Controls
            let touchStartX = 0;
            let touchStartY = 0;
            document.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: false});
            
            document.addEventListener('touchend', e => {
                if(!isGameActive) return;
                let touchEndX = e.changedTouches[0].screenX;
                let touchEndY = e.changedTouches[0].screenY;
                handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
            }, {passive: false});

            // Buttons
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('retry-btn').addEventListener('click', resetGame);

            // Start Loop
            animate();
        }

        // --- OBJECT CREATION ---

        function createPlayer() {
            playerGroup = new THREE.Group();

            // Body (Hoodie)
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x222222 }); // Black/Dark Grey
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            playerGroup.add(body);

            // Head
            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const headMat = new THREE.MeshLambertMaterial({ color: 0xffccaa }); // Skin
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.4;
            head.castShadow = true;
            playerGroup.add(head);

            // Cap
            const capGeo = new THREE.BoxGeometry(0.55, 0.2, 0.55);
            const capMat = new THREE.MeshLambertMaterial({ color: 0x0066ff }); // Blue Cap
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.position.y = 1.65;
            cap.position.z = -0.05;
            playerGroup.add(cap);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const legMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.2, 0, 0); // Will animate later if needed
            playerGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.2, 0, 0);
            playerGroup.add(rightLeg);

            scene.add(playerGroup);
            player = playerGroup;
        }

        function createEnvironment() {
            // Ground (Tracks area)
            const groundGeo = new THREE.PlaneGeometry(20, 200);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -50;
            ground.receiveShadow = true;
            scene.add(ground);

            // Rails
            for(let i=-1; i<=1; i++) {
                const railGeo = new THREE.PlaneGeometry(0.2, 200);
                const railMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.rotation.x = -Math.PI / 2;
                rail.position.set(i * LANE_WIDTH, 0.01, -50);
                scene.add(rail);
                
                // Sleepers
                for(let j=0; j<40; j++) {
                    const sleeperGeo = new THREE.BoxGeometry(0.4, 0.1, 2);
                    const sleeperMat = new THREE.MeshLambertMaterial({ color: 0x3e2723 });
                    const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
                    sleeper.position.set(i * LANE_WIDTH, 0.05, -j * 5);
                    // We won't add all to scene to save perf, just visual cues
                    if(i===0) scene.add(sleeper); 
                }
            }

            // Buildings (Simple blocks on sides)
            const buildingColors = [0xff6b6b, 0x4ecdc4, 0xffd93d, 0xc7f464];
            for(let i=0; i<20; i++) {
                const h = 5 + Math.random() * 10;
                const geo = new THREE.BoxGeometry(4, h, 4);
                const mat = new THREE.MeshLambertMaterial({ color: buildingColors[Math.floor(Math.random()*buildingColors.length)] });
                
                // Left side
                const bLeft = new THREE.Mesh(geo, mat);
                bLeft.position.set(-6 - Math.random()*2, h/2, -i * 10);
                scene.add(bLeft);
                buildings.push(bLeft);

                // Right side
                const bRight = new THREE.Mesh(geo, mat);
                bRight.position.set(6 + Math.random()*2, h/2, -i * 10);
                scene.add(bRight);
                buildings.push(bRight);
            }
        }

        function spawnObstacle() {
            if (!isGameActive) return;

            const lane = Math.floor(Math.random() * 3);
            const type = Math.random() > 0.3 ? 'train' : 'barrier';
            let mesh;

            if (type === 'train') {
                // Train
                const length = 8 + Math.random() * 8;
                const geo = new THREE.BoxGeometry(2.2, 3, length);
                const colors = [0xff0000, 0xffff00, 0x0000ff]; // Red, Yellow, Blue
                const mat = new THREE.MeshPhongMaterial({ color: colors[Math.floor(Math.random()*colors.length)] });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 1.5;
                mesh.userData = { type: 'train', passable: false };
                
                // Add details to train (windows)
                const winGeo = new THREE.BoxGeometry(2.3, 1, 1);
                const winMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                for(let w=0; w<length/2; w++) {
                    const win = new THREE.Mesh(winGeo, winMat);
                    win.position.set(0, 0.5, -length/2 + 1 + w*2);
                    mesh.add(win);
                }

            } else {
                // Barrier
                const geo = new THREE.BoxGeometry(2.2, 1, 0.5);
                const mat = new THREE.MeshLambertMaterial({ color: 0xffaa00 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 0.5;
                mesh.userData = { type: 'barrier', passable: false }; // Can jump over
            }

            mesh.position.x = (lane - 1) * LANE_WIDTH;
            mesh.position.z = -60;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            scene.add(mesh);
            obstacles.push(mesh);

            // Spawn Coins
            if (Math.random() > 0.4) {
                spawnCoins(lane);
            }
        }

        function spawnCoins(laneIndex) {
            const count = 3 + Math.floor(Math.random() * 3);
            for(let i=0; i<count; i++) {
                const geo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });
                const coin = new THREE.Mesh(geo, mat);
                
                coin.rotation.x = Math.PI / 2;
                coin.position.set((laneIndex - 1) * LANE_WIDTH, 1.5, -65 - (i * 2.5));
                
                scene.add(coin);
                coins.push(coin);
            }
        }

        // --- GAME LOGIC ---

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            resetVariables();
            isGameActive = true;
            isGameOver = false;
        }

        function resetVariables() {
            score = 0;
            coinCount = 0;
            gameSpeed = SPEED_START;
            currentLane = 1;
            targetX = 0;
            player.position.set(0, 0, 0);
            velocityY = 0;
            isJumping = false;
            distanceTraveled = 0;

            // Clear objects
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            coins.forEach(c => scene.remove(c));
            coins = [];
            
            updateUI();
        }

        function resetGame() {
            startGame();
        }

        function gameOver() {
            isGameActive = false;
            isGameOver = true;
            finalScoreEl.innerText = Math.floor(score);
            gameOverScreen.classList.remove('hidden');
        }

        function updateUI() {
            scoreEl.innerText = Math.floor(score);
            coinsEl.innerText = coinCount;
        }

        function handleInput(e) {
            if (!isGameActive) return;
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'ArrowUp') jump();
        }

        function handleSwipe(startX, startY, endX, endY) {
            const diffX = endX - startX;
            const diffY = endY - startY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal
                if (diffX > 30) moveRight(); // Swipe Right (RTL logic check: usually swipe right moves right)
                else if (diffX < -30) moveLeft();
            } else {
                // Vertical
                if (diffY < -30) jump(); // Swipe Up
            }
        }

        function moveLeft() {
            if (currentLane > 0) {
                currentLane--;
                targetX = (currentLane - 1) * LANE_WIDTH;
            }
        }

        function moveRight() {
            if (currentLane < 2) {
                currentLane++;
                targetX = (currentLane - 1) * LANE_WIDTH;
            }
        }

        function jump() {
            if (!isJumping) {
                velocityY = JUMP_FORCE;
                isJumping = true;
            }
        }

        // --- MAIN LOOP ---

        function animate() {
            requestAnimationFrame(animate);

            if (isGameActive) {
                // Increase speed
                if (gameSpeed < SPEED_MAX) gameSpeed += 0.0001;
                
                // Score
                score += gameSpeed * 0.5;
                distanceTraveled += gameSpeed;
                updateUI();

                // Player Movement (Smooth Lane Switch)
                player.position.x += (targetX - player.position.x) * 0.2;

                // Jump Physics
                player.position.y += velocityY;
                velocityY -= GRAVITY;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    velocityY = 0;
                    isJumping = false;
                }

                // Animate Player (Bobbing)
                if (!isJumping) {
                    player.position.y = Math.abs(Math.sin(Date.now() * 0.015)) * 0.2;
                }

                // Move Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed;

                    // Collision Detection
                    // Simple AABB
                    const dz = Math.abs(obs.position.z - player.position.z);
                    const dx = Math.abs(obs.position.x - player.position.x);
                    
                    if (dz < 1.5 && dx < 1.0) {
                        // Check if jumping over barrier
                        if (obs.userData.type === 'barrier' && player.position.y > 1.0) {
                            // Safe
                        } else {
                            gameOver();
                        }
                    }

                    // Remove if behind camera
                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Move Coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    let c = coins[i];
                    c.position.z += gameSpeed;
                    c.rotation.z += 0.1; // Spin

                    // Collection
                    const dz = Math.abs(c.position.z - player.position.z);
                    const dx = Math.abs(c.position.x - player.position.x);
                    const dy = Math.abs(c.position.y - (player.position.y + 1)); // Player center approx

                    if (dz < 1.0 && dx < 1.0 && dy < 1.5) {
                        coinCount++;
                        score += 10;
                        scene.remove(c);
                        coins.splice(i, 1);
                        updateUI();
                    } else if (c.position.z > 10) {
                        scene.remove(c);
                        coins.splice(i, 1);
                    }
                }

                // Move Environment (Illusion of speed)
                buildings.forEach(b => {
                    b.position.z += gameSpeed;
                    if (b.position.z > 10) {
                        b.position.z = -100; // Reset far away
                    }
                });

                // Spawning Logic
                if (Math.random() < 0.03) { // Adjust spawn rate
                    // Ensure we don't spawn too close
                    let canSpawn = true;
                    if(obstacles.length > 0) {
                        const lastObs = obstacles[obstacles.length-1];
                        if(lastObs.position.z < -40) canSpawn = true; // Wait until last one is far enough? No, z is negative far away.
                        // Actually, objects move from -60 to +10.
                        // So if last object is at -50, it's too close to spawn new one at -60.
                        if(lastObs.position.z < -45) canSpawn = false; 
                    }
                    if(canSpawn) spawnObstacle();
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        init();

    </script>
</body>
</html>
