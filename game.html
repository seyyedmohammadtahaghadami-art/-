<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner Ultimate - Real 3D Experience</title>
    <style>
        /* --- CSS STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap');

        :root {
            --primary: #FFD700;
            --secondary: #FF4757;
            --dark: #2f3542;
            --light: #f1f2f6;
            --glass: rgba(255, 255, 255, 0.1);
            --neon-blue: #00d2d3;
            --neon-pink: #ff9ff3;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Vazirmatn', sans-serif;
            color: white;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYERS --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        /* --- HUD --- */
        #hud {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            font-family: 'Lalezar', cursive;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: skewX(-10deg);
        }

        .hud-panel span {
            transform: skewX(10deg);
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 15px #ffd700;
        }

        /* --- MENUS --- */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(15px);
        }

        h1 {
            font-family: 'Lalezar', cursive;
            font-size: 80px;
            margin: 0;
            background: linear-gradient(to bottom, #ffd700, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(255, 107, 129, 0.5));
            text-align: center;
            line-height: 1;
            transform: scale(1.1) rotate(-2deg);
        }

        h2 {
            font-family: 'Lalezar', cursive;
            color: #dfe4ea;
            margin-bottom: 40px;
            font-weight: normal;
            font-size: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 350px;
        }

        .game-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            padding: 15px;
            border-radius: 50px;
            color: white;
            font-family: 'Lalezar', cursive;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 10px 0 #c0392b, 0 20px 30px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-btn:active {
            top: 10px;
            box-shadow: 0 0 0 #c0392b, 0 5px 10px rgba(0,0,0,0.5);
        }

        .game-btn.secondary {
            background: linear-gradient(135deg, #2ed573, #7bed9f);
            box-shadow: 0 10px 0 #27ae60, 0 20px 30px rgba(0,0,0,0.5);
        }
        .game-btn.secondary:active {
            box-shadow: 0 0 0 #27ae60, 0 5px 10px rgba(0,0,0,0.5);
        }

        .game-btn.shop {
            background: linear-gradient(135deg, #1e90ff, #70a1ff);
            box-shadow: 0 10px 0 #2980b9, 0 20px 30px rgba(0,0,0,0.5);
        }
        .game-btn.shop:active {
            box-shadow: 0 0 0 #2980b9, 0 5px 10px rgba(0,0,0,0.5);
        }

        /* --- LOADING --- */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e272e;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-bar-bg {
            width: 300px;
            height: 15px;
            background: #57606f;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
            border: 2px solid #2f3542;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .loader-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b81, #1e90ff);
            background-size: 200% 100%;
            animation: loadingAnim 1s linear infinite;
            transition: width 0.2s;
        }

        @keyframes loadingAnim {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- SHOP MODAL --- */
        .modal-content {
            background: #2f3542;
            padding: 40px;
            border-radius: 30px;
            border: 4px solid #57606f;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .shop-item {
            background: #57606f;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .shop-item:hover {
            background: #747d8c;
            transform: translateY(-5px);
        }

        .shop-item.selected {
            border-color: #ffd700;
            background: #2f3542;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .item-preview {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #2f3542;
        }
        ::-webkit-scrollbar-thumb {
            background: #57606f;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #747d8c;
        }

    </style>
</head>
<body>

<div id="game-container">
    <!-- LOADING -->
    <div id="loading-screen">
        <h1 style="font-size: 60px;">SUBWAY RUNNER</h1>
        <div class="loader-bar-bg"><div class="loader-bar-fill" id="loader-bar"></div></div>
        <p style="margin-top: 20px; color: #aaa; font-family: 'Lalezar'; font-size: 20px;">در حال بارگذاری موتور گرافیکی...</p>
    </div>

    <!-- CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="ui-layer hidden">
        <div class="hud-panel">
            <span>امتیاز:</span> <span id="score-display">0</span>
        </div>
        <div class="hud-panel">
            <div class="coin-icon"></div> <span id="coin-display">0</span>
        </div>
        <div class="hud-panel" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%) skewX(-10deg); font-size: 18px; opacity: 0.9;">
            <span>رکورد: <span id="highscore-display">0</span></span>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="menu-screen interactive">
        <h1>SUBWAY<br>RUNNER</h1>
        <h2>نسخه نهایی و حرفه‌ای</h2>
        <div class="btn-grid">
            <button class="game-btn secondary" onclick="Game.start()">شروع بازی</button>
            <button class="game-btn shop" onclick="UI.openShop()">فروشگاه</button>
            <button class="game-btn" onclick="UI.openSettings()">تنظیمات</button>
        </div>
        <div style="position: absolute; bottom: 30px; color: rgba(255,255,255,0.4); font-size: 14px;">
            Swipe یا کلیدهای جهت‌دار برای حرکت
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="game-over" class="menu-screen interactive hidden">
        <h1 style="color: #ff4757; -webkit-text-fill-color: #ff4757;">GAME OVER</h1>
        <h2>امتیاز نهایی: <span id="final-score">0</span></h2>
        <div class="btn-grid">
            <button class="game-btn secondary" onclick="Game.restart()">تلاش مجدد</button>
            <button class="game-btn" onclick="UI.showMainMenu()">منوی اصلی</button>
        </div>
    </div>

    <!-- SHOP MODAL -->
    <div id="shop-modal" class="menu-screen interactive hidden">
        <div class="modal-content">
            <h2 style="color: #ffd700; margin: 0; font-size: 36px;">فروشگاه</h2>
            <p style="color: #ccc; font-size: 18px;">شخصیت و اسکین خود را انتخاب کنید</p>
            <div class="shop-grid" id="shop-items">
                <!-- Generated by JS -->
            </div>
            <button class="game-btn" style="margin-top: 30px; width: 100%;" onclick="UI.closeShop()">بستن</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="menu-screen interactive hidden">
        <div class="modal-content">
            <h2 style="font-size: 36px;">تنظیمات</h2>
            <div style="text-align: right; margin: 30px 0; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px;">
                <label style="display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; font-size: 18px;">
                    <span>کیفیت گرافیک</span>
                    <select id="quality-select" style="padding: 10px; border-radius: 8px; background: #57606f; color: white; border: none; font-family: 'Vazirmatn';">
                        <option value="low">پایین (سریع)</option>
                        <option value="high" selected>بالا (زیبا)</option>
                    </select>
                </label>
                <label style="display: flex; justify-content: space-between; align-items: center; font-size: 18px;">
                    <span>صدای بازی</span>
                    <input type="checkbox" id="sound-toggle" checked style="width: 25px; height: 25px; accent-color: #ff4757;">
                </label>
            </div>
            <button class="game-btn" style="width: 100%;" onclick="UI.closeSettings()">ذخیره و بستن</button>
        </div>
    </div>
</div>

<script>
/**
 * SUBWAY RUNNER ULTIMATE - HIGH FIDELITY ENGINE
 * 
 * This engine uses a custom Pseudo-3D projection system to render
 * a world that looks like Subway Surfers using only HTML5 Canvas.
 * 
 * Features:
 * - 3-Lane System with smooth interpolation
 * - Perspective Projection (Vanishing Point)
 * - Procedural Graphics (Trains, Buildings, Graffiti)
 * - Particle System (Coins, Sparks)
 * - Object Pooling
 * - Full UI System
 * - Local Storage
 */

// --- CONFIGURATION ---
const CONFIG = {
    fps: 60,
    laneWidth: 130, // Distance between lanes
    segmentLength: 200, // Length of road segment
    drawDistance: 200, // How far to see
    fieldOfView: 100,
    cameraHeight: 1000,
    cameraDepth: null, // Calculated
    speed: {
        start: 400,
        max: 1200,
        accel: 15
    },
    colors: {
        skyTop: '#4facfe',
        skyBottom: '#00f2fe',
        grass: ['#2ed573', '#26de81'],
        road: ['#57606f', '#2f3542'],
        rumble: ['#ff4757', '#ffffff'],
        laneMarker: '#ffffff',
        building: ['#ff6b81', '#7bed9f', '#70a1ff', '#ffa502', '#a4b0be', '#ff9ff3']
    }
};

// --- UTILS ---
const Utils = {
    randomInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
    randomChoice: (arr) => arr[Math.floor(Math.random() * arr.length)],
    interpolate: (a, b, t) => a + (b - a) * t,
    clamp: (val, min, max) => Math.max(min, Math.min(max, val)),
    
    // 3D Projection
    project: (p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) => {
        p.camera.x = (p.world.x || 0) - cameraX;
        p.camera.y = (p.world.y || 0) - cameraY;
        p.camera.z = (p.world.z || 0) - cameraZ;
        
        if (p.camera.z <= 0) p.camera.z = 0.1;

        p.screen.scale = cameraDepth / p.camera.z;
        p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
        p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
        p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
    },

    overlap: (x1, w1, x2, w2, percent = 1) => {
        const half = (percent || 1) / 2;
        const min1 = x1 - (w1 * half);
        const max1 = x1 + (w1 * half);
        const min2 = x2 - (w2 * half);
        const max2 = x2 + (w2 * half);
        return !((max1 < min2) || (min1 > max2));
    }
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    enabled: true,
    init: function() {
        if (!this.ctx) {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    playTone: function(freq, type, duration, vol = 0.1) {
        if (!this.enabled || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    },
    playCoin: function() { 
        this.playTone(1200, 'sine', 0.1, 0.1); 
        setTimeout(() => this.playTone(1800, 'sine', 0.2, 0.1), 50); 
    },
    playCrash: function() { 
        this.playTone(100, 'sawtooth', 0.5, 0.3); 
        this.playTone(50, 'square', 0.5, 0.3);
    },
    playJump: function() { 
        if (!this.enabled || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(300, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        } catch(e) {}
    }
};

// --- PARTICLE SYSTEM ---
class Particle {
    constructor(x, y, z, color) {
        this.x = x;
        this.y = y;
        this.z = z;
        this.vx = (Math.random() - 0.5) * 400;
        this.vy = (Math.random() * 400) + 200;
        this.vz = (Math.random() - 0.5) * 400;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 50 + 30;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.z += this.vz * dt;
        this.vy -= 2000 * dt; // Gravity
        this.life -= dt * 1.5;
    }
}

class ParticleSystem {
    constructor() {
        this.particles = [];
    }
    emit(x, y, z, color, count = 15) {
        for(let i=0; i<count; i++) {
            this.particles.push(new Particle(x, y, z, color));
        }
    }
    update(dt) {
        for(let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if(this.particles[i].life <= 0) this.particles.splice(i, 1);
        }
    }
    render(ctx, camera, width, height) {
        this.particles.forEach(p => {
            const relZ = p.z - camera.z;
            if (relZ <= 0) return;
            
            const scale = CONFIG.cameraDepth / relZ;
            const screenX = (width / 2) + (scale * (p.x - camera.x) * width / 2);
            const screenY = (height / 2) - (scale * (p.y - (camera.y - CONFIG.cameraHeight)) * height / 2);
            const size = scale * p.size * width / 2;
            
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(screenX, screenY, size/2, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });
    }
}

// --- GAME OBJECTS ---
class GameObject {
    constructor(type, lane, z) {
        this.type = type; // 'train', 'barrier_low', 'barrier_high', 'coin'
        this.lane = lane; // -1, 0, 1
        this.z = z;
        this.active = true;
        this.width = 90;
        this.height = 90;
        this.length = 200;
        this.y = 0;
        
        this.color = '#ff4757';
        this.trainColor = '#2f3542';

        if (type === 'coin') {
            this.width = 50;
            this.height = 50;
            this.y = 70;
            this.color = '#ffd700';
            this.bobOffset = Math.random() * Math.PI * 2;
        } else if (type === 'train') {
            this.width = 100;
            this.height = 180;
            this.length = 1000; // Very long
            this.trainColor = Utils.randomChoice(['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6']);
        } else if (type === 'barrier_low') {
            this.height = 60;
            this.length = 50;
            this.color = '#ffa502';
        } else if (type === 'barrier_high') {
            this.y = 120;
            this.height = 70;
            this.length = 50;
            this.color = '#ff6b81';
        }
    }

    update(dt, speed) {
        this.z -= speed * dt;
        if (this.type === 'coin') this.bobOffset += dt * 6;
    }

    getAABB() {
        return {
            x: this.lane * CONFIG.laneWidth,
            y: this.y,
            z: this.z,
            w: this.width,
            h: this.height,
            l: this.length
        };
    }
}

// --- PLAYER ---
class Player {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.z = 0;
        this.lane = 0;
        this.targetLane = 0;
        this.vy = 0;
        this.isJumping = false;
        this.isSliding = false;
        this.slideTimer = 0;
        this.width = 70;
        this.height = 140;
        this.color = '#1e90ff';
        this.tilt = 0;
    }

    update(dt) {
        const targetX = this.targetLane * CONFIG.laneWidth;
        this.x = Utils.interpolate(this.x, targetX, dt * 15);
        this.tilt = (targetX - this.x) * 0.003;

        if (this.isJumping) {
            this.y += this.vy * dt;
            this.vy -= 3000 * dt;
            if (this.y <= 0) {
                this.y = 0;
                this.vy = 0;
                this.isJumping = false;
            }
        }

        if (this.isSliding) {
            this.slideTimer -= dt;
            this.height = 70;
            if (this.slideTimer <= 0) {
                this.isSliding = false;
                this.height = 140;
            }
        } else {
            this.height = 140;
        }
    }

    jump() {
        if (!this.isJumping && !this.isSliding) {
            this.vy = 1100;
            this.isJumping = true;
            AudioSys.playJump();
        }
    }

    slide() {
        if (!this.isJumping && !this.isSliding) {
            this.isSliding = true;
            this.slideTimer = 0.8;
        } else if (this.isJumping) {
            this.vy = -2000;
        }
    }

    move(dir) {
        this.targetLane += dir;
        this.targetLane = Utils.clamp(this.targetLane, -1, 1);
    }
}

// --- MAIN GAME ENGINE ---
const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    state: 'MENU',
    
    segments: [],
    objects: [],
    buildings: [],
    player: null,
    particles: null,
    
    score: 0,
    coins: 0,
    highScore: localStorage.getItem('sr_highscore') || 0,
    totalCoins: parseInt(localStorage.getItem('sr_totalcoins')) || 0,
    speed: 0,
    distance: 0,
    
    quality: 'high',

    init: function() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.particles = new ParticleSystem();
        this.player = new Player();
        
        const savedSkin = localStorage.getItem('sr_skin');
        if (savedSkin) this.player.color = savedSkin;

        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.setupInput();
        
        CONFIG.cameraDepth = 1 / Math.tan((CONFIG.fieldOfView / 2) * Math.PI / 180);
        
        let progress = 0;
        const loader = setInterval(() => {
            progress += Math.random() * 10;
            if (progress > 100) progress = 100;
            document.getElementById('loader-bar').style.width = progress + '%';
            
            if(progress >= 100) {
                clearInterval(loader);
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-menu').classList.remove('hidden');
                    document.getElementById('hud').classList.remove('hidden');
                    this.resetWorld();
                    this.loop(0);
                }, 500);
            }
        }, 100);
    },

    resize: function() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    },

    setupInput: function() {
        document.addEventListener('keydown', (e) => {
            if (this.state !== 'PLAYING') return;
            switch(e.key) {
                case 'ArrowLeft': this.player.move(-1); break;
                case 'ArrowRight': this.player.move(1); break;
                case 'ArrowUp': this.player.jump(); break;
                case 'ArrowDown': this.player.slide(); break;
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        
        this.canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        this.canvas.addEventListener('touchend', (e) => {
            if (this.state !== 'PLAYING') return;
            const dx = e.changedTouches[0].screenX - touchStartX;
            const dy = e.changedTouches[0].screenY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    if (dx > 0) this.player.move(1);
                    else this.player.move(-1);
                }
            } else {
                if (Math.abs(dy) > 30) {
                    if (dy < 0) this.player.jump();
                    else this.player.slide();
                }
            }
        }, {passive: false});
    },

    resetWorld: function() {
        this.segments = [];
        this.objects = [];
        this.buildings = [];
        this.score = 0;
        this.coins = 0;
        this.speed = CONFIG.speed.start;
        this.distance = 0;
        this.player = new Player();
        this.player.color = localStorage.getItem('sr_skin') || '#1e90ff';
        this.particles = new ParticleSystem();
        
        for(let n = 0; n < CONFIG.drawDistance; n++) {
            this.addSegment(n);
        }
        
        for(let n = 0; n < CONFIG.drawDistance; n+=2) {
            this.addBuilding(n);
        }

        this.updateUI();
    },

    addSegment: function(index) {
        this.segments.push({
            index: index,
            p1: { world: { z: index * CONFIG.segmentLength }, camera: {}, screen: {} },
            p2: { world: { z: (index + 1) * CONFIG.segmentLength }, camera: {}, screen: {} },
            color: Math.floor(index / 3) % 2 ? CONFIG.colors.road[0] : CONFIG.colors.road[1],
            grass: Math.floor(index / 3) % 2 ? CONFIG.colors.grass[0] : CONFIG.colors.grass[1],
            rumble: Math.floor(index / 3) % 2 ? CONFIG.colors.rumble[0] : CONFIG.colors.rumble[1]
        });
    },

    addBuilding: function(index) {
        const side = Math.random() > 0.5 ? 1 : -1;
        const offset = 2.5 + Math.random();
        this.buildings.push({
            z: index * CONFIG.segmentLength,
            x: side * (CONFIG.laneWidth * offset),
            w: 300 + Math.random() * 300,
            h: 400 + Math.random() * 800,
            color: Utils.randomChoice(CONFIG.colors.building)
        });
    },

    start: function() {
        AudioSys.init();
        this.state = 'PLAYING';
        this.resetWorld();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
    },

    restart: function() {
        this.start();
    },

    gameOver: function() {
        this.state = 'GAMEOVER';
        AudioSys.playCrash();
        
        if (this.score > this.highScore) {
            this.highScore = Math.floor(this.score);
            localStorage.setItem('sr_highscore', this.highScore);
        }
        this.totalCoins += this.coins;
        localStorage.setItem('sr_totalcoins', this.totalCoins);

        document.getElementById('final-score').innerText = Math.floor(this.score);
        document.getElementById('game-over').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
    },

    spawnObject: function() {
        if (Math.random() < 0.04 + (this.speed / 15000)) {
            const lane = Utils.randomInt(-1, 1);
            const z = this.distance + CONFIG.drawDistance * CONFIG.segmentLength;
            
            const tooClose = this.objects.some(o => Math.abs(o.z - z) < 500 && o.lane === lane);
            if (tooClose) return;

            const types = ['coin', 'coin', 'coin', 'barrier_low', 'train', 'barrier_high'];
            const type = Utils.randomChoice(types);
            
            this.objects.push(new GameObject(type, lane, z));
            
            if (type === 'coin') {
                for(let i=1; i<8; i++) {
                    this.objects.push(new GameObject('coin', lane, z + i * 120));
                }
            }
        }
    },

    update: function(dt) {
        if (this.state !== 'PLAYING') return;

        this.speed = Math.min(this.speed + CONFIG.speed.accel * dt, CONFIG.speed.max);
        this.distance += this.speed * dt;
        this.score += this.speed * dt * 0.05;

        this.player.update(dt);
        this.spawnObject();

        const playerBox = {
            x: this.player.x,
            y: this.player.y,
            z: this.distance + 250,
            w: this.player.width,
            h: this.player.height,
            l: 60
        };

        for(let i = this.objects.length - 1; i >= 0; i--) {
            let obj = this.objects[i];
            obj.update(dt, this.speed);

            if (obj.z < this.distance - 400) {
                this.objects.splice(i, 1);
                continue;
            }

            if (obj.active) {
                const objBox = obj.getAABB();
                
                if (objBox.z < playerBox.z + playerBox.l && objBox.z + objBox.l > playerBox.z) {
                    if (Utils.overlap(playerBox.x, playerBox.w, objBox.x, objBox.w, 0.7)) {
                        if (playerBox.y < objBox.y + objBox.h && playerBox.y + playerBox.h > objBox.y) {
                            
                            if (obj.type === 'coin') {
                                obj.active = false;
                                this.coins++;
                                this.score += 25;
                                AudioSys.playCoin();
                                this.particles.emit(objBox.x, objBox.y + 50, objBox.z, '#ffd700', 8);
                            } else {
                                this.particles.emit(playerBox.x, playerBox.y + 50, playerBox.z, '#ff4757', 40);
                                this.gameOver();
                            }
                        }
                    }
                }
            }
        }

        while (this.segments.length < CONFIG.drawDistance) {
            const lastZ = this.segments[this.segments.length-1].p2.world.z;
            const newIndex = lastZ / CONFIG.segmentLength;
            this.addSegment(newIndex);
            if (Math.random() > 0.5) this.addBuilding(newIndex);
        }
        
        while (this.segments.length > 0 && this.segments[0].p2.world.z < this.distance) {
            this.segments.shift();
        }
        
        this.buildings = this.buildings.filter(b => b.z > this.distance - 600);

        this.particles.update(dt);
        this.updateUI();
    },

    render: function() {
        // Sky
        const grd = this.ctx.createLinearGradient(0, 0, 0, this.height);
        grd.addColorStop(0, CONFIG.colors.skyTop);
        grd.addColorStop(1, CONFIG.colors.skyBottom);
        this.ctx.fillStyle = grd;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Sun
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        this.ctx.beginPath();
        this.ctx.arc(this.width * 0.8, this.height * 0.2, 60, 0, Math.PI*2);
        this.ctx.fill();

        const cameraX = this.player.x; 
        const cameraY = CONFIG.cameraHeight + this.player.y;
        const cameraZ = this.distance;

        // 1. Buildings (Back to Front)
        const visibleBuildings = this.buildings.filter(b => b.z > this.distance && b.z < this.distance + CONFIG.drawDistance * CONFIG.segmentLength);
        visibleBuildings.sort((a, b) => b.z - a.z);

        visibleBuildings.forEach(b => {
            const relZ = b.z - cameraZ;
            if (relZ <= 0) return;
            
            const scale = CONFIG.cameraDepth / relZ;
            const screenX = (this.width / 2) + (scale * (b.x - cameraX) * this.width / 2);
            const screenY = (this.height / 2) - (scale * (0 - (cameraY - CONFIG.cameraHeight)) * this.height / 2);
            const screenW = scale * b.w * this.width / 2;
            const screenH = scale * b.h * this.width / 2;

            // Building Body
            this.ctx.fillStyle = b.color;
            this.ctx.fillRect(screenX - screenW/2, screenY - screenH, screenW, screenH);
            
            // Graffiti / Details (Simple rectangles)
            this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
            this.ctx.fillRect(screenX - screenW/2, screenY - screenH * 0.8, screenW, screenH * 0.2);
            
            // Windows
            this.ctx.fillStyle = 'rgba(255,255,255,0.4)';
            const winSize = screenW / 6;
            for(let wy = 0; wy < 5; wy++) {
                for(let wx = 0; wx < 4; wx++) {
                    if (Math.random() > 0.2) {
                        this.ctx.fillRect(
                            screenX - screenW/2 + 15 + wx * (winSize + 8), 
                            screenY - screenH + 30 + wy * (winSize + 15), 
                            winSize, winSize
                        );
                    }
                }
            }
        });

        // 2. Road
        let maxY = this.height;
        
        for(let n = 0; n < this.segments.length; n++) {
            const segment = this.segments[n];
            
            const z1 = segment.p1.world.z - cameraZ;
            const z2 = segment.p2.world.z - cameraZ;

            if (z1 <= 0) continue;

            Utils.project(segment.p1, cameraX, cameraY, z1, CONFIG.cameraDepth, this.width, this.height, CONFIG.laneWidth * 3);
            Utils.project(segment.p2, cameraX, cameraY, z2, CONFIG.cameraDepth, this.width, this.height, CONFIG.laneWidth * 3);

            const x1 = segment.p1.screen.x;
            const y1 = segment.p1.screen.y;
            const w1 = segment.p1.screen.w;
            const x2 = segment.p2.screen.x;
            const y2 = segment.p2.screen.y;
            const w2 = segment.p2.screen.w;

            if (y1 >= maxY) continue;
            maxY = y1;

            // Grass
            this.ctx.fillStyle = segment.grass;
            this.ctx.fillRect(0, y2, this.width, y1 - y2);

            // Road
            this.drawPoly(this.ctx, x1, y1, w1, x2, y2, w2, segment.color);

            // Rumble
            const r1 = w1 / 5;
            const r2 = w2 / 5;
            this.drawPoly(this.ctx, x1 - w1 - r1, y1, r1, x2 - w2 - r2, y2, r2, segment.rumble);
            this.drawPoly(this.ctx, x1 + w1, y1, r1, x2 + w2, y2, r2, segment.rumble);

            // Lanes
            if (segment.color === CONFIG.colors.road[0]) {
                const l1 = w1 / 30;
                const l2 = w2 / 30;
                const lanew1 = w1 * 2 / 3;
                const lanew2 = w2 * 2 / 3;
                
                this.ctx.fillStyle = CONFIG.colors.laneMarker;
                this.drawPoly(this.ctx, x1 - lanew1/2, y1, l1, x2 - lanew2/2, y2, l2, CONFIG.colors.laneMarker);
                this.drawPoly(this.ctx, x1 + lanew1/2, y1, l1, x2 + lanew2/2, y2, l2, CONFIG.colors.laneMarker);
            }
        }

        // 3. Objects
        const visibleObjects = this.objects.filter(o => o.z > this.distance && o.z < this.distance + CONFIG.drawDistance * CONFIG.segmentLength);
        visibleObjects.sort((a, b) => b.z - a.z);

        visibleObjects.forEach(obj => {
            if (!obj.active) return;
            
            const relZ = obj.z - cameraZ;
            if (relZ <= 0) return;

            const scale = CONFIG.cameraDepth / relZ;
            const screenX = (this.width / 2) + (scale * (obj.lane * CONFIG.laneWidth - cameraX) * this.width / 2);
            const screenY = (this.height / 2) - (scale * (obj.y - (cameraY - CONFIG.cameraHeight)) * this.height / 2);
            
            const screenW = scale * obj.width * this.width / 2;
            const screenH = scale * obj.height * this.width / 2;

            // Shadow
            this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
            this.ctx.beginPath();
            const shadowY = (this.height / 2) - (scale * (0 - (cameraY - CONFIG.cameraHeight)) * this.height / 2);
            this.ctx.ellipse(screenX, shadowY, screenW/1.2, screenW/2.5, 0, 0, Math.PI*2);
            this.ctx.fill();

            if (obj.type === 'coin') {
                const bobY = Math.sin(obj.bobOffset) * 40 * scale * this.width;
                this.ctx.fillStyle = obj.color;
                this.ctx.beginPath();
                this.ctx.arc(screenX, screenY - screenH/2 + bobY, screenW/2, 0, Math.PI*2);
                this.ctx.fill();
                // Shine
                this.ctx.fillStyle = '#fff';
                this.ctx.beginPath();
                this.ctx.arc(screenX - screenW/5, screenY - screenH/2 + bobY - screenW/5, screenW/5, 0, Math.PI*2);
                this.ctx.fill();
            } else if (obj.type === 'train') {
                // Train Body
                this.ctx.fillStyle = obj.trainColor;
                this.ctx.fillRect(screenX - screenW/2, screenY - screenH, screenW, screenH);
                
                // Roof
                this.ctx.fillStyle = '#dfe4ea';
                this.ctx.fillRect(screenX - screenW/2, screenY - screenH, screenW, screenH * 0.15);
                
                // Windows
                this.ctx.fillStyle = '#2f3542';
                this.ctx.fillRect(screenX - screenW/2 + 8, screenY - screenH * 0.7, screenW - 16, screenH * 0.3);
                
                // Front Lights
                this.ctx.fillStyle = '#ffa502';
                this.ctx.beginPath();
                this.ctx.arc(screenX - screenW/3, screenY - screenH * 0.2, screenW/7, 0, Math.PI*2);
                this.ctx.arc(screenX + screenW/3, screenY - screenH * 0.2, screenW/7, 0, Math.PI*2);
                this.ctx.fill();
                
                // Graffiti on train
                this.ctx.fillStyle = 'rgba(255,255,255,0.3)';
                this.ctx.font = `${screenW/2}px Arial`;
                this.ctx.fillText("RUN", screenX - screenW/4, screenY - screenH/2);
            } else {
                // Barriers
                this.ctx.fillStyle = obj.color;
                this.ctx.fillRect(screenX - screenW/2, screenY - screenH, screenW, screenH);
                this.ctx.fillStyle = (obj.type === 'barrier_low') ? '#fff' : '#2f3542';
                this.ctx.fillRect(screenX - screenW/2, screenY - screenH/2, screenW, screenH/3);
            }
        });

        // 4. Player
        this.renderPlayer(cameraX, cameraY, cameraZ);

        // 5. Particles
        this.particles.render(this.ctx, { x: cameraX, y: cameraY - CONFIG.cameraHeight, z: cameraZ }, this.width, this.height);
    },

    renderPlayer: function(camX, camY, camZ) {
        const pZ = 350; 
        const scale = CONFIG.cameraDepth / pZ;
        
        const screenX = this.width / 2;
        const screenY = (this.height / 2) - (scale * (this.player.y - (camY - CONFIG.cameraHeight)) * this.height / 2);
        
        const w = scale * this.player.width * this.width / 2;
        const h = scale * this.player.height * this.width / 2;

        this.ctx.save();
        this.ctx.translate(screenX, screenY);
        this.ctx.rotate(this.player.tilt);

        // Shadow
        this.ctx.fillStyle = 'rgba(0,0,0,0.4)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, h/2, w/1.2, w/2.5, 0, 0, Math.PI*2);
        this.ctx.fill();

        // Head
        this.ctx.fillStyle = '#ffccaa';
        this.ctx.beginPath();
        this.ctx.arc(0, -h/2 - w/2.5, w/2.2, 0, Math.PI*2);
        this.ctx.fill();
        
        // Cap
        this.ctx.fillStyle = '#2f3542';
        this.ctx.beginPath();
        this.ctx.arc(0, -h/2 - w/2.5, w/2.2, Math.PI, 0);
        this.ctx.fill();
        this.ctx.fillRect(-w/1.8, -h/2 - w/2.5, w/0.9, 8);

        // Body
        this.ctx.fillStyle = this.player.color;
        this.ctx.fillRect(-w/2, -h/2, w, h * 0.55);
        
        // Legs
        this.ctx.fillStyle = '#2f3542';
        const legOffset = Math.sin(Date.now() / 80) * (this.speed / 40);
        this.ctx.fillRect(-w/2 + 4, -h/2 + h*0.55, w/2 - 6, h * 0.45 + legOffset);
        this.ctx.fillRect(4, -h/2 + h*0.55, w/2 - 6, h * 0.45 - legOffset);

        // Arms
        this.ctx.fillStyle = this.player.color;
        this.ctx.fillRect(-w/2 - 12, -h/2 + 15 - legOffset, 14, h * 0.4);
        this.ctx.fillRect(w/2 - 2, -h/2 + 15 + legOffset, 14, h * 0.4);

        this.ctx.restore();
    },

    drawPoly: function(ctx, x1, y1, w1, x2, y2, w2, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x1 - w1, y1);
        ctx.lineTo(x1 + w1, y1);
        ctx.lineTo(x2 + w2, y2);
        ctx.lineTo(x2 - w2, y2);
        ctx.closePath();
        ctx.fill();
    },

    updateUI: function() {
        document.getElementById('score-display').innerText = Math.floor(this.score);
        document.getElementById('coin-display').innerText = this.coins;
        document.getElementById('highscore-display').innerText = Math.floor(this.highScore);
    },

    loop: function(time) {
        const dt = Math.min((time - this.lastTime) / 1000, 0.1);
        this.lastTime = time;

        this.update(dt);
        this.render();

        requestAnimationFrame((t) => this.loop(t));
    }
};

// --- UI MANAGER ---
const UI = {
    openShop: function() {
        document.getElementById('shop-modal').classList.remove('hidden');
        this.renderShopItems();
    },
    closeShop: function() {
        document.getElementById('shop-modal').classList.add('hidden');
    },
    openSettings: function() {
        document.getElementById('settings-modal').classList.remove('hidden');
    },
    closeSettings: function() {
        const quality = document.getElementById('quality-select').value;
        const sound = document.getElementById('sound-toggle').checked;
        Game.quality = quality;
        AudioSys.enabled = sound;
        document.getElementById('settings-modal').classList.add('hidden');
    },
    showMainMenu: function() {
        document.getElementById('game-over').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
        document.getElementById('hud').classList.remove('hidden');
    },
    renderShopItems: function() {
        const container = document.getElementById('shop-items');
        container.innerHTML = '';
        
        const skins = [
            { name: 'آبی کلاسیک', color: '#1e90ff', price: 0 },
            { name: 'قرمز آتشین', color: '#ff4757', price: 100 },
            { name: 'سبز سمی', color: '#2ed573', price: 200 },
            { name: 'بنفش کهکشانی', color: '#9b59b6', price: 500 },
            { name: 'طلایی', color: '#ffd700', price: 1000 },
            { name: 'سایه شب', color: '#2f3542', price: 2000 },
            { name: 'صورتی', color: '#ff6b81', price: 300 },
            { name: 'نارنجی', color: '#ffa502', price: 400 }
        ];

        skins.forEach(skin => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            if (Game.player.color === skin.color) div.classList.add('selected');
            
            const owned = Game.totalCoins >= skin.price || skin.price === 0;
            
            div.innerHTML = `
                <div class="item-preview" style="background:${skin.color};"></div>
                <div style="font-size:16px; font-weight:bold;">${skin.name}</div>
                <div style="font-size:14px; color:#ffd700; margin-top:8px;">
                    ${skin.price === 0 ? 'پیش‌فرض' : (owned ? 'خریداری شد' : skin.price + ' سکه')}
                </div>
            `;
            
            div.onclick = () => {
                if (Game.player.color === skin.color) return;

                if (owned) {
                    Game.player.color = skin.color;
                    localStorage.setItem('sr_skin', skin.color);
                    this.renderShopItems();
                    AudioSys.playCoin();
                } else {
                    if (Game.totalCoins >= skin.price) {
                        Game.totalCoins -= skin.price;
                        localStorage.setItem('sr_totalcoins', Game.totalCoins);
                        Game.player.color = skin.color;
                        localStorage.setItem('sr_skin', skin.color);
                        this.renderShopItems();
                        AudioSys.playCoin();
                        alert('خرید موفق!');
                    } else {
                        alert('سکه کافی ندارید! بیشتر بازی کنید.');
                    }
                }
            };
            container.appendChild(div);
        });
        
        const coinDisplay = document.createElement('div');
        coinDisplay.style.gridColumn = "1 / -1";
        coinDisplay.style.textAlign = "center";
        coinDisplay.style.marginTop = "20px";
        coinDisplay.style.color = "#ffd700";
        coinDisplay.style.fontSize = "20px";
        coinDisplay.innerText = `موجودی کل: ${Game.totalCoins} سکه`;
        container.appendChild(coinDisplay);
    }
};

window.onload = () => Game.init();

</script>
