<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D - Ultimate Real Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Lalezar', cursive; user-select: none; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; outline: none; }
        
        /* UI Layers */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; }
        .hud { display: flex; justify-content: space-between; padding: 20px; font-size: 32px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .hud-box { background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(0,0,0,0.2)); padding: 10px 25px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); display: flex; align-items: center; gap: 10px; }
        .coin-icon { color: #FFD700; text-shadow: 0 0 10px #FFD700; }

        /* Menus */
        .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.9) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; transition: opacity 0.3s; }
        .hidden { opacity: 0; pointer-events: none; }
        
        h1 { font-size: 60px; color: #FFD700; margin: 0; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 5px 15px rgba(255, 215, 0, 0.5), 3px 3px 0 #d35400; transform: skewX(-10deg); }
        h2 { font-size: 40px; color: #ff4757; margin: 10px 0; text-shadow: 2px 2px 0 #000; }
        p { color: #ecf0f1; font-size: 24px; margin-bottom: 30px; }

        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        button { 
            background: linear-gradient(to bottom, #ff9f43, #ee5253); border: 3px solid #fff; padding: 15px 40px; 
            color: white; font-size: 28px; font-family: 'Lalezar', cursive; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: all 0.1s; text-shadow: 1px 1px 2px #000;
        }
        button:active { transform: translateY(5px); box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        button.shop-btn { background: linear-gradient(to bottom, #1dd1a1, #10ac84); }
        button.close-btn { background: linear-gradient(to bottom, #576574, #222f3e); padding: 10px 30px; font-size: 20px; }

        /* Shop Modal */
        #shop-modal { background: rgba(0,0,0,0.85); z-index: 20; }
        .shop-container { background: #2c3e50; padding: 30px; border-radius: 20px; border: 4px solid #f1c40f; text-align: center; max-width: 90%; width: 400px; box-shadow: 0 0 50px rgba(241, 196, 15, 0.3); }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); padding: 15px; margin: 15px 0; border-radius: 10px; color: white; font-size: 22px; }
        .buy-btn { background: #f1c40f; color: #000; border: none; padding: 8px 20px; border-radius: 20px; font-size: 18px; cursor: pointer; box-shadow: none; }
        .buy-btn:disabled { background: #7f8c8d; cursor: not-allowed; }

        /* Controls Hint */
        .controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 16px; pointer-events: none; }
    </style>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Game Canvas Container -->
    <div id="canvas-container"></div>

    <!-- HUD -->
    <div id="ui-layer">
        <div class="hud">
            <div class="hud-box">امتیاز: <span id="score">0</span></div>
            <div class="hud-box"><span class="coin-icon">🪙</span> <span id="coins">0</span></div>
        </div>
        <div class="controls-hint">Swipe یا Arrow Keys | بالا: پرش | پایین: غلت</div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu">
        <h1>SUBWAY PRO</h1>
        <p>نسخه فوق حرفه‌ای سه بعدی</p>
        <div class="btn-group">
            <button id="start-btn">شروع بازی</button>
            <button id="shop-btn" class="shop-btn">فروشگاه 🛒</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="menu hidden">
        <div class="shop-container">
            <h2>فروشگاه</h2>
            <p>سکه‌های شما: <span id="shop-coins" style="color:#f1c40f">0</span> 🪙</p>
            
            <div class="shop-item">
                <span>آهنربا (جذب سکه)</span>
                <button class="buy-btn" id="buy-magnet" onclick="buyItem('magnet', 50)">50 🪙</button>
            </div>
            <div class="shop-item">
                <span>سپر محافظ (یک جان)</span>
                <button class="buy-btn" id="buy-shield" onclick="buyItem('shield', 100)">100 🪙</button>
            </div>
            
            <button class="close-btn" onclick="closeShop()" style="margin-top: 20px;">بستن</button>
        </div>
    </div>

    <!-- Game Over Menu -->
    <div id="game-over-menu" class="menu hidden">
        <h2>GAME OVER</h2>
        <p>امتیاز نهایی: <span id="final-score">0</span></p>
        <div class="btn-group">
            <button id="retry-btn">تلاش مجدد</button>
            <button id="menu-btn" class="close-btn">منو اصلی</button>
        </div>
    </div>

    <script>
        // --- GAME CONFIGURATION & STATE ---
        const CONFIG = {
            laneWidth: 3,
            baseSpeed: 0.8,
            maxSpeed: 2.5,
            jumpForce: 0.45,
            gravity: 0.025,
            colors: {
                sky: 0x87CEEB,
                ground: 0x333333,
                trainRed: 0xe74c3c,
                trainYellow: 0xf1c40f,
                trainBlue: 0x3498db
            }
        };

        let state = {
            isPlaying: false,
            score: 0,
            coins: parseInt(localStorage.getItem('subwayCoins')) || 0,
            speed: CONFIG.baseSpeed,
            lane: 1, // 0: Left, 1: Center, 2: Right
            targetX: 0,
            velY: 0,
            isJumping: false,
            isRolling: false,
            rollTimer: 0,
            inventory: { magnet: 0, shield: 0 },
            distance: 0
        };

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.colors.sky);
        scene.fog = new THREE.FogExp2(CONFIG.colors.sky, 0.015);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 1, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for mobile
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- ASSETS GENERATION (Procedural High Quality) ---
        
        // 1. Environment
        const floorGeo = new THREE.PlaneGeometry(100, 400);
        const floorMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.ground, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -100;
        floor.receiveShadow = true;
        scene.add(floor);

        // Tracks & Sleepers
        const trackGroup = new THREE.Group();
        const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
        
        for(let i=-1; i<=1; i++) {
            // Rails
            const railGeo = new THREE.BoxGeometry(0.15, 0.1, 400);
            const rail1 = new THREE.Mesh(railGeo, railMat); rail1.position.set(i*CONFIG.laneWidth - 0.8, 0.05, -100);
            const rail2 = new THREE.Mesh(railGeo, railMat); rail2.position.set(i*CONFIG.laneWidth + 0.8, 0.05, -100);
            trackGroup.add(rail1, rail2);
        }
        // Sleepers
        for(let j=0; j<80; j++) {
            const sleeper = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 0.4), sleeperMat);
            sleeper.position.set(0, 0.01, -j * 5);
            sleeper.receiveShadow = true;
            trackGroup.add(sleeper);
        }
        scene.add(trackGroup);

        // City Buildings (Instanced for performance)
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6 });
        for(let i=0; i<40; i++) {
            const h = 10 + Math.random() * 20;
            const w = 4 + Math.random() * 4;
            const d = 4 + Math.random() * 4;
            
            const bLeft = new THREE.Mesh(buildingGeo, new THREE.MeshStandardMaterial({color: new THREE.Color().setHSL(Math.random(), 0.5, 0.5)}));
            bLeft.scale.set(w, h, d);
            bLeft.position.set(-8 - Math.random()*5, h/2, -i * 15 - Math.random()*10);
            bLeft.castShadow = true; bLeft.receiveShadow = true;
            scene.add(bLeft);

            const bRight = new THREE.Mesh(buildingGeo, new THREE.MeshStandardMaterial({color: new THREE.Color().setHSL(Math.random(), 0.5, 0.5)}));
            bRight.scale.set(w, h, d);
            bRight.position.set(8 + Math.random()*5, h/2, -i * 15 - Math.random()*10);
            bRight.castShadow = true; bRight.receiveShadow = true;
            scene.add(bRight);
        }

        // 2. Player Character (High Detail Procedural)
        const playerGroup = new THREE.Group();
        
        // Materials
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.6 });
        const hoodieMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
        const capMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, roughness: 0.4, metalness: 0.1 });
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

        // Body
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), hoodieMat);
        torso.position.y = 1.1; torso.castShadow = true;
        playerGroup.add(torso);

        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
        head.position.y = 1.75; head.castShadow = true;
        playerGroup.add(head);

        // Cap
        const capBase = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.15, 16), capMat);
        capBase.position.y = 1.95;
        const capBrim = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.3), capMat);
        capBrim.position.set(0, 1.9, -0.25);
        playerGroup.add(capBase, capBrim);

        // Arms (Pivoted for animation)
        const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
        const leftArmPivot = new THREE.Group(); leftArmPivot.position.set(-0.45, 1.4, 0);
        const leftArm = new THREE.Mesh(armGeo, hoodieMat); leftArm.position.y = -0.35; leftArm.castShadow = true;
        leftArmPivot.add(leftArm); playerGroup.add(leftArmPivot);

        const rightArmPivot = new THREE.Group(); rightArmPivot.position.set(0.45, 1.4, 0);
        const rightArm = new THREE.Mesh(armGeo, hoodieMat); rightArm.position.y = -0.35; rightArm.castShadow = true;
        rightArmPivot.add(rightArm); playerGroup.add(rightArmPivot);

        // Legs (Pivoted for animation)
        const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
        const leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.2, 0.7, 0);
        const leftLeg = new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({color: 0x111111})); leftLeg.position.y = -0.4; leftLeg.castShadow = true;
        const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.15, 0.4), shoeMat); leftShoe.position.set(0, -0.8, -0.05);
        leftLegPivot.add(leftLeg, leftShoe); playerGroup.add(leftLegPivot);

        const rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.2, 0.7, 0);
        const rightLeg = new THREE.Mesh(legGeo, new THREE.MeshStandardMaterial({color: 0x111111})); rightLeg.position.y = -0.4; rightLeg.castShadow = true;
        const rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.15, 0.4), shoeMat); rightShoe.position.set(0, -0.8, -0.05);
        rightLegPivot.add(rightLeg, rightShoe); playerGroup.add(rightLegPivot);

        // Shield Visual (Hidden by default)
        const shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.3, wireframe: true}));
        shieldMesh.visible = false;
        playerGroup.add(shieldMesh);

        scene.add(playerGroup);

        // --- GAME ENTITIES ---
        let trains = [];
        let coinMeshes = [];
        let magnetActive = false;
        let magnetTimer = 0;

        // Function to create a REALISTIC train
        function createTrain(laneIndex, isMoving, moveDirection) {
            const trainGroup = new THREE.Group();
            const length = 12 + Math.random() * 10;
            const colorArr = [CONFIG.colors.trainRed, CONFIG.colors.trainYellow, CONFIG.colors.trainBlue];
            const mainColor = colorArr[Math.floor(Math.random() * colorArr.length)];
            
            // Main Body (Rounded look using standard material with high metalness)
            const bodyMat = new THREE.MeshStandardMaterial({ color: mainColor, metalness: 0.6, roughness: 0.3 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3, length), bodyMat);
            body.position.y = 1.5;
            body.castShadow = true; body.receiveShadow = true;
            trainGroup.add(body);

            // Roof
            const roof = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.2, length), new THREE.MeshStandardMaterial({color: 0xdddddd, metalness: 0.8}));
            roof.position.y = 3.0;
            trainGroup.add(roof);

            // Windows (Dark glass)
            const winMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            const winCount = Math.floor(length / 2.5);
            for(let i=0; i<winCount; i++) {
                const winL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 1.5), winMat);
                winL.position.set(-1.21, 2, -length/2 + 2 + i*2.5);
                const winR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 1.5), winMat);
                winR.position.set(1.21, 2, -length/2 + 2 + i*2.5);
                trainGroup.add(winL, winR);
            }

            // Front Lights
            const lightGeo = new THREE.CircleGeometry(0.2, 16);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const l1 = new THREE.Mesh(lightGeo, lightMat); l1.position.set(-0.8, 1, length/2 + 0.01);
            const l2 = new THREE.Mesh(lightGeo, lightMat); l2.position.set(0.8, 1, length/2 + 0.01);
            trainGroup.add(l1, l2);

            // Position
            trainGroup.position.set((laneIndex - 1) * CONFIG.laneWidth, 0, -80);
            
            // Custom Data for Logic
            trainGroup.userData = { 
                isObstacle: true, 
                length: length, 
                isMoving: isMoving, 
                moveSpeed: isMoving ? (moveDirection === 'forward' ? CONFIG.baseSpeed + 0.5 : -(CONFIG.baseSpeed + 1.5)) : 0,
                type: 'train'
            };

            scene.add(trainGroup);
            trains.push(trainGroup);
        }

        function createBarrier(laneIndex) {
            const group = new THREE.Group();
            const bar = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 0.3), new THREE.MeshStandardMaterial({color: 0xffaa00}));
            bar.position.y = 1.2; // Must roll under
            bar.castShadow = true;
            
            const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.2, 0.2), new THREE.MeshStandardMaterial({color: 0x555}));
            leg1.position.set(-1, 0.6, 0);
            const leg2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.2, 0.2), new THREE.MeshStandardMaterial({color: 0x555}));
            leg2.position.set(1, 0.6, 0);
            
            group.add(bar, leg1, leg2);
            group.position.set((laneIndex - 1) * CONFIG.laneWidth, 0, -80);
            group.userData = { isObstacle: true, type: 'barrier_high' }; // Must roll
            scene.add(group);
            trains.push(group); // Add to same array for management
        }

        function spawnCoin(x, y, z) {
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 1.0, roughness: 0.2, emissive: 0x554400 });
            const coin = new THREE.Mesh(geo, mat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(x, y, z);
            coin.castShadow = true;
            scene.add(coin);
            coinMeshes.push(coin);
        }

        // --- GAME LOGIC ---

        function spawnLogic() {
            if (!state.isPlaying) return;
            
            // Spawn rate increases with speed
            if (Math.random() < 0.02 + (state.speed * 0.005)) {
                const lane = Math.floor(Math.random() * 3);
                
                // Check distance from last obstacle in this lane to prevent impossible walls
                let safeToSpawn = true;
                for(let t of trains) {
                    if (Math.abs(t.position.x - ((lane-1)*CONFIG.laneWidth)) < 0.1 && t.position.z > -100) {
                        safeToSpawn = false; break;
                    }
                }

                if (safeToSpawn) {
                    const rand = Math.random();
                    if (rand < 0.6) {
                        // 60% chance Train
                        const isMoving = Math.random() > 0.5;
                        const dir = Math.random() > 0.5 ? 'forward' : 'backward';
                        createTrain(lane, isMoving, dir);
                        
                        // Spawn coins on top of train sometimes
                        if(Math.random() > 0.5) {
                            for(let i=0; i<5; i++) spawnCoin((lane-1)*CONFIG.laneWidth, 3.5, -85 - i*2);
                        }
                    } else if (rand < 0.8) {
                        // 20% chance High Barrier (Must roll)
                        createBarrier(lane);
                        for(let i=0; i<3; i++) spawnCoin((lane-1)*CONFIG.laneWidth, 1, -82 - i*2);
                    } else {
                        // 20% chance just coins on ground
                        for(let i=0; i<5; i++) spawnCoin((lane-1)*CONFIG.laneWidth, 1, -80 - i*2);
                    }
                }
            }
        }

        function updatePhysics() {
            // Player Lane Movement (Smooth Lerp)
            playerGroup.position.x += (state.targetX - playerGroup.position.x) * 0.2;

            // Jump & Gravity
            playerGroup.position.y += state.velY;
            state.velY -= CONFIG.gravity;
            if (playerGroup.position.y <= 0) {
                playerGroup.position.y = 0;
                state.velY = 0;
                state.isJumping = false;
            }

            // Roll Logic
            if (state.isRolling) {
                playerGroup.scale.y = 0.5; // Shrink
                playerGroup.position.y = Math.max(0, playerGroup.position.y); // Force down if in air
                state.rollTimer--;
                if (state.rollTimer <= 0) {
                    state.isRolling = false;
                    playerGroup.scale.y = 1;
                }
            }

            // Animate Running (Sin wave based on speed)
            if (!state.isJumping && !state.isRolling) {
                const runSpeed = state.speed * 0.5;
                leftLegPivot.rotation.x = Math.sin(Date.now() * 0.015 * runSpeed) * 0.8;
                rightLegPivot.rotation.x = -Math.sin(Date.now() * 0.015 * runSpeed) * 0.8;
                leftArmPivot.rotation.x = -Math.sin(Date.now() * 0.015 * runSpeed) * 0.8;
                rightArmPivot.rotation.x = Math.sin(Date.now() * 0.015 * runSpeed) * 0.8;
                // Bobbing
                playerGroup.position.y = Math.abs(Math.sin(Date.now() * 0.03 * runSpeed)) * 0.1;
            } else if (state.isJumping) {
                leftLegPivot.rotation.x = -0.5; rightLegPivot.rotation.x = 0.2;
                leftArmPivot.rotation.x = -2.5; rightArmPivot.rotation.x = -2.5; // Hands up
            } else if (state.isRolling) {
                leftLegPivot.rotation.x = 1.5; rightLegPivot.rotation.x = 1.5;
                leftArmPivot.rotation.x = 0; rightArmPivot.rotation.x = 0;
            }

            // Move Trains & Obstacles
            for (let i = trains.length - 1; i >= 0; i--) {
                let t = trains[i];
                // Base movement towards player + own movement
                t.position.z += state.speed + t.userData.moveSpeed;

                // Collision Detection (AABB simplified)
                const dz = Math.abs(t.position.z - playerGroup.position.z);
                const dx = Math.abs(t.position.x - playerGroup.position.x);
                
                // Hitbox logic
                let hitZ = t.userData.length ? t.userData.length / 2 + 0.5 : 1;
                let hitY = true;

                if (t.userData.type === 'barrier_high') {
                    // If rolling, pass under
                    if (state.isRolling) hitY = false;
                } else if (t.userData.type === 'train') {
                    // If on top of train? (Simplified: if jumping high enough and close, maybe safe, but for now trains are deadly unless we implement climbing. Let's keep it simple: deadly)
                    // Actually, let's allow jumping ONTO trains if we wanted, but standard is dodging.
                    if(state.isJumping && playerGroup.position.y > 2.5) hitY = false; // Jump over low parts? No, trains are tall.
                }

                if (dz < hitZ && dx < 1.2 && hitY) {
                    handleCrash();
                }

                if (t.position.z > 15) {
                    scene.remove(t);
                    trains.splice(i, 1);
                }
            }

            // Move Coins & Magnet Logic
            for (let i = coinMeshes.length - 1; i >= 0; i--) {
                let c = coinMeshes[i];
                c.position.z += state.speed;
                c.rotation.z += 0.1;

                // Magnet Effect
                if (magnetActive) {
                    const dir = new THREE.Vector3().subVectors(playerGroup.position, c.position);
                    if (dir.length() < 8) {
                        c.position.add(dir.normalize().multiplyScalar(0.5)); // Pull towards player
                    }
                }

                // Collection
                const dist = c.position.distanceTo(new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z));
                if (dist < 1.5) {
                    state.coins++;
                    state.score += 5;
                    updateHUD();
                    scene.remove(c);
                    coinMeshes.splice(i, 1);
                } else if (c.position.z > 10) {
                    scene.remove(c);
                    coinMeshes.splice(i, 1);
                }
            }

            // Magnet Timer
            if (magnetActive) {
                magnetTimer--;
                if (magnetTimer <= 0) magnetActive = false;
            }

            // Environment Loop (Illusion)
            trackGroup.position.z += state.speed;
            if (trackGroup.position.z > 5) trackGroup.position.z = 0;

            // Increase Difficulty
            state.speed = Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + (state.score * 0.0005));
            state.score += state.speed * 0.1;
            updateHUD();
        }

        function handleCrash() {
            if (state.inventory.shield > 0) {
                state.inventory.shield--;
                shieldMesh.visible = false;
                // Push back obstacles slightly to prevent instant re-crash
                trains.forEach(t => t.position.z += 5);
                // Visual feedback
                const flash = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.5}));
                flash.position.z = -5; scene.add(flash);
                setTimeout(()=>scene.remove(flash), 100);
            } else {
                endGame();
            }
        }

        // --- CONTROLS ---
        function moveLeft() { if (state.lane > 0) { state.lane--; state.targetX = (state.lane - 1) * CONFIG.laneWidth; } }
        function moveRight() { if (state.lane < 2) { state.lane++; state.targetX = (state.lane - 1) * CONFIG.laneWidth; } }
        function jump() { if (!state.isJumping && !state.isRolling) { state.velY = CONFIG.jumpForce; state.isJumping = true; } }
        function roll() { 
            if (!state.isRolling) { 
                state.isRolling = true; 
                state.rollTimer = 40; // Frames to roll
                if(state.isJumping) { state.velY = -0.5; } // Fast fall if in air
            } 
        }

        window.addEventListener('keydown', (e) => {
            if (!state.isPlaying) return;
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'ArrowUp') jump();
            if (e.key === 'ArrowDown') roll();
        });

        // Touch Swipe
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, {passive: false});
        document.addEventListener('touchend', e => {
            if (!state.isPlaying) return;
            const dx = e.changedTouches[0].screenX - touchStartX;
            const dy = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 40) moveRight(); else if (dx < -40) moveLeft(); // Note: RTL might feel inverted, but standard is swipe right = go right
            } else {
                if (dy < -40) jump(); else if (dy > 40) roll();
            }
        }, {passive: false});

        // --- UI & GAME FLOW ---
        const uiScore = document.getElementById('score');
        const uiCoins = document.getElementById('coins');
        const uiFinalScore = document.getElementById('final-score');
        const uiShopCoins = document.getElementById('shop-coins');
        
        function updateHUD() {
            uiScore.innerText = Math.floor(state.score);
            uiCoins.innerText = state.coins;
        }

        function saveData() {
            localStorage.setItem('subwayCoins', state.coins);
        }

        function startGame() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-over-menu').classList.add('hidden');
            
            // Reset State
            state.isPlaying = true;
            state.score = 0;
            state.speed = CONFIG.baseSpeed;
            state.lane = 1;
            state.targetX = 0;
            state.velY = 0;
            state.isJumping = false;
            state.isRolling = false;
            playerGroup.position.set(0, 0, 0);
            playerGroup.scale.y = 1;
            
            // Apply Inventory
            magnetActive = state.inventory.magnet > 0;
            magnetTimer = magnetActive ? 500 : 0; // Lasts ~8 seconds
            if (magnetActive) state.inventory.magnet--;
            
            shieldMesh.visible = state.inventory.shield > 0;

            // Clear Entities
            trains.forEach(t => scene.remove(t)); trains = [];
            coinMeshes.forEach(c => scene.remove(c)); coinMeshes = [];
            
            updateHUD();
        }

        function endGame() {
            state.isPlaying = false;
            saveData();
            uiFinalScore.innerText = Math.floor(state.score);
            document.getElementById('game-over-menu').classList.remove('hidden');
        }

        function showMainMenu() {
            document.getElementById('game-over-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            updateHUD();
        }

        // Shop Logic
        function openShop() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('shop-modal').classList.remove('hidden');
            updateShopUI();
        }
        function closeShop() {
            document.getElementById('shop-modal').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }
        function updateShopUI() {
            uiShopCoins.innerText = state.coins;
            document.getElementById('buy-magnet').disabled = state.coins < 50;
            document.getElementById('buy-shield').disabled = state.coins < 100;
        }
        window.buyItem = function(item, cost) {
            if (state.coins >= cost) {
                state.coins -= cost;
                state.inventory[item]++;
                saveData();
                updateShopUI();
                updateHUD();
            }
        }

        // Button Listeners
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);
        document.getElementById('menu-btn').addEventListener('click', showMainMenu);
        document.getElementById('shop-btn').addEventListener('click', openShop);

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- MAIN LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if (state.isPlaying) {
                updatePhysics();
                spawnLogic();
            }
            renderer.render(scene, camera);
        }

        // Init
        updateHUD();
        animate();

    </script>
</body>
</html>
