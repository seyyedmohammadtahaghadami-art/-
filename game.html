<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro - Ultimate 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
        
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Lalezar', cursive; touch-action: none; user-select: none; 
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* UI Layer */
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; 
        }
        
        .hud-top { 
            display: flex; justify-content: space-between; padding: 20px; 
            font-size: 32px; color: white; text-shadow: 2px 2px 4px #000; 
        }
        .stat-box { 
            background: rgba(0,0,0,0.6); padding: 10px 25px; border-radius: 30px; 
            border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); 
            display: flex; align-items: center; gap: 10px;
        }
        .coin-icon { color: #FFD700; font-size: 36px; }
        
        /* Powerup Indicators */
        #powerups { 
            position: absolute; top: 90px; right: 20px; 
            display: flex; flex-direction: column; gap: 10px; 
        }
        .pu-badge { 
            background: rgba(0, 255, 255, 0.4); border: 2px solid #0ff; 
            padding: 8px 20px; border-radius: 15px; color: #fff; font-size: 20px; 
            display: none; animation: pulse 1s infinite; box-shadow: 0 0 10px #0ff;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Menus */
        .menu-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle, rgba(20,20,30,0.85) 0%, rgba(0,0,0,0.95) 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            pointer-events: auto; z-index: 10; transition: opacity 0.4s; 
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        h1 { 
            font-size: 70px; color: #FFD700; margin: 0; text-transform: uppercase; 
            letter-spacing: 5px; text-shadow: 0 0 30px #FFD700, 5px 5px 0 #d35400; 
            transform: perspective(500px) rotateX(10deg);
        }
        h2 { font-size: 45px; color: #ff4757; margin: 10px 0; text-shadow: 3px 3px 0 #000; }
        p { color: #ecf0f1; font-size: 24px; margin-bottom: 40px; text-shadow: 1px 1px 2px #000; }
        .subtitle { font-size: 20px; color: #bdc3c7; margin-top: -30px; margin-bottom: 40px; }

        button { 
            background: linear-gradient(to bottom, #ff9f43, #ee5253); border: 4px solid #fff; 
            padding: 15px 60px; color: white; font-size: 32px; font-family: 'Lalezar', cursive; 
            border-radius: 60px; cursor: pointer; box-shadow: 0 15px 30px rgba(0,0,0,0.6); 
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin: 10px;
        }
        button:hover { transform: scale(1.05) translateY(-5px); box-shadow: 0 20px 40px rgba(238, 82, 83, 0.6); }
        button:active { transform: scale(0.95); }
        .btn-secondary { 
            background: linear-gradient(to bottom, #576574, #222f3e); font-size: 24px; padding: 12px 40px; 
        }

        /* Shop Modal */
        #shop-modal { background: rgba(0,0,0,0.9); z-index: 20; }
        .shop-panel { 
            background: #2c3e50; padding: 40px; border-radius: 30px; 
            border: 5px solid #f1c40f; text-align: center; width: 85%; max-width: 500px; 
            box-shadow: 0 0 100px rgba(241, 196, 15, 0.2);
        }
        .shop-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.1); padding: 20px; margin: 20px 0; 
            border-radius: 15px; color: white; font-size: 24px; border: 1px solid rgba(255,255,255,0.1);
        }
        .buy-btn { 
            background: #27ae60; border: none; padding: 10px 25px; border-radius: 20px; 
            cursor: pointer; color: white; font-family: 'Lalezar'; font-size: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .buy-btn:disabled { background: #7f8c8d; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- HUD -->
    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-box">امتیاز: <span id="score">0</span></div>
            <div class="stat-box"><span class="coin-icon">🪙</span> <span id="coins">0</span></div>
        </div>
        <div id="powerups">
            <div id="pu-magnet" class="pu-badge">آهنربا فعال!</div>
            <div id="pu-shield" class="pu-badge">سپر فعال!</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="menu-screen">
        <h1>SUBWAY PRO</h1>
        <p class="subtitle">نسخه نهایی APK - فیزیک واقعی قطار</p>
        <button id="start-btn">شروع دویدن</button>
        <button id="shop-btn" class="btn-secondary">فروشگاه 🛒</button>
        <p style="font-size: 18px; margin-top: 30px; opacity: 0.8;">کنترل: Swipe یا Arrow Keys | بالا: پرش روی قطار</p>
    </div>

    <!-- Shop Screen -->
    <div id="shop-modal" class="menu-screen hidden">
        <div class="shop-panel">
            <h2>فروشگاه</h2>
            <p>سکه‌های شما: <span id="shop-coins" style="color:#f1c40f">0</span></p>
            
            <div class="shop-item">
                <span>آهنربا (جذب سکه)</span>
                <button class="buy-btn" id="buy-magnet">50 سکه</button>
            </div>
            <div class="shop-item">
                <span>سپر محافظ (یک جان)</span>
                <button class="buy-btn" id="buy-shield">100 سکه</button>
            </div>
            
            <button id="close-shop" class="btn-secondary" style="margin-top: 30px;">بستن</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="menu-screen hidden">
        <h1 style="color: #ff4757; text-shadow: 0 0 30px #ff4757;">GAME OVER</h1>
        <p>امتیاز نهایی: <span id="final-score">0</span></p>
        <button id="retry-btn">تلاش مجدد</button>
        <button id="menu-btn" class="btn-secondary">منو</button>
    </div>

<script>
/**
 * SUBWAY RUNNER PRO - ULTIMATE ENGINE
 * Author: AI Assistant
 * Features: Train Climbing, Smooth Physics, Powerups, Dynamic Obstacles
 */

// --- CONFIGURATION ---
const CONFIG = {
    laneWidth: 3.5,
    baseSpeed: 0.6,
    maxSpeed: 2.2,
    jumpForce: 0.7,
    gravity: 0.035,
    trainHeight: 3.2,
    colors: {
        sky: 0x87CEEB,
        ground: 0x222222,
        trainRed: 0xe74c3c,
        trainYellow: 0xf1c40f,
        trainBlue: 0x3498db
    }
};

class SubwayGame {
    constructor() {
        // Game State
        this.state = {
            isPlaying: false,
            score: 0,
            coins: parseInt(localStorage.getItem('subway_pro_coins')) || 0,
            speed: CONFIG.baseSpeed,
            lane: 1, // 0: Left, 1: Center, 2: Right
            targetX: 0,
            velY: 0,
            isJumping: false,
            isRolling: false,
            rollTimer: 0,
            inventory: { magnet: 0, shield: 0 },
            activePowerups: { magnet: 0, shield: false }
        };

        // Entity Arrays
        this.entities = {
            trains: [],
            barriers: [],
            coins: [],
            powerups: []
        };

        this.initThree();
        this.createWorld();
        this.createPlayer();
        this.setupInputs();
        this.updateUI();
        this.animate();
    }

    // --- THREE.JS SETUP ---
    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(CONFIG.colors.sky);
        this.scene.fog = new THREE.FogExp2(CONFIG.colors.sky, 0.012);

        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        this.camera.position.set(0, 5, 10);
        this.camera.lookAt(0, 0, -10);

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        this.scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        this.scene.add(dirLight);

        // Resize Handler
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // --- WORLD GENERATION ---
    createWorld() {
        // Ground
        const groundGeo = new THREE.PlaneGeometry(200, 400);
        const groundMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.ground, roughness: 0.8 });
        this.ground = new THREE.Mesh(groundGeo, groundMat);
        this.ground.rotation.x = -Math.PI / 2;
        this.ground.position.z = -100;
        this.ground.receiveShadow = true;
        this.scene.add(this.ground);

        // Tracks Group (for looping illusion)
        this.trackGroup = new THREE.Group();
        const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });

        // Rails
        for(let i=-1; i<=1; i++) {
            const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 400), railMat);
            r1.position.set(i*CONFIG.laneWidth - 0.9, 0.05, -100);
            const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 400), railMat);
            r2.position.set(i*CONFIG.laneWidth + 0.9, 0.05, -100);
            this.trackGroup.add(r1, r2);
        }

        // Sleepers
        for(let j=0; j<100; j++) {
            const s = new THREE.Mesh(new THREE.BoxGeometry(12, 0.15, 0.5), sleeperMat);
            s.position.set(0, 0.02, -j * 4);
            s.receiveShadow = true;
            this.trackGroup.add(s);
        }
        this.scene.add(this.trackGroup);

        // City Buildings (Procedural)
        for(let i=0; i<50; i++) {
            const h = 10 + Math.random() * 30;
            const w = 5 + Math.random() * 5;
            const d = 5 + Math.random() * 5;
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.5, 0.5) });
            
            const bL = new THREE.Mesh(geo, mat);
            bL.position.set(-12 - Math.random()*10, h/2, -i * 15);
            bL.castShadow = true; bL.receiveShadow = true;
            this.scene.add(bL);

            const bR = new THREE.Mesh(geo, mat);
            bR.position.set(12 + Math.random()*10, h/2, -i * 15);
            bR.castShadow = true; bR.receiveShadow = true;
            this.scene.add(bR);
        }
    }

    // --- PLAYER CREATION ---
    createPlayer() {
        this.player = new THREE.Group();
        
        // Materials
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const hoodieMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        const capMat = new THREE.MeshStandardMaterial({ color: 0x0055ff });
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

        // Torso
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.5), hoodieMat);
        torso.position.y = 1.2; torso.castShadow = true;
        this.player.add(torso);

        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
        head.position.y = 1.9; head.castShadow = true;
        this.player.add(head);

        // Cap
        const capBase = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.15, 16), capMat);
        capBase.position.y = 2.1;
        const capBrim = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.35), capMat);
        capBrim.position.set(0, 2.05, -0.25);
        this.player.add(capBase, capBrim);

        // Limbs (Pivots for Animation)
        this.limbs = {};
        const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
        const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);

        // Arms
        this.limbs.armL = new THREE.Group(); this.limbs.armL.position.set(-0.55, 1.6, 0);
        const meshArmL = new THREE.Mesh(armGeo, hoodieMat); meshArmL.position.y = -0.4; meshArmL.castShadow = true;
        this.limbs.armL.add(meshArmL); this.player.add(this.limbs.armL);

        this.limbs.armR = new THREE.Group(); this.limbs.armR.position.set(0.55, 1.6, 0);
        const meshArmR = new THREE.Mesh(armGeo, hoodieMat); meshArmR.position.y = -0.4; meshArmR.castShadow = true;
        this.limbs.armR.add(meshArmR); this.player.add(this.limbs.armR);

        // Legs
        this.limbs.legL = new THREE.Group(); this.limbs.legL.position.set(-0.25, 0.7, 0);
        const meshLegL = new THREE.Mesh(legGeo, pantsMat); meshLegL.position.y = -0.45; meshLegL.castShadow = true;
        const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.5), shoeMat); shoeL.position.set(0, -0.9, -0.05);
        this.limbs.legL.add(meshLegL, shoeL); this.player.add(this.limbs.legL);

        this.limbs.legR = new THREE.Group(); this.limbs.legR.position.set(0.25, 0.7, 0);
        const meshLegR = new THREE.Mesh(legGeo, pantsMat); meshLegR.position.y = -0.45; meshLegR.castShadow = true;
        const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.5), shoeMat); shoeR.position.set(0, -0.9, -0.05);
        this.limbs.legR.add(meshLegR, shoeR); this.player.add(this.limbs.legR);

        // Shield Visual
        this.shieldMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 16, 16), 
            new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3, wireframe: true })
        );
        this.shieldMesh.visible = false;
        this.player.add(this.shieldMesh);

        this.scene.add(this.player);
    }

    // --- ENTITY SPAWNING ---

    createTrain(lane, type) {
        const group = new THREE.Group();
        const length = 12 + Math.random() * 15;
        const colorKeys = ['trainRed', 'trainYellow', 'trainBlue'];
        const colorKey = colorKeys[Math.floor(Math.random() * colorKeys.length)];
        const color = CONFIG.colors[colorKey];

        // Main Body
        const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.2 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, CONFIG.trainHeight, length), bodyMat);
        body.position.y = CONFIG.trainHeight / 2; 
        body.castShadow = true; body.receiveShadow = true;
        
        // Roof
        const roof = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.2, length), new THREE.MeshStandardMaterial({color: 0xcccccc}));
        roof.position.y = CONFIG.trainHeight;

        // Windows
        const winMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
        const winCount = Math.floor(length / 3);
        for(let i=0; i<winCount; i++) {
            const wL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 1.8), winMat);
            wL.position.set(-1.41, CONFIG.trainHeight * 0.6, -length/2 + 2 + i*3);
            const wR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 1.8), winMat);
            wR.position.set(1.41, CONFIG.trainHeight * 0.6, -length/2 + 2 + i*3);
            group.add(wL, wR);
        }

        group.add(body, roof);
        
        // Movement Logic
        let moveSpeed = 0;
        if (type === 'movingTowards') moveSpeed = -(CONFIG.baseSpeed + 1.5); // Fast towards player
        if (type === 'movingWith') moveSpeed = CONFIG.baseSpeed - 0.2; // Slowly with player

        group.position.set((lane - 1) * CONFIG.laneWidth, 0, -100);
        group.userData = { 
            type: 'train', 
            length: length, 
            moveSpeed: moveSpeed, 
            height: CONFIG.trainHeight,
            climbable: true 
        };
        
        this.scene.add(group);
        this.entities.trains.push(group);
    }

    createBarrier(lane, barrierType) {
        const group = new THREE.Group();
        
        if (barrierType === 'high') {
            // Must roll under
            const bar = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 0.5), new THREE.MeshStandardMaterial({color: 0xffaa00}));
            bar.position.y = 1.5; bar.castShadow = true;
            const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.5), new THREE.MeshStandardMaterial({color: 0x555}));
            leg1.position.set(-1, 0.75, 0);
            const leg2 = leg1.clone(); leg2.position.set(1, 0.75, 0);
            group.add(bar, leg1, leg2);
            group.userData = { type: 'barrier_high' };
        } else {
            // Must jump over
            const bar = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.0, 0.5), new THREE.MeshStandardMaterial({color: 0xe67e22}));
            bar.position.y = 0.5; bar.castShadow = true;
            group.add(bar);
            group.userData = { type: 'barrier_low' };
        }

        group.position.set((lane - 1) * CONFIG.laneWidth, 0, -100);
        this.scene.add(group);
        this.entities.barriers.push(group);
    }

    createCoin(x, y, z) {
        const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 1, roughness: 0.2, emissive: 0x443300 });
        const coin = new THREE.Mesh(geo, mat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(x, y, z);
        coin.castShadow = true;
        this.scene.add(coin);
        this.entities.coins.push(coin);
    }

    createPowerup(lane) {
        const type = Math.random() > 0.5 ? 'magnet' : 'shield';
        const color = type === 'magnet' ? 0xff0000 : 0x00ffff;
        
        const group = new THREE.Group();
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({color: color, emissive: color, emissiveIntensity: 0.5}));
        const glow = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.3}));
        group.add(box, glow);
        
        group.position.set((lane - 1) * CONFIG.laneWidth, 1.5, -100);
        group.userData = { type: type };
        
        this.scene.add(group);
        this.entities.powerups.push(group);
    }

    spawnLogic() {
        // Spawn rate increases with speed
        if (Math.random() < 0.035 + (this.state.speed * 0.005)) {
            const lane = Math.floor(Math.random() * 3);
            
            // Safety Check: Don't spawn on top of existing obstacles
            let safe = true;
            for(let t of this.entities.trains) {
                if (Math.abs(t.position.x - ((lane-1)*CONFIG.laneWidth)) < 0.1 && t.position.z > -110) safe = false;
            }
            for(let b of this.entities.barriers) {
                if (Math.abs(b.position.x - ((lane-1)*CONFIG.laneWidth)) < 0.1 && b.position.z > -110) safe = false;
            }

            if (safe) {
                const r = Math.random();
                if (r < 0.45) {
                    // Train (45%)
                    const types = ['static', 'movingTowards', 'movingWith'];
                    this.createTrain(lane, types[Math.floor(Math.random()*types.length)]);
                    // Coins on roof
                    if(Math.random()>0.5) {
                        for(let i=0; i<4; i++) this.createCoin((lane-1)*CONFIG.laneWidth, CONFIG.trainHeight + 0.5, -105 - i*2.5);
                    }
                } else if (r < 0.65) {
                    // High Barrier (20%)
                    this.createBarrier(lane, 'high');
                    for(let i=0; i<3; i++) this.createCoin((lane-1)*CONFIG.laneWidth, 1, -102 - i*2);
                } else if (r < 0.85) {
                    // Low Barrier (20%)
                    this.createBarrier(lane, 'low');
                    for(let i=0; i<3; i++) this.createCoin((lane-1)*CONFIG.laneWidth, 2, -102 - i*2);
                } else if (r < 0.95) {
                    // Powerup (10%)
                    this.createPowerup(lane);
                } else {
                    // Just Coins (5%)
                    for(let i=0; i<5; i++) this.createCoin((lane-1)*CONFIG.laneWidth, 1, -100 - i*2);
                }
            }
        }
    }

    // --- PHYSICS & LOGIC ---

    updatePhysics() {
        // 1. Smooth Lane Movement (Lerp)
        this.player.position.x += (this.state.targetX - this.player.position.x) * 0.15;
        this.player.rotation.z = (this.state.targetX - this.player.position.x) * -0.1; // Tilt effect

        // 2. Vertical Physics (Gravity)
        this.player.position.y += this.state.velY;
        this.state.velY -= CONFIG.gravity;

        // 3. TRAIN CLIMBING LOGIC (THE FIX)
        let onTrainSurface = false;
        let currentTrainHeight = 0;
        let hitTrainSide = false;

        for (let t of this.entities.trains) {
            const dz = t.position.z - this.player.position.z; // Distance from player to train center
            const dx = Math.abs(t.position.x - this.player.position.x);
            
            // Check horizontal alignment
            if (dx < 1.5) {
                // Check if within train length
                // Train extends from t.z - length/2 to t.z + length/2
                if (dz < t.userData.length/2 && dz > -t.userData.length/2) {
                    
                    // CASE A: Player is ON TOP of the train
                    if (this.player.position.y >= t.userData.height - 0.5) {
                        onTrainSurface = true;
                        currentTrainHeight = t.userData.height;
                    } 
                    // CASE B: Player is in front/below and hitting the train
                    else if (dz > 0 && dz < t.userData.length/2 + 1) {
                        // If jumping high enough, climb up!
                        if (this.state.isJumping && this.player.position.y > t.userData.height - 1.5) {
                            this.player.position.y = t.userData.height;
                            this.state.velY = 0;
                            this.state.isJumping = false;
                            onTrainSurface = true;
                            currentTrainHeight = t.userData.height;
                        } else {
                            // Crash!
                            hitTrainSide = true;
                        }
                    }
                }
            }
        }

        if (hitTrainSide) {
            this.crash();
            return; // Stop physics update for this frame
        }

        if (onTrainSurface) {
            if (this.player.position.y <= currentTrainHeight) {
                this.player.position.y = currentTrainHeight;
                this.state.velY = 0;
                this.state.isJumping = false;
            }
        } else {
            // Ground logic
            if (this.player.position.y <= 0) {
                this.player.position.y = 0;
                this.state.velY = 0;
                this.state.isJumping = false;
            }
        }

        // 4. Roll Logic
        if (this.state.isRolling) {
            this.player.scale.y = 0.5;
            this.state.rollTimer--;
            if (this.state.rollTimer <= 0) {
                this.state.isRolling = false;
                this.player.scale.y = 1;
            }
        }

        // 5. Procedural Animation (Running)
        if (!this.state.isJumping && !this.state.isRolling) {
            const t = Date.now() * 0.015 * (this.state.speed / CONFIG.baseSpeed);
            this.limbs.legL.rotation.x = Math.sin(t) * 0.8;
            this.limbs.legR.rotation.x = -Math.sin(t) * 0.8;
            this.limbs.armL.rotation.x = -Math.sin(t) * 0.8;
            this.limbs.armR.rotation.x = Math.sin(t) * 0.8;
            if(!onTrainSurface) this.player.position.y = Math.abs(Math.sin(t*2)) * 0.1; // Bobbing
        } else if (this.state.isJumping) {
            this.limbs.legL.rotation.x = -0.5; this.limbs.legR.rotation.x = 0.2;
            this.limbs.armL.rotation.x = -2.5; this.limbs.armR.rotation.x = -2.5;
        } else if (this.state.isRolling) {
            this.limbs.legL.rotation.x = 1.5; this.limbs.legR.rotation.x = 1.5;
            this.limbs.armL.rotation.x = 0; this.limbs.armR.rotation.x = 0;
        }

        // 6. Move Entities & Collisions
        const speed = this.state.speed;

        // Trains
        for (let i = this.entities.trains.length - 1; i >= 0; i--) {
            let t = this.entities.trains[i];
            t.position.z += speed + t.userData.moveSpeed;
            if (t.position.z > 20) { this.scene.remove(t); this.entities.trains.splice(i, 1); }
        }

        // Barriers
        for (let i = this.entities.barriers.length - 1; i >= 0; i--) {
            let b = this.entities.barriers[i];
            b.position.z += speed;

            const dz = Math.abs(b.position.z - this.player.position.z);
            const dx = Math.abs(b.position.x - this.player.position.x);
            
            if (dz < 1.0 && dx < 1.2) {
                if (b.userData.type === 'barrier_high' && !this.state.isRolling) this.crash();
                if (b.userData.type === 'barrier_low' && this.player.position.y < 1.0) this.crash();
            }

            if (b.position.z > 20) { this.scene.remove(b); this.entities.barriers.splice(i, 1); }
        }

        // Coins
        for (let i = this.entities.coins.length - 1; i >= 0; i--) {
            let c = this.entities.coins[i];
            c.position.z += speed;
            c.rotation.z += 0.1;

            // Magnet Effect
            if (this.state.activePowerups.magnet > 0) {
                const dist = c.position.distanceTo(this.player.position);
                if (dist < 12) {
                    const dir = new THREE.Vector3().subVectors(this.player.position, c.position).normalize();
                    c.position.add(dir.multiplyScalar(0.8));
                }
            }

            // Collection
            const playerBox = new THREE.Vector3(this.player.position.x, this.player.position.y + 1, this.player.position.z);
            if (c.position.distanceTo(playerBox) < 1.5) {
                this.state.coins++;
                this.state.score += 5;
                this.updateUI();
                this.scene.remove(c);
                this.entities.coins.splice(i, 1);
            } else if (c.position.z > 10) {
                this.scene.remove(c);
                this.entities.coins.splice(i, 1);
            }
        }

        // Powerups
        for (let i = this.entities.powerups.length - 1; i >= 0; i--) {
            let p = this.entities.powerups[i];
            p.position.z += speed;
            p.rotation.y += 0.05;
            p.children[1].rotation.y -= 0.05;

            if (p.position.distanceTo(this.player.position) < 1.5) {
                this.activatePowerup(p.userData.type);
                this.scene.remove(p);
                this.entities.powerups.splice(i, 1);
            } else if (p.position.z > 10) {
                this.scene.remove(p);
                this.entities.powerups.splice(i, 1);
            }
        }

        // Powerup Timers
        if (this.state.activePowerups.magnet > 0) {
            this.state.activePowerups.magnet--;
            if (this.state.activePowerups.magnet <= 0) document.getElementById('pu-magnet').style.display = 'none';
        }

        // Environment Loop
        this.trackGroup.position.z += speed;
        if (this.trackGroup.position.z > 4) this.trackGroup.position.z = 0;

        // Difficulty Scaling
        this.state.speed = Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + (this.state.score * 0.0002));
        this.state.score += this.state.speed * 0.1;
        this.updateUI();
    }

    activatePowerup(type) {
        if (type === 'magnet') {
            this.state.activePowerups.magnet = 600; // ~10 seconds
            document.getElementById('pu-magnet').style.display = 'block';
        } else if (type === 'shield') {
            this.state.activePowerups.shield = true;
            this.shieldMesh.visible = true;
            document.getElementById('pu-shield').style.display = 'block';
        }
    }

    crash() {
        if (this.state.activePowerups.shield) {
            this.state.activePowerups.shield = false;
            this.shieldMesh.visible = false;
            document.getElementById('pu-shield').style.display = 'none';
            // Push back obstacles to prevent instant re-crash
            [...this.entities.trains, ...this.entities.barriers].forEach(o => o.position.z += 10);
            // Visual Flash
            const flash = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.5}));
            flash.position.z = -5; this.scene.add(flash);
            setTimeout(()=>this.scene.remove(flash), 100);
        } else {
            this.gameOver();
        }
    }

    // --- CONTROLS ---
    setupInputs() {
        window.addEventListener('keydown', (e) => {
            if (!this.state.isPlaying) return;
            if (e.key === 'ArrowLeft') this.moveLane(-1);
            if (e.key === 'ArrowRight') this.moveLane(1);
            if (e.key === 'ArrowUp') this.jump();
            if (e.key === 'ArrowDown') this.roll();
        });

        let tx = 0, ty = 0;
        document.addEventListener('touchstart', e => { 
            tx = e.changedTouches[0].screenX; 
            ty = e.changedTouches[0].screenY; 
        }, {passive:false});
        
        document.addEventListener('touchend', e => {
            if (!this.state.isPlaying) return;
            const dx = e.changedTouches[0].screenX - tx;
            const dy = e.changedTouches[0].screenY - ty;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 40) this.moveLane(1); 
                else if (dx < -40) this.moveLane(-1);
            } else {
                if (dy < -40) this.jump(); 
                else if (dy > 40) this.roll();
            }
        }, {passive:false});
    }

    moveLane(dir) {
        this.state.lane = Math.max(0, Math.min(2, this.state.lane + dir));
        this.state.targetX = (this.state.lane - 1) * CONFIG.laneWidth;
    }

    jump() {
        if (!this.state.isJumping) {
            this.state.velY = CONFIG.jumpForce;
            this.state.isJumping = true;
            this.state.isRolling = false; // Cancel roll
            this.player.scale.y = 1;
        }
    }

    roll() {
        if (!this.state.isRolling) {
            this.state.isRolling = true;
            this.state.rollTimer = 40;
            if (this.state.isJumping) this.state.velY = -0.8; // Fast fall
        }
    }

    // --- GAME FLOW ---
    start() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        
        this.state.isPlaying = true;
        this.state.score = 0;
        this.state.speed = CONFIG.baseSpeed;
        this.state.lane = 1;
        this.state.targetX = 0;
        this.state.velY = 0;
        this.state.isJumping = false;
        this.state.isRolling = false;
        this.player.position.set(0,0,0);
        this.player.scale.y = 1;
        
        // Apply Inventory
        if (this.state.inventory.magnet > 0) { 
            this.activatePowerup('magnet'); 
            this.state.inventory.magnet--; 
        }
        if (this.state.inventory.shield > 0) { 
            this.activatePowerup('shield'); 
            this.state.inventory.shield--; 
        }

        // Clear Entities
        [...this.entities.trains, ...this.entities.barriers, ...this.entities.coins, ...this.entities.powerups].forEach(o => this.scene.remove(o));
        this.entities = { trains: [], barriers: [], coins: [], powerups: [] };
        
        this.updateUI();
    }

    gameOver() {
        this.state.isPlaying = false;
        localStorage.setItem('subway_pro_coins', this.state.coins);
        document.getElementById('final-score').innerText = Math.floor(this.state.score);
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    showMenu() {
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        this.updateUI();
    }

    openShop() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('shop-modal').classList.remove('hidden');
        this.updateShopUI();
    }

    closeShop() {
        document.getElementById('shop-modal').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    buyItem(item, cost) {
        if (this.state.coins >= cost) {
            this.state.coins -= cost;
            this.state.inventory[item]++;
            localStorage.setItem('subway_pro_coins', this.state.coins);
            this.updateShopUI();
            this.updateUI();
        }
    }

    updateUI() {
        document.getElementById('score').innerText = Math.floor(this.state.score);
        document.getElementById('coins').innerText = this.state.coins;
    }

    updateShopUI() {
        document.getElementById('shop-coins').innerText = this.state.coins;
        document.getElementById('buy-magnet').disabled = this.state.coins < 50;
        document.getElementById('buy-shield').disabled = this.state.coins < 100;
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        if (this.state.isPlaying) {
            this.updatePhysics();
            this.spawnLogic();
        }
        this.renderer.render(this.scene, this.camera);
    }
}

// --- INITIALIZATION ---
const game = new SubwayGame();

// Button Listeners
document.getElementById('start-btn').onclick = () => game.start();
document.getElementById('retry-btn').onclick = () => game.start();
document.getElementById('menu-btn').onclick = () => game.showMenu();
document.getElementById('shop-btn').onclick = () => game.openShop();
document.getElementById('close-shop').onclick = () => game.closeShop();
document.getElementById('buy-magnet').onclick = () => game.buyItem('magnet', 50);
document.getElementById('buy-shield').onclick = () => game.buyItem('shield', 100);

</script>
