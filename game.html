<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner Pro - APK Ready</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Lalezar', cursive; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        
        /* UI Overlay - Modern Mobile Style */
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .hud-row { display: flex; justify-content: space-between; align-items: center; }
        .pill { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); padding: 8px 20px; border-radius: 30px; color: white; font-size: 22px; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .coin-icon { width: 20px; height: 20px; background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00); border-radius: 50%; border: 2px solid #fff; }
        
        /* Menus */
        .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; transition: opacity 0.3s; }
        .hidden { opacity: 0; pointer-events: none; }
        
        h1 { font-size: 70px; margin: 0; background: linear-gradient(to bottom, #FFD700, #FF4500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 5px 10px rgba(255, 69, 0, 0.5)); transform: rotate(-3deg); }
        h2 { color: #fff; font-weight: normal; margin-bottom: 40px; letter-spacing: 2px; }
        
        .btn-main { background: linear-gradient(135deg, #FF4500, #FF8C00); border: none; padding: 15px 60px; font-size: 30px; color: white; border-radius: 50px; cursor: pointer; font-family: 'Lalezar'; box-shadow: 0 10px 0 #B33000, 0 15px 30px rgba(0,0,0,0.5); transition: transform 0.1s; margin: 10px; }
        .btn-main:active { transform: translateY(10px); box-shadow: 0 0 0 #B33000; }
        
        .btn-sec { background: linear-gradient(135deg, #00C9FF, #92FE9D); box-shadow: 0 10px 0 #008B99; color: #004d4d; }
        .btn-sec:active { box-shadow: 0 0 0 #008B99; }

        /* Dizzy Effect */
        #fx-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; transition: all 0.2s; }
        .dizzy { animation: wobble 0.5s infinite; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.4) 100%); }
        @keyframes wobble { 0% { transform: rotate(0deg); } 25% { transform: rotate(1deg); } 75% { transform: rotate(-1deg); } 100% { transform: rotate(0deg); } }

    </style>
    <!-- Three.js for Real 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="fx-layer"></div>

    <div id="ui" class="hidden">
        <div class="hud-row">
            <div class="pill">امتیاز: <span id="score">0</span></div>
            <div class="pill"><div class="coin-icon"></div> <span id="coins">0</span></div>
        </div>
        <div style="text-align: center; color: rgba(255,255,255,0.7); font-size: 18px;">
            <span id="status">سلامت کامل</span>
        </div>
    </div>

    <div id="start-menu" class="menu">
        <h1>SUBWAY PRO</h1>
        <h2>نسخه نهایی APK</h2>
        <button class="btn-main" onclick="Game.start()">شروع دویدن</button>
        <div style="color: #888; margin-top: 30px; font-size: 14px;">کنترل: Swipe یا Arrow Keys</div>
    </div>

    <div id="game-over-menu" class="menu hidden">
        <h1 style="font-size: 50px; color: #ff4444; -webkit-text-fill-color: #ff4444;">GAME OVER</h1>
        <h2 id="final-score">امتیاز: 0</h2>
        <button class="btn-sec" onclick="Game.restart()">تلاش مجدد</button>
        <button class="btn-main" style="font-size: 20px; padding: 10px 40px;" onclick="UI.toMenu()">منو</button>
    </div>

<script>
/**
 * SUBWAY RUNNER PRO - HIGH PERFORMANCE ENGINE
 * Optimized for Mobile/APK conversion.
 * Features: Smooth Lerp, Moving Trains, Ramps, Coin Patterns, Side-Collision Logic.
 */

// --- CONFIGURATION ---
const CFG = {
    laneW: 3.5,
    speedBase: 0.4,
    speedMax: 1.1,
    jumpF: 0.38,
    grav: 0.018,
    colors: {
        sky: 0x87CEEB,
        ground: 0x222222,
        train: [0xFF3333, 0x33AAFF, 0xFFCC00], // Red, Blue, Yellow
        building: [0xFF6B6B, 0x4ECDC4, 0xFFE66D, 0xC7F464]
    }
};

// --- GLOBALS ---
let scene, cam, renderer;
let player, pGroup;
let world = { obs: [], coins: [], parts: [] };
let state = { 
    active: false, score: 0, coins: 0, speed: CFG.speedBase, 
    lane: 0, y: 0, vy: 0, jumping: false, sliding: false, 
    onObj: null, health: 2, dizzy: false 
};
let clock = new THREE.Clock();

// --- INIT ---
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(CFG.colors.sky);
    scene.fog = new THREE.FogExp2(CFG.colors.sky, 0.015);

    cam = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    cam.position.set(0, 4, 7);
    cam.lookAt(0, 1, -5);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lights
    const amb = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(amb);
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 50;
    sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
    scene.add(sun);

    createEnv();
    createPlayer();
    
    // Inputs
    window.addEventListener('resize', onResize);
    document.addEventListener('keydown', e => {
        if(!state.active) return;
        if(e.key === 'ArrowLeft') move(-1);
        if(e.key === 'ArrowRight') move(1);
        if(e.key === 'ArrowUp') jump();
        if(e.key === 'ArrowDown') slide();
    });
    
    let tx=0, ty=0;
    document.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
    document.addEventListener('touchend', e => {
        if(!state.active) return;
        const dx = e.changedTouches[0].clientX - tx;
        const dy = e.changedTouches[0].clientY - ty;
        if(Math.abs(dx) > Math.abs(dy)) { dx>30 ? move(1) : (dx<-30 ? move(-1) : 0); }
        else { dy<-30 ? jump() : (dy>30 ? slide() : 0); }
    });

    animate();
}

// --- ASSETS ---
function createEnv() {
    // Ground
    const gGeo = new THREE.PlaneGeometry(40, 200);
    const gMat = new THREE.MeshStandardMaterial({ color: CFG.colors.ground, roughness: 0.8 });
    const ground = new THREE.Mesh(gGeo, gMat);
    ground.rotation.x = -Math.PI/2;
    ground.position.z = -50;
    ground.receiveShadow = true;
    scene.add(ground);

    // Rails
    const rGeo = new THREE.BoxGeometry(0.2, 0.1, 200);
    const rMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
    [-CFG.laneW, 0, CFG.laneW].forEach(x => {
        const r1 = new THREE.Mesh(rGeo, rMat); r1.position.set(x-0.7, 0.05, -50); scene.add(r1);
        const r2 = new THREE.Mesh(rGeo, rMat); r2.position.set(x+0.7, 0.05, -50); scene.add(r2);
    });

    // Buildings (Instanced for performance would be better, but simple loop for now)
    const bGeo = new THREE.BoxGeometry(1, 1, 1);
    for(let i=0; i<40; i++) {
        const h = 10 + Math.random()*20;
        const mat = new THREE.MeshStandardMaterial({ color: CFG.colors.building[i%4] });
        const bL = new THREE.Mesh(bGeo, mat);
        bL.scale.set(6, h, 6);
        bL.position.set(-12 - Math.random()*5, h/2, -i*6);
        bL.castShadow = true; bL.receiveShadow = true;
        scene.add(bL);
        
        const bR = bL.clone();
        bR.position.set(12 + Math.random()*5, h/2, -i*6);
        scene.add(bR);
        
        world.parts.push(bL, bR);
    }
}

function createPlayer() {
    pGroup = new THREE.Group();
    
    // Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    body.position.y = 1.1; body.castShadow = true; pGroup.add(body);
    
    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
    head.position.y = 1.8; head.castShadow = true; pGroup.add(head);
    
    // Cap
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.5), new THREE.MeshStandardMaterial({ color: 0x0055ff }));
    cap.position.y = 2.05; pGroup.add(cap);
    
    // Legs
    const legGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const lL = new THREE.Mesh(legGeo, legMat); lL.position.set(-0.18, 0.35, 0); pGroup.add(lL);
    const lR = new THREE.Mesh(legGeo, legMat); lR.position.set(0.18, 0.35, 0); pGroup.add(lR);

    player = pGroup;
    scene.add(player);
}

// --- GAMEPLAY LOGIC ---
function spawnRow(z) {
    const type = Math.random();
    const lanes = [-1, 0, 1];
    
    // Pattern Generator (Ensuring playability)
    if (type < 0.3) {
        // Train with Ramp
        const l = lanes[Math.floor(Math.random()*3)];
        createTrain(l, z, false, true);
        // Coins on other lanes
        lanes.forEach(ol => { if(ol!==l) createCoinLine(ol, z); });
    } else if (type < 0.5) {
        // Moving Train (Danger)
        const l = lanes[Math.floor(Math.random()*3)];
        createTrain(l, z, true, false);
        lanes.forEach(ol => { if(ol!==l) createCoinLine(ol, z); });
    } else if (type < 0.7) {
        // Overhead Barrier (Slide under)
        const l = lanes[Math.floor(Math.random()*3)];
        createBarrier(l, z, 'high');
        lanes.forEach(ol => { if(ol!==l) createCoinLine(ol, z); });
    } else if (type < 0.85) {
        // Low Barrier (Jump over)
        const l = lanes[Math.floor(Math.random()*3)];
        createBarrier(l, z, 'low');
        lanes.forEach(ol => { if(ol!==l) createCoinLine(ol, z); });
    } else {
        // Just Coins (Rest)
        const l = lanes[Math.floor(Math.random()*3)];
        createCoinLine(l, z);
    }
}

function createTrain(lane, z, moving, hasRamp) {
    const geo = new THREE.BoxGeometry(2.6, 3.2, 14);
    const mat = new THREE.MeshStandardMaterial({ color: CFG.colors.train[Math.floor(Math.random()*3)], roughness: 0.3, metalness: 0.6 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(lane * CFG.laneW, 1.6, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    
    // Windows
    const win = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.8, 3), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    win.position.y = 0.5; mesh.add(win);

    // Ramp
    if (hasRamp) {
        const ramp = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 2), new THREE.MeshStandardMaterial({ color: 0x555555 }));
        ramp.position.set(0, -1.4, 6.5); // Front of train
        ramp.rotation.x = -0.4;
        mesh.add(ramp);
    }

    scene.add(mesh);
    world.obs.push({ mesh, type: 'train', lane, z, w: 2.6, h: 3.2, d: 14, speed: moving ? 0.25 : 0, hasRamp });
}

function createBarrier(lane, z, type) {
    const isHigh = type === 'high';
    const geo = new THREE.BoxGeometry(2.5, 1, 0.5);
    const mat = new THREE.MeshStandardMaterial({ color: isHigh ? 0xff0055 : 0xffaa00 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(lane * CFG.laneW, isHigh ? 2.2 : 0.5, z);
    mesh.castShadow = true;
    scene.add(mesh);
    world.obs.push({ mesh, type: 'barrier', sub: type, lane, z, w: 2.5, h: 1, d: 0.5, speed: 0 });
}

function createCoinLine(lane, z) {
    for(let i=0; i<6; i++) {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 1, roughness: 0.2 }));
        c.rotation.x = Math.PI/2;
        c.position.set(lane * CFG.laneW, 1, z - i*2);
        scene.add(c);
        world.coins.push({ mesh: c, z: z - i*2, active: true });
    }
}

// --- CONTROLS ---
function move(dir) { state.lane = Math.max(-1, Math.min(1, state.lane + dir)); }
function jump() { 
    if (!state.jumping && !state.sliding) {
        state.vy = CFG.jumpF;
        state.jumping = true;
        state.onObj = null; // Leave surface
    }
}
function slide() {
    if (!state.jumping && !state.sliding) {
        state.sliding = true;
        setTimeout(() => { state.sliding = false; player.scale.y = 1; player.position.y = state.onObj ? state.onObj.h/2 + 0.01 : 0; }, 800);
        player.scale.y = 0.5;
    }
}

function hit() {
    if (state.dizzy) {
        endGame();
    } else {
        state.health--;
        state.dizzy = true;
        state.speed *= 0.5;
        document.getElementById('fx-layer').classList.add('dizzy');
        document.getElementById('status').innerText = "سرگیجه! مراقب باش";
        document.getElementById('status').style.color = "#ff4444";
        
        setTimeout(() => {
            state.dizzy = false;
            state.speed = Math.min(state.speed * 2, CFG.speedMax);
            document.getElementById('fx-layer').classList.remove('dizzy');
            document.getElementById('status').innerText = "سلامت کامل";
            document.getElementById('status').style.color = "rgba(255,255,255,0.7)";
        }, 3000);
    }
}

// --- LOOP ---
function update() {
    if (!state.active) return;

    const dt = clock.getDelta();
    
    // Player X (Smooth)
    const targetX = state.lane * CFG.laneW;
    player.position.x += (targetX - player.position.x) * 0.2;
    player.rotation.z = (targetX - player.position.x) * 0.05;

    // Player Y (Physics)
    let groundY = 0;
    state.onObj = null;

    // Check Obstacles for "On Top" logic
    for (let o of world.obs) {
        o.z += (state.speed + o.speed);
        o.mesh.position.z = o.z;
        
        // Simple AABB for landing
        if (o.type === 'train') {
            const dz = Math.abs(o.z); // Player is at z=0
            const dx = Math.abs(player.position.x - o.mesh.position.x);
            
            if (dz < o.d/2 && dx < o.w/2) {
                // We are within train bounds horizontally
                if (player.position.y >= o.h/2 - 0.5 && state.vy <= 0) {
                    groundY = o.h/2;
                    state.onObj = o;
                }
            }
        }
    }

    if (state.jumping) {
        player.position.y += state.vy;
        state.vy -= CFG.grav;
        if (player.position.y <= groundY) {
            player.position.y = groundY;
            state.jumping = false;
            state.vy = 0;
        }
    } else {
        // Stick to ground or train
        player.position.y += (groundY - player.position.y) * 0.2;
    }

    // Slide Visuals
    if (state.sliding) {
        player.position.y = groundY; // Stay low
    }

    // Collisions
    const pBox = new THREE.Box3().setFromObject(player);
    pBox.expandByScalar(-0.2); // Forgiveness

    // Obstacles
    for (let i = world.obs.length - 1; i >= 0; i--) {
        let o = world.obs[i];
        if (o.z > 10) { scene.remove(o.mesh); world.obs.splice(i, 1); continue; }

        const oBox = new THREE.Box3().setFromObject(o.mesh);
        if (pBox.intersectsBox(oBox)) {
            // If we are on top, it's fine (handled above)
            if (state.onObj === o) continue;

            // Side vs Front
            const zDiff = Math.abs(o.z);
            if (zDiff < 1.5) {
                // Frontal hit
                if (o.type === 'barrier' && o.sub === 'high' && state.sliding) continue; // Slide under
                if (o.type === 'barrier' && o.sub === 'low' && player.position.y > 1) continue; // Jump over
                
                endGame();
            } else {
                // Side clip
                hit();
                // Push player away slightly
                player.position.x += (player.position.x > o.mesh.position.x ? 1 : -1);
            }
        }
    }

    // Coins
    for (let i = world.coins.length - 1; i >= 0; i--) {
        let c = world.coins[i];
        c.z += state.speed;
        c.mesh.position.z = c.z;
        c.mesh.rotation.z += 0.1;

        if (c.z > 10) { scene.remove(c.mesh); world.coins.splice(i, 1); continue; }

        const cBox = new THREE.Box3().setFromObject(c.mesh);
        if (pBox.intersectsBox(cBox)) {
            scene.remove(c.mesh);
            world.coins.splice(i, 1);
            state.coins++;
            state.score += 10;
            UI.update();
        }
    }

    // World Scroll
    world.parts.forEach(p => {
        p.position.z += state.speed;
        if (p.position.z > 10) p.position.z -= 240; // Loop buildings
    });

    // Spawning
    if (world.obs.length < 5 && Math.random() < 0.05) {
        spawnRow(-80);
    }

    // Speed Up
    state.speed = Math.min(state.speed + 0.0001, CFG.speedMax);
    state.score += state.speed;
    UI.update();

    // Camera Follow
    cam.position.x += (player.position.x * 0.3 - cam.position.x) * 0.1;
    cam.lookAt(player.position.x * 0.5, 1, -5);
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, cam);
}

function onResize() {
    cam.aspect = window.innerWidth / window.innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- GAME CONTROL ---
const Game = {
    start: () => {
        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('game-over-menu').classList.add('hidden');
        document.getElementById('ui').classList.remove('hidden');
        
        // Reset
        world.obs.forEach(o => scene.remove(o.mesh)); world.obs = [];
        world.coins.forEach(c => scene.remove(c.mesh)); world.coins = [];
        
        state.score = 0; state.coins = 0; state.speed = CFG.speedBase;
        state.lane = 0; state.y = 0; state.vy = 0; state.jumping = false; state.sliding = false;
        state.health = 2; state.dizzy = false;
        
        player.position.set(0,0,0);
        player.scale.set(1,1,1);
        
        state.active = true;
        clock.start();
    },
    restart: () => Game.start(),
    over: () => {
        state.active = false;
        document.getElementById('final-score').innerText = "امتیاز: " + Math.floor(state.score);
        document.getElementById('game-over-menu').classList.remove('hidden');
        document.getElementById('ui').classList.add('hidden');
    }
};
// Alias for HTML onclick
function endGame() { Game.over(); }

const UI = {
    update: () => {
        document.getElementById('score').innerText = Math.floor(state.score);
        document.getElementById('coins').innerText = state.coins;
    },
    toMenu: () => {
        document.getElementById('game-over-menu').classList.add('hidden');
        document.getElementById('start-menu').classList.remove('hidden');
    }
};

init();

</script>
</body>
</html>
