<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D - WebGL Ultimate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Tahoma', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .score-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 60px;
            color: #FFD700;
            text-shadow: 0 0 20px #FF4500;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-style: italic;
        }

        button {
            background: linear-gradient(45deg, #FF4500, #FFD700);
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.4);
            transition: transform 0.2s;
            margin-top: 20px;
        }

        button:hover { transform: scale(1.1); }
        button:active { transform: scale(0.95); }

        .hidden { display: none !important; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 20px;
        }
    </style>
    <!-- Import Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">در حال بارگذاری موتور 3D...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer" class="hidden">
        <div class="hud-top">
            <div class="score-box">امتیاز: <span id="score">0</span></div>
            <div class="score-box">سکه: <span id="coins">0</span></div>
        </div>
    </div>

    <div id="start-screen">
        <h1>SUBWAY 3D</h1>
        <p style="color: #ccc; font-size: 18px;">نسخه وب‌گل واقعی</p>
        <button id="start-btn">شروع دویدن</button>
        <p style="color: #888; margin-top: 20px; font-size: 14px;">کنترل: چپ/راست/بالا/پایین یا Swipe</p>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 style="color: #ff4444;">GAME OVER</h1>
        <p style="color: white; font-size: 24px;">امتیاز: <span id="final-score">0</span></p>
        <button id="restart-btn">تلاش دوباره</button>
    </div>

<script>
/**
 * SUBWAY SURFERS 3D - WEBGL ENGINE
 * Using Three.js for real 3D rendering, lighting, and shadows.
 */

// --- CONFIGURATION ---
const LANE_WIDTH = 3;
const SPEED_START = 0.5;
const SPEED_MAX = 1.2;
const JUMP_FORCE = 0.35;
const GRAVITY = 0.015;

// --- GLOBALS ---
let scene, camera, renderer;
let player, playerMixer;
let obstacles = [];
let coins = [];
let buildings = [];
let particles = [];
let gameActive = false;
let score = 0;
let coinCount = 0;
let speed = SPEED_START;
let lane = 0; // -1, 0, 1
let verticalVelocity = 0;
let isJumping = false;
let isSliding = false;
let slideTimer = 0;
let distance = 0;

// --- INITIALIZATION ---
function init() {
    // Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sky Blue
    scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

    // Camera
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 5, 8);
    camera.lookAt(0, 0, -5);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -20;
    dirLight.shadow.camera.right = 20;
    dirLight.shadow.camera.top = 20;
    dirLight.shadow.camera.bottom = -20;
    scene.add(dirLight);

    // Create World
    createEnvironment();
    createPlayer();

    // Event Listeners
    window.addEventListener('resize', onWindowResize, false);
    document.addEventListener('keydown', handleInput);
    
    // Touch Controls
    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, false);
    document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 30) moveRight();
            else if (dx < -30) moveLeft();
        } else {
            if (dy < -30) jump();
            else if (dy > 30) slide();
        }
    }, false);

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', resetGame);

    document.getElementById('loading').style.display = 'none';
    animate();
}

// --- OBJECT CREATION ---

function createEnvironment() {
    // Ground (Tracks)
    const groundGeo = new THREE.PlaneGeometry(20, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -50;
    ground.receiveShadow = true;
    scene.add(ground);

    // Rails
    const railGeo = new THREE.BoxGeometry(0.2, 0.1, 200);
    const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
    [-LANE_WIDTH, 0, LANE_WIDTH].forEach(x => {
        const rail1 = new THREE.Mesh(railGeo, railMat);
        rail1.position.set(x - 0.5, 0.05, -50);
        scene.add(rail1);
        const rail2 = new THREE.Mesh(railGeo, railMat);
        rail2.position.set(x + 0.5, 0.05, -50);
        scene.add(rail2);
    });

    // Buildings (Procedural City)
    const buildingGeo = new THREE.BoxGeometry(4, 10, 4);
    for(let i=0; i<20; i++) {
        const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
        const bLeft = new THREE.Mesh(buildingGeo, mat);
        bLeft.position.set(-8 - Math.random()*5, 5, -i * 10);
        bLeft.castShadow = true;
        bLeft.receiveShadow = true;
        scene.add(bLeft);
        buildings.push(bLeft);

        const bRight = new THREE.Mesh(buildingGeo, mat);
        bRight.position.set(8 + Math.random()*5, 5, -i * 10);
        bRight.castShadow = true;
        bRight.receiveShadow = true;
        scene.add(bRight);
        buildings.push(bRight);
    }
}

function createPlayer() {
    // Simple Humanoid Shape
    const group = new THREE.Group();

    // Body
    const bodyGeo = new THREE.BoxGeometry(0.8, 1, 0.5);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x000000 }); // Black Hoodie
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    group.add(body);

    // Head
    const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa }); // Skin
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.0;
    head.castShadow = true;
    group.add(head);

    // Cap
    const capGeo = new THREE.BoxGeometry(0.6, 0.2, 0.6);
    const capMat = new THREE.MeshStandardMaterial({ color: 0x0000ff }); // Blue Cap
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.y = 2.3;
    group.add(cap);

    // Legs
    const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const legL = new THREE.Mesh(legGeo, legMat);
    legL.position.set(-0.2, 0.4, 0);
    legL.castShadow = true;
    group.add(legL);
    
    const legR = new THREE.Mesh(legGeo, legMat);
    legR.position.set(0.2, 0.4, 0);
    legR.castShadow = true;
    group.add(legR);

    player = group;
    scene.add(player);
}

function spawnObstacle() {
    const type = Math.random();
    const lanePos = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
    const zPos = -60; // Spawn far away

    if (type < 0.4) {
        // Train
        const trainGeo = new THREE.BoxGeometry(2.5, 3, 12);
        const trainMat = new THREE.MeshStandardMaterial({ 
            color: Math.random() > 0.5 ? 0xff0000 : 0xffff00, // Red or Yellow
            roughness: 0.4,
            metalness: 0.6
        });
        const train = new THREE.Mesh(trainGeo, trainMat);
        train.position.set(lanePos * LANE_WIDTH, 1.5, zPos);
        train.castShadow = true;
        train.receiveShadow = true;
        
        // Windows
        const winGeo = new THREE.BoxGeometry(2.6, 1, 2);
        const winMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const win = new THREE.Mesh(winGeo, winMat);
        win.position.y = 0.5;
        train.add(win);

        scene.add(train);
        obstacles.push({ mesh: train, type: 'train', lane: lanePos, z: zPos, w: 2.5, h: 3, d: 12 });
    } else if (type < 0.7) {
        // Low Barrier
        const barGeo = new THREE.BoxGeometry(2, 1, 0.5);
        const barMat = new THREE.MeshStandardMaterial({ color: 0xffa500 });
        const bar = new THREE.Mesh(barGeo, barMat);
        bar.position.set(lanePos * LANE_WIDTH, 0.5, zPos);
        bar.castShadow = true;
        scene.add(bar);
        obstacles.push({ mesh: bar, type: 'low', lane: lanePos, z: zPos, w: 2, h: 1, d: 0.5 });
    } else {
        // Coin Line
        for(let i=0; i<5; i++) {
            const coinGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 1, roughness: 0.3 });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(lanePos * LANE_WIDTH, 1, zPos - i * 2);
            coin.castShadow = true;
            scene.add(coin);
            coins.push({ mesh: coin, lane: lanePos, z: zPos - i * 2, active: true });
        }
    }
}

// --- GAME LOGIC ---

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('hidden');
    gameActive = true;
    score = 0;
    coinCount = 0;
    speed = SPEED_START;
    lane = 0;
    player.position.set(0, 0, 0);
    updateUI();
}

function resetGame() {
    // Clear obstacles
    obstacles.forEach(o => scene.remove(o.mesh));
    obstacles = [];
    coins.forEach(c => scene.remove(c.mesh));
    coins = [];
    
    document.getElementById('game-over-screen').classList.add('hidden');
    startGame();
}

function gameOver() {
    gameActive = false;
    document.getElementById('final-score').innerText = Math.floor(score);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('ui-layer').classList.add('hidden');
}

function moveLeft() { if (lane > -1) lane--; }
function moveRight() { if (lane < 1) lane++; }
function jump() { 
    if (!isJumping && !isSliding) {
        verticalVelocity = JUMP_FORCE;
        isJumping = true;
    }
}
function slide() {
    if (!isJumping && !isSliding) {
        isSliding = true;
        slideTimer = 30; // Frames
        player.scale.y = 0.5;
        player.position.y = -0.5;
    }
}

function handleInput(e) {
    if (!gameActive) return;
    switch(e.key) {
        case 'ArrowLeft': moveLeft(); break;
        case 'ArrowRight': moveRight(); break;
        case 'ArrowUp': jump(); break;
        case 'ArrowDown': slide(); break;
    }
}

function updatePhysics() {
    // Lane Movement (Smooth)
    const targetX = lane * LANE_WIDTH;
    player.position.x += (targetX - player.position.x) * 0.2;

    // Jump / Gravity
    if (isJumping) {
        player.position.y += verticalVelocity;
        verticalVelocity -= GRAVITY;
        if (player.position.y <= 0) {
            player.position.y = 0;
            isJumping = false;
            verticalVelocity = 0;
        }
    }

    // Slide
    if (isSliding) {
        slideTimer--;
        if (slideTimer <= 0) {
            isSliding = false;
            player.scale.y = 1;
            player.position.y = 0;
        }
    }

    // Running Animation (Simple Bobbing)
    if (!isJumping && !isSliding) {
        player.position.y = Math.abs(Math.sin(Date.now() * 0.015)) * 0.2;
        player.rotation.z = (targetX - player.position.x) * 0.1; // Tilt
    } else {
        player.rotation.z = 0;
    }
}

function checkCollisions() {
    const playerBox = new THREE.Box3().setFromObject(player);
    // Shrink box slightly for forgiveness
    playerBox.expandByScalar(-0.2);

    // Obstacles
    for (let o of obstacles) {
        o.z += speed;
        o.mesh.position.z = o.z;

        const obsBox = new THREE.Box3().setFromObject(o.mesh);
        if (playerBox.intersectsBox(obsBox)) {
            // Allow jumping over low barriers
            if (o.type === 'low' && player.position.y > 1) continue;
            // Allow sliding under... (if we had high barriers)
            
            gameOver();
        }
    }

    // Coins
    for (let c of coins) {
        if (!c.active) continue;
        c.z += speed;
        c.mesh.position.z = c.z;
        c.mesh.rotation.z += 0.1;

        const coinBox = new THREE.Box3().setFromObject(c.mesh);
        if (playerBox.intersectsBox(coinBox)) {
            c.active = false;
            scene.remove(c.mesh);
            coinCount++;
            score += 10;
            updateUI();
        }
    }

    // Cleanup
    obstacles = obstacles.filter(o => o.z < 10);
    coins = coins.filter(c => c.z < 10 && c.active);
}

function updateWorld() {
    // Move Buildings to simulate infinite runner
    buildings.forEach(b => {
        b.position.z += speed;
        if (b.position.z > 10) {
            b.position.z = -60;
            b.material.color.setHex(Math.random() * 0xffffff);
        }
    });

    // Spawn Logic
    if (Math.random() < 0.03) {
        spawnObstacle();
    }

    // Increase Speed
    speed = Math.min(speed + 0.0001, SPEED_MAX);
    score += speed;
    updateUI();
}

function updateUI() {
    document.getElementById('score').innerText = Math.floor(score);
    document.getElementById('coins').innerText = coinCount;
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);

    if (gameActive) {
        updatePhysics();
        updateWorld();
        checkCollisions();
        
        // Camera Follow
        camera.position.x += (player.position.x * 0.5 - camera.position.x) * 0.1;
    }

    renderer.render(scene, camera);
}

// Start
init();

</script>
</body>
</html>
