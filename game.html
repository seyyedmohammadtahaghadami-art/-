<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Subway Runner Pro V3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;font-family:'Lalezar',cursive;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
.hud-top{display:flex;justify-content:space-between;padding:14px 18px;font-size:26px;color:#fff;text-shadow:2px 2px 5px #000}
.stat-box{background:rgba(0,0,0,.5);padding:7px 18px;border-radius:25px;border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);display:flex;align-items:center;gap:7px}
.coin-icon{color:#FFD700;font-size:28px}
#powerups{position:absolute;top:75px;right:16px;display:flex;flex-direction:column;gap:6px}
.pu-badge{background:rgba(0,220,255,.35);border:2px solid #0df;padding:6px 14px;border-radius:12px;color:#fff;font-size:16px;display:none;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.menu-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,rgba(25,20,35,.92) 0%,rgba(0,0,0,.97) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;z-index:10;transition:opacity .35s}
.hidden{opacity:0;pointer-events:none}
h1{font-size:58px;color:#FFD700;text-shadow:0 0 30px #FFD700,3px 3px 0 #b33;letter-spacing:3px}
h2{font-size:38px;color:#ff4757;margin:8px 0;text-shadow:2px 2px 0 #000}
p{color:#eee;font-size:20px;margin-bottom:25px;text-shadow:1px 1px 2px #000}
.subtitle{font-size:16px;color:#aaa;margin-top:-15px;margin-bottom:30px}
button{background:linear-gradient(to bottom,#ff9f43,#ee5253);border:3px solid #fff;padding:12px 48px;color:#fff;font-size:26px;font-family:'Lalezar',cursive;border-radius:45px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.5);transition:.2s;margin:7px}
button:hover{transform:scale(1.04) translateY(-3px)}
button:active{transform:scale(.96)}
.btn-secondary{background:linear-gradient(to bottom,#576574,#222f3e);font-size:20px;padding:10px 32px}
#shop-modal{background:rgba(0,0,0,.9);z-index:20}
.shop-panel{background:#2c3e50;padding:30px;border-radius:24px;border:4px solid #f1c40f;text-align:center;width:88%;max-width:460px}
.shop-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.08);padding:14px;margin:14px 0;border-radius:12px;color:#fff;font-size:20px}
.buy-btn{background:#27ae60;border:none;padding:8px 18px;border-radius:16px;cursor:pointer;color:#fff;font-family:'Lalezar';font-size:17px}
.buy-btn:disabled{background:#777;cursor:not-allowed}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui-layer">
  <div class="hud-top">
    <div class="stat-box">امتیاز: <span id="score">0</span></div>
    <div class="stat-box"><span class="coin-icon">🪙</span> <span id="coins">0</span></div>
  </div>
  <div id="powerups">
    <div id="pu-magnet" class="pu-badge">آهنربا!</div>
    <div id="pu-shield" class="pu-badge">سپر!</div>
  </div>
</div>
<div id="start-screen" class="menu-screen">
  <h1>SUBWAY PRO</h1>
  <p class="subtitle">نسخه اصلاح‌شده حرکت + ظاهر نرم‌تر</p>
  <button id="start-btn">شروع دویدن</button>
  <button id="shop-btn" class="btn-secondary">فروشگاه</button>
  <p style="font-size:15px;margin-top:20px;opacity:.7">Swipe یا Arrow Keys</p>
</div>
<div id="shop-modal" class="menu-screen hidden">
  <div class="shop-panel">
    <h2>فروشگاه</h2>
    <p>سکه: <span id="shop-coins" style="color:#f1c40f">0</span></p>
    <div class="shop-item"><span>آهنربا</span><button class="buy-btn" id="buy-magnet">50</button></div>
    <div class="shop-item"><span>سپر</span><button class="buy-btn" id="buy-shield">100</button></div>
    <button id="close-shop" class="btn-secondary" style="margin-top:20px">بستن</button>
  </div>
</div>
<div id="game-over-screen" class="menu-screen hidden">
  <h1 style="color:#ff4757">GAME OVER</h1>
  <p>امتیاز: <span id="final-score">0</span></p>
  <button id="retry-btn">دوباره</button>
  <button id="menu-btn" class="btn-secondary">منو</button>
</div>

<script>
const CONFIG = {
  laneWidth: 3.6,
  baseSpeed: 0.52,
  maxSpeed: 2.0,
  jumpForce: 0.68,
  gravity: 0.032,
  trainHeight: 3.3
};

class SubwayGame {
  constructor() {
    this.state = {
      isPlaying: false,
      score: 0,
      coins: parseInt(localStorage.getItem('sp_v3_coins')) || 0,
      speed: CONFIG.baseSpeed,
      lane: 1,
      targetX: 0,
      velY: 0,
      isJumping: false,
      isRolling: false,
      rollTimer: 0,
      inventory: { magnet: 0, shield: 0 },
      activePowerups: { magnet: 0, shield: false },
      // برای کنترل نرم‌تر حرکت
      laneCooldown: 0
    };
    this.entities = { trains: [], barriers: [], coins: [], powerups: [] };
    this.buildings = [];
    this.initThree();
    this.createWorld();
    this.createPlayer();
    this.setupInputs();
    this.updateUI();
    this.animate();
  }

  initThree() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x87CEEB);
    this.scene.fog = new THREE.FogExp2(0x87CEEB, 0.0085);

    this.camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 220);
    this.camera.position.set(0, 6.2, 11.5);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(this.renderer.domElement);

    // نور گرم و نرم
    const hemi = new THREE.HemisphereLight(0xfff4e0, 0x4a5568, 0.75);
    this.scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff0cc, 1.1);
    sun.position.set(20, 45, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1536, 1536);
    sun.shadow.camera.left = -35;
    sun.shadow.camera.right = 35;
    sun.shadow.camera.top = 35;
    sun.shadow.camera.bottom = -35;
    this.scene.add(sun);

    const fill = new THREE.DirectionalLight(0xffc888, 0.3);
    fill.position.set(-15, 12, -8);
    this.scene.add(fill);

    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  createWorld() {
    // زمین
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 450),
      new THREE.MeshStandardMaterial({ color: 0x2d2d2d, roughness: 0.92 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -100;
    ground.receiveShadow = true;
    this.scene.add(ground);

    // ریل‌ها
    this.trackGroup = new THREE.Group();
    const railMat = new THREE.MeshStandardMaterial({ color: 0x6a6a6a, metalness: 0.8, roughness: 0.3 });
    const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });

    for (let i = -1; i <= 1; i++) {
      const off = i * CONFIG.laneWidth;
      const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 450), railMat);
      r1.position.set(off - 0.9, 0.05, -100);
      const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 450), railMat);
      r2.position.set(off + 0.9, 0.05, -100);
      this.trackGroup.add(r1, r2);
    }
    for (let j = 0; j < 120; j++) {
      const s = new THREE.Mesh(new THREE.BoxGeometry(12, 0.14, 0.5), sleeperMat);
      s.position.set(0, 0.02, -j * 3.7);
      this.trackGroup.add(s);
    }
    this.scene.add(this.trackGroup);

    // ساختمان‌های کناری (ساده‌تر و کمتر شلوغ)
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 14; i++) {
        const h = 12 + Math.random() * 16;
        const b = new THREE.Mesh(
          new THREE.BoxGeometry(7 + Math.random() * 4, h, 9 + Math.random() * 5),
          new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.35, 0.35 + Math.random() * 0.15),
            roughness: 0.85
          })
        );
        b.position.set(side * (13 + Math.random() * 4), h / 2, -i * 26 - Math.random() * 10);
        b.castShadow = true;
        b.receiveShadow = true;
        this.scene.add(b);
        this.buildings.push(b);
      }
    }
  }

  // شخصیت نرم‌تر (کمتر بلوکی)
  createPlayer() {
    this.player = new THREE.Group();

    const skin = new THREE.MeshStandardMaterial({ color: 0xf0c8a8, roughness: 0.5 });
    const hoodie = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.65 });
    const cap = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.35 });
    const pants = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.55 });
    const shoeW = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.25 });
    const shoeB = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.35 });

    // بدن (استوانه‌ای‌تر برای نرم بودن)
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, 1.1, 12), hoodie);
    torso.position.y = 1.4;
    torso.castShadow = true;
    this.player.add(torso);

    // سر
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 12), skin);
    head.position.y = 2.2;
    head.castShadow = true;
    this.player.add(head);

    // کلاه
    const capBase = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.38, 0.16, 14), cap);
    capBase.position.y = 2.42;
    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.4), cap);
    brim.position.set(0, 2.36, -0.3);
    this.player.add(capBase, brim);

    // بازوها
    this.limbs = {};
    const armGeo = new THREE.CylinderGeometry(0.12, 0.13, 0.8, 8);

    this.limbs.armL = new THREE.Group();
    this.limbs.armL.position.set(-0.55, 1.75, 0);
    const aL = new THREE.Mesh(armGeo, hoodie);
    aL.position.y = -0.38;
    aL.castShadow = true;
    this.limbs.armL.add(aL);
    this.player.add(this.limbs.armL);

    this.limbs.armR = new THREE.Group();
    this.limbs.armR.position.set(0.55, 1.75, 0);
    const aR = new THREE.Mesh(armGeo, hoodie);
    aR.position.y = -0.38;
    aR.castShadow = true;
    this.limbs.armR.add(aR);
    this.player.add(this.limbs.armR);

    // پاها
    const legGeo = new THREE.CylinderGeometry(0.14, 0.15, 0.9, 8);

    this.limbs.legL = new THREE.Group();
    this.limbs.legL.position.set(-0.22, 0.8, 0);
    const lL = new THREE.Mesh(legGeo, pants);
    lL.position.y = -0.42;
    lL.castShadow = true;
    this.limbs.legL.add(lL);
    // کفش
    const sL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.18, 0.48), shoeW);
    sL.position.set(0, -0.9, 0.02);
    const stL = new THREE.Mesh(new THREE.BoxGeometry(0.33, 0.1, 0.18), shoeB);
    stL.position.set(0, -0.86, -0.04);
    this.limbs.legL.add(sL, stL);
    this.player.add(this.limbs.legL);

    this.limbs.legR = new THREE.Group();
    this.limbs.legR.position.set(0.22, 0.8, 0);
    const lR = new THREE.Mesh(legGeo, pants);
    lR.position.y = -0.42;
    lR.castShadow = true;
    this.limbs.legR.add(lR);
    const sR = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.18, 0.48), shoeW);
    sR.position.set(0, -0.9, 0.02);
    const stR = new THREE.Mesh(new THREE.BoxGeometry(0.33, 0.1, 0.18), shoeB);
    stR.position.set(0, -0.86, -0.04);
    this.limbs.legR.add(sR, stR);
    this.player.add(this.limbs.legR);

    // سپر
    this.shieldMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.25, wireframe: true })
    );
    this.shieldMesh.visible = false;
    this.player.add(this.shieldMesh);

    this.scene.add(this.player);
  }

  createTrain(lane, type) {
    const g = new THREE.Group();
    const len = 13 + Math.random() * 11;
    const cols = [0xd63031, 0xfdcb6e, 0x0984e3];
    const col = cols[Math.floor(Math.random() * 3)];

    const bodyMat = new THREE.MeshStandardMaterial({ color: col, metalness: 0.5, roughness: 0.28 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.7, CONFIG.trainHeight, len), bodyMat);
    body.position.y = CONFIG.trainHeight / 2;
    body.castShadow = true;
    body.receiveShadow = true;
    g.add(body);

    // سقف
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(2.85, 0.2, len + 0.15),
      new THREE.MeshStandardMaterial({ color: 0xd0d0d0, metalness: 0.55, roughness: 0.3 })
    );
    roof.position.y = CONFIG.trainHeight + 0.05;
    g.add(roof);

    // پنجره‌ها
    const winMat = new THREE.MeshStandardMaterial({ color: 0x1a2535, metalness: 0.85, roughness: 0.15 });
    const wins = Math.floor(len / 2.7);
    for (let i = 0; i < wins; i++) {
      const z = -len / 2 + 1.6 + i * 2.7;
      const wL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.05, 1.5), winMat);
      wL.position.set(-1.36, CONFIG.trainHeight * 0.6, z);
      const wR = wL.clone();
      wR.position.x = 1.36;
      g.add(wL, wR);
    }

    // نوار سفید
    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(2.72, 0.22, len * 0.85),
      new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.4 })
    );
    stripe.position.y = CONFIG.trainHeight * 0.25;
    g.add(stripe);

    let moveSpeed = 0;
    if (type === 'movingTowards') moveSpeed = -(CONFIG.baseSpeed + 1.3);
    if (type === 'movingWith') moveSpeed = CONFIG.baseSpeed - 0.22;

    g.position.set((lane - 1) * CONFIG.laneWidth, 0, -105);
    g.userData = { type: 'train', length: len, moveSpeed, height: CONFIG.trainHeight };
    this.scene.add(g);
    this.entities.trains.push(g);
  }

  createBarrier(lane, high) {
    const g = new THREE.Group();
    if (high) {
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 0.4, 0.45),
        new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.35 })
      );
      bar.position.y = 1.5;
      bar.castShadow = true;
      const leg = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.1, 1.5),
        new THREE.MeshStandardMaterial({ color: 0x444 })
      );
      leg.position.set(-0.95, 0.75, 0);
      const leg2 = leg.clone();
      leg2.position.x = 0.95;
      g.add(bar, leg, leg2);
      g.userData = { type: 'barrier_high' };
    } else {
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 0.95, 0.5),
        new THREE.MeshStandardMaterial({ color: 0xe67e22, metalness: 0.3 })
      );
      bar.position.y = 0.5;
      bar.castShadow = true;
      g.add(bar);
      g.userData = { type: 'barrier_low' };
    }
    g.position.set((lane - 1) * CONFIG.laneWidth, 0, -105);
    this.scene.add(g);
    this.entities.barriers.push(g);
  }

  createCoin(x, y, z) {
    const coin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.38, 0.38, 0.08, 16),
      new THREE.MeshStandardMaterial({
        color: 0xFFD700,
        metalness: 0.92,
        roughness: 0.18,
        emissive: 0x443300,
        emissiveIntensity: 0.2
      })
    );
    coin.rotation.x = Math.PI / 2;
    coin.position.set(x, y, z);
    coin.castShadow = true;
    this.scene.add(coin);
    this.entities.coins.push(coin);
  }

  createPowerup(lane) {
    const type = Math.random() > 0.5 ? 'magnet' : 'shield';
    const color = type === 'magnet' ? 0xff2244 : 0x00e5ff;
    const g = new THREE.Group();
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.75, 0.75, 0.75),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 })
    );
    g.add(box);
    g.position.set((lane - 1) * CONFIG.laneWidth, 1.5, -105);
    g.userData = { type };
    this.scene.add(g);
    this.entities.powerups.push(g);
  }

  spawnLogic() {
    if (Math.random() < 0.03 + this.state.speed * 0.004) {
      const lane = Math.floor(Math.random() * 3);
      let safe = true;
      for (const t of this.entities.trains) {
        if (Math.abs(t.position.x - (lane - 1) * CONFIG.laneWidth) < 0.2 && t.position.z > -115) safe = false;
      }
      for (const b of this.entities.barriers) {
        if (Math.abs(b.position.x - (lane - 1) * CONFIG.laneWidth) < 0.2 && b.position.z > -115) safe = false;
      }
      if (!safe) return;

      const r = Math.random();
      if (r < 0.4) {
        const types = ['static', 'movingTowards', 'movingWith'];
        this.createTrain(lane, types[Math.floor(Math.random() * 3)]);
        if (Math.random() > 0.45) {
          for (let i = 0; i < 4; i++)
            this.createCoin((lane - 1) * CONFIG.laneWidth, CONFIG.trainHeight + 0.5, -110 - i * 2.3);
        }
      } else if (r < 0.6) {
        this.createBarrier(lane, true);
        for (let i = 0; i < 3; i++) this.createCoin((lane - 1) * CONFIG.laneWidth, 1, -108 - i * 2);
      } else if (r < 0.8) {
        this.createBarrier(lane, false);
        for (let i = 0; i < 3; i++) this.createCoin((lane - 1) * CONFIG.laneWidth, 2, -108 - i * 2);
      } else if (r < 0.92) {
        this.createPowerup(lane);
      } else {
        for (let i = 0; i < 5; i++) this.createCoin((lane - 1) * CONFIG.laneWidth, 1, -105 - i * 2);
      }
    }
  }

  // ========== فیزیک اصلاح‌شده (باگ حرکت و پرش) ==========
  updatePhysics() {
    // حرکت نرم لاین (حتی موقع پرش)
    const lerpSpeed = this.state.isJumping ? 0.12 : 0.18;
    this.player.position.x += (this.state.targetX - this.player.position.x) * lerpSpeed;
    this.player.rotation.z = (this.state.targetX - this.player.position.x) * -0.08;

    // گرانش
    this.player.position.y += this.state.velY;
    this.state.velY -= CONFIG.gravity;

    // تشخیص سطح قطار
    let onTrain = false;
    let trainH = 0;
    let hitSide = false;

    for (const t of this.entities.trains) {
      const dx = Math.abs(t.position.x - this.player.position.x);
      const dz = t.position.z - this.player.position.z;
      const half = t.userData.length / 2;

      if (dx < 1.4 && dz < half && dz > -half) {
        // روی سقف
        if (this.player.position.y >= t.userData.height - 0.6) {
          onTrain = true;
          trainH = t.userData.height;
        }
        // برخورد از جلو
        else if (dz > 0 && dz < half + 0.9) {
          if (this.state.isJumping && this.player.position.y > t.userData.height - 1.5) {
            // پرش موفق روی قطار
            this.player.position.y = t.userData.height;
            this.state.velY = 0;
            this.state.isJumping = false;
            onTrain = true;
            trainH = t.userData.height;
          } else {
            hitSide = true;
          }
        }
      }
    }

    if (hitSide) {
      this.crash();
      return;
    }

    if (onTrain) {
      if (this.player.position.y <= trainH) {
        this.player.position.y = trainH;
        this.state.velY = 0;
        this.state.isJumping = false;
      }
    } else {
      if (this.player.position.y <= 0) {
        this.player.position.y = 0;
        this.state.velY = 0;
        this.state.isJumping = false;
      }
    }

    // غلت
    if (this.state.isRolling) {
      this.player.scale.y = 0.5;
      this.state.rollTimer--;
      if (this.state.rollTimer <= 0) {
        this.state.isRolling = false;
        this.player.scale.y = 1;
      }
    }

    // انیمیشن دویدن
    if (!this.state.isJumping && !this.state.isRolling) {
      const t = Date.now() * 0.015 * (this.state.speed / CONFIG.baseSpeed);
      this.limbs.legL.rotation.x = Math.sin(t) * 0.8;
      this.limbs.legR.rotation.x = -Math.sin(t) * 0.8;
      this.limbs.armL.rotation.x = -Math.sin(t) * 0.7;
      this.limbs.armR.rotation.x = Math.sin(t) * 0.7;
      if (!onTrain) this.player.position.y = Math.abs(Math.sin(t * 2)) * 0.07;
    } else if (this.state.isJumping) {
      this.limbs.legL.rotation.x = -0.5;
      this.limbs.legR.rotation.x = 0.2;
      this.limbs.armL.rotation.x = -2.3;
      this.limbs.armR.rotation.x = -2.3;
    }

    const speed = this.state.speed;

    // حرکت موجودیت‌ها
    for (let i = this.entities.trains.length - 1; i >= 0; i--) {
      const t = this.entities.trains[i];
      t.position.z += speed + t.userData.moveSpeed;
      if (t.position.z > 22) {
        this.scene.remove(t);
        this.entities.trains.splice(i, 1);
      }
    }

    for (let i = this.entities.barriers.length - 1; i >= 0; i--) {
      const b = this.entities.barriers[i];
      b.position.z += speed;
      const dz = Math.abs(b.position.z - this.player.position.z);
      const dx = Math.abs(b.position.x - this.player.position.x);
      if (dz < 1 && dx < 1.2) {
        if (b.userData.type === 'barrier_high' && !this.state.isRolling) this.crash();
        if (b.userData.type === 'barrier_low' && this.player.position.y < 1) this.crash();
      }
      if (b.position.z > 20) {
        this.scene.remove(b);
        this.entities.barriers.splice(i, 1);
      }
    }

    for (let i = this.entities.coins.length - 1; i >= 0; i--) {
      const c = this.entities.coins[i];
      c.position.z += speed;
      c.rotation.z += 0.11;
      if (this.state.activePowerups.magnet > 0) {
        const d = c.position.distanceTo(this.player.position);
        if (d < 12) {
          const dir = new THREE.Vector3().subVectors(this.player.position, c.position).normalize();
          c.position.add(dir.multiplyScalar(0.85));
        }
      }
      const pPos = new THREE.Vector3(this.player.position.x, this.player.position.y + 1, this.player.position.z);
      if (c.position.distanceTo(pPos) < 1.5) {
        this.state.coins++;
        this.state.score += 5;
        this.updateUI();
        this.scene.remove(c);
        this.entities.coins.splice(i, 1);
      } else if (c.position.z > 12) {
        this.scene.remove(c);
        this.entities.coins.splice(i, 1);
      }
    }

    for (let i = this.entities.powerups.length - 1; i >= 0; i--) {
      const p = this.entities.powerups[i];
      p.position.z += speed;
      p.rotation.y += 0.05;
      if (p.position.distanceTo(this.player.position) < 1.5) {
        this.activatePowerup(p.userData.type);
        this.scene.remove(p);
        this.entities.powerups.splice(i, 1);
      } else if (p.position.z > 12) {
        this.scene.remove(p);
        this.entities.powerups.splice(i, 1);
      }
    }

    if (this.state.activePowerups.magnet > 0) {
      this.state.activePowerups.magnet--;
      if (this.state.activePowerups.magnet <= 0) document.getElementById('pu-magnet').style.display = 'none';
    }

    // ریل لوپ
    this.trackGroup.position.z += speed;
    if (this.trackGroup.position.z > 3.7) this.trackGroup.position.z = 0;

    // ساختمان‌ها
    for (const b of this.buildings) {
      b.position.z += speed * 0.12;
      if (b.position.z > 35) b.position.z -= 380;
    }

    // افزایش سختی
    this.state.speed = Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + this.state.score * 0.00016);
    this.state.score += this.state.speed * 0.1;
    this.updateUI();
  }

  activatePowerup(type) {
    if (type === 'magnet') {
      this.state.activePowerups.magnet = 600;
      document.getElementById('pu-magnet').style.display = 'block';
    } else {
      this.state.activePowerups.shield = true;
      this.shieldMesh.visible = true;
      document.getElementById('pu-shield').style.display = 'block';
    }
  }

  crash() {
    if (this.state.activePowerups.shield) {
      this.state.activePowerups.shield = false;
      this.shieldMesh.visible = false;
      document.getElementById('pu-shield').style.display = 'none';
      [...this.entities.trains, ...this.entities.barriers].forEach(o => o.position.z += 11);
    } else {
      this.gameOver();
    }
  }

  setupInputs() {
    window.addEventListener('keydown', e => {
      if (!this.state.isPlaying) return;
      if (e.key === 'ArrowLeft') this.moveLane(-1);
      if (e.key === 'ArrowRight') this.moveLane(1);
      if (e.key === 'ArrowUp') this.jump();
      if (e.key === 'ArrowDown') this.roll();
    });

    let tx = 0, ty = 0;
    document.addEventListener('touchstart', e => {
      tx = e.changedTouches[0].screenX;
      ty = e.changedTouches[0].screenY;
    }, { passive: false });

    document.addEventListener('touchend', e => {
      if (!this.state.isPlaying) return;
      const dx = e.changedTouches[0].screenX - tx;
      const dy = e.changedTouches[0].screenY - ty;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) this.moveLane(1);
        else if (dx < -30) this.moveLane(-1);
      } else {
        if (dy < -30) this.jump();
        else if (dy > 30) this.roll();
      }
    }, { passive: false });
  }

  // حرکت لاین اصلاح‌شده (حتی موقع پرش کار می‌کنه)
  moveLane(dir) {
    const newLane = Math.max(0, Math.min(2, this.state.lane + dir));
    if (newLane === this.state.lane) return;
    this.state.lane = newLane;
    this.state.targetX = (this.state.lane - 1) * CONFIG.laneWidth;
  }

  jump() {
    // فقط وقتی روی زمین یا سقف قطار هستیم پرش کن
    if (!this.state.isJumping) {
      this.state.velY = CONFIG.jumpForce;
      this.state.isJumping = true;
      this.state.isRolling = false;
      this.player.scale.y = 1;
    }
  }

  roll() {
    if (!this.state.isRolling) {
      this.state.isRolling = true;
      this.state.rollTimer = 40;
      if (this.state.isJumping) this.state.velY = -0.8;
    }
  }

  start() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    this.state.isPlaying = true;
    this.state.score = 0;
    this.state.speed = CONFIG.baseSpeed;
    this.state.lane = 1;
    this.state.targetX = 0;
    this.state.velY = 0;
    this.state.isJumping = false;
    this.state.isRolling = false;
    this.player.position.set(0, 0, 0);
    this.player.scale.y = 1;

    if (this.state.inventory.magnet > 0) {
      this.activatePowerup('magnet');
      this.state.inventory.magnet--;
    }
    if (this.state.inventory.shield > 0) {
      this.activatePowerup('shield');
      this.state.inventory.shield--;
    }

    [...this.entities.trains, ...this.entities.barriers, ...this.entities.coins, ...this.entities.powerups]
      .forEach(o => this.scene.remove(o));
    this.entities = { trains: [], barriers: [], coins: [], powerups: [] };
    this.updateUI();
  }

  gameOver() {
    this.state.isPlaying = false;
    localStorage.setItem('sp_v3_coins', this.state.coins);
    document.getElementById('final-score').innerText = Math.floor(this.state.score);
    document.getElementById('game-over-screen').classList.remove('hidden');
  }

  showMenu() {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    this.updateUI();
  }

  openShop() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('shop-modal').classList.remove('hidden');
    this.updateShopUI();
  }

  closeShop() {
    document.getElementById('shop-modal').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  }

  buyItem(item, cost) {
    if (this.state.coins >= cost) {
      this.state.coins -= cost;
      this.state.inventory[item]++;
      localStorage.setItem('sp_v3_coins', this.state.coins);
      this.updateShopUI();
      this.updateUI();
    }
  }

  updateUI() {
    document.getElementById('score').innerText = Math.floor(this.state.score);
    document.getElementById('coins').innerText = this.state.coins;
  }

  updateShopUI() {
    document.getElementById('shop-coins').innerText = this.state.coins;
    document.getElementById('buy-magnet').disabled = this.state.coins < 50;
    document.getElementById('buy-shield').disabled = this.state.coins < 100;
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    if (this.state.isPlaying) {
      this.updatePhysics();
      this.spawnLogic();
    }
    // دوربین نرم
    this.camera.position.x += (this.player.position.x * 0.3 - this.camera.position.x) * 0.07;
    this.camera.lookAt(this.player.position.x * 0.25, 2, this.player.position.z - 11);
    this.renderer.render(this.scene, this.camera);
  }
}

const game = new SubwayGame();
document.getElementById('start-btn').onclick = () => game.start();
document.getElementById('retry-btn').onclick = () => game.start();
document.getElementById('menu-btn').onclick = () => game.showMenu();
document.getElementById('shop-btn').onclick = () => game.openShop();
document.getElementById('close-shop').onclick = () => game.closeShop();
document.getElementById('buy-magnet').onclick = () => game.buyItem('magnet', 50);
document.getElementById('buy-shield').onclick = () => game.buyItem('shield', 100);
</script>
</body>
</html>
