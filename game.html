<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner Ultimate V2 - Fixed & Enhanced</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Vazirmatn', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .hud-top { display: flex; justify-content: space-between; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-family: 'Lalezar'; }
        .score-box { background: rgba(0, 0, 0, 0.5); padding: 10px 20px; border-radius: 20px; border: 2px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); }
        
        /* Menus */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; backdrop-filter: blur(10px); }
        h1 { font-size: 60px; color: #FFD700; text-shadow: 0 0 20px #FF4500; margin-bottom: 10px; font-family: 'Lalezar'; }
        button { background: linear-gradient(45deg, #FF4500, #FFD700); border: none; padding: 15px 40px; font-size: 24px; color: white; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 10px 20px rgba(255, 69, 0, 0.4); transition: transform 0.2s; margin-top: 20px; font-family: 'Lalezar'; }
        button:hover { transform: scale(1.1); }
        .hidden { display: none !important; }
        
        /* Effects */
        #dizzy-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.5) 100%); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="dizzy-overlay"></div>
    <div id="canvas-container"></div>

    <div id="ui-layer" class="hidden">
        <div class="hud-top">
            <div class="score-box">امتیاز: <span id="score">0</span></div>
            <div class="score-box">سکه: <span id="coins">0</span></div>
        </div>
        <div style="text-align: center; color: white; font-family: 'Lalezar'; font-size: 20px; text-shadow: 1px 1px 2px black;">
            وضعیت: <span id="status-text" style="color: #2ed573;">سلامت</span>
        </div>
    </div>

    <div id="start-screen" class="menu-screen">
        <h1>SUBWAY V2</h1>
        <p style="color: #ccc;">نسخه اصلاح شده با قطار متحرک و رمپ</p>
        <button id="start-btn">شروع دویدن</button>
        <p style="color: #888; margin-top: 20px; font-size: 14px;">کنترل: چپ/راست/بالا/پایین</p>
    </div>

    <div id="game-over-screen" class="menu-screen hidden">
        <h1 style="color: #ff4444;">GAME OVER</h1>
        <p style="color: white; font-size: 24px;">امتیاز: <span id="final-score">0</span></p>
        <button id="restart-btn">تلاش دوباره</button>
    </div>

<script>
/**
 * SUBWAY RUNNER V2 - FIXED ENGINE
 * Features: Moving Trains, Ramps, Side Collision (Dizzy), Overhead Barriers
 */

// --- CONFIG ---
const LANE_WIDTH = 3.5;
const SPEED_START = 0.4;
const SPEED_MAX = 1.2;
const JUMP_FORCE = 0.38;
const GRAVITY = 0.018;

// --- STATE ---
let scene, camera, renderer;
let player, playerGroup;
let obstacles = []; // { mesh, type, lane, z, w, h, d, speed, hasRamp }
let coins = [];
let buildings = [];
let gameActive = false;
let score = 0;
let coinCount = 0;
let speed = SPEED_START;
let lane = 0; // -1, 0, 1
let verticalVelocity = 0;
let isJumping = false;
let isSliding = false;
let slideTimer = 0;
let onTrain = false; // Is player on top of a train?
let currentTrainHeight = 0;

// Health System
let health = 2; // 2 hits from side allowed
let isDizzy = false;
let dizzyTimer = 0;

// --- INIT ---
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 5, 8);
    camera.lookAt(0, 0, -5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -20; dirLight.shadow.camera.right = 20;
    dirLight.shadow.camera.top = 20; dirLight.shadow.camera.bottom = -20;
    scene.add(dirLight);

    createEnvironment();
    createPlayer();

    // Inputs
    window.addEventListener('resize', onWindowResize, false);
    document.addEventListener('keydown', handleInput);
    
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, false);
    document.addEventListener('touchend', e => {
        if (!gameActive) return;
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 30) moveRight(); else if (dx < -30) moveLeft();
        } else {
            if (dy < -30) jump(); else if (dy > 30) slide();
        }
    }, false);

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', resetGame);

    animate();
}

// --- OBJECTS ---
function createEnvironment() {
    // Ground
    const groundGeo = new THREE.PlaneGeometry(40, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -50;
    ground.receiveShadow = true;
    scene.add(ground);

    // Rails
    const railGeo = new THREE.BoxGeometry(0.2, 0.1, 200);
    const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });
    [-LANE_WIDTH, 0, LANE_WIDTH].forEach(x => {
        const r1 = new THREE.Mesh(railGeo, railMat); r1.position.set(x-0.6, 0.05, -50); scene.add(r1);
        const r2 = new THREE.Mesh(railGeo, railMat); r2.position.set(x+0.6, 0.05, -50); scene.add(r2);
    });

    // Buildings
    const bGeo = new THREE.BoxGeometry(5, 15, 5);
    for(let i=0; i<30; i++) {
        const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
        const bL = new THREE.Mesh(bGeo, mat); bL.position.set(-10, 7.5, -i*8); bL.castShadow=true; scene.add(bL); buildings.push(bL);
        const bR = new THREE.Mesh(bGeo, mat); bR.position.set(10, 7.5, -i*8); bR.castShadow=true; scene.add(bR); buildings.push(bR);
    }
}

function createPlayer() {
    playerGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.5), new THREE.MeshStandardMaterial({ color: 0x000000 }));
    body.position.y = 1.2; body.castShadow = true; playerGroup.add(body);
    
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
    head.position.y = 2.0; head.castShadow = true; playerGroup.add(head);
    
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x0000ff }));
    cap.position.y = 2.3; playerGroup.add(cap);

    const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const lL = new THREE.Mesh(legGeo, legMat); lL.position.set(-0.2, 0.4, 0); playerGroup.add(lL);
    const lR = new THREE.Mesh(legGeo, legMat); lR.position.set(0.2, 0.4, 0); playerGroup.add(lR);

    player = playerGroup;
    scene.add(player);
}

function spawnPattern() {
    const zPos = -80;
    const patternType = Math.floor(Math.random() * 5);
    const lanes = [-1, 0, 1];
    
    // Helper to add obstacle
    const addObs = (l, type, moving = false, ramp = false) => {
        let mesh, w, h, d, y;
        const color = type === 'train' ? (Math.random()>0.5?0xff0000:0xffff00) : 0xffa500;
        
        if (type === 'train') {
            w = 2.8; h = 3.5; d = 12; y = 1.75;
            mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 }));
            mesh.castShadow = true;
            // Windows
            const win = new THREE.Mesh(new THREE.BoxGeometry(2.9, 1, 2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            win.position.y = 0.5; mesh.add(win);
            
            // Ramp
            if (ramp) {
                const rampMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x555555 }));
                rampMesh.position.set(0, -1.5, 6); // At front of train
                rampMesh.rotation.x = -0.5;
                mesh.add(rampMesh);
            }
        } else if (type === 'barrier_low') {
            w = 2.5; h = 1; d = 0.5; y = 0.5;
            mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0xffa500 }));
        } else if (type === 'barrier_high') {
            w = 2.5; h = 1; d = 0.5; y = 2.5; // Floating
            mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0xff4757 }));
        }

        mesh.position.set(l * LANE_WIDTH, y, zPos);
        scene.add(mesh);
        obstacles.push({ 
            mesh, type, lane: l, z: zPos, w, h, d, 
            speed: moving ? 0.3 : 0, // Moving trains come towards player
            hasRamp: ramp,
            yOffset: y
        });
    };

    const addCoin = (l, zOffset) => {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 1 }));
        c.rotation.x = Math.PI/2;
        c.position.set(l * LANE_WIDTH, 1, zPos + zOffset);
        scene.add(c);
        coins.push({ mesh: c, lane: l, z: zPos + zOffset, active: true });
    };

    // Patterns (Ensuring at least one safe lane)
    if (patternType === 0) {
        // Two trains, one gap
        const safe = Math.floor(Math.random()*3)-1;
        lanes.forEach(l => { if (l !== safe) addObs(l, 'train', Math.random()>0.7, Math.random()>0.5); });
    } else if (patternType === 1) {
        // One train with ramp, others coins
        const trainLane = Math.floor(Math.random()*3)-1;
        addObs(trainLane, 'train', false, true); // Static train with ramp
        lanes.forEach(l => { if (l !== trainLane) addCoin(l, 0); });
    } else if (patternType === 2) {
        // High barrier (slide under) + Low barrier (jump over)
        addObs(-1, 'barrier_high');
        addObs(0, 'barrier_low');
        addCoin(1, 0);
    } else if (patternType === 3) {
        // Moving Train!
        addObs(0, 'train', true, false);
        addCoin(-1, 0); addCoin(1, 0);
    } else {
        // Coin line
        const l = Math.floor(Math.random()*3)-1;
        for(let i=0; i<5; i++) addCoin(l, -i*2);
    }
}

// --- LOGIC ---
function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('hidden');
    document.getElementById('dizzy-overlay').style.opacity = 0;
    
    obstacles.forEach(o => scene.remove(o.mesh)); obstacles = [];
    coins.forEach(c => scene.remove(c.mesh)); coins = [];
    
    score = 0; coinCount = 0; speed = SPEED_START; lane = 0;
    verticalVelocity = 0; isJumping = false; isSliding = false;
    health = 2; isDizzy = false;
    
    player.position.set(0, 0, 0);
    player.rotation.set(0, 0, 0);
    camera.rotation.set(0, 0, 0);
    
    gameActive = true;
    updateUI();
}

function resetGame() { startGame(); }

function gameOver() {
    gameActive = false;
    document.getElementById('final-score').innerText = Math.floor(score);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('ui-layer').classList.add('hidden');
}

function moveLeft() { if (lane > -1) lane--; }
function moveRight() { if (lane < 1) lane++; }
function jump() { 
    if (!isJumping && !isSliding) {
        // If on train, jump from train height
        if (onTrain) {
            verticalVelocity = JUMP_FORCE;
            isJumping = true;
            onTrain = false; // Leave train
        } else if (player.position.y <= 0.1) {
            verticalVelocity = JUMP_FORCE;
            isJumping = true;
        }
    }
}
function slide() {
    if (!isJumping && !isSliding) {
        isSliding = true;
        slideTimer = 40;
        player.scale.y = 0.5;
        player.position.y = onTrain ? currentTrainHeight - 0.5 : -0.5;
    }
}

function handleInput(e) {
    if (!gameActive) return;
    switch(e.key) {
        case 'ArrowLeft': moveLeft(); break;
        case 'ArrowRight': moveRight(); break;
        case 'ArrowUp': jump(); break;
        case 'ArrowDown': slide(); break;
    }
}

function takeDamage() {
    if (isDizzy) {
        gameOver(); // Second hit while dizzy
    } else {
        health--;
        isDizzy = true;
        dizzyTimer = 180; // 3 seconds
        speed *= 0.5; // Slow down
        
        // Visuals
        document.getElementById('dizzy-overlay').style.opacity = 1;
        document.getElementById('status-text').innerText = "سرگیجه!";
        document.getElementById('status-text').style.color = "#ff4757";
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 500);
        
        if (health <= 0) gameOver();
    }
}

function updatePhysics() {
    // Lane Lerp
    const targetX = lane * LANE_WIDTH;
    player.position.x += (targetX - player.position.x) * 0.2;

    // Gravity & Jump
    if (isJumping) {
        player.position.y += verticalVelocity;
        verticalVelocity -= GRAVITY;
        
        // Check landing on train or ground
        let landed = false;
        if (player.position.y <= currentTrainHeight && onTrain) {
            player.position.y = currentTrainHeight;
            isJumping = false; verticalVelocity = 0; landed = true;
        } else if (player.position.y <= 0 && !onTrain) {
            player.position.y = 0;
            isJumping = false; verticalVelocity = 0; landed = true;
        }
    } else {
        // Stick to ground or train
        if (onTrain) player.position.y = currentTrainHeight;
        else player.position.y = 0;
    }

    // Slide
    if (isSliding) {
        slideTimer--;
        if (slideTimer <= 0) {
            isSliding = false;
            player.scale.y = 1;
            // Restore Y based on surface
            player.position.y = onTrain ? currentTrainHeight : 0;
        }
    }

    // Dizzy Recovery
    if (isDizzy) {
        dizzyTimer--;
        camera.rotation.z = Math.sin(Date.now() * 0.01) * 0.1; // Wobble camera
        if (dizzyTimer <= 0) {
            isDizzy = false;
            speed = Math.min(speed * 2, SPEED_MAX); // Recover speed
            document.getElementById('dizzy-overlay').style.opacity = 0;
            document.getElementById('status-text').innerText = "سلامت";
            document.getElementById('status-text').style.color = "#2ed573";
            camera.rotation.z = 0;
        }
    }

    // Animation
    if (!isJumping && !isSliding) {
        const bob = Math.abs(Math.sin(Date.now() * 0.015)) * 0.2;
        player.position.y += bob;
        player.rotation.z = (targetX - player.position.x) * 0.1;
    }
}

function checkCollisions() {
    // Player Box (approximate)
    const pBox = new THREE.Box3().setFromObject(player);
    pBox.expandByScalar(-0.2);

    // Check Obstacles
    onTrain = false; // Reset flag, check if standing on any
    
    for (let o of obstacles) {
        // Move obstacle
        o.z += (speed + o.speed); // Add train's own speed
        o.mesh.position.z = o.z;
        
        // Remove if behind
        if (o.z > 10) {
            scene.remove(o.mesh);
            o.active = false;
        }

        const oBox = new THREE.Box3().setFromObject(o.mesh);
        
        // Collision Logic
        if (pBox.intersectsBox(oBox)) {
            // 1. Top Collision (Landing on train)
            // If player is falling and feet are above obstacle center
            if (o.type === 'train' && verticalVelocity <= 0 && player.position.y >= o.yOffset + o.h/2 - 0.5) {
                onTrain = true;
                currentTrainHeight = o.yOffset + o.h/2;
                player.position.y = currentTrainHeight;
                isJumping = false;
                verticalVelocity = 0;
                
                // Ramp logic (auto jump or boost)
                if (o.hasRamp && o.z > -2 && o.z < 2) {
                    // Just landed on ramp area
                }
            } 
            // 2. Side/Front Collision
            else {
                // Check if it's a side hit (Z is close, X is different) or front hit
                const zDiff = Math.abs(o.z - 0); // Player is at z=0 approx
                
                if (zDiff < 2) {
                    // Front hit -> Game Over
                    if (o.type === 'train' || o.type === 'barrier_low') {
                         // If we are not on top
                         if (!onTrain || player.position.y < o.yOffset) {
                             // Actually if we hit the front face
                             if (Math.abs(player.position.x - o.mesh.position.x) < 1) {
                                 gameOver();
                             } else {
                                 takeDamage(); // Side clip
                             }
                         }
                    } else if (o.type === 'barrier_high') {
                        if (!isSliding) takeDamage(); // Hit head
                    }
                } else {
                    // Side hit
                    takeDamage();
                }
            }
        }
    }
    
    // Cleanup inactive
    obstacles = obstacles.filter(o => o.active !== false);

    // Coins
    for (let c of coins) {
        if (!c.active) continue;
        c.z += speed;
        c.mesh.position.z = c.z;
        c.mesh.rotation.z += 0.1;
        
        if (c.z > 10) { scene.remove(c.mesh); c.active = false; continue; }

        const cBox = new THREE.Box3().setFromObject(c.mesh);
        if (pBox.intersectsBox(cBox)) {
            c.active = false;
            scene.remove(c.mesh);
            coinCount++;
            score += 10;
            updateUI();
        }
    }
    coins = coins.filter(c => c.active !== false);
}

function updateWorld() {
    buildings.forEach(b => {
        b.position.z += speed;
        if (b.position.z > 10) {
            b.position.z = -80;
            b.material.color.setHex(Math.random() * 0xffffff);
        }
    });

    if (Math.random() < 0.03) spawnPattern();

    speed = Math.min(speed + 0.0002, SPEED_MAX);
    score += speed;
    updateUI();
}

function updateUI() {
    document.getElementById('score').innerText = Math.floor(score);
    document.getElementById('coins').innerText = coinCount;
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    if (gameActive) {
        updatePhysics();
        updateWorld();
        checkCollisions();
        camera.position.x += (player.position.x * 0.5 - camera.position.x) * 0.1;
    }
    renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
