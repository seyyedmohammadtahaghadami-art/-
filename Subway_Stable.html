<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Subway Runner Stable</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:'Lalezar',cursive;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud{display:flex;justify-content:space-between;padding:12px 16px;font-size:22px;color:#fff;text-shadow:2px 2px 4px #000}
.box{background:rgba(0,0,0,.55);padding:6px 14px;border-radius:16px;border:1.5px solid rgba(255,255,255,.15)}
.menu{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:auto}
.hidden{display:none}
h1{font-size:42px;color:#FFD700;text-shadow:0 0 20px #FFD700;margin-bottom:10px}
button{background:linear-gradient(#ff9f43,#ee5253);border:3px solid #fff;color:#fff;font-family:'Lalezar';font-size:22px;padding:12px 36px;border-radius:36px;cursor:pointer;margin:6px}
button:active{transform:scale(.96)}
.btn2{background:linear-gradient(#555,#333);font-size:16px;padding:9px 22px}
</style>
</head>
<body>
<div id="ui">
  <div class="hud">
    <div class="box">امتیاز: <span id="score">0</span></div>
    <div class="box">🪙 <span id="coins">0</span></div>
  </div>
</div>

<div id="start" class="menu">
  <h1>SUBWAY RUNNER</h1>
  <p style="color:#aaa;margin-bottom:20px">نسخه پایدار</p>
  <button id="btnStart">شروع</button>
</div>

<div id="over" class="menu hidden">
  <h1 style="color:#ff4757">GAME OVER</h1>
  <p style="color:#fff;font-size:20px;margin:10px 0">امتیاز: <span id="fscore">0</span></p>
  <button id="btnRetry">دوباره</button>
  <button id="btnMenu" class="btn2">منو</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ========== CONFIG ==========
  const LANE_W = 3.5;
  const TRAIN_H = 3.1;
  const BASE_SPEED = 0.5;
  const MAX_SPEED = 2.0;
  const JUMP = 0.72;
  const GRAVITY = 0.034;

  // ========== STATE ==========
  const S = {
    playing: false,
    score: 0,
    coins: parseInt(localStorage.getItem('st_coins')||'0'),
    speed: BASE_SPEED,
    lane: 1,
    targetX: 0,
    velY: 0,
    jumping: false,
    rolling: false,
    rollTimer: 0
  };

  // ========== THREE ==========
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x5dade2);
  scene.fog = new THREE.FogExp2(0x5dade2, 0.012);

  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 6.5, 11);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.insertBefore(renderer.domElement, document.getElementById('ui'));

  // Lights
  scene.add(new THREE.HemisphereLight(0xfff5e6, 0x445566, 0.9));
  const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
  sun.position.set(15, 35, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 300),
    new THREE.MeshStandardMaterial({color:0x333, roughness:0.9})
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.z = -60;
  ground.receiveShadow = true;
  scene.add(ground);

  // Tracks
  const tracks = new THREE.Group();
  const railMat = new THREE.MeshStandardMaterial({color:0x777, metalness:0.8, roughness:0.3});
  const sleepMat = new THREE.MeshStandardMaterial({color:0x4a3528, roughness:0.9});
  for(let i=-1;i<=1;i++){
    const o = i * LANE_W;
    const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 300), railMat);
    r1.position.set(o-0.8, 0.03, -60);
    const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 300), railMat);
    r2.position.set(o+0.8, 0.03, -60);
    tracks.add(r1, r2);
  }
  for(let j=0;j<90;j++){
    const s = new THREE.Mesh(new THREE.BoxGeometry(9, 0.1, 0.4), sleepMat);
    s.position.set(0, 0.02, -j*3.2);
    tracks.add(s);
  }
  scene.add(tracks);

  // Buildings
  const buildings = [];
  for(let side=-1; side<=1; side+=2){
    for(let i=0;i<10;i++){
      const h = 8 + Math.random()*12;
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(5+Math.random()*2, h, 6+Math.random()*2),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0.08, 0.25, 0.3+Math.random()*0.1),
          roughness: 0.85
        })
      );
      b.position.set(side*(10+Math.random()*2), h/2, -i*24-Math.random()*5);
      b.castShadow = true;
      scene.add(b);
      buildings.push(b);
    }
  }

  // ========== PLAYER ==========
  const player = new THREE.Group();
  const hoodieMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.6});
  const skinMat = new THREE.MeshStandardMaterial({color:0xf0c8a0, roughness:0.5});
  const pantsMat = new THREE.MeshStandardMaterial({color:0x111, roughness:0.6});
  const shoeMat = new THREE.MeshStandardMaterial({color:0xf5f5f5, roughness:0.3});

  // Body
  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 12), hoodieMat);
  torso.scale.set(1.05, 1.35, 0.85);
  torso.position.y = 1.3;
  torso.castShadow = true;
  player.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 10), skinMat);
  head.position.y = 2.05;
  head.castShadow = true;
  player.add(head);

  // Cap
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 8, 0, Math.PI*2, 0, Math.PI*0.5), new THREE.MeshStandardMaterial({color:0x1e3a8a}));
  cap.position.y = 2.25;
  player.add(cap);

  // Arms
  const armL = new THREE.Group();
  armL.position.set(-0.48, 1.55, 0);
  const armLM = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), hoodieMat);
  armLM.scale.y = 2.2;
  armLM.position.y = -0.26;
  armL.add(armLM);
  player.add(armL);

  const armR = new THREE.Group();
  armR.position.set(0.48, 1.55, 0);
  const armRM = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), hoodieMat);
  armRM.scale.y = 2.2;
  armRM.position.y = -0.26;
  armR.add(armRM);
  player.add(armR);

  // Legs
  const legL = new THREE.Group();
  legL.position.set(-0.16, 0.7, 0);
  const legLM = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), pantsMat);
  legLM.scale.y = 2.3;
  legLM.position.y = -0.32;
  legL.add(legLM);
  const shoeL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), shoeMat);
  shoeL.scale.set(1.1, 0.55, 1.35);
  shoeL.position.set(0, -0.75, 0.03);
  legL.add(shoeL);
  player.add(legL);

  const legR = new THREE.Group();
  legR.position.set(0.16, 0.7, 0);
  const legRM = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), pantsMat);
  legRM.scale.y = 2.3;
  legRM.position.y = -0.32;
  legR.add(legRM);
  const shoeR = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), shoeMat);
  shoeR.scale.set(1.1, 0.55, 1.35);
  shoeR.position.set(0, -0.75, 0.03);
  legR.add(shoeR);
  player.add(legR);

  scene.add(player);

  // ========== ENTITIES ==========
  const trains = [];
  const bars = [];
  const coins = [];

  function makeTrain(lane){
    const g = new THREE.Group();
    const len = 12 + Math.random()*8;
    const cols = [0xc0392b, 0xf1c40f, 0x2980b9, 0x27ae60];
    const col = cols[Math.floor(Math.random()*cols.length)];
    const mat = new THREE.MeshStandardMaterial({color:col, metalness:0.5, roughness:0.3});
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, TRAIN_H*0.9, len), mat);
    body.position.y = TRAIN_H*0.48;
    body.castShadow = true;
    g.add(body);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.12, len+0.15), new THREE.MeshStandardMaterial({color:0xddd, metalness:0.6}));
    roof.position.y = TRAIN_H;
    g.add(roof);
    g.position.set((lane-1)*LANE_W, 0, -80);
    g.userData = {len};
    scene.add(g);
    trains.push(g);
  }

  function makeBar(lane, high){
    const g = new THREE.Group();
    if(high){
      const b = new THREE.Mesh(new THREE.BoxGeometry(2, 0.28, 0.3), new THREE.MeshStandardMaterial({color:0xffaa00}));
      b.position.y = 1.35;
      g.add(b);
      g.userData = {type:'high'};
    } else {
      const b = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 0.35), new THREE.MeshStandardMaterial({color:0xe67e22}));
      b.position.y = 0.38;
      g.add(b);
      g.userData = {type:'low'};
    }
    g.position.set((lane-1)*LANE_W, 0, -80);
    scene.add(g);
    bars.push(g);
  }

  function makeCoin(x,y,z){
    const c = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 0.05, 12),
      new THREE.MeshStandardMaterial({color:0xFFD700, metalness:0.9, roughness:0.2, emissive:0x443300, emissiveIntensity:0.15})
    );
    c.rotation.x = Math.PI/2;
    c.position.set(x,y,z);
    scene.add(c);
    coins.push(c);
  }

  function spawn(){
    if(Math.random() > 0.03 + S.speed*0.003) return;
    const lane = Math.floor(Math.random()*3);
    const r = Math.random();
    if(r < 0.4){
      makeTrain(lane);
      if(Math.random()>0.5) for(let i=0;i<3;i++) makeCoin((lane-1)*LANE_W, TRAIN_H+0.4, -85-i*2);
    } else if(r < 0.6){
      makeBar(lane, true);
    } else if(r < 0.8){
      makeBar(lane, false);
    } else {
      for(let i=0;i<4;i++) makeCoin((lane-1)*LANE_W, 0.9, -80-i*1.8);
    }
  }

  // ========== INPUT ==========
  function move(dir){
    const n = Math.max(0, Math.min(2, S.lane+dir));
    if(n === S.lane) return;
    S.lane = n;
    S.targetX = (S.lane-1)*LANE_W;
  }
  function jump(){
    if(!S.jumping){
      S.velY = JUMP;
      S.jumping = true;
      S.rolling = false;
      player.scale.y = 1;
    }
  }
  function roll(){
    if(!S.rolling){
      S.rolling = true;
      S.rollTimer = 32;
      if(S.jumping) S.velY = -0.6;
    }
  }

  window.addEventListener('keydown', e=>{
    if(!S.playing) return;
    if(e.key==='ArrowLeft') move(-1);
    if(e.key==='ArrowRight') move(1);
    if(e.key==='ArrowUp') jump();
    if(e.key==='ArrowDown') roll();
  });

  let tx=0, ty=0;
  window.addEventListener('touchstart', e=>{
    tx = e.changedTouches[0].screenX;
    ty = e.changedTouches[0].screenY;
  }, {passive:true});
  window.addEventListener('touchend', e=>{
    if(!S.playing) return;
    const dx = e.changedTouches[0].screenX - tx;
    const dy = e.changedTouches[0].screenY - ty;
    if(Math.abs(dx) > Math.abs(dy)){
      if(dx > 25) move(1); else if(dx < -25) move(-1);
    } else {
      if(dy < -25) jump(); else if(dy > 25) roll();
    }
  }, {passive:true});

  // ========== GAME FLOW ==========
  function start(){
    document.getElementById('start').classList.add('hidden');
    document.getElementById('over').classList.add('hidden');
    S.playing = true;
    S.score = 0;
    S.speed = BASE_SPEED;
    S.lane = 1;
    S.targetX = 0;
    S.velY = 0;
    S.jumping = false;
    S.rolling = false;
    player.position.set(0,0,0);
    player.scale.y = 1;

    // Clear
    [...trains, ...bars, ...coins].forEach(o=>scene.remove(o));
    trains.length = 0;
    bars.length = 0;
    coins.length = 0;
    updateUI();
  }

  function gameOver(){
    S.playing = false;
    localStorage.setItem('st_coins', S.coins);
    document.getElementById('fscore').textContent = Math.floor(S.score);
    document.getElementById('over').classList.remove('hidden');
  }

  function updateUI(){
    document.getElementById('score').textContent = Math.floor(S.score);
    document.getElementById('coins').textContent = S.coins;
  }

  // ========== LOOP ==========
  function update(){
    // Move X
    player.position.x += (S.targetX - player.position.x) * 0.16;
    player.rotation.z = (S.targetX - player.position.x) * -0.06;

    // Gravity
    player.position.y += S.velY;
    S.velY -= GRAVITY;

    // Train collision
    let onTrain = false, tH = 0, hit = false;
    for(const t of trains){
      const dx = Math.abs(t.position.x - player.position.x);
      const dz = t.position.z - player.position.z;
      const half = t.userData.len / 2;
      if(dx < 1.25 && dz < half && dz > -half){
        if(player.position.y >= TRAIN_H - 0.5){
          onTrain = true; tH = TRAIN_H;
        } else if(dz > 0 && dz < half + 0.7){
          if(S.jumping && player.position.y > TRAIN_H - 1.3){
            player.position.y = TRAIN_H;
            S.velY = 0;
            S.jumping = false;
            onTrain = true; tH = TRAIN_H;
          } else hit = true;
        }
      }
    }
    if(hit){ gameOver(); return; }

    if(onTrain){
      if(player.position.y <= tH){
        player.position.y = tH;
        S.velY = 0;
        S.jumping = false;
      }
    } else if(player.position.y <= 0){
      player.position.y = 0;
      S.velY = 0;
      S.jumping = false;
    }

    // Roll
    if(S.rolling){
      player.scale.y = 0.48;
      S.rollTimer--;
      if(S.rollTimer <= 0){
        S.rolling = false;
        player.scale.y = 1;
      }
    }

    // Anim
    if(!S.jumping && !S.rolling){
      const t = Date.now() * 0.012 * (S.speed/BASE_SPEED);
      const sw = Math.sin(t) * 0.5;
      legL.rotation.x = sw;
      legR.rotation.x = -sw;
      armL.rotation.x = -sw * 0.75;
      armR.rotation.x = sw * 0.75;
      if(!onTrain) player.position.y = Math.abs(Math.sin(t*2)) * 0.04;
    } else if(S.jumping){
      legL.rotation.x = -0.4;
      legR.rotation.x = 0.15;
      armL.rotation.x = -1.8;
      armR.rotation.x = -1.8;
    }

    // Move entities
    const sp = S.speed;
    for(let i=trains.length-1;i>=0;i--){
      trains[i].position.z += sp;
      if(trains[i].position.z > 15){ scene.remove(trains[i]); trains.splice(i,1); }
    }
    for(let i=bars.length-1;i>=0;i--){
      const b = bars[i];
      b.position.z += sp;
      const dz = Math.abs(b.position.z - player.position.z);
      const dx = Math.abs(b.position.x - player.position.x);
      if(dz < 0.8 && dx < 1){
        if(b.userData.type==='high' && !S.rolling) gameOver();
        if(b.userData.type==='low' && player.position.y < 0.8) gameOver();
      }
      if(b.position.z > 12){ scene.remove(b); bars.splice(i,1); }
    }
    for(let i=coins.length-1;i>=0;i--){
      const c = coins[i];
      c.position.z += sp;
      c.rotation.z += 0.1;
      const pp = new THREE.Vector3(player.position.x, player.position.y+0.9, player.position.z);
      if(c.position.distanceTo(pp) < 1.3){
        S.coins++;
        S.score += 5;
        updateUI();
        scene.remove(c);
        coins.splice(i,1);
      } else if(c.position.z > 10){
        scene.remove(c);
        coins.splice(i,1);
      }
    }

    // Tracks & buildings
    tracks.position.z += sp;
    if(tracks.position.z > 3.2) tracks.position.z = 0;
    for(const b of buildings){
      b.position.z += sp * 0.08;
      if(b.position.z > 20) b.position.z -= 250;
    }

    S.speed = Math.min(MAX_SPEED, BASE_SPEED + S.score * 0.00015);
    S.score += sp * 0.1;
    updateUI();
    spawn();
  }

  function loop(){
    requestAnimationFrame(loop);
    if(S.playing) update();
    // Camera
    camera.position.x += (player.position.x * 0.25 - camera.position.x) * 0.06;
    camera.lookAt(player.position.x * 0.2, 2, player.position.z - 9);
    renderer.render(scene, camera);
  }
  loop();

  // Buttons
  document.getElementById('btnStart').onclick = start;
  document.getElementById('btnRetry').onclick = start;
  document.getElementById('btnMenu').onclick = ()=>{
    document.getElementById('over').classList.add('hidden');
    document.getElementById('start').classList.remove('hidden');
  };

  window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  updateUI();
})();
</script>
</body>
</html>
